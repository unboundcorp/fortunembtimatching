}
function buildRadarSvg(pA, pB){
  var ns='http://www.w3.org/2000/svg';
  var size=220, cx=size/2, cy=size/2, R=80;
  var svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox','0 0 '+size+' '+size); svg.setAttribute('width',size); svg.setAttribute('height',size); svg.setAttribute('role','img');
  var titleEl=document.createElementNS(ns,'title'); titleEl.textContent='오행 균형 레이더 차트'; svg.appendChild(titleEl);
  function pt(i, r){ var angle=(Math.PI*2*i/5)-Math.PI/2; return [cx+r*Math.cos(angle), cy+r*Math.sin(angle)]; }
  [0.25,0.5,0.75,1].forEach(function(f){
    var poly=document.createElementNS(ns,'polygon');
    var p=[]; for(var i=0;i<5;i++){ var xy=pt(i,R*f); p.push(xy[0]+','+xy[1]); }
    poly.setAttribute('points',p.join(' ')); poly.setAttribute('fill','none'); poly.setAttribute('stroke','rgba(201,169,97,.2)');
    svg.appendChild(poly);
  });
  for(var i=0;i<5;i++){
    var xy=pt(i,R);
    var line=document.createElementNS(ns,'line'); line.setAttribute('x1',cx); line.setAttribute('y1',cy); line.setAttribute('x2',xy[0]); line.setAttribute('y2',xy[1]); line.setAttribute('stroke','rgba(201,169,97,.2)');
    svg.appendChild(line);
    var label=document.createElementNS(ns,'text'); var lp=pt(i,R+16);
    label.setAttribute('x',lp[0]); label.setAttribute('y',lp[1]); label.setAttribute('fill','#a79f8f'); label.setAttribute('font-size','11'); label.setAttribute('text-anchor','middle');
    label.textContent=ELEMENTS[i];
    svg.appendChild(label);
  }
  function polyFor(profile, color){
    var vals=elementProfile(profile.elementIdx);
    var pts=[]; for(var i=0;i<5;i++){ var xy=pt(i, R*(vals[i]/100)); pts.push(xy[0]+','+xy[1]); }
    var poly=document.createElementNS(ns,'polygon');
    poly.setAttribute('points',pts.join(' ')); poly.setAttribute('fill',color); poly.setAttribute('fill-opacity','0.18'); poly.setAttribute('stroke',color); poly.setAttribute('stroke-width','2');
    return poly;
  }
  svg.appendChild(polyFor(pA,'#c9a961'));
  svg.appendChild(polyFor(pB,'#e94f37'));
  return svg;
}

/* =====================================================================
   기능17: 그룹 궁합 네트워크 (신규, v3)
   새 궁합 계산 로직 없음 — computeCompat/getSajuResult를 nC2로 재사용만 한다.
===================================================================== */
var GC_TIER_ORDER = ['천생연분형','찰떡궁합형','무난동행형','노력필요형','인연신중형'];
var GC_TIER_COLORS = {
  '천생연분형':'#c9a961', /* 금박색 */
  '찰떡궁합형':'#e2624a', /* 주색 밝은 톤 */
  '무난동행형':'#6b6ba0', /* 인디고 중간톤 */
  '노력필요형':'#8a7f68', /* 회갈색 */
  '인연신중형':'#4a4550'  /* 먹색에 가까운 저채도 톤 */
};
/* 프로필 객체를 computeCompat이 기대하는 person 형태로 변환 (submitCompat의 pA 매핑과 동일 패턴) */
function toCompatPerson(p){
  return {mbti:p.mbti, elementIdx:p.elementIdx, zodiacIdx:p.zodiacIdx, name:p.name, element:p.element, zodiac:p.zodiac, saju:getSajuResult(p), gender:p.gender};
}
/* STATE.profiles 전체를 nC2 조합으로 짝지어 기존 computeCompat을 그대로 재사용해 궁합을 산출 */
function buildGroupCompatPairs(profiles){
  var pairs=[];
  for(var i=0;i<profiles.length;i++){
    for(var j=i+1;j<profiles.length;j++){
      var pA=toCompatPerson(profiles[i]), pB=toCompatPerson(profiles[j]);
      var res=computeCompat(pA,pB);
      pairs.push({a:profiles[i], b:profiles[j], res:res});
    }
  }
  return pairs;
}
/* 원형 네트워크 그래프: SVG 연결선 레이어 + 절대위치 HTML 노드 버튼 (모바일 반응형 좌표계 0~100 상대값) */
function buildGroupCompatGraph(profiles, pairs){
  var n=profiles.length;
  var R = n<=5?38:(n<=8?34:30);
  var pos = profiles.map(function(p,i){
    var angle = Math.PI*2*i/n - Math.PI/2; /* 12시 방향부터 시계방향 */
    return {id:p.id, x:50+R*Math.cos(angle), y:50+R*Math.sin(angle)};
  });
  var posById={}; pos.forEach(function(pt){ posById[pt.id]=pt; });

  var wrap=el('div',{});
  var container=el('div',{class:'gc-container'});
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 100 100');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.setAttribute('class','gc-svg');
  svg.setAttribute('aria-hidden','true');

  var lineEls=[]; /* {line, aId, bId} */
  pairs.forEach(function(pr){
    var a=posById[pr.a.id], b=posById[pr.b.id];
    var line=document.createElementNS(ns,'line');
    line.setAttribute('x1',a.x); line.setAttribute('y1',a.y);
    line.setAttribute('x2',b.x); line.setAttribute('y2',b.y);
    line.setAttribute('stroke', GC_TIER_COLORS[pr.res.combinedTier]);
    line.setAttribute('stroke-width','1.4');
    line.setAttribute('vector-effect','non-scaling-stroke');
    line.setAttribute('class','gc-line');
    line.style.opacity='0.85';
    svg.appendChild(line);
    lineEls.push({line:line, aId:pr.a.id, bId:pr.b.id});
  });
  container.appendChild(svg);

  var nodeEls=[]; /* {btn,id} */
  pos.forEach(function(pt){
    var p=profiles.filter(function(pp){ return pp.id===pt.id; })[0];
    var btn=el('button',{type:'button', class:'gc-node', style:'left:'+pt.x+'%;top:'+pt.y+'%;', 'aria-pressed':'false', 'aria-label':p.name+' 기준으로 궁합 보기'});
    var avatar=el('div',{class:'gc-avatar', 'aria-hidden':'true'},[(p.name||'?').trim().slice(0,1)||'?']);
    if(p.element && ELEMENT_COLOR[p.element]){ avatar.style.borderColor = ELEMENT_COLOR[p.element]; }
    btn.appendChild(avatar);
    btn.appendChild(el('div',{class:'gc-label'},[p.name]));
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var willSelect = this.getAttribute('aria-pressed')!=='true';
      applySelection(willSelect ? this._gcId : null);
    });
    btn._gcId = pt.id;
    container.appendChild(btn);
    nodeEls.push({btn:btn, id:pt.id});
  });

  container.addEventListener('click', function(){ applySelection(null); });

  function applySelection(id){
    nodeEls.forEach(function(ne){
      var isSelected = ne.id===id;
      ne.btn.setAttribute('aria-pressed', isSelected?'true':'false');
      ne.btn.classList.toggle('dim', id!=null && !isSelected);
    });
    lineEls.forEach(function(le){
      if(id==null){ le.line.style.opacity='0.85'; le.line.setAttribute('stroke-width','1.4'); }
      else{
        var related = le.aId===id || le.bId===id;
        le.line.style.opacity = related?'1':'0.15';
        le.line.setAttribute('stroke-width', related?'2':'1.4');
      }
    });
  }

  wrap.appendChild(container);

  var legend=el('div',{class:'gc-legend'});
  GC_TIER_ORDER.forEach(function(t){
    legend.appendChild(el('span',{},[el('span',{class:'dot', style:'background:'+GC_TIER_COLORS[t]+';'}), t]));
  });
  wrap.appendChild(legend);
  return wrap;
}
/* 인물별 궁합 요약 카드 리스트 — 사주+MBTI 두 축을 항상 병기, "이어보기"로 1:1 상세 펼치기
   ★ 무료 범위는 1:1 궁합 화면과 같은 기준으로 맞춘다.
     무료: 이름 · 등급 배지 · 한 줄 요약(사주 관점 한 줄 + MBTI 케미 한 줄)
     유료(compat_full): 쌍별 상세 — 종합/사주/MBTI 점수, 쌍마다의 오행 관계와 케미 문장
     잠긴 부분은 흐리게 가리는 게 아니라 아예 DOM에 만들지 않는다. */
function buildGroupCompatCards(profiles, pairs, unlocked){
  var wrap=el('div',{class:'gc-cards'});
  profiles.forEach(function(p){
    var related = pairs.filter(function(pr){ return pr.a.id===p.id || pr.b.id===p.id; });
    var avg = Math.round(related.reduce(function(s,pr){ return s+pr.res.combined; },0)/related.length);
    var tier = avg>=85?'천생연분형':avg>=70?'찰떡궁합형':avg>=55?'무난동행형':avg>=40?'노력필요형':'인연신중형';
    var best = related.reduce(function(m,pr){ return pr.res.combined>m.res.combined?pr:m; }, related[0]);
    var elemPhrase = best.res.saju.elemRel.indexOf(' — ')>=0 ? best.res.saju.elemRel.split(' — ')[1] : best.res.saju.elemRel;
    var mbtiPhrase = best.res.categories.chemistry;

    var card=el('div',{class:'scroll-card'});
    var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;'});
    head.appendChild(el('h3',{style:'margin-bottom:0;'},[p.name]));
    head.appendChild(el('span',{class:'badge', style:'border-color:'+GC_TIER_COLORS[tier]+';color:'+GC_TIER_COLORS[tier]+';'},[tier]));
    card.appendChild(head);
    card.appendChild(el('p',{class:'section-sub', style:'margin-top:8px;'},['사주로는 '+elemPhrase+', MBTI로는 '+mbtiPhrase]));

    if(unlocked){
      var expandBtn=el('button',{class:'btn btn-ghost btn-sm', type:'button', style:'margin-top:6px;', 'aria-expanded':'false'},['이어보기 ↓']);
      var detail=el('div',{class:'hidden', style:'margin-top:8px;'});
      related.forEach(function(pr){
        var other = pr.a.id===p.id?pr.b:pr.a;
        var row=el('div',{class:'gc-pair-row'});
        var left=el('div',{},[
          el('div',{},[other.name]),
          el('div',{class:'section-sub', style:'margin:2px 0 0;'},[pr.res.saju.elemRel]),
          el('div',{class:'section-sub', style:'margin:2px 0 0;'},[pr.res.categories.chemistry])
        ]);
        var right=el('div',{style:'text-align:right;flex:none;'},[
          el('div',{},[pr.res.combined+'점 · '+pr.res.combinedTier]),
          el('div',{class:'section-sub', style:'margin-top:2px;'},['사주 '+pr.res.saju.score+'점 · MBTI '+pr.res.mbtiScore+'점'])
        ]);
        row.appendChild(left); row.appendChild(right);
        detail.appendChild(row);
      });
      expandBtn.addEventListener('click', function(){
        var open = this.getAttribute('aria-expanded')==='true';
        this.setAttribute('aria-expanded', open?'false':'true');
        this.textContent = open?'이어보기 ↓':'접기 ↑';
        this._detail.classList.toggle('hidden', open);
      });
      expandBtn._detail = detail;
      card.appendChild(expandBtn);
      card.appendChild(detail);
    } else {
      /* 잠긴 상태에서는 쌍별 상세를 만들지 않는다. 무엇이 잠겼는지만 알린다. */
      card.appendChild(el('p',{class:'biz-hint', style:'margin-top:6px;'},
        [compatLockMark()+related.length+'명과의 쌍별 상세는 유료예요']));
    }
    wrap.appendChild(card);
  });
  return wrap;
}
/* 렌더: 그룹 궁합 네트워크 화면 (renderCompat()과 별개 화면, 기존 1:1 궁합 입력/상태 건드리지 않음) */
function renderGroupCompat(){
  var main=$('#main'); main.innerHTML='';
  var view=el('div',{class:'view'});
  view.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ ROUTE='compat'; render(); }},['← 궁합 보기로 돌아가기']));
  view.appendChild(el('h2',{class:'section-title', style:'margin-top:10px;'},['모두의 궁합 보기']));
  view.appendChild(el('p',{class:'section-sub'},['저장된 프로필 전체를 한 화면에서 이어서 봐요. 사주 궁합과 MBTI 궁합을 함께 반영한 점수예요.']));

  if(STATE.profiles.length<2){
    view.appendChild(emptyState('프로필이 2명 이상 필요합니다','그룹 궁합을 보려면 프로필이 2명 이상 필요합니다.', function(){ startSetupWizard(null); render(); }, '새 프로필 추가하기'));
    main.appendChild(view);
    return;
  }

  var profiles = STATE.profiles;
  var pairs = buildGroupCompatPairs(profiles);
  var avgAll = Math.round(pairs.reduce(function(s,pr){ return s+pr.res.combined; },0)/pairs.length);

  var gaugeCard=el('div',{class:'scroll-card'});
  gaugeCard.appendChild(el('div',{class:'gauge-label'},['전체 평균 궁합 지수']));
  gaugeCard.appendChild(el('div',{style:'display:flex;justify-content:center;'},[buildDonutGauge(avgAll, 152)]));
  var best = pairs.reduce(function(m,pr){ return pr.res.combined>m.res.combined?pr:m; }, pairs[0]);
  var worst = pairs.reduce(function(m,pr){ return pr.res.combined<m.res.combined?pr:m; }, pairs[0]);
  if(pairs.length===1){
    gaugeCard.appendChild(el('p',{style:'text-align:center;color:var(--ink-dim);margin-top:6px;'},['이 두 사람의 궁합: '+best.a.name+' × '+best.b.name+' ('+best.res.combined+'점)']));
  } else {
    gaugeCard.appendChild(el('p',{style:'text-align:center;color:var(--ink-dim);margin-top:6px;'},['최고 궁합: '+best.a.name+' × '+best.b.name+' ('+best.res.combined+'점)']));
    gaugeCard.appendChild(el('p',{style:'text-align:center;color:var(--ink-dim);'},['상극 궁합: '+worst.a.name+' × '+worst.b.name+' ('+worst.res.combined+'점)']));
  }
  view.appendChild(gaugeCard);

  view.appendChild(buildGroupCompatGraph(profiles, pairs));
  /* 그룹 궁합도 1:1 궁합과 같은 상품(compat_full)·같은 잠금 정책을 따른다.
     쌍별 상세를 무료로 열어두면 1:1 유료 상세보다 더 많은 것을 공짜로 주게 된다. */
  var groupUnlocked = hasAccess(PRODUCTS.compat_full.id);
  view.appendChild(buildGroupCompatCards(profiles, pairs, groupUnlocked));
  if(!groupUnlocked){
    var gBlock = lockedBlock(PRODUCTS.compat_full, '', '모두의 궁합 상세');
    gBlock.insertBefore(el('div',{class:'locked-count'},
      [pairs.length+'쌍의 사주·MBTI 상세 점수가 잠겨 있어요']), gBlock.firstChild);
    view.appendChild(gBlock);
  }
  view.appendChild(el('p',{class:'disclaimer'},['사주 궁합도, MBTI 궁합도 정해진 답이 아니라 서로를 이해하는 참고 자료로 봐주세요.']));
  main.appendChild(view);
}

/* =====================================================================
   기능12: 공유 링크로 함께 참여하기 (서버 없이 URL 해시로 프로필 전달)
===================================================================== */
function encodeInvite(profile){
  var payload = { n:profile.name, m:profile.mbti, y:profile.year, mo:profile.month, d:profile.day,
    h: profile.birthTime?profile.birthTime.hour:null, mi: profile.birthTime?profile.birthTime.minute:null,
    g:profile.gender };
  return encodeURIComponent(JSON.stringify(payload));
}
function decodeInviteFromHash(hash){
  var m = /invite=([^&]+)/.exec(hash||'');
  if(!m) return null;
  try{
    var obj = JSON.parse(decodeURIComponent(m[1]));
    if(typeof obj.y!=='number'||typeof obj.mo!=='number'||typeof obj.d!=='number'||typeof obj.m!=='string') return null;
    return obj;
  }catch(e){ return null; }
}
function openInviteLinkModal(profile){

  var body=el('div',{});

  var box2=el('div',{class:'field'},[ el('input',{type:'text',value:link,readOnly:'readonly', id:'inviteLinkInput'}) ]);
  body.appendChild(box2);

    var f=data;
    return '[인연점] '+profile.name+'님의 오늘의 운세 ('+f.date+')\n'+
      FORTUNE_CATS.map(function(c){ return c.label+': '+f.items[c.key].text; }).join('\n')+
      '\n행운 아이템: '+f.luckyItem+' / 행운 색상: '+f.luckyColor;

  } else if(kind==='saju'){
    var s=data;
    return '[인연점] '+profile.name+'님의 사주팔자\n연주 '+s.year.text+'('+s.year.textH+') · 월주 '+s.month.text+'('+s.month.textH+') · 일주 '+s.day.text+'('+s.day.textH+')'+(s.hour?(' · 시주 '+s.hour.text+'('+s.hour.textH+')'):' · 시주 모름');
  } else if(kind==='mbtiReport'){

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast('텍스트를 복사했습니다.'); }).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(ok?'텍스트를 복사했습니다.':'복사에 실패했습니다. 직접 선택해 복사해주세요.');
  }catch(e){ showToast('복사를 지원하지 않는 환경입니다.'); }
}
function wrapCanvasText(ctx, text, x, yy, maxWidth, lineHeight){
  var words=text.split(''); var line=''; var yy2=yy;
  for(var i=0;i<words.length;i++){
    var test=line+words[i];
    if(ctx.measureText(test).width>maxWidth && line!==''){
      ctx.fillText(line, x, yy2); line=words[i]; yy2+=lineHeight;
    } else { line=test; }
  }
  ctx.fillText(line, x, yy2);
  return yy2+lineHeight;
}
function drawShareCard(canvas, kind, profile, data){
  var ctx=canvas.getContext('2d');
  var w=canvas.width, h=canvas.height;
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#c9a961'; ctx.lineWidth=3; ctx.strokeRect(18,18,w-36,h-36);
  ctx.strokeStyle='rgba(201,169,97,.4)'; ctx.lineWidth=1; ctx.strokeRect(30,30,w-60,h-60);

  ctx.beginPath(); ctx.arc(w-90,90,42,0,Math.PI*2); ctx.strokeStyle='#e94f37'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#e94f37'; ctx.font='700 26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('緣', w-90, 92);

  ctx.fillStyle='#c9a961'; ctx.font='700 30px serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('인연점', 50, 100);

  ctx.fillStyle='#ece4d3'; ctx.font='400 17px sans-serif';
  var y=170;

  if(kind==='fortune'){
    ctx.font='700 22px serif'; ctx.fillStyle='#ece4d3';
    ctx.fillText(profile.name+'님의 오늘의 운세', 50, y); y+=16;
    ctx.font='400 14px sans-serif'; ctx.fillStyle='#a79f8f';
    ctx.fillText(data.date, 50, y+18); y+=50;
    FORTUNE_CATS.forEach(function(cat){
      var item=data.items[cat.key];
      ctx.font='700 15px sans-serif'; ctx.fillStyle='#c9a961';
      ctx.fillText(item.label, 50, y); y+=22;
      ctx.font='400 15px sans-serif'; ctx.fillStyle='#ece4d3';
      y=wrapCanvasText(ctx, item.text, 50, y, w-100, 21); y+=14;
    });
    y+=6; ctx.font='400 14px sans-serif'; ctx.fillStyle='#c9a961';
    ctx.fillText('행운 아이템 '+data.luckyItem+' · 행운 색상 '+data.luckyColor, 50, y);
  } else if(kind==='report'){
    ctx.font='700 22px serif'; ctx.fillText(profile.name+'님의 성향 리포트', 50, y); y+=40;
    ctx.font='700 26px serif'; ctx.fillStyle='#c9a961'; ctx.fillText(profile.mbti, 50, y); y+=8;
    ctx.font='400 16px sans-serif'; ctx.fillStyle='#ece4d3'; ctx.fillText(TYPE_TAGLINE[profile.mbti], 50, y+26); y+=60;
    ctx.font='700 16px sans-serif'; ctx.fillStyle='#c9a961'; ctx.fillText('오행 · '+profile.element, 50, y); y+=26;
    ctx.font='400 15px sans-serif'; ctx.fillStyle='#ece4d3';
    y=wrapCanvasText(ctx, ELEMENT_TRAIT[profile.element], 50, y, w-100, 21);
  } else if(kind==='saju'){
    var s=data.year?data:getSajuResult(profile);
    ctx.font='700 22px serif'; ctx.fillText(profile.name+'님의 사주팔자', 50, y); y+=44;
    var cols = s.hour?['year','month','day','hour']:['year','month','day'];
    var labelMap={year:'연주',month:'월주',day:'일주',hour:'시주'};
    var colW=(w-100)/cols.length;
    cols.forEach(function(pos,i){
      var g=s[pos]; var cx=50+colW*i+colW/2;
      ctx.textAlign='center';
      ctx.font='400 13px sans-serif'; ctx.fillStyle='#a79f8f'; ctx.fillText(labelMap[pos], cx, y);
      ctx.font='700 30px serif'; ctx.fillStyle='#ece4d3'; ctx.fillText(g.stem+g.branch, cx, y+42);
      ctx.font='400 13px sans-serif'; ctx.fillStyle='#c9a961'; ctx.fillText(g.stemH+g.branchH, cx, y+62);
    });
    ctx.textAlign='left';
    y+=110;
    ctx.font='400 14px sans-serif'; ctx.fillStyle='#a79f8f';
    y=wrapCanvasText(ctx, '이 계산은 근사 절기 계산과 공개 음력 데이터를 사용한 자체 만세력 로직으로, 실제와 최대 하루 정도 차이가 날 수 있습니다.', 50, y, w-100, 20);
  } else if(kind==='mbtiReport'){
    var rpt = buildMbtiReport16(profile);
    ctx.font='700 22px serif'; ctx.fillText(profile.name+'님의 MBTI 풀이', 50, y); y+=40;
    ctx.font='700 30px serif'; ctx.fillStyle='#c9a961'; ctx.fillText(profile.mbti, 50, y); y+=8;
    ctx.font='400 16px sans-serif'; ctx.fillStyle='#ece4d3'; ctx.fillText(TYPE_TAGLINE[profile.mbti], 50, y+26); y+=64;
    ctx.font='700 15px sans-serif'; ctx.fillStyle='#c9a961'; ctx.fillText('오프닝', 50, y); y+=22;
    ctx.font='400 15px sans-serif'; ctx.fillStyle='#ece4d3';
    y=wrapCanvasText(ctx, rpt.sections[0].body.replace(/<[^>]+>/g,''), 50, y, w-100, 21); y+=18;
    ctx.font='700 15px sans-serif'; ctx.fillStyle='#c9a961'; ctx.fillText('4지표', 50, y); y+=22;
    ctx.font='400 15px sans-serif'; ctx.fillStyle='#ece4d3';
    ctx.fillText(profile.mbti.split('').join('  ·  '), 50, y);
  } else {
    var r=data;
    ctx.font='700 22px serif'; ctx.fillText(profile.name+' × '+r.pB.name, 50, y); y+=50;
    ctx.font='700 60px serif'; ctx.fillStyle='#c9a961'; ctx.textAlign='center';
    ctx.fillText(r.res.combined+'점', w/2, y+40); y+=70;
    ctx.font='400 18px sans-serif'; ctx.fillStyle='#ece4d3';
    ctx.fillText(r.res.combinedTier, w/2, y); y+=50;
    ctx.textAlign='left';
    ctx.font='700 15px sans-serif'; ctx.fillStyle='#c9a961'; ctx.fillText('사주 관점', 50, y); y+=22;
    ctx.font='400 15px sans-serif'; ctx.fillStyle='#ece4d3'; y=wrapCanvasText(ctx, r.res.saju.elemRel, 50, y, w-100, 21); y+=16;
    ctx.font='700 15px sans-serif'; ctx.fillStyle='#c9a961'; ctx.fillText('MBTI 관점', 50, y); y+=22;
    ctx.font='400 15px sans-serif'; ctx.fillStyle='#ece4d3'; y=wrapCanvasText(ctx, r.res.categories.chemistry, 50, y, w-100, 21);
  }

  ctx.font='400 11px sans-serif'; ctx.fillStyle='#7d7768'; ctx.textAlign='center';
  ctx.fillText('자체 계산 만세력 기반 참고용 콘텐츠입니다', w/2, h-40);
}

/* =====================================================================
   메인 렌더 디스패치
===================================================================== */
function render(){
  updateHeader();
  if(!STATE.onboarded && STATE.profiles.length===0){ renderOnboarding(); return; }
  if(ROUTE==='setup' && SETUP){ $('#appHeader').hidden=true; $('#tabbarWrap').hidden=true; renderSetup(); return; }
  if(STATE.profiles.length===0){ startSetupWizard(null); renderSetup(); return; }
  if(ROUTE==='inviteAccept'){ $('#appHeader').hidden=true; $('#tabbarWrap').hidden=true; renderInviteAccept(); return; }

  $all('.tab-btn').forEach(function(b){
    var on=b.dataset.route===ROUTE;
    if(on){ b.setAttribute('aria-current','page'); b.scrollIntoView({inline:'nearest', block:'nearest'}); }
    else b.removeAttribute('aria-current');
  });

  if(ROUTE==='home') renderHome();
  else if(ROUTE==='saju') renderSaju();
  else if(ROUTE==='monthlyFortune') renderMonthlyFortune();
  else if(ROUTE==='report13') renderReport13();
  else if(ROUTE==='mbtiReport') renderMbtiReport13();
  else if(ROUTE==='report') renderReport();
  else if(ROUTE==='compat') renderCompat();
  else if(ROUTE==='groupCompat') renderGroupCompat();
  else if(ROUTE==='history') renderHistory();
  else if(ROUTE==='settings') renderSettings();
  else renderHome();
}

/* 탭 클릭 위임 */
$('#tabbar').addEventListener('click', function(e){
  var btn=e.target.closest('.tab-btn');
  if(!btn) return;
  if(btn.dataset.route==='compat'){ COMPAT_DRAFT=null; COMPAT_SUB=null; }
  setRoute(btn.dataset.route);
});

/* 결제·해석 설정을 렌더 전에 로드해야 첫 화면부터 잠금/AI 상태가 올바르게 표시된다. */
bootCommerceModules();
/* 첫 화면을 그리기 전에 권한 상태를 채운다.
   서버 모드라면 조회가 끝날 때까지 '잠금'이 기본값이다 — 열어두고 나중에 닫으면 이미 늦다. */
primeEntitlements();

/* 초기 렌더: 초대 링크로 진입했고 이미 프로필이 있으면 봉인 해제 화면부터 보여준다 */
if(PENDING_INVITE && !INVITE_CONSUMED && STATE.profiles.length>0){
  ROUTE='inviteAccept';
}
render();

/* 서버가 붙어 있으면 권한을 서버에 다시 물어보고, 받은 값으로 화면을 다시 그린다.
   결제창에서 ?receipt=... 를 달고 돌아온 경우에는 영수증 검증을 먼저 통과시킨다.
   (검증에 성공해도 권한은 여전히 서버 조회 결과만 쓴다.) */
(function bootEntitlements(){
  if(!serverAuthoritative()) return;
  verifyReceiptFromUrl()
    .catch(function(){ return false; })
    .then(function(){ return fetchEntitlements(); })
    .then(function(){ render(); })
    .catch(function(err){ console.warn('이용권 조회 실패', err); render(); });
})();

})();
</script>
