<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>인연점 · 정통 만세력 사주 × MBTI 궁합</title>
<meta name="description" content="클라이언트에서 직접 계산하는 만세력 사주와 MBTI를 결합한 운세·궁합 플랫폼">
<style>
/* ===================== 리셋 & 베이스 ===================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ===== v4-A: Insight Timer풍 다크/골드 미니멀 리스킨 (변수명 유지, 값만 교체) ===== */
  --void:#0A0A0A;
  --base:#0d0d0f;
  --panel:rgba(255,255,255,.045);
  --panel-2:#1e1e20;
  --ink:#F2ECDD;
  --ink-dim:#95908a;
  /* 결제·보안 고지문에 쓰이는 색. #6f6b66은 배경(#0d0d0f) 대비 4.07:1로 WCAG AA(4.5:1) 미달이라
     가장 중요한 고지 문구가 가장 안 읽혔다. #8a857e는 약 5.2:1로 AA를 넘긴다. */
  --ink-faint:#8a857e;
  --gold:#D4AF37;
  --gold-2:#F1C94A;
  --gold-gradient:linear-gradient(135deg,var(--gold),var(--gold-2));
  --gold-soft:rgba(212,175,55,.16);
  --gold-line:rgba(212,175,55,.28);
  --red:#7a2a20;
  --red-hi:#e94f37;
  --ok:#7a9a6a;
  --shadow:0 14px 34px rgba(0,0,0,.6);
  --shadow-sm:0 4px 14px rgba(0,0,0,.5);
  --serif:'Nanum Myeongjo','AppleMyungjo','Batang','Songti SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  --pA:#D4AF37; /* 프로필A 라인색 */
  --pB:#e94f37; /* 프로필B 라인색 */
  --em-wood:#7a9a6a; --em-fire:#e2624a; --em-earth:#c9a15a; --em-metal:#cfd3d8; --em-water:#5f8fb0;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;max-width:100%;}
body{
  font-family:var(--sans);
  font-weight:350;
  letter-spacing:.02em;
  background:var(--base);
  background-image:
    radial-gradient(ellipse at 15% -10%, rgba(212,175,55,.06), transparent 55%),
    radial-gradient(ellipse at 100% 0%, rgba(212,175,55,.05), transparent 45%);
  color:var(--ink);
  min-height:100vh;
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:1rem;letter-spacing:.02em;}
select,input{font-family:inherit;color:inherit;letter-spacing:.02em;}
a{color:inherit;}
h1,h2,h3,h4{font-family:var(--sans);font-weight:400;letter-spacing:.02em;}
/* 세리프는 섹션 타이틀 · 게이지 큰 숫자 등 소수의 "포인트" 요소에만 남긴다 */
.section-title,.gauge-num,.donut-gauge-num,.brand-name,.onboard h1,.stat-mini .v{font-family:var(--serif);}
.gold-text{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hidden{display:none !important;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
[hidden]{display:none !important;}

/* ===================== 레이아웃 ===================== */
#app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--gold-line);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-seal{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--serif);font-weight:400;font-size:.95rem;flex:none;}
.brand-name{font-family:var(--serif);font-size:1.2rem;letter-spacing:.04em;}
.profile-switch{display:flex;align-items:center;gap:8px;}
.profile-switch select{
  background:var(--panel);border:1px solid var(--gold-line);color:var(--ink);
  padding:7px 10px;border-radius:3px;font-size:.85rem;max-width:120px;
}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--gold-line);
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  transition:background .15s,transform .15s;
}
.icon-btn:hover{background:var(--gold-soft);}
.icon-btn:active{transform:scale(.94);}

.tabbar-wrap{position:relative;border-bottom:1px solid var(--gold-line);}
.tabbar-wrap::after{
  content:"";position:absolute;top:0;right:0;bottom:0;width:26px;
  background:linear-gradient(90deg, transparent, var(--base) 80%);
  pointer-events:none;
}
.tabbar{
  display:flex;gap:2px;padding:0 12px;
  overflow-x:auto;background:rgba(0,0,0,.12);
}
.tab-btn{
  padding:13px 13px;font-size:.83rem;color:var(--ink-dim);white-space:nowrap;
  border-bottom:2px solid transparent;position:relative;letter-spacing:.01em;
  transition:color .15s,opacity .15s;
}
.tab-btn[aria-current="page"]{color:var(--gold);border-bottom-color:var(--red-hi);}
.tab-btn:hover{color:var(--ink);}
.tab-btn:active{opacity:.6;}

main{flex:1;padding:22px 20px 80px;}
/* v4-C: 화면 진입 리듬을 .stamp-in(카드 등장)과 동일한 이징으로 통일 — cubic-bezier(.2,1.4,.4,1), .2~.4s 범위 */
.view{animation:fadeUp .3s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.section-title{font-size:1.5rem;margin-bottom:4px;color:var(--gold);}
.section-sub{color:var(--ink-dim);font-size:.88rem;margin-bottom:20px;}

/* ===================== 족자(scroll) 카드 → v4-A: 반투명 다크그레이 카드 + 얇은 골드 헤어라인 ===================== */
.scroll-card{
  background:var(--panel);
  border:1px solid var(--gold-line);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow-sm);
  position:relative;
  margin-bottom:14px;
}
.scroll-card::before,.scroll-card::after{
  content:"";position:absolute;left:20px;right:20px;height:1px;background:var(--gold-gradient);opacity:.5;
}
.scroll-card::before{top:0;}
.scroll-card::after{bottom:0;}
.scroll-card h3{font-size:1.05rem;color:var(--ink);margin-bottom:10px;font-weight:400;}
.stamp-in{animation:stamp .3s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.08);}
  100%{opacity:1;transform:scale(1);}
}

/* ===================== 버튼 ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:12px;font-weight:500;font-size:1.02rem;letter-spacing:.02em;
  border:1px solid var(--gold-line);transition:transform .15s,background .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.98);}
.btn-primary{background:var(--gold-gradient);color:#171410;border-color:transparent;font-weight:600;box-shadow:0 0 0 0 rgba(212,175,55,0);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(212,175,55,.3);}
.btn-ghost{background:transparent;color:var(--gold);}
.btn-ghost:hover{background:var(--gold-soft);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:.85rem;}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none !important;}

/* ===================== 인장 원형 버튼 → v4-A: 가는 골드 라인 프레임으로 재조정 ===================== */
.seal-btn{
  width:64px;height:64px;border-radius:50%;border:1px solid var(--gold-line);
  color:var(--ink-dim);display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-weight:400;font-size:.82rem;text-align:center;line-height:1.15;
  transition:border-color .15s,color .15s,transform .15s;
}
.seal-btn:hover{border-color:var(--gold);color:var(--gold);}
.seal-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--void);background:var(--gold-gradient);}

/* ===================== v4-A 신규: 원형 CTA 버튼 (화면당 핵심 액션 1개) ===================== */
.btn-circle-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 6px;}
.btn-circle{
  width:68px;height:68px;border-radius:50%;flex:none;padding:0;
  background:var(--ink);color:var(--void);border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  transition:transform .15s,box-shadow .15s;
}
.btn-circle svg{width:26px;height:26px;stroke:var(--void);fill:none;stroke-width:1.6;}
.btn-circle:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(212,175,55,.25);}
.btn-circle:active{transform:translateY(0) scale(.96);}
.btn-circle[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;}
.btn-circle[disabled]:hover{transform:none;box-shadow:none;}
.btn-circle-label{font-size:.82rem;color:var(--ink-dim);letter-spacing:.03em;}

/* ===================== v4-A 신규: row + chevron 리스트 (설정·입력 화면 공용) ===================== */
.settings-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px 18px;background:var(--panel);border:1px solid var(--gold-line);
  border-radius:16px;margin-bottom:10px;width:100%;text-align:left;
  transition:border-color .15s,background .15s,transform .15s;
}
.settings-row:hover,.settings-row:focus-visible{border-color:var(--gold);background:rgba(212,175,55,.06);}
.settings-row:active{transform:scale(.98);background:rgba(212,175,55,.09);}
.settings-row .sr-label{color:var(--ink-dim);font-size:.88rem;flex:none;}
.settings-row .sr-value-wrap{display:flex;align-items:center;gap:8px;min-width:0;}
.settings-row .sr-value{color:var(--ink);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;text-align:right;}
.settings-row .sr-chevron{color:var(--gold);flex:none;font-size:1.1rem;line-height:1;opacity:.8;}
.settings-row[disabled],.settings-row.sr-static{cursor:default;}
.sheet-body{display:flex;flex-direction:column;gap:4px;}

/* ===================== v4-A 신규: 원형 도넛 게이지 ===================== */
.donut-gauge{position:relative;display:inline-flex;align-items:center;justify-content:center;margin:0 auto;}
.donut-gauge-num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.9rem;color:var(--ink);text-align:center;line-height:1.1;}
.donut-gauge-num small{display:block;font-family:var(--sans);font-size:.6rem;color:var(--ink-dim);font-weight:400;margin-top:2px;}

/* ===================== MBTI 그리드 ===================== */
.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0;}
.mbti-cell{
  aspect-ratio:1/1;border:1px solid var(--gold-line);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-weight:700;font-size:1.05rem;color:var(--ink-dim);background:rgba(0,0,0,.15);
  transition:all .15s;
}
.mbti-cell:hover{border-color:var(--gold);color:var(--ink);}
.mbti-cell[aria-pressed="true"]{background:var(--gold-gradient);border-color:transparent;color:#171410;}
@media (max-width:520px){.mbti-grid{grid-template-columns:repeat(4,1fr);gap:7px;}.mbti-cell{font-size:.85rem;}}

/* ===================== 폼 공통 ===================== */
.field{margin-bottom:16px;}
.field label{display:block;font-size:.85rem;color:var(--ink-dim);margin-bottom:6px;}
.field select,.field input[type=text],.field input[type=number]{
  width:100%;padding:11px 12px;background:var(--panel);border:1px solid var(--gold-line);
  border-radius:3px;color:var(--ink);font-size:.95rem;
}
.field select:focus,.field input:focus{border-color:var(--gold);}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.hour-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.hour-btn{padding:9px 4px;font-size:.78rem;border:1px solid var(--gold-line);border-radius:3px;color:var(--ink-dim);transition:border-color .15s,background .15s,color .15s,transform .15s;}
.hour-btn:hover{border-color:var(--gold);color:var(--ink);}
.hour-btn:active{transform:scale(.95);}
.hour-btn[aria-pressed="true"]{background:var(--panel-2);border-color:var(--gold);color:var(--gold);}
.progress-track{height:5px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;background:var(--red-hi);transition:width .3s ease;}
.seg-toggle{display:flex;border:1px solid var(--gold-line);border-radius:20px;overflow:hidden;width:max-content;}
.seg-toggle button{padding:8px 18px;font-size:.85rem;color:var(--ink-dim);transition:background .15s,color .15s;}
.seg-toggle button:active{opacity:.7;}
.seg-toggle button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold);}
.chk-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-dim);margin-top:6px;}
.chk-row input{accent-color:var(--gold);width:16px;height:16px;}

/* 별점 */
.stars{display:flex;gap:2px;}
.star{width:16px;height:16px;color:var(--ink-faint);}
.star.on{color:var(--gold);}

/* 태그/배지 */
.badge{display:inline-block;padding:4px 10px;border:1px solid var(--gold-line);border-radius:20px;font-size:.76rem;color:var(--gold);}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.badge-hap{border-color:rgba(122,154,106,.6);color:#9fc28c;}
.badge-chung{border-color:rgba(233,79,55,.6);color:#f0846f;}
.badge-hyeong{border-color:rgba(201,169,97,.6);color:var(--gold);}
.badge-pa{border-color:rgba(95,143,176,.6);color:#8bb6d6;}
.warn-box{border:1px dashed var(--red-hi);background:rgba(233,79,55,.08);border-radius:4px;padding:12px 14px;font-size:.85rem;color:#f0c9c0;margin:12px 0;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}

/* 요약 카드 4분할 */
.stat-mini{background:rgba(0,0,0,.18);border:1px solid var(--gold-line);border-radius:3px;padding:12px;text-align:center;}
.stat-mini .k{font-size:.72rem;color:var(--ink-dim);margin-bottom:4px;}
.stat-mini .v{font-family:var(--serif);font-size:1.1rem;color:var(--gold);}

/* 온보딩 */
.onboard{min-height:calc(100vh - 0px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:22px;}
.constellation{width:min(320px,80vw);height:min(320px,80vw);}
.constellation line{stroke:var(--gold);stroke-width:1;opacity:.5;stroke-dasharray:60;stroke-dashoffset:60;animation:drawLine 1.8s ease forwards;}
.constellation circle{fill:var(--gold);opacity:0;animation:popDot .4s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes drawLine{to{stroke-dashoffset:0;}}
@keyframes popDot{to{opacity:1;}}
.onboard h1{font-size:1.9rem;color:var(--gold);}
.onboard p{color:var(--ink-dim);max-width:40ch;}

/* 히스토리 리스트 */
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--gold-line);border-radius:3px;margin-bottom:8px;background:rgba(0,0,0,.15);transition:border-color .15s;}
.hist-item:hover{border-color:var(--gold);}
.hist-item .meta{font-size:.78rem;color:var(--ink-dim);}
.hist-actions{display:flex;gap:6px;}
.tabgroup{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tabgroup button{padding:8px 14px;border:1px solid var(--gold-line);border-radius:20px;font-size:.82rem;color:var(--ink-dim);transition:background .15s,color .15s,border-color .15s;}
.tabgroup button:active{opacity:.7;}
.tabgroup button[aria-selected="true"]{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);}

/* 모달 */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,5,10,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:modalFade .2s ease both;}
.modal-box{background:var(--panel-2);border:1px solid var(--gold-line);border-radius:4px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow);animation:modalIn .3s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes modalFade{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-box h3{color:var(--gold);margin-bottom:12px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--gold);color:var(--ink);padding:11px 20px;border-radius:30px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;box-shadow:var(--shadow-sm);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 레이더차트 */
.radar-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
.legend{display:flex;gap:18px;font-size:.8rem;flex-wrap:wrap;justify-content:center;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;}

/* 매듭 애니메이션 */
.knot-wrap{display:flex;justify-content:center;margin:14px 0;}
.knot-path{stroke-dasharray:400;stroke-dashoffset:400;animation:knotDraw 1.4s ease forwards .2s;}
@keyframes knotDraw{to{stroke-dashoffset:0;}}

.gauge-num{font-family:var(--serif);font-size:2.6rem;color:var(--gold);text-align:center;}
.gauge-label{text-align:center;color:var(--ink-dim);font-size:.85rem;margin-bottom:6px;}

.disclaimer{font-size:.8rem;color:var(--ink-dim);text-align:center;margin-top:22px;line-height:1.65;border-top:1px dashed var(--gold-line);padding-top:12px;}

.share-preview{display:flex;justify-content:center;margin:16px 0;}
.share-preview canvas{border:1px solid var(--gold-line);border-radius:4px;max-width:100%;height:auto;}

.empty-state{text-align:center;padding:40px 16px;color:var(--ink-dim);}
.empty-state .glyph{font-family:var(--serif);font-size:2.4rem;color:var(--gold);margin-bottom:10px;}

.profile-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--gold-line);border-radius:3px;margin-bottom:8px;}
.profile-list-item.active{border-color:var(--red-hi);}

/* ===================== v2: 사주팔자 인장 표 ===================== */
.pillar-table{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:10px;margin:14px 0;}
.pillar-col{display:flex;flex-direction:column;align-items:center;gap:8px;}
.pillar-col .col-label{font-size:.72rem;color:var(--ink-dim);}
.pillar-seal{
  width:100%;aspect-ratio:1/1;max-width:78px;border-radius:14px;border:1px solid var(--gold-line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:rgba(0,0,0,.16);position:relative;
}
.pillar-seal .ch{font-family:var(--serif);font-size:1.35rem;color:var(--ink);line-height:1.1;}
.pillar-seal .ch-h{font-size:.68rem;color:var(--ink-dim);}
.pillar-seal.elem-0{background:rgba(122,154,106,.16);border-color:rgba(122,154,106,.55);}
.pillar-seal.elem-1{background:rgba(226,98,74,.16);border-color:rgba(226,98,74,.55);}
.pillar-seal.elem-2{background:rgba(201,161,90,.18);border-color:rgba(201,161,90,.6);}
.pillar-seal.elem-3{background:rgba(207,211,216,.14);border-color:rgba(207,211,216,.55);}
.pillar-seal.elem-4{background:rgba(95,143,176,.16);border-color:rgba(95,143,176,.55);}
.pillar-sipseong{font-size:.68rem;color:var(--gold);min-height:1em;}
.pillar-table-scroll{overflow-x:auto;padding-bottom:2px;}
@media (max-width:520px){ .pillar-table{gap:6px;} .pillar-seal{max-width:60px;} .pillar-seal .ch{font-size:1.05rem;} }
@media (max-width:380px){ .pillar-seal{max-width:50px;} .pillar-seal .ch-h{font-size:.6rem;} }

/* 오행 도넛/막대 */
.elem-bars{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.elem-bar-row{display:flex;align-items:center;gap:10px;font-size:.8rem;}
.elem-bar-row .lbl{width:28px;color:var(--ink-dim);flex:none;}
.elem-bar-track{flex:1;height:10px;background:rgba(0,0,0,.25);border-radius:6px;overflow:hidden;}
.elem-bar-fill{height:100%;border-radius:6px;transition:width .4s ease;}
.elem-bar-row .num{width:20px;text-align:right;color:var(--ink-dim);flex:none;}

/* 목차 앵커 */
.toc-nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:1px solid var(--gold-line);border-radius:4px;background:rgba(0,0,0,.15);margin-bottom:18px;position:sticky;top:8px;z-index:5;max-height:150px;overflow-y:auto;}
.toc-nav a{font-size:.74rem;padding:5px 9px;border:1px solid var(--gold-line);border-radius:14px;color:var(--ink-dim);white-space:nowrap;transition:color .15s,border-color .15s;}
.toc-nav a:hover{color:var(--gold);border-color:var(--gold);}
.toc-nav a:active{opacity:.7;}
.toc-nav a.toc-locked{opacity:.55;border-style:dashed;}
.toc-nav a.toc-locked:hover{opacity:1;color:var(--gold);border-color:var(--gold);}
.report-section{scroll-margin-top:80px;margin-bottom:22px;}
.report-section h3{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:1.08rem;margin-bottom:10px;}
.report-section .sec-icon{width:20px;height:20px;flex:none;color:var(--gold);}
.report-section p{margin-bottom:10px;color:var(--ink);}
.report-section p strong{color:var(--gold);}
.next-sec-btn{display:flex;justify-content:center;margin:26px 0 6px;}

/* 대운 타임라인 */
.daewoon-scroll{display:flex;gap:10px;overflow-x:auto;padding:14px 4px 18px;}
.daewoon-item{flex:none;width:88px;text-align:center;border:1px solid var(--gold-line);border-radius:6px;padding:10px 6px;background:rgba(0,0,0,.15);}
.daewoon-item.current{border-color:var(--red-hi);background:rgba(233,79,55,.12);}
.daewoon-item .age{font-size:.72rem;color:var(--ink-dim);margin-bottom:6px;}
.daewoon-item .gz{font-family:var(--serif);font-size:1.1rem;color:var(--ink);}
.daewoon-item .ss{font-size:.68rem;color:var(--gold);margin-top:4px;}
.daewoon-item.current .age::before{content:'● 현재  ';color:var(--red-hi);}

/* ===================== v4: 유료 구간(페이월) ===================== */
/* 잠긴 구간은 "가려져 있다"가 눈에 보여야 한다. 내용을 통째로 지우면
   무엇을 사는 건지 알 수 없고, 다 보여주면 잠글 이유가 없다. */
.locked-block{position:relative;margin:18px 0;border:1px solid var(--gold-line);border-radius:16px;overflow:hidden;background:var(--panel);}
.locked-count{padding:10px 16px 0;font-size:.78rem;color:var(--gold);letter-spacing:.02em;}
.locked-teaser{position:relative;padding:12px 16px 0;color:var(--ink-dim);font-size:.9rem;line-height:1.7;
  max-height:76px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 35%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 35%,transparent 100%);}
.locked-cta{padding:14px 18px 20px;text-align:center;}
.locked-icon{font-size:1.5rem;margin-bottom:6px;}
.locked-title{font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:4px;}
.locked-desc{font-size:.84rem;color:var(--ink-dim);margin-bottom:12px;line-height:1.6;}
.compat-upsell{margin-top:16px;padding:16px;border:1px solid var(--gold-line);border-radius:16px;background:var(--gold-soft);text-align:center;}
.compat-upsell p{font-size:.86rem;color:var(--ink-dim);line-height:1.7;margin-bottom:12px;}

/* 결제 화면 */
.pay-product{text-align:center;padding:6px 0 14px;border-bottom:1px solid var(--gold-line);margin-bottom:14px;}
.pay-name{font-size:1.05rem;font-weight:600;color:var(--ink);}
.pay-price{font-size:1.5rem;font-weight:700;color:var(--gold);margin:6px 0;}
.pay-desc{font-size:.85rem;color:var(--ink-dim);line-height:1.6;}
.pay-benefits{list-style:none;padding:0;margin:0 0 14px;}
.pay-benefits li{position:relative;padding-left:20px;font-size:.87rem;color:var(--ink-dim);line-height:2;}
.pay-benefits li::before{content:'✓';position:absolute;left:0;color:var(--gold);}
.pay-upsell{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:12px;border-radius:12px;background:var(--gold-soft);font-size:.82rem;color:var(--ink-dim);margin-bottom:12px;}
/* 결제 미연동 상태를 숨기면 "결제되는 것처럼" 보인다. 눈에 띄게 알린다. */
.pay-demo-notice{padding:12px 14px;border:1px solid var(--red);border-radius:12px;background:rgba(233,79,55,.08);margin-bottom:6px;}
.pay-demo-notice strong{display:block;color:var(--red-hi);font-size:.88rem;margin-bottom:6px;}
.pay-demo-notice p{font-size:.8rem;color:var(--ink-dim);line-height:1.65;margin:0 0 6px;}
.pay-demo-notice p:last-child{margin-bottom:0;}
/* 체험 모드 배지 — "실제 결제가 아니다"를 결제 관련 화면 어디서든 같은 모양으로 알린다 */
.trial-badge{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--red);
  background:rgba(233,79,55,.1);color:var(--red-hi);font-size:.74rem;font-weight:700;letter-spacing:.02em;margin-bottom:8px;}
/* 법적 고지 모달 본문 */
.legal-body{font-size:.85rem;color:var(--ink-dim);line-height:1.75;}
.legal-body h4{color:var(--gold);font-size:.92rem;margin:14px 0 6px;font-weight:600;}
.legal-body h4:first-child{margin-top:0;}
.legal-body p{margin-bottom:8px;}
.legal-body ul{margin:0 0 8px 18px;}
.legal-body li{margin-bottom:4px;}
.legal-body .pending{color:var(--red-hi);}
.legal-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.legal-links button{font-size:.8rem;padding:7px 12px;}
.pay-legal-line{font-size:.78rem;color:var(--ink-faint);line-height:1.6;margin-top:10px;}

/* 지금 풀이를 무엇이 만들고 있는지 알리는 띠 */
.interp-notice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 14px;margin:14px 0;border-radius:12px;background:var(--panel);
  border:1px solid rgba(255,255,255,.07);font-size:.8rem;color:var(--ink-dim);line-height:1.6;}
.interp-notice.on{border-color:var(--gold-line);}
.interp-notice.warn{border-color:var(--red);}
.interp-badge{flex:0 0 auto;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--gold-soft);color:var(--gold);letter-spacing:.02em;}
.interp-notice.on .interp-badge{background:var(--gold-gradient);color:#1a1508;}
.interp-err{color:var(--red-hi);}

/* 설정: 구매 내역 / 연동 */
.biz-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.86rem;}
.biz-row:last-child{border-bottom:0;}
.biz-row .k{color:var(--ink-dim);}
.biz-row .v{color:var(--ink);font-weight:600;text-align:right;}
.biz-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:var(--panel-2);color:var(--ink);font-size:.85rem;margin-top:6px;}
.biz-hint{font-size:.76rem;color:var(--ink-faint);line-height:1.65;margin-top:6px;}

/* 궁합 요약 좌우 배치 */
.compat-pair{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:14px 0;}
.compat-side{flex:1;min-width:200px;}
.compat-side h4{text-align:center;font-size:.9rem;color:var(--ink-dim);margin-bottom:8px;}
.compat-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
@media (max-width:640px){.compat-summary-grid{grid-template-columns:1fr;}}
.tier-label{display:inline-block;margin-top:4px;padding:5px 14px;border-radius:20px;background:var(--gold-soft);color:var(--gold);font-family:var(--serif);font-size:.95rem;}

/* ===================== v3: 그룹 궁합 네트워크 (기능17) ===================== */
.gc-container{position:relative;width:100%;aspect-ratio:1/1;max-width:520px;margin:0 auto;}
.gc-svg{position:absolute;inset:0;width:100%;height:100%;}
.gc-line{transition:opacity .2s ease;}
.gc-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .2s ease;}
.gc-node.dim{opacity:.5;}
.gc-avatar{width:clamp(36px,9vw,56px);height:clamp(36px,9vw,56px);border-radius:50%;border:2px solid var(--gold-line);background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:1rem;color:var(--ink);transition:border-color .15s,box-shadow .15s;}
.gc-node:hover .gc-avatar{border-color:var(--gold);}
.gc-node[aria-pressed="true"] .gc-avatar{border-color:var(--red-hi);box-shadow:0 0 0 3px rgba(233,79,55,.22);}
.gc-label{font-size:clamp(10px,2.8vw,13px);color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:clamp(36px,9vw,56px);text-align:center;}
.gc-legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin:16px 0 4px;font-size:.78rem;color:var(--ink-dim);}
.gc-legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
.gc-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
.gc-pair-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--gold-line);font-size:.82rem;}
@media (max-width:480px){.gc-cards{grid-template-columns:1fr;}}

/* 봉투 애니메이션 */
.envelope-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 20px;text-align:center;}
.envelope{width:180px;height:120px;position:relative;}
.envelope .body{position:absolute;inset:0;background:var(--panel-2);border:2px solid var(--gold);border-radius:4px;}
.envelope .flap{position:absolute;top:0;left:0;right:0;height:60px;background:var(--panel);border:2px solid var(--gold);border-top:none;clip-path:polygon(0 0,50% 85%,100% 0);transform-origin:top center;animation:flapOpen 1.1s ease forwards .3s;}
@keyframes flapOpen{to{transform:rotateX(180deg);opacity:.15;}}
.envelope .seal{position:absolute;top:38px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--gold-gradient);display:flex;align-items:center;justify-content:center;color:#171410;font-family:var(--serif);font-weight:400;animation:sealPop 1.1s ease forwards .3s;}
@keyframes sealPop{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;transform:translateX(-50%) scale(1.4);}}

@media (max-width:600px){
  main{padding:18px 14px 80px;}
  .section-title{font-size:1.2rem;}
  .row3{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app">

  <header class="app-header" id="appHeader" hidden>
    <div class="brand">
      <div class="brand-seal" aria-hidden="true">緣</div>
      <span class="brand-name">인연점</span>
    </div>
    <div class="profile-switch" id="profileSwitch"></div>
  </header>

  <div class="tabbar-wrap" id="tabbarWrap" hidden>
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴">
    <button class="tab-btn" data-route="home">오늘의 운세</button>
    <button class="tab-btn" data-route="saju">내 사주</button>
    <button class="tab-btn" data-route="report">성향 리포트</button>
    <button class="tab-btn" data-route="compat">궁합 보기</button>
    <button class="tab-btn" data-route="history">히스토리</button>
    <button class="tab-btn" data-route="settings">설정</button>
  </nav>
  </div>

  <main id="main" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
</div>

<script>
'use strict';
(function(){

/* =====================================================================
   ★ 출시 전 반드시 채워야 하는 값 (지금은 비어 있음 — 화면에는 "확인 중"으로 나간다)
   ---------------------------------------------------------------------
   [1] COMPANY.mailOrderNo   — 통신판매업 신고번호. 신고 자체는 완료됐고 번호만 아직 못 받은 상태라
                               화면에는 "확인 중"으로 나간다("미신고"로 읽히는 표현을 쓰지 않는다).
   [2] COMPANY.supportPhone  — 고객센터 전화번호 (대표님 지시로 현재 비워둠)
       → 전자상거래법 제13조 표시의무 항목이다. 위 2개가 비어 있는 상태로 유료 결제를 열면 안 된다.
       → 값이 채워지면 화면 표기는 자동으로 바뀐다(하드코딩된 곳이 없다).
       ※ 고객센터 이메일·개인정보 보호책임자는 확정되어 이미 채워져 있다.

   [5] BILLING_SOURCE.entitlementEndpoint / contentEndpoint / verifyEndpoint / checkoutEndpoint
       → 전부 null이면 "체험 모드"다. 이 상태에서는 이용권이 이 브라우저에만 저장되고
         개발자도구로 위조할 수 있으므로 실제 과금을 해서는 안 된다.
       → ★ 주소를 넣는 곳은 아래 BILLING_SOURCE 상수 "한 곳뿐"이다. 여기에 값이 들어가면
         브라우저 저장소로는 그 값을 바꾸거나 지울 수 없다(설정 화면 저장본은 개발자도구
         한 줄이면 지워지므로, 그것을 권한의 근거로 삼으면 페이월이 통째로 뚫린다).
       → 설정 → 결제 연동 화면의 입력칸은 ?demo=1 개발 모드에서만 동작하는 임시 덮어쓰기이고,
         이미 상수에 값이 있는 항목은 개발 모드에서도 덮어쓸 수 없다(끄거나 낮출 수 없다).
       → 결제 버튼을 실제로 열려면 entitlementEndpoint · contentEndpoint · checkoutEndpoint가
         "모두" 설정돼야 한다. 하나라도 비면 결제 버튼은 열리지 않는다(paywallGate() 참조).
===================================================================== */

/* =====================================================================
   사업자 정보 — 화면 어디에도 하드코딩하지 않는다. 전부 이 객체에서 꺼내 쓴다.
   null인 항목은 companyValue()가 "확인 중"으로 바꿔 표시한다.
   (가격을 formatWon(PRODUCTS[...].price) 한 곳으로 모은 것과 같은 원칙)
===================================================================== */
var COMPANY = {
  serviceName:  '인연점',
  legalName:    '주식회사 언바운드',
  legalNameEn:  'Unbound',
  ceo:          '박정인',
  bizRegNo:     '581-88-04065',
  corpRegNo:    '120111-0153083',
  address:      '인천광역시 서해구 중봉대로612번길 10-22, 7층 703호 D21 (청라동, 우리프라자)',
  mailOrderNo:  null,   /* ★ 통신판매업 신고번호 — 신고는 완료됐고 번호만 아직 못 받았다("확인 중"으로 표시) */
  supportPhone: null,   /* ★ 고객센터 전화 — 대표님 지시로 비워둠 */
  supportEmail: 'unbound.co.ltd@gmail.com',
  privacyOfficer: '박정인',
  hostingProvider: null, /* ★ 호스팅서비스 제공자 — 전자상거래법 제13조 제1항 제3호 표시의무. 배포처 확정 전이라 비워둔다 */
  privacyEffectiveDate: null /* ★ 개인정보처리방침 시행일자 — 서비스 출시일로 확정되면 채운다 */
};
/* 못 받은 값을 그럴듯한 가짜로 채우지 않는다. 없으면 없다고 적는다. */
function companyValue(v){ return (v===null || v===undefined || v==='') ? '확인 중' : String(v); }
function companyMissing(v){ return (v===null || v===undefined || v===''); }

/* =====================================================================
   결제 서버 연결 지점 — 여기 한 곳에만 둔다.
   ---------------------------------------------------------------------
   null = 아직 서버가 없다는 뜻(체험 모드). 값이 들어가는 순간 서버 권위 모드로 전환된다.

   ── 서버 계약 (백엔드는 이 주석만 보고 구현할 수 있어야 한다) ────────────────
   공통: 요청은 POST + Content-Type: application/json, 자격증명은 쿠키(credentials:'include').
        모든 응답은 JSON. 타임아웃 BILLING.timeoutMs(기본 10초).
        ★ 어떤 실패(네트워크/타임아웃/4xx/5xx/형식오류)든 클라이언트는 "잠금"으로 되돌아간다.
          절대 열어주는 쪽으로 실패하지 않는다.

   1) entitlementEndpoint — 지금 이 사용자가 무엇을 살 권리가 있는지 조회
      요청 : { "kind": "entitlements" }
      응답 : {
               "items":     { "saju_full": { "purchasedAt": 1737000000000 }, ... },  // 1회 구매 상품
               "pass":      { "productId":"premium_pass", "purchasedAt":..., "expiresAt":... } | null,
               "purchases": [ { "productId":"saju_full", "at":..., "price":1900, "receiptId":"..." } ]
             }
      주의 : 이 응답이 권한의 유일한 근거다. 클라이언트의 localStorage 값은 이때 완전히 무시된다.
             미로그인/미결제면 { "items":{}, "pass":null, "purchases":[] } 를 200으로 돌려준다.

   2) contentEndpoint — 유료 섹션 "본문"을 서버에서 받아온다
      요청 : { "productId":"saju_full", "sectionFrom":3, "payload": {
                "kind":"saju", "gender":"여",
                "pillars":{...}, "elements":{...}, "dayMasterStrength":"weak", "sipseong":{...},
                "requested":{"sections":13,"tone":"따뜻한 반말체","language":"ko"} } }
             ★ payload에는 "본문을 쓰는 데 실제로 필요한 것"만 담는다(허용 목록 방식).
               닉네임과 생년월일·태어난 시각 원본은 보내지 않는다(contentPayloadFrom() 참조).
               본문에 이름을 넣고 싶으면 응답에 {{name}} 이라고 적어라 —
               클라이언트가 화면에 그릴 때 그 자리를 사용자의 닉네임으로 바꿔 넣는다.
      응답 : { "sections": [ { "id":"s4", "title":"내면 · 겉과 속의 차이",
                              "icon":"M4 18 L10 6 L16 18",
                              "paragraphs": ["{{name}}는 …", "문단2"] } ] }

      주의 : ★ paragraphs(평문 문단 배열)를 권장한다. 클라이언트가 textContent로만 넣으므로 XSS가 원리적으로 불가능하다.
             부득이 HTML을 보내야 하면 "body":"<p>…</p>" 도 받지만, 클라이언트가 p/strong/em/b/i/br/ul/ol/li 만
             남기고 나머지 태그·속성을 전부 제거한다(허용 목록 방식).
             ★ 서버는 반드시 결제 여부를 먼저 확인하고, 미결제자에게는 본문을 내려주지 않는다(403).

               결제하지 않은 사람은 원리적으로 본문을 손에 넣을 수 없다.

   3) verifyEndpoint — 결제창에서 돌아왔을 때 영수증 1건을 검증
      요청 : { "receiptId":"...", "productId":"..." }
      응답 : { "verified": true|false, "reason":"..." }
      호출 시점 : 페이지 진입 URL에 ?receipt=... 가 있을 때 1회. verified가 true면
                  곧바로 entitlementEndpoint를 다시 조회해 권한을 갱신한다(권한은 여전히 서버가 준 것만 쓴다).

   4) checkoutEndpoint — 결제 세션 생성
      요청 : { "productId":"saju_full", "price":1900 }
      응답 : { "checkoutUrl":"https://pg.example.com/..." }  // PG 결제창으로 이동
             또는 { "granted": true, "receiptId":"..." }      // 서버가 즉시 승인한 경우

===================================================================== */

function $(sel,ctx){return (ctx||document).querySelector(sel);}

function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]===null || attrs[k]===undefined || attrs[k]===false){ /* omit falsy boolean-style attrs (e.g. disabled) */ }
    else e.setAttribute(k,attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

}

}
function djb2(str){
  var hash=5381;
  for(var i=0;i<str.length;i++){ hash=((hash*33)^str.charCodeAt(i))>>>0; }
  return hash>>>0;
}
function hasBatchim(str){
  var s=String(str==null?'':str);
  if(!s) return false;
  var code=s.charCodeAt(s.length-1);
  if(code<0xAC00||code>0xD7A3) return false; // 한글 음절이 아니면(영문/숫자 등) 받침 없음으로 간주

/* 예약된 타이머를 추적한다. 실행이 끝나면 목록에서 스스로 빠져 배열이 무한히 자라지 않는다. */
var activeTimers = [];
function trackTimeout(fn, ms){
  var id = setTimeout(function(){
    var i = activeTimers.indexOf(id);
    if(i >= 0) activeTimers.splice(i, 1);
    fn();
  }, ms);
  activeTimers.push(id);
  return id;
}

/* =====================================================================
   외부(해석 서버 등)에서 받은 HTML을 화면에 넣기 전에 통과시키는 정화기.
   ---------------------------------------------------------------------
   외부 라이브러리를 쓸 수 없으므로(단일 HTML 파일 제약) 직접 만든다.
   방식: DOMParser로 "떼어낸 문서"에 파싱한다 — 이 문서는 렌더링되지 않으므로
   <script>도 실행되지 않고 <img onerror>도 발화하지 않는다. 그 다음 허용 목록에
   있는 태그만 새로 만들어 옮겨 담는다(속성은 전부 버린다).
   허용 태그: p, strong, b, em, i, br, ul, ol, li
   그 밖의 요소는 태그만 버리고 안의 "글자"는 살린다(내용이 통째로 사라지지 않도록).
===================================================================== */
var SANITIZE_ALLOWED_TAGS = {P:1, STRONG:1, B:1, EM:1, I:1, BR:1, UL:1, OL:1, LI:1};
/* 이 태그들은 껍데기뿐 아니라 "안의 글자"까지 통째로 버린다.
   <script>는 실행되진 않아도 남겨두면 코드가 본문에 그대로 찍혀 보이기 때문이다. */
/* ★ 조회 키는 반드시 대문자로 정규화해서 쓴다.
   HTML 안의 SVG/MathML 네임스페이스 요소는 tagName이 소문자로 유지되기 때문에
   (<svg> → "svg", 그 안의 <script> → "script"), 정규화하지 않으면 이 목록이 통째로 빗나가
   껍데기만 벗겨지고 안의 코드가 본문에 글자로 그대로 찍힌다(실제로 그랬다). */
var SANITIZE_DROP_SUBTREE = {SCRIPT:1, STYLE:1, NOSCRIPT:1, IFRAME:1, OBJECT:1, EMBED:1, TEMPLATE:1,
  HEAD:1, LINK:1, META:1, SVG:1, MATH:1, FOREIGNOBJECT:1, ANIMATE:1, ANIMATETRANSFORM:1, SET:1, USE:1,
  DESC:1, TITLE:1, CANVAS:1, AUDIO:1, VIDEO:1, FRAME:1, FRAMESET:1, XMP:1, PLAINTEXT:1, LISTING:1};
function sanitizeHtmlToFragment(html){
  var frag = document.createDocumentFragment();
  var src = String(html==null ? '' : html);
  if(!src) return frag;
  var inert = null;
  try{
    if(typeof DOMParser !== 'undefined'){
      inert = new DOMParser().parseFromString('<body>'+src+'</body>', 'text/html').body;
    }
  }catch(e){ inert = null; }
  if(!inert){
    /* DOMParser를 못 쓰는 환경이면 태그를 전부 벗겨 평문으로만 넣는다(가장 안전한 쪽). */
    frag.appendChild(document.createTextNode(src.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()));
    return frag;
  }
  (function walk(srcNode, destNode){
    var kids = srcNode.childNodes;
    for(var i=0;i<kids.length;i++){
      var n = kids[i];
      if(n.nodeType === 3){ destNode.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if(n.nodeType !== 1) continue; /* 주석·기타 노드는 버린다 */
      var tag = String(n.tagName || '').toUpperCase(); /* SVG/MathML은 소문자로 오므로 반드시 정규화 */
      if(SANITIZE_DROP_SUBTREE[tag]){ continue; } /* 내용까지 통째로 버린다 */
      if(SANITIZE_ALLOWED_TAGS[tag]){
        var clean = document.createElement(tag.toLowerCase()); /* 속성은 하나도 옮기지 않는다 */
        walk(n, clean);
        destNode.appendChild(clean);
      } else {
        walk(n, destNode); /* 허용 안 된 태그: 껍데기만 버리고 내용은 살린다 */
      }
    }
  })(inert, frag);
  return frag;
}
/* 서버가 보낸 평문 문단 배열 → <p> 노드들. textContent로만 넣으므로 XSS가 원리적으로 불가능하다. */
function paragraphsToFragment(list){
  var frag = document.createDocumentFragment();
  (list||[]).forEach(function(t){
    var p = document.createElement('p');
    p.textContent = String(t==null?'':t);
    frag.appendChild(p);
  });
  return frag;
}

function openModal(title, bodyNode, actions){
  closeModal();
  var backdrop=el('div',{class:'modal-backdrop',id:'activeModal'});
  var box=el('div',{class:'modal-box',role:'dialog','aria-modal':'true','aria-label':typeof title==='string'?title:'대화 상자'});
  box.appendChild(el('h3',{},[title]));
  box.appendChild(bodyNode);
  var row=el('div',{class:'modal-close-row'});
  (actions||[{label:'닫기',cls:'btn-ghost',onclick:closeModal}]).forEach(function(a){
    row.appendChild(el('button',{class:'btn '+(a.cls||'btn-ghost'),
      disabled: a.disabled?'disabled':null,
      onclick: a.disabled?null:a.onclick},[a.label]));
  });
  box.appendChild(row);
  backdrop.appendChild(box);
  backdrop.addEventListener('click', function(e){ if(e.target===backdrop) closeModal(); });
  document.addEventListener('keydown', modalEscHandler);
  openModal._trigger = document.activeElement;
  $('#modalRoot').appendChild(backdrop);
  box.querySelector('button,input,select')&&box.querySelector('button,input,select').focus();
}
function modalEscHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  var m=$('#activeModal'); if(m) m.remove();
  document.removeEventListener('keydown', modalEscHandler);
  if(openModal._trigger && openModal._trigger.focus){ openModal._trigger.focus(); openModal._trigger=null; }
}

var SajuEngine = (function(){

function ganjiOf(idx){
  idx=((idx%60)+60)%60;
  return { idx:idx, stemIdx: idx%10, branchIdx: idx%12,

/* ---- 1. 일주(日柱) 계산 — 날짜 차이 기반 ----
   기준(anchor): 1900-01-31(UTC 자정 기준 날짜) = 60갑자 index 40 (갑진/甲辰).
   [검산 근거] 공개된 오픈소스 만세력 라이브러리(jjonline/calendar.js)의 일주 계산식
   gzD = toGanZhi(Date.UTC(y,m-1,d)/86400000 + 25567 + 10 + (d-1)) 을 기준으로 역산해
   아래 4개의 "널리 알려진 간지일"과 전부 정확히 일치함을 대조 완료(2026년 8월, Node.js로 자체 검산):
     · 1949-10-01 (중국 국경일, 통상 '갑자일'로 널리 알려짐)      -> index 0  (갑자/甲子)  일치
     · 2000-01-01 (다수의 공개 만세력에 '무오일'로 기재)           -> index 54 (무오/戊午)  일치
     · 2024-01-01 (다수의 공개 만세력에 '갑자일'로 기재)           -> index 0  (갑자/甲子)  일치
     · 1990-01-01 (다수의 공개 만세력에 '병인일'로 기재)           -> index 2  (병인/丙寅)  일치
   4개 검증일 모두 기준 index 40에서 daysBetween 공식으로 역산한 값과 정확히 일치하여 보정 없이 채택함.
   [자시 경계 처리] 23:00~다음날 01:00를 '다음날의 시작'으로 간주하는 단순 기준(자정 기준 아님, 23:00 기준)을
   채택한다. 즉 23:00~23:59에 태어났다면 일주 계산 시 날짜를 +1일 하여 다음날 일주를 사용한다.
   시간 미상 입력은 이 보정이 발생하지 않는다(시주 자체를 계산하지 않으므로 자시 여부를 특정할 수 없음). */
var DAY_ANCHOR_UTC = Date.UTC(1900,0,31);
var DAY_ANCHOR_IDX = 40;
function dayPillarIndexForCivilDate(y,m,d,hour){
  var base = Date.UTC(y,m-1,d);
  if(hour!=null && hour>=23) base += 86400000; // 야자시(23시대) -> 다음날로 간주
  var diff = Math.round((base-DAY_ANCHOR_UTC)/86400000);
  return ((diff+DAY_ANCHOR_IDX)%60+60)%60;
}

/* ---- 2. 절기(24절기) 근사 계산 — 태양 황경 기반 수치 탐색 ---- */
function toJD(ms){ return ms/86400000 + 2440587.5; }
function fromJD(jd){ return (jd-2440587.5)*86400000; }
function sunLongitude(jd){
  var T=(jd-2451545.0)/36525;
  var L=280.46646+36000.76983*T+0.0003032*T*T;
  var g=357.52911+35999.05029*T-0.0001537*T*T;
  var gr=g*Math.PI/180;
  var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(gr)+(0.019993-0.000101*T)*Math.sin(2*gr)+0.000289*Math.sin(3*gr);
  var lam=(L+C)%360; if(lam<0)lam+=360;
  return lam;
}
function angDiff(a,target){ var d=(a-target)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; }
function findSolarTermUTCms(guessUTCms, targetDeg){
  var startJD=toJD(guessUTCms-6*86400000), endJD=toJD(guessUTCms+6*86400000);
  var stepJD=6/24;
  var prevJD=startJD, prevDiff=angDiff(sunLongitude(prevJD),targetDeg);
  for(var jd=startJD+stepJD; jd<=endJD; jd+=stepJD){
    var diff=angDiff(sunLongitude(jd),targetDeg);
    if((prevDiff<=0&&diff>=0)||(prevDiff>=0&&diff<=0)){
      var lo=prevJD, loD=prevDiff, hi=jd;
      for(var it=0; it<24; it++){
        var mid=(lo+hi)/2, midD=angDiff(sunLongitude(mid),targetDeg);
        if((loD<=0&&midD>=0)||(loD>=0&&midD<=0)){ hi=mid; } else { lo=mid; loD=midD; }
      }
      return fromJD((lo+hi)/2);
    }
    prevJD=jd; prevDiff=diff;
  }
  return null;
}
/* 12절: 목표 태양황경(deg) + 평균 가이드 날짜(월은 0-index) + 대응 월지 index */
var JIE_LIST = [
  {deg:315, gm:1, gd:4,  branch:2},  // 입춘 -> 인월
  {deg:345, gm:2, gd:5,  branch:3},  // 경칩 -> 묘월
  {deg:15,  gm:3, gd:4,  branch:4},  // 청명 -> 진월

  {deg:75,  gm:5, gd:5,  branch:6},  // 망종 -> 오월

var SOLAR_TERM_NAMES = ['입춘','경칩','청명','입하','망종','소서','입추','백로','한로','입동','대설','소한'];
var termCache = {};
function jieBoundariesForYear(year){
  if(termCache[year]) return termCache[year];
  var arr = JIE_LIST.map(function(j,i){
    var guess = Date.UTC(year, j.gm, j.gd);
    return {deg:j.deg, branch:j.branch, name:SOLAR_TERM_NAMES[i], ms:findSolarTermUTCms(guess, j.deg)};
  });
  termCache[year]=arr;
  return arr;
}
function ipchunUTCms(year){ return jieBoundariesForYear(year)[0].ms; }
function nextTermAfter(sortedAll, ms){ for(var i=0;i<sortedAll.length;i++){ if(sortedAll[i].ms>ms) return sortedAll[i]; } return null; }
function prevTermBeforeOrEq(sortedAll, ms){ var found=null; for(var i=0;i<sortedAll.length;i++){ if(sortedAll[i].ms<=ms) found=sortedAll[i]; else break; } return found; }

  var all=[];
  [year-1,year,year+1].forEach(function(y){ jieBoundariesForYear(y).forEach(function(b){ all.push(b); }); });
  all.sort(function(a,b){ return a.ms-b.ms; });
  return all;
}

/* ---- 3. 연주(年柱) — 입춘 기준 ---- */
function yearPillar(birthUTCms, year){
  var ipchun = ipchunUTCms(year);
  var sajuYear = (birthUTCms < ipchun) ? year-1 : year;
  var stemIdx = ((sajuYear-4)%10+10)%10;
  var branchIdx = ((sajuYear-4)%12+12)%12;
  return { sajuYear:sajuYear, idx: idxFromStemBranch(stemIdx,branchIdx), stemIdx:stemIdx, branchIdx:branchIdx };
}

/* ---- 4. 월주(月柱) — 오호둔법 ---- */
function monthPillar(birthUTCms, birthYear, yearStemIdx){
  var all = threeYearTerms(birthYear);
  var current = prevTermBeforeOrEq(all, birthUTCms) || all[0];
  var monthBranch = current.branch;
  var startStem = (2 + 2*(yearStemIdx%5))%10; // 오호둔: 갑기->병인(2), 을경->무인(4), 병신->경인(6), 정임->임인(8), 무계->갑인(0)
  var offset = (monthBranch - 2 + 12)%12;
  var stemIdx = (startStem+offset)%10;
  var next = nextTermAfter(all, birthUTCms);
  return { idx: idxFromStemBranch(stemIdx,monthBranch), branch:monthBranch, currentTerm:current, nextTerm:next };
}

/* ---- 5. 시주(時柱) — 오서둔법 ---- */
function hourBranchIndex(hour){ var adj=(hour+1)%24; return Math.floor(adj/2); }
function hourPillar(dayStemIdx, hour){
  var branchIdx = hourBranchIndex(hour);
  var startStem = (2*(dayStemIdx%5))%10; // 오서둔: 갑기->갑자(0), 을경->병자(2), 병신->무자(4), 정임->경자(6), 무계->임자(8)
  var stemIdx = (startStem + branchIdx)%10;
  return { idx: idxFromStemBranch(stemIdx,branchIdx), branch:branchIdx };
}

var KST_OFFSET_MS = 9*3600*1000;
/* ---- 종합: 사주 8자(또는 6자) 계산 ----
   y,m,d,hour(,minute)는 한국 표준시(KST, UTC+9) 기준 입력으로 간주한다.
   절기(태양 황경) 비교는 실제 시각(UTC)이 필요하므로 KST->UTC 변환을 거치고,
   일주는 관례상 '민간 달력 날짜' 단위이므로 이 변환과 무관하게 계산한다. */
function computeSaju(y,m,d,hour,minute){
  var localHour = (hour==null?12:hour); // 시간 모르면 정오로 가정(연/월 경계 오차 최소화 목적, 시주는 계산 안 함)
  var birthUTCms = Date.UTC(y,m-1,d,localHour,(minute||0),0) - KST_OFFSET_MS;
  var yp = yearPillar(birthUTCms, y);
  var mp = monthPillar(birthUTCms, y, yp.stemIdx);
  var dIdx = dayPillarIndexForCivilDate(y,m,d,hour);
  var result = {
    year: ganjiOf(yp.idx), month: ganjiOf(mp.idx), day: ganjiOf(dIdx),
    sajuYear: yp.sajuYear, hasHour: hour!=null,
    termBoundary: { current: mp.currentTerm, next: mp.nextTerm },
    birthUTCms: birthUTCms
  };
  if(hour!=null){ var hp=hourPillar(dIdx%10, hour); result.hour = ganjiOf(hp.idx); }
  // 절기 경계 근접(24시간 이내) 감지
  var nearMs = 24*3600*1000;
  result.nearBoundary = (mp.currentTerm && Math.abs(birthUTCms-mp.currentTerm.ms)<nearMs) ||
    (mp.nextTerm && Math.abs(mp.nextTerm.ms-birthUTCms)<nearMs);
  return result;
}

  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0, // 2050-2059

function leapMonthOf(y){ return LUNAR_INFO[y-1900] & 0xf; }
function leapDaysOf(y){ return leapMonthOf(y) ? ((LUNAR_INFO[y-1900]&0x10000)?30:29) : 0; }

function lunarToSolar(y,m,d,isLeapMonth){

  for(i=1900;i<y;i++){ offset+=lYearDaysOf(i); }

    if(!isAdd){ if(lm<=i && lm>0){ offset+=leapDaysOf(y); isAdd=true; } }

var SIPSEONG_NAMES = [['비견','겁재'],['식신','상관'],['편재','정재'],['편관','정관'],['편인','정인']];
function sipseongOf(dayStemIdx, targetElem, targetYY){
  var dayElem = STEM_ELEM[dayStemIdx], dayYY = STEM_YY[dayStemIdx];
  var diff = ((targetElem-dayElem)%5+5)%5;
  var pair = SIPSEONG_NAMES[diff];
  return (targetYY===dayYY) ? pair[0] : pair[1];
}
function elementCounts(chars){ // chars: [{elem,yy}, ...]
  var counts=[0,0,0,0,0];
  chars.forEach(function(c){ counts[c.elem]++; });
  return counts;
}

/* ---- 8. 지지 합충형파 ---- */
function pairKey(a,b){ return a<b? a+'_'+b : b+'_'+a; }
var YUKHAP = {}; [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]].forEach(function(p){ YUKHAP[pairKey(p[0],p[1])]=1; });
var CHUNG = {}; [[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]].forEach(function(p){ CHUNG[pairKey(p[0],p[1])]=1; });
var PA = {}; [[0,9],[1,4],[2,11],[3,6],[5,8],[10,7]].forEach(function(p){ PA[pairKey(p[0],p[1])]=1; });
var SAMHAP = [ {set:[11,3,7],elem:0}, {set:[2,6,10],elem:1}, {set:[5,9,1],elem:3}, {set:[8,0,4],elem:4} ]; // 해묘미목/인오술화/사유축금/신자진수
var BANGHAP = [ {set:[2,3,4],elem:0}, {set:[5,6,7],elem:1}, {set:[8,9,10],elem:3}, {set:[11,0,1],elem:4} ];
function branchRelations(branchIdxList){
  var rel = { hap:[], chung:[], pa:[], hyeong:[], samhap:[], banghap:[] };
  for(var i=0;i<branchIdxList.length;i++){
    for(var j=i+1;j<branchIdxList.length;j++){
      var a=branchIdxList[i], b=branchIdxList[j];
      var k=pairKey(a.idx,b.idx);
      if(YUKHAP[k]) rel.hap.push([a,b]);
      if(CHUNG[k]) rel.chung.push([a,b]);
      if(PA[k]) rel.pa.push([a,b]);
    }
  }
  var idxs = branchIdxList.map(function(x){return x.idx;});
  function hasAll(arr){ return arr.every(function(v){ return idxs.indexOf(v)>=0; }); }
  if(hasAll([2,5,8])) rel.hyeong.push({type:'삼형', chars:[2,5,8]});
  if(hasAll([1,10,7])) rel.hyeong.push({type:'삼형', chars:[1,10,7]});
  if(hasAll([0,3])) rel.hyeong.push({type:'상형', chars:[0,3]});
  [4,6,9,11].forEach(function(b){ if(idxs.filter(function(v){return v===b;}).length>=2) rel.hyeong.push({type:'자형', chars:[b]}); });
  SAMHAP.forEach(function(s){
    var have = s.set.filter(function(v){ return idxs.indexOf(v)>=0; });
    if(have.length>=2) rel.samhap.push({elem:s.elem, have:have, full:have.length===3});
  });
  BANGHAP.forEach(function(s){
    var have = s.set.filter(function(v){ return idxs.indexOf(v)>=0; });
    if(have.length>=2) rel.banghap.push({elem:s.elem, have:have, full:have.length===3});
  });
  return rel;
}

/* ---- 9. 대운 ---- */
function daewoonList(birthUTCms, birthYear, yearStemIdx, yearYY, gender, monthIdx){
  var forward = (yearYY===1 && gender==='M') || (yearYY===0 && gender==='F');
  var all = threeYearTerms(birthYear);
  var refTerm = forward ? nextTermAfter(all, birthUTCms) : prevTermBeforeOrEq(all, birthUTCms);
  var refMs = refTerm ? refTerm.ms : birthUTCms;
  var days = Math.abs(refMs - birthUTCms)/86400000;
  var daeunNumber = Math.max(1, Math.round(days/3)); // 3일=1년 환산(전통 규칙)
  var list = [];
  for(var n=0;n<9;n++){
    var idx = forward ? (monthIdx+1+n)%60 : ((monthIdx-1-n)%60+60)%60;
    list.push({ startAge: daeunNumber+10*n, ganji: ganjiOf(idx) });
  }
  return { forward:forward, daeunNumber:daeunNumber, list:list };
}

/* ---- 10. 세운 ---- */
function saeunPillar(year){
  var stemIdx=((year-4)%10+10)%10, branchIdx=((year-4)%12+12)%12;
  return ganjiOf(idxFromStemBranch(stemIdx,branchIdx));
}

/* ---- v5-B 신규(기능19): 지정 연도 1~12월 월주 목록 ----
   새 계산 알고리즘이 아니라, 이미 존재하는 연주(yearPillar)·월주(monthPillar, 오호둔법) 공식을
   "임의의 연도+월"에도 그대로 적용하는 래퍼일 뿐이다. 각 달 15일 정오(KST)를 그 달의 대표 시각으로 삼아
   yearPillar+monthPillar를 순차 호출한다(computeSaju 내부에서 이 둘을 쓰는 것과 완전히 동일한 방식).
   대표 시각 자체가 yearPillar에 그대로 들어가므로, 1~2월처럼 입춘 이전 달은 yearPillar가 알아서
   사주년(sajuYear)을 전년도로 넘겨 처리한다(별도 분기 로직 불필요). */
function monthlyPillarsOfYear(year){
  var list = [];
  for(var m=1; m<=12; m++){
    var repUTCms = Date.UTC(year, m-1, 15, 12, 0, 0) - KST_OFFSET_MS; // 그 달 15일 정오(KST) 대표 시각
    var yp = yearPillar(repUTCms, year);
    var mp = monthPillar(repUTCms, yp.sajuYear, yp.stemIdx);
    list.push({ month:m, sajuYear:yp.sajuYear, yearGanji: ganjiOf(yp.idx), ganji: ganjiOf(mp.idx) });
  }
  return list;
}

return {
  STEMS:STEMS, BRANCHES:BRANCHES, ELEM_NAMES:ELEM_NAMES, STEM_ELEM:STEM_ELEM, STEM_YY:STEM_YY, BRANCH_ELEM:BRANCH_ELEM, BRANCH_YY:BRANCH_YY,
  ganjiOf:ganjiOf, computeSaju:computeSaju, lunarToSolar:lunarToSolar, ipchunUTCms:ipchunUTCms, jieBoundariesForYear:jieBoundariesForYear,
  sipseongOf:sipseongOf, elementCounts:elementCounts, branchRelations:branchRelations, daewoonList:daewoonList, saeunPillar:saeunPillar,

/* =====================================================================
   상용화 계층 1 — 이용권(Entitlement) / 결제
   ---------------------------------------------------------------------
   무료로 열어두는 범위와 유료 범위를 한 곳에서 정의한다.
   결제는 PG(결제대행사) 없이는 절대 실제로 처리할 수 없으므로, 여기서는
   "결제 요청을 만들어 넘기는 자리"만 만들어 두고 실제 승인은 서버가 하도록 분리했다.
   데모 모드에서는 카드번호 같은 실제 결제정보를 입력받지 않는다 —
   받는 시늉만 하는 가짜 결제창은 그 자체로 위험하기 때문이다.
===================================================================== */
var PRODUCTS = {
  saju_full:    { id:'saju_full',    name:'사주 풀이 전체 해석', price:1900, kind:'once',
                  desc:'13개 섹션 전체 — 성격·재물·직업·관계·건강·대운 흐름까지' },
  mbti_full:    { id:'mbti_full',    name:'MBTI 풀이 전체 해석', price:1900, kind:'once',
                  desc:'13개 섹션 전체 — 강점·그림자·관계 패턴·성장 방향까지' },
  compat_full:  { id:'compat_full',  name:'궁합 상세 전체', price:1900, kind:'once',
                  desc:'사주 궁합 상세 · MBTI 궁합 상세 · 궁합 시각화' },
  premium_pass: { id:'premium_pass', name:'전체 이용권 30일', price:4900, kind:'pass', days:30,
                  desc:'위 모든 상세 해석을 30일간 무제한으로' }
};

/* 무료로 보여줄 섹션 수. 이 값이 "맛보기"의 크기다.
   너무 적으면 서비스 가치를 못 느끼고, 너무 많으면 결제할 이유가 없어진다. */
var FREE_SECTION_COUNT = 3;

function defaultEntitlements(){ return { items:{}, pass:null, purchases:[] }; }

/* =====================================================================
   권한(이용권)의 단일 출처.
   ---------------------------------------------------------------------
   화면의 모든 잠금 판정은 여기 담긴 ENT.data 하나만 본다.
   localStorage를 직접 읽어 잠금을 판단하는 곳은 이 파일 어디에도 없다 —
   서버가 붙는 순간 그런 곳이 하나라도 남아 있으면 배선 전체가 무의미해지기 때문이다.

     mode 'server' : ENT.data = 서버 응답. localStorage 값은 완전히 무시된다.
     mode 'trial'  : ENT.data = 이 브라우저의 localStorage. 실제 결제가 아닌 체험 모드.
===================================================================== */
var ENT = { mode:'trial', ready:false, error:null, data: defaultEntitlements() };

/* 체험 모드에서만 쓰는 로컬 저장본. 서버 모드에서는 이 함수가 호출되지 않는다. */
function localTrialEntitlements(){
  if(!STATE.entitlements) STATE.entitlements = defaultEntitlements();
  var e = STATE.entitlements;
  if(!e.items) e.items = {};
  if(!e.purchases) e.purchases = [];
  return e;
}
/* 서버 응답을 앱이 쓰는 모양으로 맞춘다. 모르는 필드는 버리고, 빠진 필드는 잠금 쪽 기본값으로 채운다. */
function normalizeEntitlements(raw){
  var out = defaultEntitlements();
  if(!raw || typeof raw !== 'object') return out;
  if(raw.items && typeof raw.items === 'object'){
    for(var k in raw.items){ if(PRODUCTS[k]) out.items[k] = { purchasedAt: Number(raw.items[k] && raw.items[k].purchasedAt) || Date.now() }; }
  }
  if(raw.pass && raw.pass.expiresAt){
    out.pass = { productId: raw.pass.productId || 'premium_pass',
                 purchasedAt: Number(raw.pass.purchasedAt) || Date.now(),
                 expiresAt: Number(raw.pass.expiresAt) || 0 };
  }
  if(Array.isArray(raw.purchases)){
    out.purchases = raw.purchases.filter(function(p){ return p && PRODUCTS[p.productId]; }).map(function(p){
      return { productId:p.productId, at:Number(p.at)||0, price:Number(p.price)||PRODUCTS[p.productId].price,
               provider:'server', receiptId:p.receiptId||null };
    });
  }
  return out;
}

/* 결제 서버에 보내는 JSON 요청 공통 처리. 타임아웃이 반드시 걸린다.
   실패는 전부 throw로 올라가고, 호출부는 예외 없이 "잠금"으로 되돌린다. */
function billingFetchJson(url, payload){
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, BILLING.timeoutMs) : null;
  function done(){ if(timer) clearTimeout(timer); }
  return fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body: JSON.stringify(payload || {}),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(res){
    done();
    if(!res.ok) throw new Error('서버 응답 오류 (HTTP '+res.status+')');
    return res.json();
  }).catch(function(err){
    done();
    throw (err && err.name === 'AbortError') ? new Error('서버 응답 시간이 초과되었습니다.') : err;
  });
}

/* 부팅 직후 첫 화면을 그리기 전에 동기적으로 한 번 채운다.
   서버 모드라면 조회가 끝나기 전까지는 '잠금'이 기본값이다 — 열어두고 나중에 닫으면 이미 늦다. */
function primeEntitlements(){
  if(serverAuthoritative()){
    ENT.mode = 'server'; ENT.ready = false; ENT.error = null;
    ENT.data = defaultEntitlements();
  } else {
    ENT.mode = 'trial'; ENT.ready = true; ENT.error = null;
    ENT.data = localTrialEntitlements();
  }
}

/* 권한 조회 — 잠금 판정에 쓰이는 값은 전부 이 함수를 거쳐서만 갱신된다.
   서버 계약은 파일 상단 BILLING 주석 참조. */
async function fetchEntitlements(){
  if(!serverAuthoritative()){
    ENT.mode = 'trial'; ENT.error = null;
    ENT.data = localTrialEntitlements();
    ENT.ready = true;
    return ENT.data;
  }
  ENT.mode = 'server';
  try{
    var data = await billingFetchJson(BILLING.entitlementEndpoint, { kind:'entitlements' });
    ENT.data = normalizeEntitlements(data);
    ENT.error = null;
  }catch(err){
    /* 서버가 답하지 않으면 잠근다. 열어주는 쪽으로 실패하지 않는다. */
    ENT.data = defaultEntitlements();
    ENT.error = (err && err.message) || String(err);
  }
  ENT.ready = true;
  return ENT.data;
}

/* 결제창에서 돌아왔을 때 영수증 1건을 서버에 검증시킨다(URL에 ?receipt=... 가 있을 때만).
   검증에 성공해도 권한을 직접 부여하지 않는다 — 다시 fetchEntitlements()로 서버 값을 받아온다. */
async function verifyReceiptFromUrl(){
  if(!BILLING.verifyEndpoint) return false;
  var m = /(?:^|[?&])receipt=([^&]+)/.exec(location.search);
  if(!m) return false;
  var receiptId = decodeURIComponent(m[1]);
  var productId = (/(?:^|[?&])product=([^&]+)/.exec(location.search) || [])[1];
  try{
    var res = await billingFetchJson(BILLING.verifyEndpoint, {
      receiptId: receiptId, productId: productId ? decodeURIComponent(productId) : null
    });
    return !!(res && res.verified);
  }catch(e){
    console.warn('영수증 검증 실패', e);
    return false;
  }
}

/* 화면이 잠금을 판단할 때 보는 유일한 값. */
function entitlements(){ return ENT.data; }

function passActive(){
  var e = entitlements();
  return !!(e.pass && e.pass.expiresAt && e.pass.expiresAt > Date.now());
}

/* 특정 상품에 대한 접근 권한이 있는지. 전체 이용권이 살아 있으면 개별 상품도 모두 열린다.
   ★ localStorage를 직접 보지 않는다. 서버 모드에서는 ENT.data가 곧 서버 응답이다. */
function hasAccess(productId){
  if(passActive()) return true;
  return !!entitlements().items[productId];
}

function passRemainingDays(){
  var e = entitlements();
  if(!passActive()) return 0;
  return Math.max(1, Math.ceil((e.pass.expiresAt - Date.now())/86400000));
}

/* 체험 모드에서만 쓰는 로컬 지급. 서버 모드에서는 절대 호출되지 않는다
   (서버 모드의 권한은 오직 fetchEntitlements()가 받아온 값이다). */
function grantProductLocally(productId, receipt){
  if(serverAuthoritative()){ console.warn('서버 모드에서는 클라이언트가 권한을 부여하지 않습니다.'); return; }
  var e = localTrialEntitlements();
  var prod = PRODUCTS[productId];
  if(!prod) return;
  if(prod.kind === 'pass'){
    var base = (e.pass && e.pass.expiresAt > Date.now()) ? e.pass.expiresAt : Date.now();
    e.pass = { productId:productId, purchasedAt:Date.now(), expiresAt: base + prod.days*86400000 };
  } else {
    e.items[productId] = { purchasedAt:Date.now() };
  }
  e.purchases.push({
    productId:productId, at:Date.now(), price:prod.price,
    provider:(receipt && receipt.provider) || 'trial',
    receiptId:(receipt && receipt.receiptId) || null
  });
  saveState();
  ENT.data = e; /* 체험 모드에서도 판정은 ENT를 거친다 */
}

/* =====================================================================
   유료 콘텐츠 본문 취득.
   ---------------------------------------------------------------------
   서버(contentEndpoint)가 연결돼 있으면 본문을 서버에서 받아온다.
   즉 미결제자는 애초에 본문을 손에 넣을 수 없다(원리적으로 우회 불가).
   서버가 없으면 지금까지처럼 클라이언트가 만든 로컬 섹션을 그대로 쓴다.

   나중에 서버가 생기면 "이 함수 안"만 바뀌고 렌더링 코드는 그대로다.
   반환: 섹션 배열 [{id,title,icon,paragraphs?,body?,untrusted:true}] 또는 null(서버 미연결/실패)
===================================================================== */
/* ★ 회사 서버(contentEndpoint)로 나가는 payload는 "허용 목록"으로 다시 만든다.
   본문을 쓰는 데 실제로 필요한 값만 남기고, 닉네임과 생년월일·태어난 시각 원본은 보내지 않는다.
   (개인정보처리방침 §2 ④에 적힌 목록이 바로 이 함수가 만들어내는 항목이다.
    새 항목을 추가하려면 처리방침을 함께 고쳐야 한다.) */
function contentPayloadFrom(payload){
  if(!payload || typeof payload !== 'object') return null;
  var person = payload.person || {};
  var out = { kind: payload.kind || null };
  if(person.gender) out.gender = person.gender;
  if(person.mbti)   out.mbti = person.mbti;
  if(payload.pillars)  out.pillars = payload.pillars;
  if(payload.elements) out.elements = payload.elements;
  if(payload.dayMasterStrength) out.dayMasterStrength = payload.dayMasterStrength;
  if(payload.sipseong) out.sipseong = payload.sipseong;
  if(payload.requested) out.requested = payload.requested;
  return out;
}
/* 서버 본문 안의 {{name}} 자리를 화면에 그릴 때 이 브라우저에서 채운다.
   이름을 서버로 보내지 않고도 "민지는 …" 같은 문장을 쓸 수 있게 하는 장치다. */
function fillNamePlaceholder(text, name, forHtml){
  var v = forHtml ? escapeHtml(name || '') : String(name || '');
  return String(text == null ? '' : text).replace(/\{\{\s*name\s*\}\}/g, v);
}
async function fetchPaidSection(productId, payload, displayName){
  if(!serverContentMode()) return null;
  var data = await billingFetchJson(BILLING.contentEndpoint, {
    productId: productId, sectionFrom: FREE_SECTION_COUNT, payload: contentPayloadFrom(payload)
  });
  if(!data || !Array.isArray(data.sections)) throw new Error('유료 본문 형식이 올바르지 않습니다.');
  if(!data.sections.length) throw new Error('서버가 유료 본문을 하나도 돌려주지 않았습니다.');
  return data.sections.map(function(s, i){
    return {
      id: s.id || ('srv'+i),
      title: fillNamePlaceholder(s.title || ('섹션 '+(FREE_SECTION_COUNT+i+1)), displayName, false),
      icon: safeIconPath(s.icon),
      paragraphs: Array.isArray(s.paragraphs)
        ? s.paragraphs.map(function(t){ return fillNamePlaceholder(t, displayName, false); }) : null,
      body: typeof s.body === 'string' ? fillNamePlaceholder(s.body, displayName, true) : '',
      untrusted: true /* 외부에서 온 내용 — 화면에 넣기 전 반드시 정화한다 */
    };
  });
}

/* 결제 처리기.
   체험 모드 — 실제 결제 없음. 결제 흐름과 화면 전환만 확인하는 용도(?demo=1 에서만).
   서버 모드 — 운영용. 브라우저는 결제창을 띄우고 서버가 승인/검증까지 책임진다.
              결제 승인을 클라이언트가 판단하면 누구나 콘솔에서 우회할 수 있으므로
              반드시 서버가 검증한 결과만 신뢰한다(승인 후에도 권한은 fetchEntitlements()로 다시 받아온다). */
var PaymentProvider = {
  /* ★ 우선순위: 소스 상수 > (개발 모드일 때만) 브라우저 저장본.
     저장본은 소스 상수가 "비어 있는 칸"만 채울 수 있고, 채워진 칸을 끄거나 바꿀 수 없다.
     따라서 배포본(상수가 채워진 파일)에서는 localStorage를 통째로 지워도
     서버 권위가 유지되고, 체험 모드로 강등되지 않는다. */
  load: function(){
    var stored = (DEV_FLAGS.configOverride && STATE.billingConfig) ? STATE.billingConfig : null;
    /* 구버전 스키마({mode, config:{checkoutEndpoint}}) 하위호환 */
    var legacyCfg = (stored && stored.config) || null;
    function pick(key, legacyValue){
      return BILLING_SOURCE[key] || (stored && stored[key]) || legacyValue || null;
    }
    BILLING.entitlementEndpoint = pick('entitlementEndpoint', null);
    BILLING.contentEndpoint     = pick('contentEndpoint', null);
    BILLING.verifyEndpoint      = pick('verifyEndpoint', legacyCfg && legacyCfg.verifyEndpoint);
    BILLING.checkoutEndpoint    = pick('checkoutEndpoint', legacyCfg && legacyCfg.checkoutEndpoint);
  },
  /* 개발용 덮어쓰기 저장. 소스 상수가 이미 잡고 있는 항목은 저장하지 않는다
     (저장해봐야 load()가 무시하므로, 저장된 값이 실제 동작인 것처럼 보이면 안 된다). */
  save: function(){
    if(!DEV_FLAGS.configOverride) return;
    var out = {};
    ['entitlementEndpoint','contentEndpoint','verifyEndpoint','checkoutEndpoint'].forEach(function(k){
      out[k] = BILLING_SOURCE[k] ? null : (BILLING[k] || null);
    });
    STATE.billingConfig = out;
    saveState();
  },
  isConfigured: function(){ return !!BILLING.checkoutEndpoint; },

  /* 결제 시작. 서버가 만든 결제 세션으로 넘긴다. */
  checkout: function(product){
    if(!BILLING.checkoutEndpoint) return Promise.reject(new Error('결제 서버가 연결되어 있지 않습니다.'));
    return billingFetchJson(BILLING.checkoutEndpoint, { productId:product.id, price:product.price })
      .then(function(session){
        /* 서버가 결제창 URL을 주면 그쪽으로 넘긴다. 승인 결과는 서버가 검증한다. */
        if(session && session.checkoutUrl){ location.href = session.checkoutUrl; return {redirected:true}; }
        if(session && session.granted){ return { provider:'server', receiptId:session.receiptId }; }
        throw new Error('서버가 결제 결과를 알려주지 않았습니다.');
      });
  }
};

function formatWon(n){ return n.toLocaleString('ko-KR')+'원'; }

/* 궁합 상세로 가는 버튼 앞에 붙는 자물쇠. 눌러보고 나서야 유료임을 아는 상황을 막는다. */
function compatLockMark(){ return hasAccess(PRODUCTS.compat_full.id) ? '' : '🔒 '; }

/* 잠긴 구간에 들어가는 카드.
   내용을 통째로 숨기지 않고 앞부분을 흐릿하게 남겨, 무엇이 잠겼는지 보이게 한다. */
function lockedBlock(product, teaserHtml, sectionTitle){
  var wrap = el('div',{class:'locked-block'});
  if(teaserHtml){
    var teaser = el('div',{class:'locked-teaser', html:teaserHtml, 'aria-hidden':'true'});
    wrap.appendChild(teaser);
  }
  var cta = el('div',{class:'locked-cta'});
  cta.appendChild(el('div',{class:'locked-icon'},['🔒']));
  /* '내면 부터는'처럼 조사가 띄어써지지 않도록 붙여 쓴다. */
  cta.appendChild(el('div',{class:'locked-title'},[sectionTitle ? '‘'+sectionTitle+'’부터는 유료예요' : '여기부터는 유료예요']));
  cta.appendChild(el('div',{class:'locked-desc'},[product.desc]));
  var btn = el('button',{class:'btn btn-primary', onclick:function(){ openPaywall(product); }},
    ['더보기 · '+formatWon(product.price)]);
  cta.appendChild(btn);
  cta.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:8px;', onclick:function(){ openPaywall(PRODUCTS.premium_pass); }},
    ['전체 이용권으로 한 번에 열기']));
  wrap.appendChild(cta);
  return wrap;
}

/* 결제 화면.
   데모 모드에서는 카드번호 등 실제 결제정보를 절대 입력받지 않는다.
   진짜처럼 생긴 결제창은 그 자체로 사용자를 속이는 물건이 되기 때문이다. */
function openPaywall(product){
  var body = el('div',{});

  var head = el('div',{class:'pay-product'});
  head.appendChild(el('div',{class:'pay-name'},[product.name]));
  head.appendChild(el('div',{class:'pay-price'},[formatWon(product.price)+(product.kind==='pass'?' / '+product.days+'일':' · 1회 결제')]));
  head.appendChild(el('div',{class:'pay-desc'},[product.desc]));
  body.appendChild(head);

  var list = el('ul',{class:'pay-benefits'});
  ['결제 후 바로 열람', '같은 기기에서 계속 보관', '무료 구간은 결제 없이 계속 이용 가능'].forEach(function(t){
    list.appendChild(el('li',{},[t]));
  });
  body.appendChild(list);

  if(product.kind !== 'pass'){
    /* 개별 상품과 이용권 가격이 같아지면 "더 싸다"는 문구는 거짓이 된다.
       가격 관계에 따라 문구를 바꿔, 항상 사실만 말하도록 한다. */
    var passPrice = PRODUCTS.premium_pass.price;
    /* 개별 상품을 전부 사는 값과 이용권 값을 실제로 비교해서 말한다.
       가격을 어떻게 바꾸든 문구가 사실과 어긋나지 않게 하기 위해 계산으로 뽑는다. */
    var singlesTotal = 0;
    for(var pid in PRODUCTS){ if(PRODUCTS[pid].kind === 'once') singlesTotal += PRODUCTS[pid].price; }
    var upsellText;
    if(passPrice < product.price){
      upsellText = '전체 이용권이면 '+formatWon(passPrice)+'으로 더 싸게, 모든 상세 해석이 열려요.';
    } else if(passPrice === product.price){
      upsellText = '같은 '+formatWon(passPrice)+'으로 전체 이용권을 사면 이것 말고 나머지 상세 해석도 30일간 다 열려요.';
    } else if(passPrice < singlesTotal){
      /* '원'은 받침이 있으므로 조사는 '로'가 아니라 '으로'다. */
      upsellText = '상세 해석을 하나씩 다 사면 '+formatWon(singlesTotal)+'인데, 전체 이용권은 '+formatWon(passPrice)+'으로 30일간 다 열려요.';
    } else {
      upsellText = '전체 이용권('+formatWon(passPrice)+')이면 모든 상세 해석이 30일간 열려요.';
    }
    var upsell = el('div',{class:'pay-upsell'});
    upsell.appendChild(el('span',{},[upsellText]));
    upsell.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ closeModal(); openPaywall(PRODUCTS.premium_pass); }},['이용권 보기']));
    body.appendChild(upsell);
  }

  /* 전자상거래법상 청약철회 안내는 결제 "전"에 보여야 한다. 결제 후에 알리면 환불 거부 근거가 없다. */
  body.appendChild(buildPayLegalLine());

  /* ★ 결제 버튼은 paywallGate()가 live일 때만 살아난다.
     "일부만 연동된 상태"에서 버튼을 열어두면 사용자가 돈을 내고 아무것도 못 받는다. */
  var gate = paywallGate();
  var actions = [];
  if(gate.live){
    if(gate.verifyMissing){
      body.appendChild(el('p',{class:'pay-legal-line'},[
        '영수증 검증 주소(verifyEndpoint)가 설정되지 않아, 결제창에서 돌아온 직후 이용권 반영이 잠시 늦어질 수 있습니다. 열리지 않으면 잠시 후 새로고침해 주세요.'
      ]));
    }
    actions.push({ label:'결제하기', cls:'btn-primary', onclick:function(){
      showToast('결제 페이지로 이동합니다…');
      PaymentProvider.checkout(product).then(function(r){
        if(r && r.redirected) return;
        /* 결제가 성공해도 권한을 클라이언트가 스스로 부여하지 않는다.
           서버에 다시 물어보고, 서버가 인정한 결과만 화면에 반영한다. */
        return fetchEntitlements().then(function(){
          closeModal();
          if(hasAccess(product.id)) showToast('결제가 완료되었어요.');
          else if(serverAuthoritative()) showToast('결제는 접수됐지만 아직 서버에서 확인되지 않았어요. 잠시 후 다시 확인해주세요.');
          else showToast('결제 서버는 연결됐지만 권한 조회 서버(entitlementEndpoint)가 없어 권한을 확인할 수 없습니다.');
          render();
        });
      }).catch(function(err){
        showToast((err && err.message) || '결제를 시작하지 못했습니다.');
      });
    }});
  } else {
    /* 결제를 열 수 없는 상태. 왜 못 여는지를 뭉뚱그리지 않고 조합별로 정확히 적는다. */
    body.appendChild(buildPaywallBlockedNotice(gate));
    /* ★ 데모 해제 버튼은 기본 상태에서 DOM에 만들어지지 않는다.
       주소에 ?demo=1 을 붙였고, 서버가 권한을 쥐고 있지 않을 때만 생성된다
       (CSS로 숨기는 방식은 개발자도구로 되살아난다). */
    if(DEV_FLAGS.demoUnlock && !serverAuthoritative()){
      actions.push({ label:'[개발용] 결제됐다고 가정하고 열기', cls:'btn-ghost', onclick:function(){
        grantProductLocally(product.id, {provider:'trial', receiptId:'trial-'+Date.now().toString(36)});
        closeModal(); showToast('개발용으로 열었어요. 실제 결제는 되지 않았습니다.'); render();
      }});
    }
    actions.push({ label: PAYWALL_BLOCKED_LABEL[gate.mode] || '결제를 열 수 없습니다',
                   cls:'btn-primary', disabled:true, onclick:null });
  }
  actions.push({ label:'닫기', onclick:function(){ closeModal(); } });

  openModal(product.kind==='pass' ? '전체 이용권' : '더 자세히 보기', body, actions);
}

/* 결제를 열 수 없는 이유를 조합별로 정확히 적는다.
   ★ "체험 모드"라는 말은 결제 서버가 하나도 연결되지 않은 상태에서만 쓴다.
      일부만 연결된 상태에서 그 말을 쓰면, 실제 결제가 나가는 화면에 "실제 결제가 아니다"라고
      적히는 사고가 난다(이번 라운드에 실제로 발생). */
function buildPaywallBlockedNotice(gate){
  var notice = el('div',{class:'pay-demo-notice'});
  if(gate.mode === 'trial'){
    notice.appendChild(el('span',{class:'trial-badge'},['체험 모드 — 실제 결제가 아닙니다']));
    notice.appendChild(el('strong',{},['아직 결제가 연결되지 않았습니다.']));
    notice.appendChild(el('p',{},['결제 서버가 하나도 연결되지 않은 상태라 실제로 결제되지 않고, 카드 정보도 받지 않습니다.']));
    notice.appendChild(el('p',{},['이용권은 이 브라우저에만 저장되는 체험용이며, 개발자도구로 위조할 수 있습니다.']));
  } else if(gate.mode === 'partial'){
    notice.appendChild(el('span',{class:'trial-badge'},['연동 미완료 — 결제를 열 수 없습니다']));
    notice.appendChild(el('strong',{},['결제 서버 설정이 끝나지 않았습니다.']));
    notice.appendChild(el('p',{},['서버 주소가 일부만 연결돼 있습니다. 이 상태로 결제하면 돈은 빠져나가는데 이용권이 부여되지 않으므로, 결제 버튼을 열지 않습니다.']));
    notice.appendChild(el('p',{},['아직 설정되지 않은 항목 — '+gate.missingEndpoints.join(' · ')]));
  } else if(gate.mode === 'legal'){
    notice.appendChild(el('span',{class:'trial-badge'},['표시사항 등록 대기 — 결제를 열 수 없습니다']));
    notice.appendChild(el('strong',{},['사업자 표시사항 등록이 완료되면 결제가 열립니다.']));
    notice.appendChild(el('p',{},['전자상거래법 제13조 제1항이 표시를 의무화한 항목이 아직 비어 있어, 유료 판매를 시작할 수 없습니다.']));
    notice.appendChild(el('p',{},['비어 있는 항목 — '+gate.missingLegal.join(' · ')]));
  }
  return notice;
}

/* 결제 화면에 들어가는 청약철회 요약 한 줄 + 약관 바로가기. */
function buildPayLegalLine(){
  var wrap = el('div',{});
  wrap.appendChild(el('p',{class:'pay-legal-line'},[
    '디지털 콘텐츠 특성상 결제 후 해당 상세 해석을 열람하면 청약철회가 제한됩니다. 열람 전이라면 결제일로부터 7일 이내 청약철회가 가능합니다.'
  ]));
  var links = el('div',{class:'legal-links'});
  links.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ openRefundModal(); }},['환불·청약철회 안내']));
  links.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ openTermsModal(); }},['이용약관']));
  wrap.appendChild(links);
  return wrap;
}

/* 설정: 지금 무엇이 열려 있는지. 결제한 사람이 "내가 뭘 샀더라"를 확인하는 자리다. */
function buildPurchasePanel(){
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['이용권']));
  var e = entitlements();

  /* 지금 이 화면의 이용권이 "서버가 확인해 준 것"인지 "이 기기에만 있는 체험분"인지 정직하게 먼저 알린다. */
  if(localEntitlementMode()){
    card.appendChild(el('span',{class:'trial-badge'},['이 기기에만 저장된 체험 이용권']));
    card.appendChild(el('p',{class:'biz-hint'},[
      '이용권 조회 서버가 연결되지 않아, 아래 이용권은 이 브라우저에만 저장된 체험용입니다. 실제로 결제된 것이 아니고, 브라우저 저장소를 지우거나 기기를 바꾸면 사라집니다.'
    ]));
  } else if(ENT.error){
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '이용권 서버에 연결하지 못했습니다('+ENT.error+'). 확인될 때까지 유료 구간은 잠긴 상태로 둡니다.'
    ]));
  } else if(!ENT.ready){
    card.appendChild(el('p',{class:'biz-hint'},['이용권을 서버에 확인하는 중입니다…']));
  }

  if(passActive()){
    card.appendChild(el('div',{class:'biz-row'},[
      el('span',{class:'k'},['전체 이용권']),
      el('span',{class:'v'},[passRemainingDays()+'일 남음'])
    ]));
  } else {
    card.appendChild(el('div',{class:'biz-row'},[
      el('span',{class:'k'},['전체 이용권']),
      el('span',{class:'v'},['없음'])
    ]));
  }

  ['saju_full','mbti_full','compat_full'].forEach(function(id){
    var prod = PRODUCTS[id];
    var owned = !!e.items[id];
    card.appendChild(el('div',{class:'biz-row'},[
      el('span',{class:'k'},[prod.name]),
      el('span',{class:'v', style: owned||passActive() ? 'color:var(--gold);' : ''},
        [ passActive() ? '이용권으로 열림' : (owned ? '구매함' : formatWon(prod.price)) ])
    ]));
  });

  if(!passActive()){
    card.appendChild(el('button',{class:'btn btn-primary btn-block', style:'margin-top:12px;',
      onclick:function(){ openPaywall(PRODUCTS.premium_pass); }},['전체 이용권 보기 · '+formatWon(PRODUCTS.premium_pass.price)]));
  }

  if(e.purchases.length){
    card.appendChild(el('p',{class:'biz-hint'},['결제 내역 '+e.purchases.length+'건 · 마지막 '+new Date(e.purchases[e.purchases.length-1].at).toLocaleString('ko-KR')]));
    /* 체험 모드로 연 이용권이 섞여 있으면 실제 결제로 오해할 수 있으므로 분리해서 알린다. */
    var trialCount = e.purchases.filter(function(x){ return x.provider==='trial' || x.provider==='demo'; }).length;
    if(trialCount){
      card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},
        [trialCount+'건은 결제 연동 전 체험 모드로 열린 항목이라 실제 결제된 것이 아닙니다.']));
      card.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:8px;', onclick:function(){
        confirmModal('체험 모드로 열린 이용권을 모두 초기화할까요?', function(){
          STATE.entitlements = defaultEntitlements(); saveState();
          fetchEntitlements().then(function(){ render(); showToast('초기화했어요.'); });
        });
      }},['체험 이용권 초기화']));
    }
  }
  return card;
}

/* =====================================================================
   법적 고지 (전자상거래법 제13조 표시의무 + 개인정보보호법)
   ---------------------------------------------------------------------
   화면에 찍히는 사업자 정보는 전부 COMPANY 객체에서 꺼낸다(하드코딩 0건).
   아직 못 받은 값은 지어내지 않고 "확인 중"으로 표시한다.
===================================================================== */
function legalRow(k, v){
  var missing = companyMissing(v);
  return el('div',{class:'biz-row'},[
    el('span',{class:'k'},[k]),
    el('span',{class:'v', style: missing ? 'color:var(--red-hi);font-weight:400;' : ''},[companyValue(v)])
  ]);
}
function openCompanyInfoModal(){

  body.appendChild(legalRow('영문 상호', COMPANY.legalNameEn));

  body.appendChild(legalRow('사업자등록번호', COMPANY.bizRegNo));
  body.appendChild(legalRow('법인등록번호', COMPANY.corpRegNo));
  body.appendChild(legalRow('사업장 소재지', COMPANY.address));
  body.appendChild(legalRow('통신판매업 신고번호', COMPANY.mailOrderNo));
  body.appendChild(legalRow('호스팅서비스 제공자', COMPANY.hostingProvider));
  body.appendChild(legalRow('고객센터 전화', COMPANY.supportPhone));
  body.appendChild(legalRow('고객센터 이메일', COMPANY.supportEmail));

  if(companyMissing(COMPANY.mailOrderNo) || companyMissing(COMPANY.supportPhone) || companyMissing(COMPANY.hostingProvider)){
    body.appendChild(el('p',{class:'biz-hint', style:'margin-top:12px;'},[
      '"확인 중"으로 표시된 항목은 아직 확정되지 않아 비워둔 값입니다. 확정되는 대로 이 화면에 그대로 반영됩니다.'
    ]));
  }
  var gInfo = paywallGate();
  if(gInfo.missingLegal.length){
    body.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '전자상거래법 제13조 표시의무 항목('+gInfo.missingLegal.join(' · ')+')이 비어 있어, 이 항목이 채워지기 전까지 유료 결제 버튼은 열리지 않습니다.'
    ]));
  }
  openModal('사업자 정보', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}

/* ★ 개인정보처리방침은 이 앱이 "실제로 하는 일"만 적는다. 사실과 다른 문장이 한 줄도 있으면 안 된다. */
function openPrivacyModal(){
  var body = el('div',{class:'legal-body'});
  function h(t){ body.appendChild(el('h4',{},[t])); }
  function p(t){ body.appendChild(el('p',{},[t])); }
  function ul(items){
    var u = el('ul',{});
    items.forEach(function(t){ u.appendChild(el('li',{},[t])); });
    body.appendChild(u);

function openRefundModal(){

  function p(t){ body.appendChild(el('p',{},[t])); }
  h('1. 상품의 성격');
  p('서비스가 판매하는 상품은 즉시 열람이 가능한 디지털 콘텐츠(상세 해석)입니다. 배송이 없으며, 결제 즉시 해당 콘텐츠가 열립니다.');
  h('2. 청약철회가 가능한 경우');
  p('전자상거래 등에서의 소비자보호에 관한 법률에 따라, 결제일로부터 7일 이내이고 해당 유료 콘텐츠를 아직 열람하지 않은 경우 청약철회(전액 환불)가 가능합니다.');
  h('3. 청약철회가 제한되는 경우');
  p('같은 법 제17조 제2항에 따라, 디지털 콘텐츠의 제공이 개시된 경우(= 결제한 상세 해석을 한 번이라도 열람한 경우) 청약철회가 제한됩니다. 이 사실은 결제 화면에서 결제 전에 안내됩니다.');
  p('전체 이용권(30일)의 경우, 이용권으로 유료 콘텐츠를 열람한 뒤에는 남은 기간에 대한 부분 환불이 제한됩니다.');
  h('4. 청약철회가 제한되지 않는 경우');
  p('결제 금액이 표시와 다르거나, 콘텐츠가 표시·광고된 내용과 현저히 다르거나, 서비스 장애로 콘텐츠를 열람하지 못한 경우에는 열람 여부와 관계없이 환불을 요청할 수 있습니다.');
  h('5. 환불 신청 방법');
  p('아래 연락처로 결제 일시와 상품명을 알려주시면 확인 후 처리합니다. 환불은 원 결제수단으로 처리되며, 결제대행사 사정에 따라 영업일 기준 3~5일이 소요될 수 있습니다.');
  p('이메일: ' + companyValue(COMPANY.supportEmail) + ' / 전화: ' + companyValue(COMPANY.supportPhone));
  /* ★ 여기 적는 문장은 paywallGate()의 판정과 정확히 일치해야 한다.
     "결제가 발생하지 않는다"는 말은 결제창으로 가는 길 자체가 없을 때만 참이다. */
  var gate = paywallGate();
  if(!gate.live){
    var lines = [];
    if(!BILLING.checkoutEndpoint){
      lines.push('지금은 결제 세션 생성 서버(checkoutEndpoint)가 연결되지 않아, 이 앱에서 결제를 진행할 수 없습니다. 따라서 이 앱을 통해 새로 발생하는 결제 내역도 없습니다.');
    } else {
      lines.push('결제 세션 생성 서버는 연결돼 있으나 연동이 끝나지 않아 결제 버튼을 열지 않은 상태입니다. 결제 진행 자체가 차단되어 있습니다.');
    }
    var missing = gate.missingEndpoints.concat(gate.missingLegal);
    if(missing.length) lines.push('아직 준비되지 않은 항목 — '+missing.join(' · '));
    lines.push('이미 다른 경로로 결제하신 건이 있다면 위 연락처로 문의해 주세요.');
    lines.forEach(function(t){
      body.appendChild(el('p',{class:'biz-hint', style:'margin-top:8px;color:var(--red-hi);'},[t]));
    });
  }
  openModal('환불 · 청약철회 안내', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}
