/* 설정: AI 해석 연결. 사용자가 느낀 "퀄리티 차이"를 실제로 메우는 자리다. */
function buildInterpreterPanel(){
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['풀이 품질 · AI 해석 연결']));
  card.appendChild(el('p',{class:'biz-hint'},[
    '사주팔자(네 기둥) 계산은 이 앱이 절기까지 직접 계산해서 뽑습니다. 하지만 그 사주를 읽어주는 문장은 기본적으로 미리 준비된 해석표를 조합한 것이라, 사람이 AI에게 직접 물어볼 때보다 얕게 느껴집니다. 아래에 해석 서버를 연결하면 같은 사주 데이터를 AI가 직접 읽고 풀이합니다.'
  ]));

  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['현재 방식']),
    el('span',{class:'v'},[Interpreter.isApiReady() ? 'AI 해석 ('+Interpreter.config.model+')' : '기본 해석표'])
  ]));

  var epInput = el('input',{class:'biz-input', type:'url', placeholder:'https://api.내도메인.com/interpret',
    value:Interpreter.config.endpoint||'', 'aria-label':'해석 서버 주소'});
  card.appendChild(el('label',{class:'k', style:'display:block;margin-top:12px;font-size:.82rem;'},['해석 서버 주소']));
  card.appendChild(epInput);

  var modelInput = el('input',{class:'biz-input', type:'text', placeholder:'claude-opus-5',
    value:Interpreter.config.model||'', 'aria-label':'모델 이름'});
  card.appendChild(el('label',{class:'k', style:'display:block;margin-top:10px;font-size:.82rem;'},['모델']));
  card.appendChild(modelInput);

  card.appendChild(el('p',{class:'biz-hint'},[
    'API 키는 여기에 넣지 마세요. 브라우저에 넣은 키는 페이지를 여는 누구나 꺼내 쓸 수 있습니다. 키는 서버에만 두고, 이 앱은 [브라우저 → 내 서버 → Anthropic] 순서로만 호출합니다.'
  ]));

  var row = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;'});
  row.appendChild(el('button',{class:'btn btn-primary btn-sm', onclick:function(){
    var ep = (epInput.value||'').trim();
    if(ep && !/^https?:\/\//.test(ep)){ showToast('http:// 또는 https:// 로 시작하는 주소를 넣어주세요.'); return; }
    Interpreter.config.endpoint = ep;
    Interpreter.config.model = (modelInput.value||'').trim() || 'claude-opus-5';
    Interpreter.config.mode = ep ? 'api' : 'local';
    Interpreter.lastError = null;
    Interpreter.save();
    showToast(ep ? 'AI 해석을 연결했어요.' : '기본 해석표로 되돌렸어요.');
    render();
  }},['저장']));
  row.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ showInterpreterContract(); }},['서버가 지켜야 할 형식 보기']));
  card.appendChild(row);
  return card;
}

/* 연동할 서버가 무엇을 받고 무엇을 돌려줘야 하는지. 이게 없으면 붙일 수가 없다. */
function showInterpreterContract(){
  var p = activeProfile();
  var sample = (p && getSajuResult(p)) ? Interpreter.buildSajuPayload(p, getSajuResult(p)) : {kind:'saju', note:'프로필을 만들면 실제 예시가 표시됩니다'};
  var body = el('div',{class:'sheet-body'});
  body.appendChild(el('p',{class:'biz-hint'},['앱이 보내는 요청 (POST, JSON)']));
  body.appendChild(el('pre',{style:'white-space:pre-wrap;word-break:break-all;font-size:.72rem;background:var(--panel-2);padding:10px;border-radius:8px;max-height:220px;overflow:auto;'},
    [JSON.stringify({model:Interpreter.config.model||'claude-opus-5', payload:sample}, null, 1)]));
  body.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;'},['서버가 돌려줘야 하는 응답 (권장 형식)']));
  body.appendChild(el('pre',{style:'white-space:pre-wrap;font-size:.72rem;background:var(--panel-2);padding:10px;border-radius:8px;'},
    [JSON.stringify({sections:[{id:'s1', title:'타고난 기질', icon:'M4 18 L10 6 L16 18', paragraphs:['…해석 문단 1…','…해석 문단 2…']}]}, null, 1)]));
  body.appendChild(el('p',{class:'biz-hint'},[
    'paragraphs는 평문 문단 배열입니다. 앱은 이 값을 태그로 해석하지 않고 글자 그대로만 넣으므로, 응답에 스크립트가 섞여 들어가도 실행될 수 없습니다. 이 형식을 권장합니다.'
  ]));
  body.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;'},['서식이 꼭 필요하면 body(HTML)도 받습니다']));
  body.appendChild(el('pre',{style:'white-space:pre-wrap;font-size:.72rem;background:var(--panel-2);padding:10px;border-radius:8px;'},
    [JSON.stringify({sections:[{id:'s1', title:'타고난 기질', icon:'M4 18 L10 6 L16 18', body:'<p>…<strong>강조</strong>…</p>'}]}, null, 1)]));
  body.appendChild(el('p',{class:'biz-hint'},[
    'body를 보내면 앱이 p · strong · b · em · i · br · ul · ol · li 만 남기고 나머지 태그와 모든 속성을 제거한 뒤 화면에 넣습니다. 서버에서도 사용자 입력이 그대로 섞여 들어가지 않도록 이스케이프해 주세요.'
  ]));
  openModal('해석 서버 연동 규격', body, [{label:'닫기', onclick:closeModal}]);
}

/* 설정: 결제 연동.
   ★ 여기 적히는 문장은 "지금 이 코드가 실제로 하는 일"과 정확히 일치해야 한다.
      서버가 없는데 "서버가 확인해 준 결과만 신뢰합니다"라고 적으면 그건 거짓 고지다. */
function buildBillingPanel(){
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['결제 연동']));

  var authoritative = serverAuthoritative();
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['권한 판정']),
    el('span',{class:'v', style: authoritative?'color:var(--gold);':'color:var(--red-hi);'},
      [authoritative ? '서버가 확인 (서버 권위)' : '이 브라우저에만 저장 (서버 미연결)'])
  ]));
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['유료 본문']),
    el('span',{class:'v', style: serverContentMode()?'color:var(--gold);':''},
      [serverContentMode() ? '서버에서 받아옴' : '이 브라우저에서 생성'])
  ]));
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['결제 세션 주소']),
    el('span',{class:'v', style:PaymentProvider.isConfigured()?'color:var(--gold);':'color:var(--red-hi);'},
      [PaymentProvider.isConfigured() ? '설정됨' : '미설정'])
  ]));

  /* ★ 결제 버튼이 실제로 열리는지를 별도 줄로 못 박는다.
     "결제창 연동됨"만 보고 결제가 되는 줄 알았다가 돈을 잃는 일이 없어야 한다. */
  var gate = paywallGate();
  var gateText = { trial:'열리지 않음 (체험 모드)', partial:'열리지 않음 (연동 미완료)',
                   legal:'열리지 않음 (표시사항 등록 대기)', live:'열림 (실제 결제)' }[gate.mode];
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['결제 버튼']),
    el('span',{class:'v', style: gate.live?'color:var(--gold);':'color:var(--red-hi);'},[gateText])
  ]));

  /* ★ 현재 동작을 그대로 서술한다. 상태에 따라 문장이 달라진다. */
  if(gate.mode === 'trial'){
    card.appendChild(el('span',{class:'trial-badge'},['체험 모드 — 실제 결제가 아닙니다']));
    card.appendChild(el('p',{class:'biz-hint'},[
      '서버 주소가 하나도 설정되지 않아, 이용권이 이 기기(브라우저)에만 저장되는 체험 모드입니다. 이 상태의 이용권은 개발자도구로 위조할 수 있고, 기기를 바꾸면 사라집니다.'
    ]));
  } else if(gate.mode === 'partial'){
    card.appendChild(el('span',{class:'trial-badge'},['연동 미완료 — 결제를 열 수 없습니다']));
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '설정되지 않은 항목 — '+gate.missingEndpoints.join(' · ')+'. 셋이 모두 채워지기 전에는 결제 버튼을 열지 않습니다. 일부만 연결된 상태로 결제를 열면, 결제는 되는데 이용권이 부여되지 않아 사용자가 실제 손해를 봅니다.'
    ]));
  } else if(gate.mode === 'legal'){
    card.appendChild(el('span',{class:'trial-badge'},['표시사항 등록 대기']));
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '서버는 모두 연결됐지만 전자상거래법 제13조 표시의무 항목('+gate.missingLegal.join(' · ')+')이 비어 있어 결제 버튼을 열지 않습니다.'
    ]));
  } else {
    card.appendChild(el('p',{class:'biz-hint'},[
      '이용권 조회·유료 본문·결제 세션 서버가 모두 연결되고 사업자 표시사항도 채워져, 결제 버튼이 열려 있습니다. 이 화면에서 발생하는 결제는 실제 결제입니다.'
    ]));
  }
  if(authoritative){
    card.appendChild(el('p',{class:'biz-hint'},[
      '권한 판정은 서버 응답만 신뢰합니다. 브라우저에 저장된 이용권 값은 잠금 판단에 전혀 쓰이지 않고, 서버가 응답하지 않으면 유료 구간은 잠긴 상태로 남습니다.'
    ]));
  }
  if(authoritative && !serverContentMode()){
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '유료 본문 서버(contentEndpoint)가 비어 있어 유료 문장을 이 브라우저가 만들고 있습니다. 파일을 저장해 코드를 고치면 잠금을 우회할 수 있으므로, 본문 서버까지 연결해야 완전히 막힙니다.'
    ]));
  }

  /* ★ 서버 주소의 권위 있는 출처는 소스코드의 BILLING_SOURCE 상수다.
     이 화면 입력칸은 개발 모드(?demo=1)에서만 동작하는 임시 덮어쓰기이며,
     상수가 이미 잡고 있는 항목은 개발 모드에서도 바꿀 수 없다. */
  var pinnedAll = billingPinnedBySource();
  var canEdit = DEV_FLAGS.configOverride;
  card.appendChild(el('p',{class:'biz-hint', style:'margin-top:14px;'},[
    canEdit
      ? '[개발 모드] 아래 입력값은 이 브라우저에만 저장되며 개발자도구로 지울 수 있습니다. 주소 표시줄의 ?demo=1 을 빼면 즉시 무시됩니다. 실제 운영 배포에는 파일 상단 BILLING_SOURCE 상수에 직접 넣어야 합니다.'
      : '서버 주소는 파일 상단 BILLING_SOURCE 상수에서만 정해집니다. 브라우저에 저장한 값은 권한의 근거로 쓰지 않습니다 — 개발자도구로 지울 수 있는 값을 근거로 삼으면 페이월이 통째로 뚫리기 때문입니다. 개발 중 임시로 바꿔보려면 주소 뒤에 ?demo=1 을 붙이세요.'
  ]));

  var fields = [
    ['entitlementEndpoint', '이용권 조회 주소 (권한의 근거)', 'https://api.내도메인.com/entitlements'],
    ['contentEndpoint',     '유료 본문 조회 주소',            'https://api.내도메인.com/paid-content'],
    ['verifyEndpoint',      '영수증 검증 주소',               'https://api.내도메인.com/verify'],
    ['checkoutEndpoint',    '결제 세션 생성 주소',            'https://api.내도메인.com/checkout']
  ];
  var inputs = {};
  fields.forEach(function(f){
    var pinned = !!BILLING_SOURCE[f[0]];
    var labelText = f[1] + (pinned ? ' · 소스 상수 고정(읽기 전용)' : '');
    card.appendChild(el('label',{class:'k', style:'display:block;margin-top:12px;font-size:.82rem;'},[labelText]));
    var locked = pinned || !canEdit;
    inputs[f[0]] = el('input',{class:'biz-input', type:'url', placeholder:f[2],
      value: BILLING[f[0]] || '', 'aria-label':labelText,
      readOnly: locked ? 'readonly' : null,
      disabled: locked ? 'disabled' : null,
      style: locked ? 'opacity:.55;cursor:not-allowed;' : null});
    card.appendChild(inputs[f[0]]);
  });
  var verifyNote = buildVerifyDependencyNote();
  if(verifyNote) card.appendChild(verifyNote);

  if(canEdit && !pinnedAll){
    card.appendChild(el('button',{class:'btn btn-primary btn-sm', style:'margin-top:12px;', onclick:function(){
      var next = {};
      for(var i=0;i<fields.length;i++){
        var key = fields[i][0];
        if(BILLING_SOURCE[key]) continue; /* 소스 상수가 잡은 칸은 건드리지 않는다 */
        var v = (inputs[key].value||'').trim();
        if(v && !/^https?:\/\//.test(v)){ showToast('http:// 또는 https:// 로 시작하는 주소를 넣어주세요.'); return; }
        next[key] = v || null;
      }
      for(var k in next){ BILLING[k] = next[k]; }
      PaymentProvider.save();
      /* 주소가 바뀌면 권한 근거 자체가 바뀐다. 즉시 다시 조회한다. */
      primeEntitlements();
      render();
      fetchEntitlements().then(function(){
        showToast(serverAuthoritative() ? '[개발용] 서버 권위 모드로 전환했어요.' : '[개발용] 로컬 이용권 모드로 되돌렸어요.');
        render();
      });
    }},['[개발용] 저장']));
  }
  card.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:8px;margin-left:8px;', onclick:function(){
    showBillingContract();
  }},['서버가 지켜야 할 형식 보기']));
  return card;
}
/* 영수증 검증 주소가 이용권 조회 주소에 종속된다는 사실을 화면에 알린다
   (조회 주소가 비면 ?receipt= 검증이 아예 실행되지 않는다). */
function buildVerifyDependencyNote(){
  if(!BILLING.verifyEndpoint || BILLING.entitlementEndpoint) return null;
  return el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
    '영수증 검증 주소는 이용권 조회 주소가 함께 설정돼야 동작합니다. 지금은 조회 주소가 비어 있어 결제창에서 돌아와도 영수증 검증이 실행되지 않습니다.'
  ]);
}
/* 결제 서버가 무엇을 받고 무엇을 돌려줘야 하는지. 백엔드가 이 화면만 보고 만들 수 있어야 한다. */
function showBillingContract(){
  var body = el('div',{class:'sheet-body'});
  function block(title, req, res, note){
    body.appendChild(el('p',{class:'biz-hint', style:'margin-top:12px;color:var(--gold);'},[title]));
    body.appendChild(el('pre',{style:'white-space:pre-wrap;word-break:break-all;font-size:.7rem;background:var(--panel-2);padding:10px;border-radius:8px;'},
      ['요청  '+JSON.stringify(req)+'\n응답  '+JSON.stringify(res)]));
    if(note) body.appendChild(el('p',{class:'biz-hint'},[note]));
  }
  body.appendChild(el('p',{class:'biz-hint'},['모두 POST · Content-Type: application/json · 쿠키 동봉(credentials: include) · 타임아웃 '+(BILLING.timeoutMs/1000)+'초']));
  block('1) 이용권 조회 (entitlementEndpoint)',
    {kind:'entitlements'},
    {items:{saju_full:{purchasedAt:1737000000000}}, pass:{productId:'premium_pass', purchasedAt:1737000000000, expiresAt:1739592000000}, purchases:[{productId:'saju_full', at:1737000000000, price:1900, receiptId:'r_1'}]},
    '이 응답이 권한의 유일한 근거입니다. 미결제 사용자에게도 200으로 { "items":{}, "pass":null, "purchases":[] } 를 돌려주세요. pass.expiresAt은 앞으로의 시각(밀리초)이어야 하며, 0이거나 과거면 이용권이 만료된 것으로 봅니다. 응답이 없거나 오류면 앱은 모든 유료 구간을 잠급니다.');
  block('2) 유료 본문 조회 (contentEndpoint)',
    {productId:'saju_full', sectionFrom:FREE_SECTION_COUNT, payload:{kind:'saju', gender:'여',
      pillars:{year:{stem:'경',branch:'오'}, month:{stem:'임',branch:'오'}, day:{stem:'신',branch:'해'}, hour:{stem:'계',branch:'사'}},
      elements:{목:0,화:3,토:0,금:3,수:2}, dayMasterStrength:'weak',
      sipseong:{비견:1,겁재:1,식신:1,상관:1,편재:0,정재:0,편관:1,정관:2,편인:0,정인:0},
      requested:{sections:13, tone:'따뜻한 반말체', language:'ko'}}},
    {sections:[{id:'s4', title:'내면 · 겉과 속의 차이', icon:'M4 18 L10 6 L16 18', paragraphs:['{{name}}는 …','문단2']}]},
    '결제 여부를 서버에서 먼저 확인하고, 미결제자에게는 403으로 본문을 주지 마세요. paragraphs(평문 배열) 권장 — 앱이 글자로만 넣으므로 스크립트가 실행될 수 없습니다. 요청 payload에는 닉네임과 생년월일·태어난 시각 원본이 들어가지 않습니다(개인정보 최소 전송). 본문에 이름을 넣으려면 {{name}} 이라고 쓰면 앱이 화면에 그릴 때 닉네임으로 바꿔 넣습니다. icon은 SVG path의 d 값(viewBox 0 0 20 20)이고, M/m으로 시작하지 않으면 앱이 기본 아이콘으로 대체합니다.');
  block('3) 영수증 검증 (verifyEndpoint)',
    {receiptId:'r_1', productId:'saju_full'},
    {verified:true},
    '결제창에서 돌아온 주소에 ?receipt=... 가 있을 때 1회 호출합니다. verified가 true여도 앱은 권한을 스스로 주지 않고 1)을 다시 조회합니다.');
  block('4) 결제 세션 생성 (checkoutEndpoint)',
    {productId:'saju_full', price:1900},
    {checkoutUrl:'https://pg.example.com/…'},
    '{ "granted": true, "receiptId": "…" } 형태로 즉시 승인해도 됩니다. 어느 쪽이든 승인 후 앱은 1)을 다시 조회해 서버가 인정한 결과만 반영합니다.');
  openModal('결제 서버 연동 규격', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}

/* 리포트 한 벌(목차 + 안내 띠 + 섹션)을 host 안에 그린다.
   AI 해석이 연결돼 있으면, 먼저 기본 풀이를 즉시 보여주고(빈 화면으로 기다리게 하지 않는다)
   응답이 오면 그 자리를 AI 해석으로 바꿔 끼운다. 실패하면 기본 풀이를 그대로 두고 이유를 알린다. */
function paintReportInto(host, localSections, product, tocLabel, payloadFn, displayName){
  var payload = null;
  try{ payload = payloadFn ? payloadFn() : null; }catch(e){ payload = null; }

  /* ★ 유료 본문 서버가 연결돼 있으면, 클라이언트는 유료 섹션의 "본문"을 아예 갖지 않는다.
     제목만 남기고 본문을 비워, 결제하지 않은 사람은 브라우저 안에서 본문을 얻을 방법이 없게 만든다. */
  var baseSections = serverContentMode() ? stripPaidBodies(localSections) : localSections;
  var paidNeeded = serverContentMode() && hasAccess(product.id);

  var state = { sections: baseSections, source: 'local', loading: Interpreter.isApiReady(), error: null,
                paidLoading: false, paidError: null };

  function paint(){
    host.innerHTML = '';
    host.appendChild(buildGatedToc(state.sections, product, tocLabel));
    host.appendChild(interpreterNotice(state));
    /* AI 해석이 이미 13섹션을 통째로 갈아끼운 뒤라면 본문이 비어 있지 않으므로 대체 카드를 쓰지 않는다. */
    var showPending = paidNeeded && state.source !== 'api' && (state.paidLoading || state.paidError);
    if(showPending) host.appendChild(paidContentNotice(state, loadPaidBody));
    renderGatedSections(host, state.sections, product, {
      pendingFrom: showPending ? FREE_SECTION_COUNT : -1,
      pendingLoading: state.paidLoading,
      onRetry: loadPaidBody
    });
  }

  /* 유료 본문을 서버에서 받아온다. 권한이 없으면 요청조차 하지 않는다.
     ★ 실패를 조용히 삼키지 않는다 — 결제한 사람이 아무 설명 없이 빈 화면을 보는 게 제일 나쁘다. */
  function loadPaidBody(){
    state.paidLoading = true; state.paidError = null;
    paint();
    fetchPaidSection(product.id, payload, displayName).then(function(remote){
      state.paidLoading = false;
      state.paidError = null;
      state.sections = baseSections.slice(0, FREE_SECTION_COUNT).concat(remote);
      paint();
    }).catch(function(err){
      state.paidLoading = false;
      state.paidError = (err && err.message) || '유료 해석을 불러오지 못했습니다.';
      state.sections = baseSections;
      console.warn('유료 본문 조회 실패', err);
      paint();
    });
  }

  paint();
  if(paidNeeded) loadPaidBody();

  if(!Interpreter.isApiReady()) return;
  if(!payload){ state.loading=false; state.error='해석에 넘길 데이터를 만들지 못했습니다.'; paint(); return; }

  Interpreter.generate(payload).then(function(sections){
    if(!sections.length) throw new Error('해석 결과가 비어 있습니다.');
    /* 서버가 준 섹션에 id가 없으면 목차 이동이 깨지므로 없을 때만 채워 넣는다.
       ★ untrusted 표시를 붙여, 화면에 넣을 때 반드시 정화기를 거치게 한다. */
    state.sections = sections.map(function(sec, i){
      return { id: sec.id || ('ai'+i), title: sec.title || ('섹션 '+(i+1)), icon: safeIconPath(sec.icon),
               paragraphs: Array.isArray(sec.paragraphs) ? sec.paragraphs : null,
               body: typeof sec.body === 'string' ? sec.body : '',
               untrusted: true };
    });
    state.source = 'api'; state.loading = false; state.error = null;
    paint();
  }).catch(function(err){
    state.loading = false;
    state.error = (err && err.message) || '해석 서버 호출에 실패했습니다.';
    paint();
  });
}
/* 유료 구간의 본문만 비운다(제목·아이콘은 목차와 잠금 카드에 필요하므로 남긴다). */
function stripPaidBodies(sections){
  return sections.map(function(s, i){
    if(i < FREE_SECTION_COUNT) return s;
    return { id:s.id, title:s.title, icon:s.icon, body:'', paragraphs:null };
  });
}
/* 섹션 본문을 화면에 넣는다.
   - paragraphs(평문 배열) : textContent로만 조립 → 스크립트가 실행될 수 없다
   - untrusted body(HTML)  : 허용 태그 목록으로 정화한 뒤 삽입
   - 로컬 문구뱅크 body     : 이 파일이 직접 만든 문자열이므로 그대로 삽입 (이름은 이미 escapeHtml 처리됨) */
function appendSectionBody(sec, s){
  if(s.paragraphs && s.paragraphs.length){ sec.appendChild(paragraphsToFragment(s.paragraphs)); return; }
  if(s.untrusted){
    var wrap = el('div',{});
    wrap.appendChild(sanitizeHtmlToFragment(s.body || ''));
    sec.appendChild(wrap);
    return;
  }
  sec.appendChild(el('div',{html:s.body||''}));
}
/* 티저에 쓸 평문. paragraphs든 body든 태그를 벗겨 한 줄로 만든다. */
function sectionPlainText(s){
  if(!s) return '';
  if(s.paragraphs && s.paragraphs.length) return s.paragraphs.join(' ').replace(/\s+/g,' ').trim();
  return String(s.body||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
}

/* 목차. 잠긴 섹션도 제목은 보여준다 — 무엇을 사는 건지 알 수 있어야 하기 때문이다.
   다만 눌렀을 때 아무 데도 안 가는 링크를 남기면 고장난 것처럼 보이므로,
   잠긴 항목은 결제 화면으로 연결한다. */
function buildGatedToc(sections, product, ariaLabel){
  var unlocked = hasAccess(product.id);
  var freeCount = unlocked ? sections.length : Math.min(FREE_SECTION_COUNT, sections.length);
  var toc = el('nav',{class:'toc-nav','aria-label':ariaLabel});
  sections.forEach(function(s,i){
    var label = s.title.split(' · ')[0];
    if(i < freeCount){
      toc.appendChild(el('a',{href:'#'+s.id, onclick:function(e){ e.preventDefault(); var t=document.getElementById(s.id); if(t) t.scrollIntoView(); }},[label]));
    } else {
      toc.appendChild(el('a',{href:'#', class:'toc-locked', title:'유료 구간이에요',
        onclick:function(e){ e.preventDefault(); openPaywall(product); }},['🔒 '+label]));
    }
  });
  return toc;
}

/* 결제한 사람이 유료 본문을 못 받았을 때, 그 사실을 화면에 정직하게 알리고 재시도 수단을 준다.
   AI 해석 실패에는 이미 같은 처리가 있었는데 정작 돈을 낸 경로에만 없었다. */
function paidContentNotice(state, onRetry){
  var box = el('div',{class:'interp-notice warn'});
  if(state.paidLoading){
    box.classList.remove('warn');
    box.appendChild(el('span',{class:'interp-badge'},['유료 해석']));
    box.appendChild(el('span',{},['결제하신 유료 해석을 서버에서 불러오는 중이에요.']));
    return box;
  }
  box.appendChild(el('span',{class:'interp-badge'},['유료 해석']));
  box.appendChild(el('span',{class:'interp-err'},['유료 해석을 불러오지 못했어요: '+state.paidError]));
  box.appendChild(el('span',{},['이용권은 그대로 있어요. 잠시 후 다시 시도해 주세요.']));
  box.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:onRetry},['다시 시도']));
  return box;
}

/* 리포트 섹션을 무료 구간까지만 그리고, 그 다음부터는 잠금 카드로 대체한다.
   사주 풀이와 MBTI 풀이가 같은 구조라 한 함수로 공유한다.
   opts.pendingFrom 이후의 섹션은 본문이 아직/끝내 없는 구간이므로, 제목만 덩그러니 두지 않고
   "불러오는 중"·"불러오지 못했어요 + 다시 시도" 카드로 대체한다. */
function renderGatedSections(view, sections, product, opts){
  opts = opts || {};
  var pendingFrom = (typeof opts.pendingFrom === 'number') ? opts.pendingFrom : -1;
  var unlocked = hasAccess(product.id);
  var freeCount = unlocked ? sections.length : Math.min(FREE_SECTION_COUNT, sections.length);

  sections.forEach(function(s,i){
    if(i >= freeCount) return;
    var sec=el('section',{class:'report-section', id:s.id});
    var h=el('h3',{});
    h.appendChild(svgIcon(s.icon));
    h.appendChild(document.createTextNode(s.title));
    sec.appendChild(h);
    if(pendingFrom >= 0 && i >= pendingFrom){
      if(opts.pendingLoading){
        sec.appendChild(el('p',{class:'section-sub'},['본문을 불러오는 중이에요…']));
      } else {
        sec.appendChild(el('p',{class:'section-sub'},['본문을 불러오지 못했어요. 이용권은 그대로 남아 있어요.']));
        /* 재시도 버튼은 첫 실패 섹션에만 둔다(섹션마다 달면 같은 버튼이 열 개 늘어선다). */
        if(opts.onRetry && i === pendingFrom){
          sec.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:opts.onRetry},['다시 시도']));
        }
      }
    } else {
      appendSectionBody(sec, s);
    }
    view.appendChild(sec);
    var hasNext = (i < freeCount-1);
    if(hasNext){
      view.appendChild(el('div',{class:'next-sec-btn'},[
        el('button',{class:'btn btn-ghost btn-sm', onclick:(function(nextId){ return function(){ var t=document.getElementById(nextId); if(t) t.scrollIntoView(); }; })(sections[i+1].id)},['다음 섹션 ↓'])
      ]));
    }
  });

  if(!unlocked && sections.length > freeCount){
    var next = sections[freeCount];
    /* 맛보기는 다음 섹션의 앞부분만 보여준다. 통째로 넣으면 잠금이 무의미해진다.
       (유료 본문 서버 모드에서는 본문 자체가 비어 있어 티저도 나오지 않는다.) */
    var teaser = sectionPlainText(next).slice(0, 160);
    var remain = sections.length - freeCount;
    var block = lockedBlock(product, teaser ? '<p>'+escapeHtml(teaser)+'…</p>' : '', next.title.split(' · ')[0]);
    block.insertBefore(el('div',{class:'locked-count'},['남은 '+remain+'개 섹션이 잠겨 있어요']), block.firstChild);
    view.appendChild(block);
  }
}

/* 지금 풀이가 어떻게 만들어지고 있는지 알린다.
   "왜 Claude에 직접 물어볼 때보다 얕은가"에 대한 정직한 답이기도 하다. */

      : '연결된 해석 서버('+Interpreter.config.model+')가 이 데이터를 직접 읽고 풀이합니다.']));
  } else {

    box.appendChild(el('span',{},['사주팔자 계산은 이 앱이 직접 하지만, 풀이 문장은 미리 준비된 해석표를 조합해 만듭니다. AI 해석을 연결하면 같은 사주를 훨씬 깊게 읽어줍니다.']));
    box.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ ROUTE='settings'; render(); }},['연결 설정 →']));

  return box;
}

/* =====================================================================
   상용화 계층 2 — 해석 엔진(Interpreter)
   ---------------------------------------------------------------------
   사주팔자(사주 기둥) 계산은 이 파일 안의 SajuEngine이 천문 계산으로 직접 한다.
   반면 "풀이 문장"은 지금까지 미리 써둔 문구 표에서 골라 조합하는 방식이었다.
   같은 사주라도 사람이 Claude에게 직접 물어볼 때보다 얕게 느껴지는 이유가 바로 이것이다.
   (계산이 틀린 게 아니라, 해석하는 주체가 없었다.)

   그래서 해석을 갈아끼울 수 있는 층으로 분리한다.
     local — 지금까지의 문구 표 조합. 오프라인에서 즉시 동작. 무료 기본값.
     api   — 실제 LLM이 해석. 서버를 거쳐 호출한다.

   API 키를 브라우저에 두면 페이지를 여는 누구나 키를 훔쳐 쓸 수 있으므로,
   반드시 [브라우저 → 내 서버 → Anthropic] 순서로 호출한다. 이 파일은 내 서버의
   엔드포인트 주소만 알고 있으면 되고 키는 서버에만 둔다.
===================================================================== */
var Interpreter = {
  config: {
    mode: 'local',            /* 'local' | 'api' */
    endpoint: '',             /* 예: https://api.내도메인.com/interpret */
    model: 'claude-opus-5',
    timeoutMs: 30000
  },
  lastError: null,

  load: function(){
    var c = STATE.interpreterConfig;
    if(c){ for(var k in c){ if(k in this.config) this.config[k] = c[k]; } }
  },
  save: function(){
    STATE.interpreterConfig = {
      mode:this.config.mode, endpoint:this.config.endpoint,
      model:this.config.model, timeoutMs:this.config.timeoutMs
    };
    saveState();
  },
  isApiReady: function(){
    return this.config.mode === 'api' && /^https?:\/\//.test(this.config.endpoint || '');
  },

  /* LLM에 넘길 재료. 여기 담기는 값은 전부 이 앱이 실제로 계산한 것이다.
     해석 품질은 결국 이 재료를 얼마나 정확하고 빠짐없이 넘기느냐로 갈린다. */
  buildSajuPayload: function(profile, saju){
    var counts = dominantElementIdx(saju).counts;
    return {
      kind: 'saju',
      person: {
        name: profile.name || '',
        gender: profile.gender === 'M' ? '남' : '여',
        birth: { year:profile.year, month:profile.month, day:profile.day,
                 time: profile.birthTime || null, calendar: profile.calendarType || 'solar' }
      },
      pillars: {
        year:  { stem:SajuEngine.STEMS[saju.year.stemIdx],  branch:SajuEngine.BRANCHES[saju.year.branchIdx] },
        month: { stem:SajuEngine.STEMS[saju.month.stemIdx], branch:SajuEngine.BRANCHES[saju.month.branchIdx] },
        day:   { stem:SajuEngine.STEMS[saju.day.stemIdx],   branch:SajuEngine.BRANCHES[saju.day.branchIdx] },
        hour:  saju.hour ? { stem:SajuEngine.STEMS[saju.hour.stemIdx], branch:SajuEngine.BRANCHES[saju.hour.branchIdx] } : null
      },
      elements: { 목:counts[0], 화:counts[1], 토:counts[2], 금:counts[3], 수:counts[4] },
      dayMasterStrength: sinGangJak(saju),
      sipseong: sipseongCounts(saju),
      requested: { sections: 13, tone: '따뜻한 반말체', language: 'ko' }
    };
  },

  buildCompatPayload: function(pA, pB, res){
    return {
      kind: 'compat',
      a: { name:pA.name, mbti:pA.mbti, pillars: pA.saju ? this.buildSajuPayload(pA, pA.saju).pillars : null },
      b: { name:pB.name, mbti:pB.mbti, pillars: pB.saju ? this.buildSajuPayload(pB, pB.saju).pillars : null },
      computed: { combined:res.combined, tier:res.combinedTier, sajuScore:res.saju.score, mbtiScore:res.mbtiScore },
      requested: { language:'ko', tone:'따뜻한 반말체' }
    };
  },

  /* 실제 호출. 실패하면 조용히 넘어가지 않고 이유를 남긴다 —
     화면에서 "AI 해석 실패, 기본 풀이로 표시 중"을 사용자에게 알려야 하기 때문이다. */
  generate: function(payload){
    var self = this;
    if(!this.isApiReady()){
      return Promise.reject(new Error('AI 해석이 연결되어 있지 않습니다.'));
    }
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, this.config.timeoutMs) : null;

    return fetch(this.config.endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:this.config.model, payload:payload }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if(timer) clearTimeout(timer);
      if(!res.ok) throw new Error('해석 서버 응답 오류 (HTTP '+res.status+')');
      return res.json();
    }).then(function(data){
      if(!data || !Array.isArray(data.sections)) throw new Error('해석 결과 형식이 올바르지 않습니다.');
      self.lastError = null;
      return data.sections;
    }).catch(function(err){
      if(timer) clearTimeout(timer);
      self.lastError = (err && err.name === 'AbortError') ? '해석 시간이 초과되었습니다.' : (err.message || String(err));
      throw err;
    });
  }
};

===================================================================== */

];
function calcZodiac(year){ var idx=((year-4)%12+12)%12; return {idx:idx, name:ZODIAC[idx]}; }
function calcYinYang(year){ return (year%2===0)?'양':'음'; }
function calcStarSign(month, day){
  for(var i=0;i<STAR_SIGNS.length;i++){
    var s=STAR_SIGNS[i];
    var fromM=s.from[0], fromD=s.from[1], toM=s.to[0], toD=s.to[1];
    if(fromM===toM){ if(month===fromM && day>=fromD && day<=toD) return s.name; }
    else if(fromM<toM){ if((month===fromM&&day>=fromD)||(month===toM&&day<=toD)||(month>fromM&&month<toM)) return s.name; }
    else { if((month===fromM&&day>=fromD)||(month===toM&&day<=toD)) return s.name; }
  }
  return STAR_SIGNS[0].name;
}
function elementProfile(primaryIdx){
  return ELEMENTS.map(function(_,i){
    if(i===primaryIdx) return 95;
    var diff=Math.min(Math.abs(i-primaryIdx),5-Math.abs(i-primaryIdx));
    if(diff===1) return 55;
    return 28;
  });
}
function elementScore(aIdx,bIdx){
  if(aIdx===bIdx) return 75;
  var diff=((bIdx-aIdx)+5)%5;
  if(diff===1||diff===4) return 92;

function sajuChars(sajuResult){ // 8자(또는 6자) 배열: {pos,label,stemIdx,branchIdx,stemElem,stemYY,branchElem,branchYY}
  var out=[];

  });
  if(sajuResult.hour){

    counts[elem]++;
  });
  var best=0; for(var i=1;i<5;i++){ if(counts[i]>counts[best]) best=i; }

  var dayElem = SajuEngine.STEM_ELEM[dayStemIdx];
  var chars = sajuChars(sajuResult);
  var supportive=0, total=chars.length;
  chars.forEach(function(c){
    if(c.pos==='day' && c.part==='stem') return; // 일간 자기 자신 제외
    var elem = c.part==='stem' ? SajuEngine.STEM_ELEM[c.g.stemIdx] : SajuEngine.BRANCH_ELEM[c.g.branchIdx];
    var diff = ((elem-dayElem)%5+5)%5;

function daeunMoneyHealthLines(dayStemIdx, ganji, counts){
  var sipName = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[ganji.stemIdx], SajuEngine.STEM_YY[ganji.stemIdx]);
  var moneyLine = DAEUN_MONEY_LINE[sipName];

  var branchElem = SajuEngine.BRANCH_ELEM[ganji.branchIdx];
  var weakestElem = counts.indexOf(Math.min.apply(null,counts));
  var mostElem = counts.indexOf(Math.max.apply(null,counts));
  var healthLine;
  if(branchElem === weakestElem){
    healthLine = '건강 쪽으로 보면 평소 여린 '+ELEMENTS[branchElem]+' 기운이 채워지는 구간이라 '+ELEM_ORGAN[branchElem]+' 쪽 컨디션이 조금은 회복될 여지가 있어.';
  } else if(branchElem === mostElem){
    healthLine = '건강 쪽으로 보면 원래도 진한 '+ELEMENTS[branchElem]+' 기운이 한층 더해지는 구간이라 '+ELEM_ORGAN[branchElem]+' 쪽에 무리가 가지 않게 평소보다 신경 쓰는 게 좋아.';
  } else {
    healthLine = '건강 쪽으로 보면 이 구간은 '+ELEMENTS[branchElem]+' 기운이 두드러져서 '+ELEM_ORGAN[branchElem]+' 쪽을 평소보다 챙기면 좋아.';
  }
  // 신규(대운 서술 심화 후속): 십이운성 — 이 대운 지지가 일간 기준으로 어느 단계인지 조회해 생애주기 비유 문장 추가.
  // 새 계산 없음: twelveStageOf()는 위 고정 조견표(TWELVE_STAGE_START)를 조회할 뿐이다.
  var stageName = twelveStageOf(dayStemIdx, ganji.branchIdx);
  var stageLine = '이 대운은 십이운성으로 보면 '+TWELVE_STAGE_LINE[stageName];
  return { sipName:sipName, moneyLine:moneyLine, healthLine:healthLine, stageName:stageName, stageLine:stageLine };
}

/* ---- 13섹션 리포트 조립 (기능6) ----

function buildReport13(profile, saju){
  var name = (profile.name||'').trim() || '너';
  var safeName = escapeHtml(name); // 리포트 문구는 el({html:...})로 렌더되므로 사용자 입력(이름)은 반드시 이스케이프 후 삽입(XSS 방지)
  var dayStemIdx = saju.day.stemIdx;
  var dayStemName = SajuEngine.STEMS[dayStemIdx];
  var elemInfo = dominantElementIdx(saju);
  var counts = elemInfo.counts;
  var chars = sajuChars(saju);
  var totalChars = chars.length;
  var maxCount = Math.max.apply(null, counts);
  var balanceKey = (maxCount >= Math.ceil(totalChars*0.5)) ? 'many' : (counts.every(function(c){return c<=totalChars/5+0.6;}) ? 'balanced' : 'balanced');
  // 균형/과다: 특정 오행이 절반 이상이면 과다, 0개인 오행이 있으면 그 관점에선 '부족'(오프닝은 대표적으로 과다/균형만 사용, 부족은 잠재력 섹션에서 별도 사용)
  var minCount = Math.min.apply(null, counts);
  if(minCount===0 && maxCount<Math.ceil(totalChars*0.5)) balanceKey='few';
  var sg = sinGangJak(saju); // 'strong' | 'weak'
  var sipCounts = sipseongCounts(saju);
  var domSip = dominantSipseong(sipCounts);
  var domGroup = groupCategory(domSip);
  var branchList = [ {idx:saju.year.branchIdx}, {idx:saju.month.branchIdx}, {idx:saju.day.branchIdx} ];
  if(saju.hour) branchList.push({idx:saju.hour.branchIdx});
  var rel = SajuEngine.branchRelations(branchList);
  var hasHapAny = rel.hap.length>0 || rel.samhap.length>0 || rel.banghap.length>0;
  var hasChungAny = rel.chung.length>0;
  var shinsal = shinsalTags(saju); // v4-B: 신살 존재 여부 태그(고정 룩업, 새 계산 없음)
  var gyeok = gyeokOf(saju); // v4-B: 월지 십성 → 격국 이름(고정 룩업)

  var sections = [];
  function add(id, title, iconPath, bodyHtml){ sections.push({id:id, title:title, icon:iconPath, body:bodyHtml}); }
  function T(s){
    return s
      .replace(/\{n\}(은|는)/g, josa(safeName,'은','는'))
      .replace(/\{n\}(을|를)/g, josa(safeName,'을','를'))
      .replace(/\{n\}(이|가)/g, josa(safeName,'이','가'))
      .replace(/\{n\}(과|와)/g, josa(safeName,'과','와'))
      .replace(/\{n\}(이랑|랑)/g, josa(safeName,'이랑','랑'))
      .replace(/\{n\}/g, safeName);
  }

  // 1. 오프닝
  add('s1','오프닝 · 한 문장 요약','M4 18 L10 6 L16 18',
    '<p>'+T(PB.ilganImage[dayStemName].line)+' '+PB.balanceOpening[balanceKey==='few'?'few':(balanceKey==='many'?'many':'balanced')]+'</p>'+
    '<p>지금부터 '+safeName+'의 사주 여덟 글자(시주를 모르면 여섯 글자) 안에 담긴 흐름을 하나씩 같이 짚어볼게.</p>');

  // 2. 일간 분석
  add('s2','일간 분석 · 타고난 기질','M4 18 L10 6 L16 18',
    /* 조사는 바로 앞 한글 음절(천간 이름)의 받침으로 정한다. 괄호 안 한자는 판정 대상이 아니다.
       무/기/계 일간은 받침이 없어 '이'가 아니라 '가'가 맞다. */
    '<p><strong>일간 '+dayStemName+'('+saju.day.stemH+')</strong>'+josaOnly(dayStemName,'이','가')+' '+safeName+' 사주의 뿌리야. '+PB.shingangTrait[sg][dayStemName]+'</p>'+
    '<p>일간은 사주에서 \''+safeName+' 자신\'을 나타내는 글자야. 이 글자 하나를 기준으로 나머지 일곱(또는 다섯) 글자와의 관계를 읽는 게 사주풀이의 핵심이야.</p>');

  // 3. 사회적 인상
  var seasonKey = counts[SajuEngine.BRANCH_ELEM[saju.month.branchIdx]] >= 3 ? 'strong' : (counts[SajuEngine.BRANCH_ELEM[saju.month.branchIdx]]<=1?'weak':'mid');
  /* 12지 중 자·묘·사·오·미·유·해는 받침이 없어 '이'가 아니라 '가'가 맞다. josa()가 앞 음절 받침으로 판정한다. */

  // v4-B: 신살(고정 룩업) 존재 여부를 자연스러운 문장 1회로 — 역마살>화개살>도화살 순으로 하나만(도화살은 연애운 섹션에서 이미 별도로 다룸)
  if(shinsal['역마살']){
    s3Html += '<p>거기다 지지에 <strong>역마살</strong>이 껴 있어서, 한자리에 오래 머무르기보다 옮겨 다니거나 변화가 잦은 흐름 속에서 더 활기를 띠는 인상을 주기도 해.</p>';
  } else if(shinsal['화개살']){
    s3Html += '<p>거기다 지지에 <strong>화개살</strong>이 껴 있어서, 겉으론 무난해 보여도 속으론 늘 혼자만의 몰입거리를 찾는 사람이라는 인상을 은근히 풍기기도 해.</p>';
  } else if(shinsal['도화살']){
    s3Html += '<p>거기다 지지에 <strong>도화살</strong>까지 껴 있어서, 애쓰지 않아도 자연스럽게 시선을 끄는 매력이 도는 인상이야.</p>';
  }
  add('s3','사회적 인상 · 남들이 보는 나','M3 10 L10 4 L17 10 L17 17 L3 17 Z', s3Html);

  // 4. 내면
  add('s4','내면 · 겉과 속의 차이','M10 3 C4 3 4 10 10 17 C16 10 16 3 10 3 Z',
    /* "일지 해(亥) 은" → "일지 해(亥)는". 자·묘·사·오·미·유·해는 받침이 없다. */
    '<p><strong>일지 '+saju.day.branch+'('+saju.day.branchH+')</strong>'+josaOnly(saju.day.branch,'은','는')+' 가까운 사람만 아는 속마음이야. '+PB.iljiInner[saju.day.branchIdx]+'</p><p>'+PB.hourKnown[saju.hour?'yes':'no']+'</p>');

  // 5. 사랑/연애운
  var loveKey = (sipCounts.정관>=sipCounts.편관 && sipCounts.정관>0) ? 'jeonggwan'
    : (sipCounts.편관>0 ? 'pyeongwan' : (sipCounts.정재>=sipCounts.편재 && sipCounts.정재>0 ? 'jeongjae' : (sipCounts.편재>0?'pyeonjae':'weak')));
  var dohwa = hasDohwa(saju);
  var loveHtml = '<p>'+PB.lovePattern[loveKey]+'</p>';
  if(dohwa){ loveHtml += '<p>'+seededPick(djb2(name+dayStemName+'love'), PB.dohwaExtra)+'</p>'; }
  loveHtml += '<p>'+PB.loveRelationExtra[hasChungAny?'chung':(hasHapAny?'hap':'none')]+'</p>';
  loveHtml += '<p>연애나 결혼처럼 중요한 선택은 이 풀이를 참고 자료로만 삼고, 마지막 결정은 늘 '+safeName+' 스스로의 마음을 따라야 해.</p>';
  add('s5','사랑 · 연애운','M10 17 C2 11 2 5 6.5 4 C9 3.5 10 6 10 6 C10 6 11 3.5 13.5 4 C18 5 18 11 10 17 Z', loveHtml);

  // 6. 일/커리어운
  var careerBase = (sipCounts.식신+sipCounts.상관) >= (sipCounts.편관+sipCounts.정관) ? 'siksang' : 'gwan';
  var careerKey = careerBase+'_'+sg;
  var s6Html = '<p>'+PB.careerPattern[careerKey]+'</p>';
  // v4-B: 격국(월지 십성 → 8격, 고정 룩업) 해설 한 줄
  if(gyeok.gyeok){
    s6Html += '<p>사주 용어로는 이걸 <strong>'+gyeok.gyeok+'</strong>이라고 불러. '+GYEOKGUK_DESC[gyeok.gyeok]+'</p>';
  }
  add('s6','일 · 커리어운','M3 8 L17 8 L17 16 L3 16 Z M7 8 L7 5 L13 5 L13 8', s6Html);

  // 7. 금전운/재물운
  var moneyKey = sipCounts.정재>=sipCounts.편재 ? (sipCounts.정재>0?'jeongjae':'none') : (sipCounts.편재>0?'pyeonjae':'none');
  var jaego = rel.samhap.length>0 || rel.banghap.length>0; // 간이: 지지 국(局)이 있으면 재고 흐름 있음으로 취급
  add('s7','금전운 · 재물운','M10 3 L10 17 M5 6 C5 6 6.5 5 10 5 C13.5 5 14.5 7 12 8 C9.5 9 6.5 10.5 9 12 C11 13 15 12.5 15 12.5',
    '<p>'+PB.moneyType[moneyKey]+'</p><p>'+PB.jaegoText[jaego?'yes':'no']+'</p><p>'+PB.moneyShingang[sg]+'</p><p>'+PB.moneyPsych[moneyKey]+'</p>'+
    '<p>큰돈이 오가는 계약이나 투자 결정은 이 풀이가 아니라 반드시 실제 자료와 전문가 조언을 함께 참고해줘 — 여긴 어디까지나 성향을 짚어보는 참고용이야.</p>');

  // 8. 잠재력
  var weakestElem = counts.indexOf(Math.min.apply(null,counts));
  var nextTermSoon = !!(saju.termBoundary && saju.termBoundary.next);
  // v4-B: 용신 근사 — 오행 균형에서 가장 부족한 오행을 "필요한 기운"으로 제시(정교한 용신 산출이 아닌 근사, 고정 로직 없음)
  var yongsinHtml = '<p>사주에서는 이렇게 부족한 기운을 채워주는 걸 <strong>용신(用神)</strong>이라고 불러. 정통 용신 이론은 사주 전체 구조를 훨씬 정교하게 따지지만, 여기서는 원국의 오행 균형만으로 '+safeName+'에게 지금 근사적으로 필요한 기운을 짚어볼게.</p>';
  // v5-A 신규: 오행-장부 대응(ELEM_ORGAN, 고정 룩업) — 이미 계산된 오행 카운트(counts/maxCount/weakestElem)에서 가장 많은/적은 오행을 근거로 건강 관련 서술 추가. 새 계산 없음.
  var mostElem = counts.indexOf(maxCount);
  var healthHtml;
  if(mostElem !== weakestElem){
    healthHtml = '<p>오행은 몸의 장부와도 이어진다고 봐 — 전통 한의학에서는 목(木)은 간·담, 화(火)는 심장·소장, 토(土)는 비장·위장, 금(金)은 폐·대장, 수(水)는 신장·방광과 연결된다고 보거든. '+josa(safeName,'은','는')+' 오행 중 <strong>'+ELEMENTS[mostElem]+'</strong> 기운이 가장 진해서 <strong>'+ELEM_ORGAN[mostElem]+'</strong> 쪽에 무리가 가기 쉽고, 반대로 가장 여린 <strong>'+ELEMENTS[weakestElem]+'</strong> 기운 쪽인 <strong>'+ELEM_ORGAN[weakestElem]+'</strong>도 평소보다 챙겨주면 좋아. 이건 전통 오행 이론에 기반한 참고용 근사일 뿐 의학적 진단이 아니니, 몸 상태가 계속 안 좋다면 반드시 병원에 가서 정확한 진단을 받아야 해.</p>';
  } else {
    healthHtml = '<p>오행은 몸의 장부와도 이어진다고 봐 — 전통 한의학에서는 목(木)은 간·담, 화(火)는 심장·소장, 토(土)는 비장·위장, 금(金)은 폐·대장, 수(水)는 신장·방광과 연결된다고 보거든. '+josa(safeName,'은','는')+' 오행 중 <strong>'+ELEMENTS[weakestElem]+'</strong> 기운이 가장 여려서 <strong>'+ELEM_ORGAN[weakestElem]+'</strong> 쪽을 평소보다 챙겨주면 좋아. 이건 전통 오행 이론에 기반한 참고용 근사일 뿐 의학적 진단이 아니니, 몸 상태가 계속 안 좋다면 반드시 병원에 가서 정확한 진단을 받아야 해.</p>';
  }
  add('s8','잠재력 · 미발현 오행','M10 2 L12 8 L18 8 L13 12 L15 18 L10 14 L5 18 L7 12 L2 8 L8 8 Z',
    yongsinHtml+'<p>'+PB.potentialElem[weakestElem]+'</p><p>'+PB.daeunInflow[nextTermSoon?'yes':'no']+'</p>'+healthHtml);

  // 9. 반복 패턴/고민
  var strongestElem = counts.indexOf(maxCount);
  add('s9','반복되는 패턴 · 고민','M4 10 C4 6 7 3 10 3 C13 3 16 6 16 10 C16 14 13 17 10 17 C7 17 4 14 4 10 Z',
    '<p>'+PB.patternElem[strongestElem]+'</p><p><strong>'+domGroup+'</strong> 기운이 두드러진 사주라 반복되는 고민도 이 쪽에서 나오는 경우가 많아. '+PB.patternSipseong[domGroup]+'</p>');

  // v5-A 신규: 대운=계절 비유 — 이미 존재하는 groupCategory(비겁/식상/재성/관성/인성) 분류를 재사용해
  // 확장·도전에 가까운 그룹(비겁/식상/재성)은 "상승기", 안정·정리에 가까운 그룹(관성/인성)은 "준비기"로 톤을 얹는다. 새 판정 로직 아님.
  function daeunSeasonLine(sipName){
    var grp = groupCategory(sipName);
    var expanding = (grp==='비겁'||grp==='식상'||grp==='재성');
    return expanding
      ? '대운은 인생의 계절과 같다고들 하는데, 이 구간은 확장하고 도전하기 좋은 <strong>상승기</strong>에 가까워.'
      : '대운은 인생의 계절과 같다고들 하는데, 이 구간은 다지고 정리하며 내실을 채우기 좋은 <strong>준비기</strong>에 가까워.';
  }

  // 대운 목록 계산 (10~12 섹션 공용)
  var dw = null;
  if(profile.gender){
    dw = SajuEngine.daewoonList(saju.birthUTCms, profile.year, saju.year.stemIdx, SajuEngine.STEM_YY[saju.year.stemIdx], profile.gender, saju.month.idx);
  }
  var ageNow = (new Date().getFullYear()) - profile.year + 1;
  var curIdx = 0;
  if(dw){ for(var i=0;i<dw.list.length;i++){ if(ageNow>=dw.list[i].startAge) curIdx=i; } }

  // 10. 과거 대운 흐름
  if(dw && curIdx>0){
    var pastHtml='';
    var pastStart = Math.max(0,curIdx-2);
    for(var pi=pastStart; pi<curIdx; pi++){
      var pd = dw.list[pi];
      var sName = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[pd.ganji.stemIdx], SajuEngine.STEM_YY[pd.ganji.stemIdx]);
      // v5-A: 대운=계절 비유는 가장 최근 지나온 대운 1개에만 얹어 반복을 피한다(선택적 강화)
      var pastSeasonLine = (pi === curIdx-1) ? (' '+daeunSeasonLine(sName)) : '';
      // v5-C: 금전운·건강운 문장 — 기능5 타임라인과 동일한 daeunMoneyHealthLines() 재사용, 두 화면이 같은 근거로 서술
      var pastMH = daeunMoneyHealthLines(dayStemIdx, pd.ganji, counts);
      pastHtml += '<p><strong>'+pd.startAge+'세~ '+pd.ganji.text+'('+pd.ganji.textH+') 대운</strong> — '+PB.sipseongLine[sName]+' '+(pi%2===0?PB.daeunToneA:PB.daeunToneB)+pastSeasonLine+'</p>'+
        '<p>'+pastMH.stageLine+'</p>'+
        '<p>'+pastMH.moneyLine+' '+pastMH.healthLine+'</p>';
    }
    add('s10','지나온 대운의 흐름','M2 10 L18 10 M14 6 L18 10 L14 14', pastHtml || '<p><strong>아직 첫 대운</strong>을 지나는 중이라, 지나온 대운 흐름은 다음 리포트에서 더 길게 짚어볼 수 있어.</p>');
  } else {
    add('s10','지나온 대운의 흐름','M2 10 L18 10 M14 6 L18 10 L14 14', '<p><strong>아직 첫 대운 이전이거나 갓 지나는 시기</strong>라, 지나온 흐름보다 지금부터의 흐름이 더 중요한 때야.</p>');
  }

  // 11. 현재 대운 + 올해 세운
  if(dw){
    var cur = dw.list[curIdx];
    var curSip = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[cur.ganji.stemIdx], SajuEngine.STEM_YY[cur.ganji.stemIdx]);
    var thisYear = new Date().getFullYear();
    var saeun = SajuEngine.saeunPillar(thisYear);
    var saeunBranchRel = SajuEngine.branchRelations(branchList.concat([{idx:saeun.branchIdx}]));
    var newHap = saeunBranchRel.hap.length>rel.hap.length || saeunBranchRel.samhap.length>rel.samhap.length;
    var newChung = saeunBranchRel.chung.length>rel.chung.length;
    var saeunKey = newChung?'chung':(newHap?'hap':'none');
    var curMH = daeunMoneyHealthLines(dayStemIdx, cur.ganji, counts); // v5-C: 기능5 타임라인과 동일한 함수 재사용
    add('s11','현재 대운 · 올해의 흐름','M10 2 A8 8 0 1 1 9.99 2 M10 6 L10 10 L13 12',
      '<p><strong>'+cur.startAge+'세부터 시작된 '+cur.ganji.text+'('+cur.ganji.textH+') 대운</strong>을 지나는 중이야. '+PB.currentDaeunLine[curSip]+' '+daeunSeasonLine(curSip)+'</p>'+
      '<p>'+curMH.stageLine+'</p>'+
      '<p>'+curMH.moneyLine+' '+curMH.healthLine+'</p>'+
      '<p>올해('+thisYear+'년, '+saeun.text+' 해)는 — '+PB.saeunPattern[saeunKey]+'</p>');
  }

  // 12. 다가올 대운
  if(dw && curIdx+1<dw.list.length){
    var nxt = dw.list[curIdx+1];
    var nxtSip = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[nxt.ganji.stemIdx], SajuEngine.STEM_YY[nxt.ganji.stemIdx]);
    var nxtMH = daeunMoneyHealthLines(dayStemIdx, nxt.ganji, counts); // v5-C: 기능5 타임라인과 동일한 함수 재사용
    add('s12','다가올 대운','M10 18 L2 8 M6 4 L2 8 L6 12',
      '<p><strong>'+nxt.startAge+'세부터 '+nxt.ganji.text+'('+nxt.ganji.textH+') 대운</strong>이 다가오고 있어. '+PB.futureSipseongLine[nxtSip]+' '+(curIdx%2===0?PB.daeunToneA:PB.daeunToneB)+' '+daeunSeasonLine(nxtSip)+'</p>'+
      '<p>'+nxtMH.stageLine+'</p>'+
      '<p>'+nxtMH.moneyLine+' '+nxtMH.healthLine+'</p>');
  } else {
    add('s12','다가올 대운','M10 18 L2 8 M6 4 L2 8 L6 12',
      '<p><strong>지금 이후로도 대운은 계속 이어져</strong>. 다음 리포트에서 그 다음 흐름을 이어서 짚어볼 수 있어.</p>');
  }

  // 13. 클로징
  add('s13','클로징','M10 3 L10 17 M4 10 L16 10',
    '<p>'+PB.closingBase[sg]+' '+PB.closingFlavor[domGroup]+'</p><p>'+PB.closingTail+'</p>');

  return { sections: sections, meta:{ balanceKey:balanceKey, sg:sg, domSip:domSip, dohwa:dohwa, hasHapAny:hasHapAny, hasChungAny:hasChungAny } };
}

/* 섹션11 "타 유형과의 궁합 경향" — 기존 MBTI_MATRIX를 그대로 재사용해 상위/하위 유형을 뽑고,
   정반대 유형(4지표 전부 반대)까지 함께 언급해 "2~3개 그룹으로 뭉뚱그려" 짧게 안내한다. 새 계산 없음. */
function buildMbtiCompatTrend(mbti){
  var scores = MBTI_TYPES.filter(function(t){ return t!==mbti; }).map(function(t){ return {t:t, s:MBTI_MATRIX[mbti][t]}; });
  scores.sort(function(a,b){ return b.s-a.s; });
  var top = scores.slice(0,3).map(function(x){ return x.t; });
  var bottom = scores.slice(-2).map(function(x){ return x.t; });
  var opposite = mbti.split('').map(function(l){
    var d = DIM_LETTERS.filter(function(pair){ return pair.indexOf(l)>=0; })[0];
    return d[0]===l ? d[1] : d[0];
  }).join('');
  return '경험상 <strong>'+top.join('·')+'</strong> 같은 유형과는 대화가 술술 풀리고 손발이 잘 맞는 편이고, <strong>'+bottom.join('·')+'</strong> 유형과는 처음엔 속도나 표현 방식이 달라 답답하게 느껴질 수 있어. 특히 정반대 유형인 <strong>'+opposite+'</strong>와는 부딪히는 지점도 있지만 그만큼 배우는 것도 많은 조합이야. 물론 이건 유형 하나만 놓고 본 일반적인 경향이고, 실제 궁합은 사주까지 함께 볼 때 훨씬 더 정확해지니 위쪽 \'궁합 보기\'에서 직접 확인해봐.';
}
/* 기능6 buildReport13(profile, saju)와 동일한 패턴의 13섹션 리포트 생성 함수.
   profile.mbti만 조회 키로 쓰고 새 입력 UI는 만들지 않는다. */
function buildMbtiReport16(profile){
  var mbti = profile.mbti;
  var name = (profile.name||'').trim() || '너';
  var safeName = escapeHtml(name);
  var sym = MBTI_SYMBOL[mbti];
  var pb = MBTI_PB[mbti];
  function T(s){
    return s
      .replace(/\{n\}(은|는)/g, josa(safeName,'은','는'))
      .replace(/\{n\}(을|를)/g, josa(safeName,'을','를'))
      .replace(/\{n\}(이|가)/g, josa(safeName,'이','가'))
      .replace(/\{n\}(과|와)/g, josa(safeName,'과','와'))
      .replace(/\{n\}(이랑|랑)/g, josa(safeName,'이랑','랑'))
      .replace(/\{n\}/g, safeName);
  }
  function pick(sectionKey){ return MBTI_SUFFIX[sectionKey][djb2(name+mbti+sectionKey) % MBTI_SUFFIX[sectionKey].length]; }
  var intensity = (djb2(name+mbti+'opening')%2===0) ? 'typical' : 'mild';

  var sections=[];
  function add(id,title,iconPath,bodyHtml){ sections.push({id:id, title:title, icon:iconPath, body:bodyHtml}); }

  // 1. 오프닝
  add('m1','오프닝 · 한 문장 요약', MBTI_ICONS.star,
    '<p>'+josa(safeName,'은','는')+' <strong>'+sym.img+'</strong> 같은 사람이야. '+TYPE_TAGLINE[mbti]+' — 이게 '+mbti+'인 '+josa(safeName,'을','를')+' 한 문장으로 요약한 말이야.</p>'+
    '<p>'+T(MBTI_OPENING_INTENSITY[intensity])+'</p>'+
    '<p>지금부터 '+safeName+'의 MBTI 네 글자 안에 담긴 결을 하나씩 같이 짚어볼게.</p>');

  // 2. 핵심 성향 (4지표 각 한 줄, 기존 INDICATOR 재사용 + v4-B: 인지기능 스택으로 "왜 이런 순서로 행동하는지" 한 줄 추가)
  var indHtml = mbti.split('').map(function(l){ return '<p><strong>'+INDICATOR[l].title+'</strong> — '+INDICATOR[l].strength+'</p>'; }).join('');
  var cog = MBTI_COGFUNC[mbti];
  /* 괄호 뒤 조사는 괄호가 아니라 그 앞 한글 음절의 받침으로 갈린다.
     인지기능 이름은 '사고'(받침 없음)·'감각'·'직관'·'감정'(받침 있음)이 섞여 있어 고정하면 8유형이 틀린다. */
  indHtml += '<p>이 네 글자가 실제로 어떤 순서로 쓰이는지는 <strong>인지기능</strong>으로 더 정확히 볼 수 있어. '+mbti+'인 '+josa(safeName,'은','는')+' <strong>'+cog[0]+'('+MBTI_FUNC_NAME[cog[0]]+')</strong>'+josaOnly(MBTI_FUNC_NAME[cog[0]],'을','를')+' 가장 먼저 꺼내 쓰고, <strong>'+cog[1]+'('+MBTI_FUNC_NAME[cog[1]]+')</strong>'+josaOnly(MBTI_FUNC_NAME[cog[1]],'으로','로')+' 그걸 받쳐주는 순서야 — 이 조합이 앞으로 나올 강점과 약점, 스트레스 반응까지 다 이어져 있어.</p>';
  add('m2','핵심 성향 · 네 글자 안의 결', MBTI_ICONS.wind, indHtml);

  // 3. 타고난 강점
  add('m3','타고난 강점', MBTI_ICONS.mountain, '<p>'+pb.strengths.join('</p><p>')+'</p><p>'+pick('strengths')+'</p>');

  // 4. 그림자 · 약점
  add('m4','그림자 · 솔직한 약점', MBTI_ICONS.river, '<p>'+pb.weakness+'</p><p>'+pick('weakness')+'</p>');

  // 5. 연애 스타일
  add('m5','연애 스타일', MBTI_ICONS.field,
    '<p>'+pb.love+'</p><p>'+pick('love')+'</p><p>더 정밀한 상대와의 궁합은 사주까지 함께 보는 \'궁합 보기\'에서 확인할 수 있어.</p>');

  // 6. 직업 적성 · 커리어
  add('m6','직업 적성 · 커리어', MBTI_ICONS.mountain, '<p>'+pb.career+'</p><p>'+pick('career')+'</p>');

  // 7. 금전관
  add('m7','금전관', MBTI_ICONS.river,
    '<p>'+pb.money+'</p><p>'+pick('money')+'</p><p>다만 큰돈이 오가는 결정은 이 풀이가 아니라 실제 상황과 전문가 조언을 먼저 참고해줘 — 여긴 성향을 짚어보는 참고용이야.</p>');

  // 8. 인간관계 패턴
  add('m8','인간관계 패턴', MBTI_ICONS.field, '<p>'+pb.relationship+'</p><p>'+pick('relationship')+'</p>');

  // 9. 스트레스 대처
  add('m9','스트레스 대처', MBTI_ICONS.wind, '<p>'+pb.stress+'</p><p>'+pick('stress')+'</p>');

  // 10. 성장 포인트
  add('m10','성장 포인트', MBTI_ICONS.star, '<p>'+pb.growth+'</p><p>'+pick('growth')+'</p>');

  // 11. 타 유형과의 궁합 경향 (MBTI_MATRIX 재사용, 새 계산 없음)
  add('m11','타 유형과의 궁합 경향', MBTI_ICONS.mountain, '<p>'+buildMbtiCompatTrend(mbti)+'</p>');

  // 12. 어울리는 활동 · 취미
  add('m12','어울리는 활동 · 취미', MBTI_ICONS.river, '<p>'+pb.activities+'</p><p>'+pick('activities')+'</p>');

  // 13. 클로징
  add('m13','클로징', MBTI_ICONS.field,
    '<p>'+pb.closing+'</p><p>'+pick('closing')+'</p>');

  return { sections: sections };
}

/* =====================================================================
   MBTI 미니 테스트 (v1 유지)
===================================================================== */
function computeMbtiFromAnswers(answers){
  var counts=[[0,0],[0,0],[0,0],[0,0]];
  answers.forEach(function(ansIdx, qIdx){
    var dim=MBTI_TEST_Q[qIdx].dim;
    counts[dim][ansIdx]++;
  });
  var result='';
  for(var d=0; d<4; d++){
    result += counts[d][0] >= counts[d][1] ? DIM_LETTERS[d][0] : DIM_LETTERS[d][1];
  }
  return result;
}

/* =====================================================================
   오늘의 운세 (v1 유지 + v2: 오늘 일진 + 합충 코멘트 반영)
===================================================================== */
function getTodayFortune(profile){
  var cacheKey = profile.id+'_'+todayStr();
  var cached = STATE.fortuneHistory.find(function(f){ return f.cacheKey===cacheKey; });
  if(cached) return cached;

  var seedBase = djb2(profile.mbti+(profile.name||'')+todayStr()+profile.id);
  var result = {id:uid(), cacheKey:cacheKey, profileId:profile.id, date:todayStr(), items:{}};
  FORTUNE_CATS.forEach(function(cat, ci){
    var seed = (seedBase + ci*97) >>> 0;
    var phrase = seededPick(seed, FORTUNE_PHRASES[cat.key]);
    var mbtiLetter = profile.mbti[ (seed>>>2) % 4 ];
    var flavor = MBTI_FLAVOR[mbtiLetter];
    var stars = 1 + (seed % 5);
    result.items[cat.key] = {label:cat.label, text:flavor+' '+phrase, stars:stars};
  });
  result.luckyItem = seededPick((seedBase+11)>>>0, LUCKY_ITEMS);
  result.luckyColor = seededPick((seedBase+23)>>>0, LUCKY_COLORS);

  // v2: 오늘의 실제 일진 + 원국과의 합충 반영 코멘트
  try{
    var now=new Date();
    var todayIdx = SajuEngine.dayPillarIndexForCivilDate(now.getFullYear(), now.getMonth()+1, now.getDate(), null);
    var todayGz = SajuEngine.ganjiOf(todayIdx);
    result.todayIljin = todayGz;
    var saju = getSajuResult(profile);
    if(saju){
      var branchList=[{idx:saju.year.branchIdx},{idx:saju.month.branchIdx},{idx:saju.day.branchIdx}];
      if(saju.hour) branchList.push({idx:saju.hour.branchIdx});
      var withToday = SajuEngine.branchRelations(branchList.concat([{idx:todayGz.branchIdx}]));
      var baseRel = SajuEngine.branchRelations(branchList);
      if(withToday.chung.length>baseRel.chung.length){
        result.iljinComment = '오늘은 '+todayGz.text+'('+todayGz.textH+') 일이라 원국 일지와 충이 걸리는 날입니다. 마음이 붕 뜨거나 갑자기 계획이 틀어질 수 있으니 큰 결정은 하루 미루는 편이 좋습니다.';
      } else if(withToday.hap.length>baseRel.hap.length || withToday.samhap.length>baseRel.samhap.length){
        result.iljinComment = '오늘은 '+todayGz.text+'('+todayGz.textH+') 일이라 원국과 합이 들어오는 날입니다. 사람이나 기회가 자연스럽게 다가올 수 있는 하루입니다.';
      } else {
        result.iljinComment = '오늘은 '+todayGz.text+'('+todayGz.textH+') 일입니다. 원국과 크게 부딪히는 기운은 없어서 평소 리듬대로 움직이면 무난합니다.';
      }
    }
  }catch(e){ /* 사주 계산 실패해도 기존 v1 운세는 그대로 표시 */ }

  STATE.fortuneHistory.unshift(result);
  if(STATE.fortuneHistory.length>200) STATE.fortuneHistory.length=200;
  saveState();
  return result;
}

/* =====================================================================
   v5-B 신규(기능19): 월별 올해 운세 — 새 계산 없이 기존 함수만 조합한다.
   (a) 월지-원국 합충 여부: SajuEngine.branchRelations 재사용(기존 iljinComment와 동일 패턴을 월 단위로 적용)
   (b) 월간-일간 십성 관계: SajuEngine.sipseongOf 재사용, 재성(정재/편재) 여부로 금전운 판정
   (c) 오행-장부: v5-A의 ELEM_ORGAN 룩업 재사용, 그 달 지지 오행이 원국의 가장 여린/진한 오행과 겹치는지로 건강운 판정
   (d) 현재 대운 상승기/준비기: isExpandingGroup(v5-A 로직과 동일한 groupCategory 기반) 재사용, 화면 상단에 1회만 안내
===================================================================== */
function buildMonthlyFortune(profile, year){
  var saju = getSajuResult(profile);
  if(!saju) return null;
  year = year || (new Date()).getFullYear();
  var pillars = SajuEngine.monthlyPillarsOfYear(year);
  var dayStemIdx = saju.day.stemIdx;
  var branchList = [{idx:saju.year.branchIdx},{idx:saju.month.branchIdx},{idx:saju.day.branchIdx}];
  if(saju.hour) branchList.push({idx:saju.hour.branchIdx});
  var baseRel = SajuEngine.branchRelations(branchList);
  var elemInfo = dominantElementIdx(saju);
  var counts = elemInfo.counts;
  var weakestElem = counts.indexOf(Math.min.apply(null,counts));
  var mostElem = counts.indexOf(Math.max.apply(null,counts));

  // 현재 대운 상승기/준비기 안내(화면 상단 1회 — 대운은 원국 전체에 걸리는 흐름이라 달마다 반복하지 않는다)
  var daeunIntro = null;
  if(profile.gender){
    var dw = SajuEngine.daewoonList(saju.birthUTCms, profile.year, saju.year.stemIdx, SajuEngine.STEM_YY[saju.year.stemIdx], profile.gender, saju.month.idx);
    var ageNow = (new Date().getFullYear()) - profile.year + 1;
    var curIdx=0; for(var i=0;i<dw.list.length;i++){ if(ageNow>=dw.list[i].startAge) curIdx=i; }
    var cur = dw.list[curIdx];
    var curSip = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[cur.ganji.stemIdx], SajuEngine.STEM_YY[cur.ganji.stemIdx]);
    daeunIntro = isExpandingGroup(curSip)
      ? '지금 큰 흐름(대운)은 확장하고 도전하기 좋은 상승기입니다. 이번 해의 달들도 이 흐름 안에서 움직입니다.'
      : '지금 큰 흐름(대운)은 다지고 준비하기 좋은 시기입니다. 이번 해의 달들도 차분히 내실을 채우는 쪽에 무게가 실립니다.';
  }

  var months = pillars.map(function(mp){
    var mStemIdx = mp.ganji.stemIdx, mBranchIdx = mp.ganji.branchIdx;
    var seed = djb2((profile.name||'')+profile.id+year+mp.month);

    // (a) 월지-원국 합충 → 총운
    var monthRel = SajuEngine.branchRelations(branchList.concat([{idx:mBranchIdx}]));
    var newChung = monthRel.chung.length>baseRel.chung.length;
    var newHap = monthRel.hap.length>baseRel.hap.length || monthRel.samhap.length>baseRel.samhap.length;
    var totalTier = newChung?'chung':(newHap?'hap':'none');

    // (b) 월간-일간 십성 → 금전운(재성 여부)
    var monthSip = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[mStemIdx], SajuEngine.STEM_YY[mStemIdx]);
    var moneyTier = monthSip==='정재' ? 'jeongjae' : (monthSip==='편재' ? 'pyeonjae' : 'none');

    // (c) 오행-장부 → 건강운(그 달 지지 오행이 원국에서 가장 여린/진한 오행과 겹치는지)
    var monthElem = SajuEngine.BRANCH_ELEM[mBranchIdx];
    var healthText;
    if(monthElem === weakestElem){
      healthText = '이 달은 평소 여린 '+ELEMENTS[monthElem]+' 기운이 채워지는 시기라 '+ELEM_ORGAN[monthElem]+' 쪽 컨디션이 조금은 회복될 여지가 있습니다. 그래도 무리하지 않는 게 좋습니다.';
    } else if(monthElem === mostElem){
      healthText = '이 달은 원래도 진한 '+ELEMENTS[monthElem]+' 기운이 한층 더해지는 시기라 '+ELEM_ORGAN[monthElem]+' 쪽에 무리가 가기 쉬우니 평소보다 컨디션을 더 챙기는 게 좋습니다.';
    } else {
      healthText = '이 달은 '+ELEMENTS[monthElem]+' 기운이 두드러지는 시기라 '+ELEM_ORGAN[monthElem]+' 쪽을 평소보다 신경 써주면 좋습니다.';
    }
    healthText += ' (전통 오행 이론에 기반한 참고용 근사이며 의학적 진단이 아닙니다.)';

    var items = {
      total: { label:'총운', stars: 1+((seed+1)%5), text: seededPick(seed+1, MONTHLY_TOTAL_PHRASES[totalTier]) },
      love: { label:'애정운', stars: 1+((seed+2)%5), text: seededPick(seed+2, FORTUNE_PHRASES.love) },
      money: { label:'금전운', stars: 1+((seed+3)%5), text: seededPick(seed+3, MONTHLY_MONEY_PHRASES[moneyTier]) },
      work: { label:'학업·직장운', stars: 1+((seed+4)%5), text: seededPick(seed+4, FORTUNE_PHRASES.work) },
      health: { label:'건강운', stars: 1+((seed+5)%5), text: healthText }
    };
    return { month:mp.month, ganji:mp.ganji, items:items };
  });

  return { year:year, daeunIntro:daeunIntro, months:months };
}

/* =====================================================================
   궁합 계산 (v1 MBTI/띠/오행 + v2 사주 정밀 궁합)
===================================================================== */
function computeCompat(pA, pB){
  var mbti = MBTI_MATRIX[pA.mbti][pB.mbti];
  var elem = elementScore(pA.elementIdx, pB.elementIdx);
  var zod = zodiacScore(pA.zodiacIdx, pB.zodiacIdx);
  var total = Math.round(mbti*0.5 + elem*0.3 + zod*0.2);
  total = Math.max(1, Math.min(100, total));
  var tier = total>=85?'최상':total>=70?'좋음':total>=55?'무난':total>=40?'노력필요':'상극주의';
  var cats = buildCompatCategories(total, mbti, elem, zod, pA, pB);
  var saju = buildSajuCompat(pA, pB);
  var combined = Math.round(mbti*0.4 + saju.score*0.4 + elem*0.1 + zod*0.1);
  combined = Math.max(1, Math.min(100, combined));
  var combinedTier = combined>=85?'천생연분형':combined>=70?'찰떡궁합형':combined>=55?'무난동행형':combined>=40?'노력필요형':'인연신중형';
  return {total:total, tier:tier, mbtiScore:mbti, elemScore:elem, zodScore:zod, categories:cats,
    saju:saju, combined:combined, combinedTier:combinedTier};
}
function tierText(score, high, mid, low){
  if(score>=75) return high; if(score>=50) return mid; return low;
}
function buildCompatCategories(total, mbti, elem, zod, pA, pB){
  var love = tierText(total,
    '서로에게 자연스럽게 끌리는 좋은 흐름입니다. 표현에 솔직해질수록 관계가 깊어집니다.',
    '천천히 알아갈수록 매력이 드러나는 사이입니다. 서두르지 않는 편이 좋습니다.',
    '초반엔 결이 달라 보일 수 있지만, 서로의 차이를 인정하면 특별한 관계가 됩니다.');
  var friend = tierText((mbti+zod)/2,
    '함께 있으면 편안하고 대화가 끊이지 않는 조합입니다.',
    '관심사가 다를 수 있지만 서로에게 새로운 시야를 열어줍니다.',
    '가치관 차이로 부딪힐 수 있으니 서로의 방식을 존중해야 합니다.');
  var chemistry = tierText(mbti,
    '함께 있을 때 시너지가 크게 나는 케미입니다.',
    '합을 맞춰가는 과정 자체가 즐거운 조합입니다.',
    '처음엔 어색해도 시간이 지나며 합이 맞아갑니다.');
  var conflictParts=[];
  if(elem<60) conflictParts.push('두 사람의 기운이 부딪히기 쉬우니 감정이 격해질 때 한 박자 쉬어가세요.');
  if(mbti<60) conflictParts.push('성향 차이로 오해가 생기기 쉬우니 결론보다 과정을 자주 공유하세요.');
  if(zod<60) conflictParts.push('생활 리듬이나 속도 차이가 갈등의 씨앗이 될 수 있습니다.');
  if(conflictParts.length===0) conflictParts.push('큰 갈등 요소는 적지만, 사소한 습관 차이는 미리 이야기해두면 좋습니다.');
  return {love:love, friend:friend, chemistry:chemistry, conflict:conflictParts.join(' ')};
}
/* v2: 사주 정밀 궁합 — 두 사람의 일간 오행 상생상극 + 일지 합충 + 십성 상호작용 */
function buildSajuCompat(pA, pB){
  if(!pA.saju || !pB.saju) return {score:60, elemRel:'정보 부족', branchRel:'정보 부족', comment:'두 사람 모두 사주 계산이 준비되면 더 정밀한 궁합을 볼 수 있습니다.'};
  var aElem = SajuEngine.STEM_ELEM[pA.saju.day.stemIdx], bElem = SajuEngine.STEM_ELEM[pB.saju.day.stemIdx];
  var diff = ((bElem-aElem)%5+5)%5;
  var elemScore60, elemRel;
  if(diff===0){ elemScore60=70; elemRel='비화(같은 기운) — 편하지만 닮은 단점도 함께 보일 수 있습니다'; }
  else if(diff===1){ elemScore60=95; elemRel='상생(내가 상대를 북돋는 관계) — 서로를 자연스럽게 살려주는 흐름입니다'; }
  else if(diff===4){ elemScore60=90; elemRel='상생(상대가 나를 북돋는 관계) — 기대지 않아도 자연스럽게 도움을 주고받습니다'; }
  else { elemScore60=45; elemRel='상극(서로 부딪히는 기운) — 자극이 되기도 하지만 의식적으로 배려가 필요합니다'; }
  var relBranch = SajuEngine.branchRelations([{idx:pA.saju.day.branchIdx},{idx:pB.saju.day.branchIdx}]);
  var branchScore, branchRel;
  if(relBranch.hap.length>0){ branchScore=90; branchRel='일지 육합 — 생활 리듬이 잘 맞는 편입니다'; }
  else if(relBranch.chung.length>0){ branchScore=40; branchRel='일지 충 — 서로 다른 리듬 탓에 부딪히는 순간이 잦을 수 있습니다'; }
  else { branchScore=65; branchRel='특별한 합충 없음 — 무난하게 맞춰가는 관계입니다'; }
  var score = Math.round(elemScore60*0.6 + branchScore*0.4);
  var sipA = SajuEngine.sipseongOf(pA.saju.day.stemIdx, bElem, SajuEngine.STEM_YY[pB.saju.day.stemIdx]);
  var comment = sipA+' 관계에 가까워서, '+groupCategory(sipA)+' 기운으로 서로를 자극하거나 채워주는 조합입니다.';
  return {score:score, elemRel:elemRel, branchRel:branchRel, comment:comment};
}

function setRoute(route){
  ROUTE = route;
  $all('.tab-btn').forEach(function(b){
    var on=b.dataset.route===route;
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  render();
  var main=$('#main'); main.focus();
}
function updateHeader(){
  var header=$('#appHeader'), tabbar=$('#tabbarWrap');
  var hasProfiles = STATE.profiles.length>0;
  header.hidden = !hasProfiles;
  tabbar.hidden = !hasProfiles;
  if(!hasProfiles) return;
  var sw=$('#profileSwitch');
  sw.innerHTML='';
  var select=el('select',{'aria-label':'활성 프로필 선택', onchange:function(e){
    STATE.activeId = e.target.value; saveState(); render();
  }});
  STATE.profiles.forEach(function(p){
    var opt=el('option',{value:p.id},[p.name]);
    if(p.id===STATE.activeId) opt.setAttribute('selected','selected');
    select.appendChild(opt);
  });
  sw.appendChild(select);
}

function svgIcon(pathD, cls){
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox','0 0 20 20'); svg.setAttribute('class',cls||'sec-icon'); svg.setAttribute('aria-hidden','true');
  var p=document.createElementNS(ns,'path'); p.setAttribute('d',safeIconPath(pathD)); p.setAttribute('fill','none'); p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','1.4'); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  svg.appendChild(p);
  return svg;
}
/* v4-A 신규: 원형 도넛 게이지 — 기존 텍스트형 .gauge-num을 대체. 계산값(score)은 그대로, 표시 방식만 SVG 원형으로 교체.
   1:1 궁합 요약(기능10)·그룹 궁합 네트워크 평균 게이지(기능17)에서 공용으로 재사용한다. */
var DONUT_GRAD_ID = 'donutGoldGrad';
function buildDonutGauge(score, size, label){
  size = size || 148;
  score = Math.max(0, Math.min(100, Math.round(score)));
  var stroke = Math.round(size*0.075);
  var r = (size - stroke)/2;
  var c = size/2;
  var circumference = 2*Math.PI*r;
  var offset = circumference * (1 - score/100);
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+size+' '+size);
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  svg.setAttribute('role','img'); svg.setAttribute('aria-label','점수 '+score+'점');
  var defs=document.createElementNS(ns,'defs');
  var grad=document.createElementNS(ns,'linearGradient'); grad.setAttribute('id',DONUT_GRAD_ID);
  grad.setAttribute('x1','0%'); grad.setAttribute('y1','0%'); grad.setAttribute('x2','100%'); grad.setAttribute('y2','100%');
  var s1=document.createElementNS(ns,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#D4AF37');
  var s2=document.createElementNS(ns,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#F1C94A');
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad); svg.appendChild(defs);
  var track=document.createElementNS(ns,'circle');
  track.setAttribute('cx',c); track.setAttribute('cy',c); track.setAttribute('r',r);
  track.setAttribute('fill','none'); track.setAttribute('stroke','rgba(255,255,255,.08)'); track.setAttribute('stroke-width',stroke);
  svg.appendChild(track);
  var fg=document.createElementNS(ns,'circle');
  fg.setAttribute('cx',c); fg.setAttribute('cy',c); fg.setAttribute('r',r);
  fg.setAttribute('fill','none'); fg.setAttribute('stroke','url(#'+DONUT_GRAD_ID+')'); fg.setAttribute('stroke-width',stroke);
  fg.setAttribute('stroke-linecap','round');
  fg.setAttribute('stroke-dasharray', circumference.toFixed(2));
  fg.setAttribute('stroke-dashoffset', offset.toFixed(2));
  fg.setAttribute('transform','rotate(-90 '+c+' '+c+')');
  fg.setAttribute('class','stamp-in');
  svg.appendChild(fg);
  var wrap=el('div',{class:'donut-gauge', style:'width:'+size+'px;height:'+size+'px;'});
  wrap.appendChild(svg);
  var numHtml = score+'점'+(label?('<small>'+escapeHtml(label)+'</small>'):'');
  wrap.appendChild(el('div',{class:'donut-gauge-num', html:numHtml}));
  return wrap;
}
/* v4-A 신규: row + chevron 리스트 아이템 — 값을 고르고 확인하는 화면(설정/궁합 입력/사주 정보 입력)
   전반에서 재사용. 탭하면 바텀시트형 모달(기존 openModal 재사용)로 실제 선택 UI를 띄운다. */
function settingsRow(label, value, onOpen){
  return el('button',{type:'button', class:'settings-row', onclick:onOpen},[
    el('span',{class:'sr-label'},[label]),
    el('span',{class:'sr-value-wrap'},[
      el('span',{class:'sr-value'},[value]),
      el('span',{class:'sr-chevron','aria-hidden':'true'},['›'])
    ])
  ]);
}
/* v4-A 신규: 바텀시트형 모달(기존 openModal/.modal-box 재사용) — settingsRow를 탭하면 이 함수로 실제 선택 UI를 띄운다.
   bodyBuilder(reopen)는 매번 최신 상태를 읽어 시트 내용을 새로 그리므로, 시트 안의 컨트롤이 state를 바꾼 뒤
   reopen()을 호출하면 같은 시트가 최신 상태로 다시 그려진다(선택 표시 등 동기화). 상태·검증 로직은 전혀 건드리지 않는다. */
function openRowSheet(title, bodyBuilder){
  function reopen(){
    openModal(title, bodyBuilder(reopen), [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
  }

function buildConstellationSvg(){
  var pts=[[30,110],[70,40],[140,25],[200,60],[230,130],[180,190],[100,180]];
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 260 220'); svg.setAttribute('class','constellation'); svg.setAttribute('aria-hidden','true');
  for(var i=0;i<pts.length-1;i++){
    var line=document.createElementNS(ns,'line');
    line.setAttribute('x1',pts[i][0]); line.setAttribute('y1',pts[i][1]);
    line.setAttribute('x2',pts[i+1][0]); line.setAttribute('y2',pts[i+1][1]);
    line.style.animationDelay=(i*0.18)+'s';
    svg.appendChild(line);
  }
  pts.forEach(function(p,i){
    var c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r',4);
    c.style.animationDelay=(i*0.18+0.15)+'s';
    svg.appendChild(c);
  });
  return svg;
}

function buildPillarTable(saju){
  var cols = saju.hour ? ['hour','day','month','year'] : ['day','month','year'];
  var labelMap = {year:'연주', month:'월주', day:'일주', hour:'시주'};
  var table=el('div',{class:'pillar-table', style:'--cols:'+cols.length+';'});
  cols.forEach(function(pos){
    var g=saju[pos];
    var col=el('div',{class:'pillar-col'});
    col.appendChild(el('div',{class:'col-label'},[labelMap[pos]]));
    var stemSeal=el('div',{class:'pillar-seal elem-'+SajuEngine.STEM_ELEM[g.stemIdx]});
    stemSeal.appendChild(el('div',{class:'ch'},[g.stem]));
    stemSeal.appendChild(el('div',{class:'ch-h'},[g.stemH]));
    var branchSeal=el('div',{class:'pillar-seal elem-'+SajuEngine.BRANCH_ELEM[g.branchIdx]});
    branchSeal.appendChild(el('div',{class:'ch'},[g.branch]));
    branchSeal.appendChild(el('div',{class:'ch-h'},[g.branchH]));
    col.appendChild(stemSeal);
    col.appendChild(branchSeal);
    table.appendChild(col);
  });
  var scrollWrap = el('div',{class:'pillar-table-scroll'},[table]);
  if(!saju.hour){
    var note=el('p',{class:'section-sub'},['시간을 몰라서 시주는 계산에서 제외했어요.']);
    var wrap=el('div',{},[scrollWrap,note]);
    return wrap;
  }
  return scrollWrap;
}

function buildStars(n){
  var wrap=el('div',{class:'stars','aria-label':n+'점 만점에 5점 중 '+n+'점'});
  for(var i=1;i<=5;i++){
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox','0 0 20 20'); svg.setAttribute('class','star'+(i<=n?' on':'')); svg.setAttribute('aria-hidden','true');
    var path=document.createElementNS(ns,'path'); path.setAttribute('d','M10 1l2.6 5.9 6.4.6-4.8 4.3 1.5 6.2L10 14.9 4.3 18l1.5-6.2L1 7.5l6.4-.6z'); path.setAttribute('fill','currentColor');
    svg.appendChild(path); wrap.appendChild(svg);
  }
  return wrap;
}

function submitCompat(){
  var p=activeProfile();
  var pSaju = getSajuResult(p);
  var pA = {mbti:p.mbti, elementIdx:p.elementIdx, zodiacIdx:p.zodiacIdx, name:p.name, element:p.element, zodiac:p.zodiac, saju:pSaju, gender:p.gender};
  var y=COMPAT_DRAFT.year, m=COMPAT_DRAFT.month, d=COMPAT_DRAFT.day;
  if(COMPAT_DRAFT.calendarType==='lunar'){
    var solar=SajuEngine.lunarToSolar(y,m,d,COMPAT_DRAFT.lunarLeap);
    if(solar){ y=solar.year; m=solar.month; d=solar.day; }
  }
  var bSaju = SajuEngine.computeSaju(y,m, d, COMPAT_DRAFT.timeUnknown?null:COMPAT_DRAFT.hour, COMPAT_DRAFT.timeUnknown?0:COMPAT_DRAFT.minute);
  var bElemInfo = dominantElementIdx(bSaju);
  var legacyZ = calcZodiac(y);
  var pB = {mbti:COMPAT_DRAFT.mbti, elementIdx:bElemInfo.idx, zodiacIdx:legacyZ.idx, name:(COMPAT_DRAFT.name||'상대방').slice(0,20),
    element:ELEMENTS[bElemInfo.idx], zodiac:legacyZ.name, saju:bSaju, gender:COMPAT_DRAFT.gender};
  var res = computeCompat(pA, pB);
  COMPAT_DRAFT.result = {pA:pA, pB:pB, res:res};
  COMPAT_SUB = null;
  var histEntry = {id:uid(), date:todayStr(), profileId:p.id, partnerName:pB.name, partnerMbti:pB.mbti, score:res.combined, tier:res.combinedTier, pA:pA, pB:pB, res:res};
  STATE.compatHistory.unshift(histEntry);
  if(STATE.compatHistory.length>200) STATE.compatHistory.length=200;
  saveState();
  render();
}

    box.appendChild(relCard);
  }
  return box;
}
function buildCoupleRelationSvg(sajuA, sajuB){
  var ns='http://www.w3.org/2000/svg';
  var branchesA = sajuA.hour? ['year','month','day','hour'] : ['year','month','day'];
  var branchesB = sajuB.hour? ['year','month','day','hour'] : ['year','month','day'];
  var w=300, h=120;
  var svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox','0 0 '+w+' '+h); svg.setAttribute('width','100%'); svg.setAttribute('height',h); svg.setAttribute('role','img');
  var title=document.createElementNS(ns,'title'); title.textContent='두 사람 사주 지지 합충선'; svg.appendChild(title);
  var stepA = w/(branchesA.length+1), stepB = w/(branchesB.length+1);
  function ptA(i){ return [stepA*(i+1), 20]; }
  function ptB(i){ return [stepB*(i+1), h-20]; }
  branchesA.forEach(function(pos,i){
    var xy=ptA(i);
    var c=document.createElementNS(ns,'circle'); c.setAttribute('cx',xy[0]); c.setAttribute('cy',xy[1]); c.setAttribute('r','14'); c.setAttribute('fill','rgba(201,169,97,.18)'); c.setAttribute('stroke','var(--pA)');
    svg.appendChild(c);
    var t=document.createElementNS(ns,'text'); t.setAttribute('x',xy[0]); t.setAttribute('y',xy[1]+4); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','11'); t.setAttribute('fill','#ece4d3'); t.textContent=sajuA[pos].branch;
    svg.appendChild(t);
  });
  branchesB.forEach(function(pos,i){
    var xy=ptB(i);
    var c=document.createElementNS(ns,'circle'); c.setAttribute('cx',xy[0]); c.setAttribute('cy',xy[1]); c.setAttribute('r','14'); c.setAttribute('fill','rgba(233,79,55,.14)'); c.setAttribute('stroke','var(--pB)');
    svg.appendChild(c);
    var t=document.createElementNS(ns,'text'); t.setAttribute('x',xy[0]); t.setAttribute('y',xy[1]+4); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','11'); t.setAttribute('fill','#ece4d3'); t.textContent=sajuB[pos].branch;
    svg.appendChild(t);
  });
  branchesA.forEach(function(posA,i){
    branchesB.forEach(function(posB,j){
      var relSet = SajuEngine.branchRelations([{idx:sajuA[posA].branchIdx},{idx:sajuB[posB].branchIdx}]);
      var color = relSet.hap.length>0 ? '#9fc28c' : (relSet.chung.length>0 ? '#f0846f' : null);
      if(color){
        var a=ptA(i), b=ptB(j);
        var line=document.createElementNS(ns,'line'); line.setAttribute('x1',a[0]); line.setAttribute('y1',a[1]); line.setAttribute('x2',b[0]); line.setAttribute('y2',b[1]); line.setAttribute('stroke',color); line.setAttribute('stroke-width','1.6'); line.setAttribute('opacity','.8');
        svg.appendChild(line);
      }
    });
  });
  var wrap=el('div',{style:'overflow-x:auto;'},[svg]);
  var legend=el('div',{class:'legend', style:'margin-top:8px;'},[
    el('span',{},[el('span',{class:'dot',style:'background:#9fc28c'}),'합']),
    el('span',{},[el('span',{class:'dot',style:'background:#f0846f'}),'충'])
  ]);
  var outer=el('div',{},[wrap,legend]);
  return outer;
}
function buildKnotSvg(){
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox','0 0 300 90'); svg.setAttribute('width','260'); svg.setAttribute('height','78'); svg.setAttribute('aria-hidden','true');
  var wrap=el('div',{class:'knot-wrap'});

  var pathB=document.createElementNS(ns,'path');

  pathB.style.animationDelay='.15s';
  svg.appendChild(pathA); svg.appendChild(pathB);
