/* 무료로 보여줄 섹션 수. 이 값이 "맛보기"의 크기다.
   너무 적으면 서비스 가치를 못 느끼고, 너무 많으면 결제할 이유가 없어진다. */
var FREE_SECTION_COUNT = 3;

/* =====================================================================
   R13 — 월별 운세 상세 · 대운 상세의 무료/유료 경계.
   ---------------------------------------------------------------------
   두 화면은 사주 풀이 13섹션의 10~12번(지나온/현재/다가올 대운)과 내용이 겹친다.
   무료로 열어두면 돈을 낸 사람이 새로 얻는 것이 그만큼 줄어들므로 saju_full에 포함시켰다.

   경계는 사주 풀이(앞 3섹션 무료 → 4번째부터 잠금)와 같은 사상으로 잡는다.
     무료 — 목록과 요약 지표. 월별 12개 타일(월·간지·총운 별점), 대운 타임라인(나이·간지·십성),
            그리고 올해를 지나는 큰 흐름 한 줄. 전부 잠그면 무엇을 사는지 알 수 없어 전환이 죽는다.
     무료 미리보기 1개 — "지금 지나는 구간"의 상세는 열어 둔다(현재 월 1개 · 현재 대운 1개).
            사는 물건을 실물로 한 번 보여주는 자리다. 13섹션이 앞 3섹션을 여는 것과 같은 논리.
     유료 — 나머지 구간의 상세 본문.

   ★ 잠긴 상세는 CSS로 가리지 않는다. 애초에 문장을 만들지 않고 DOM에도 넣지 않는다.
     (buildMonthlyFortune은 잠긴 달의 items를 null로 돌려주고, 대운 상세는 클릭 시점에 만든다.)
===================================================================== */
function sajuDetailUnlocked(){ return hasAccess(PRODUCTS.saju_full.id); }
/* 무료로 열어둘 "현재 구간"이 몇 월인지. 올해가 아니면 미리보기 없음(0). */
function monthlyPreviewMonth(year){
  var now = new Date();
  return (now.getFullYear() === year) ? (now.getMonth() + 1) : 0;
}

function defaultEntitlements(){ return { items:{}, pass:null, purchases:[] }; }

/* =====================================================================
   권한(이용권)의 단일 출처.
   ---------------------------------------------------------------------
   화면의 모든 잠금 판정은 여기 담긴 ENT.data 하나만 본다.
   localStorage를 직접 읽어 잠금을 판단하는 곳은 이 파일 어디에도 없다 —
   서버가 붙는 순간 그런 곳이 하나라도 남아 있으면 배선 전체가 무의미해지기 때문이다.

     mode 'server' : ENT.data = 서버 응답. localStorage 값은 완전히 무시된다.
     mode 'trial'  : ENT.data = 이 브라우저의 localStorage. 실제 결제가 아닌 체험 모드.
===================================================================== */
var ENT = { mode:'trial', ready:false, error:null, data: defaultEntitlements() };

/* 체험 모드에서만 쓰는 로컬 저장본. 서버 모드에서는 이 함수가 호출되지 않는다. */
function localTrialEntitlements(){
  if(!STATE.entitlements) STATE.entitlements = defaultEntitlements();
  var e = STATE.entitlements;
  if(!e.items) e.items = {};
  if(!e.purchases) e.purchases = [];
  return e;
}
/* 서버 응답을 앱이 쓰는 모양으로 맞춘다. 모르는 필드는 버리고, 빠진 필드는 잠금 쪽 기본값으로 채운다. */
function normalizeEntitlements(raw){
  var out = defaultEntitlements();
  if(!raw || typeof raw !== 'object') return out;
  if(raw.items && typeof raw.items === 'object'){
    for(var k in raw.items){ if(PRODUCTS[k]) out.items[k] = { purchasedAt: Number(raw.items[k] && raw.items[k].purchasedAt) || Date.now() }; }
  }
  if(raw.pass && raw.pass.expiresAt){
    out.pass = { productId: raw.pass.productId || 'premium_pass',
                 purchasedAt: Number(raw.pass.purchasedAt) || Date.now(),
                 expiresAt: Number(raw.pass.expiresAt) || 0 };
  }
  if(Array.isArray(raw.purchases)){
    out.purchases = raw.purchases.filter(function(p){ return p && PRODUCTS[p.productId]; }).map(function(p){
      return { productId:p.productId, at:Number(p.at)||0, price:Number(p.price)||PRODUCTS[p.productId].price,
               provider:'server', receiptId:p.receiptId||null };
    });
  }
  return out;
}

/* =====================================================================
   관리자 테스트 콘솔의 "서버 응답 시뮬레이션".
   ---------------------------------------------------------------------
   ★ 가로채는 대상은 ADMIN_SIM_PREFIX로 시작하는 가짜 주소뿐이다.
     실제 서버 주소로 나가는 요청은 관리자 모드에서도 절대 가로채지 않는다 —
     진짜 서버가 붙어 있으면 화면에 반영되는 답은 언제나 진짜 서버의 것이어야 한다.
   ADMIN_KEY가 null이면 첫 줄에서 바로 빠져나가므로 이 함수는 아무 일도 하지 않는다.
===================================================================== */
function adminSimResponse(url, payload){
  if(!adminOn()) return null;
  var u = String(url == null ? '' : url);
  if(u.indexOf(ADMIN_SIM_PREFIX) !== 0) return null;
  var channel = u.slice(ADMIN_SIM_PREFIX.length);
  var mode = ADMIN_SIM[channel === 'entitlements' ? 'ent' : channel];
  if(!mode) return null;
  var body = payload || {};

  /* 실제 fetch와 "같은 모양의 실패"를 만든다. 호출부가 구분하지 못해야 재현이 의미가 있다. */
  function fail(msg){ return Promise.reject(new Error(msg)); }
  function later(ms, make){
    return new Promise(function(resolve){ trackTimeout(function(){ resolve(make()); }, ms); });
  }
  function slowFail(ms, msg){
    return new Promise(function(_, reject){ trackTimeout(function(){ reject(new Error(msg)); }, ms); });
  }
  if(mode === 'http4')   return fail('서버 응답 오류 (HTTP 403)');
  if(mode === 'http5')   return fail('서버 응답 오류 (HTTP 500)');
  /* 실제 타임아웃은 BILLING.timeoutMs(기본 10초)지만, 테스트에서 10초를 기다리게 하지 않는다.
     던지는 오류 메시지는 실제 경로와 글자까지 같다. */
  if(mode === 'timeout') return slowFail(1200, '서버 응답 시간이 초과되었습니다.');

  if(channel === 'entitlements'){
    if(mode === 'malformed') return later(120, function(){ return {items:'형식오류', pass:'형식오류'}; });
    if(mode === 'deny')      return later(120, function(){ return {items:{}, pass:null, purchases:[]}; });
    /* grant — 관리자가 부여 목록에 올린 것을 "서버가 승인했다"고 답한다. */
    return later(140, function(){
      var items = {}, pass = null, purchases = [];
      for(var k in ADMIN_GRANTS){
        if(!ADMIN_GRANTS[k] || !PRODUCTS[k]) continue;
        if(k === 'premium_pass'){
          pass = { productId:'premium_pass', purchasedAt:Date.now(),
                   expiresAt: Date.now() + PRODUCTS.premium_pass.days*86400000 };
        } else {
          items[k] = { purchasedAt: Date.now() };
        }
        purchases.push({ productId:k, at:Date.now(), price:PRODUCTS[k].price, receiptId:null });
      }
      return {items:items, pass:pass, purchases:purchases};
    });
  }
  if(channel === 'content'){
    if(mode === 'malformed') return later(150, function(){ return {sections:'형식오류'}; });
    return later(220, function(){
      var secs = [];
      for(var i=FREE_SECTION_COUNT;i<13;i++){
        secs.push({
          id:'adminsim'+(i+1),
          title:'섹션 '+(i+1)+' · 관리자 시뮬레이션',
          icon:'M4 18 L10 6 L16 18',
          paragraphs:[
            '[관리자 테스트 모드] 이 문단은 시뮬레이션 서버가 내려준 예시 본문입니다. 실제 해석이 아닙니다.',
            '{{name}} — 서버는 이 자리에 {{name}} 이라고만 적어 보내고, 닉네임은 이 브라우저가 채워 넣습니다.'
          ]
        });
      }
      return {sections:secs};
    });
  }
  if(channel === 'verify'){
    if(mode === 'malformed') return later(120, function(){ return {}; });
    if(mode === 'reject')    return later(120, function(){ return {verified:false, reason:'[관리자 시뮬레이션] 이 번호로 확인된 구매 내역이 없습니다.'}; });
    var rid  = String(body.receiptId == null ? '' : body.receiptId).trim();
    var prod = ADMIN_SIM.receipts[rid];
    if(!prod){
      return later(120, function(){
        return {verified:false, reason:'[관리자 시뮬레이션] 이 번호로 발급된 영수증이 없습니다. 결제 흐름 리허설로 번호를 먼저 발급하세요.'};
      });
    }
    /* 서버가 이 구매를 "지금 세션에 다시 연결"한 상황을 재현한다 —
       재연결을 하지 않으면 곧이어 나가는 이용권 조회가 여전히 빈 값을 돌려주기 때문이다. */
    ADMIN_GRANTS[prod] = true; saveAdminGrants(); ADMIN_SIM.ent = 'grant';
    return later(160, function(){ return {verified:true, restored:true, productIds:[prod], reason:''}; });
  }
  if(channel === 'checkout'){
    if(mode === 'malformed') return later(150, function(){ return {}; });
    var pid = body.productId;
    if(!PRODUCTS[pid]) return fail('[관리자 시뮬레이션] 알 수 없는 상품입니다.');
    var newId = 'ADMIN-SIM-' + Date.now().toString(36).toUpperCase();
    ADMIN_SIM.receipts[newId] = pid;
    ADMIN_GRANTS[pid] = true; saveAdminGrants(); ADMIN_SIM.ent = 'grant';
    return later(220, function(){ return {granted:true, receiptId:newId}; });
  }
  return null;
}

/* 결제 서버에 보내는 JSON 요청 공통 처리. 타임아웃이 반드시 걸린다.
   실패는 전부 throw로 올라가고, 호출부는 예외 없이 "잠금"으로 되돌린다. */
function billingFetchJson(url, payload){
  /* 관리자 시뮬레이션 주소로 나가는 요청만 여기서 가로챈다(실제 주소는 그대로 네트워크로 나간다). */
  var simulated = adminSimResponse(url, payload);
  if(simulated) return simulated;
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, BILLING.timeoutMs) : null;
  function done(){ if(timer) clearTimeout(timer); }
  return fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body: JSON.stringify(payload || {}),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(res){
    done();
    if(!res.ok) throw new Error('서버 응답 오류 (HTTP '+res.status+')');
    return res.json();
  }).catch(function(err){
    done();
    throw (err && err.name === 'AbortError') ? new Error('서버 응답 시간이 초과되었습니다.') : err;
  });
}

/* 부팅 직후 첫 화면을 그리기 전에 동기적으로 한 번 채운다.
   서버 모드라면 조회가 끝나기 전까지는 '잠금'이 기본값이다 — 열어두고 나중에 닫으면 이미 늦다. */
function primeEntitlements(){
  if(serverAuthoritative()){
    ENT.mode = 'server'; ENT.ready = false; ENT.error = null;
    ENT.data = defaultEntitlements();
  } else {
    ENT.mode = 'trial'; ENT.ready = true; ENT.error = null;
    ENT.data = localTrialEntitlements();
  }
}

/* 권한 조회 — 잠금 판정에 쓰이는 값은 전부 이 함수를 거쳐서만 갱신된다.
   서버 계약은 파일 상단 BILLING 주석 참조. */
async function fetchEntitlements(){
  if(!serverAuthoritative()){
    ENT.mode = 'trial'; ENT.error = null;
    ENT.data = localTrialEntitlements();
    ENT.ready = true;
    return ENT.data;
  }
  ENT.mode = 'server';
  try{
    var data = await billingFetchJson(BILLING.entitlementEndpoint, { kind:'entitlements' });
    ENT.data = normalizeEntitlements(data);
    ENT.error = null;
  }catch(err){
    /* 서버가 답하지 않으면 잠근다. 열어주는 쪽으로 실패하지 않는다. */
    ENT.data = defaultEntitlements();
    ENT.error = (err && err.message) || String(err);
  }
  ENT.ready = true;
  return ENT.data;
}

/* 결제창에서 돌아왔을 때 영수증 1건을 서버에 검증시킨다(URL에 ?receipt=... 가 있을 때만).
   검증에 성공해도 권한을 직접 부여하지 않는다 — 다시 fetchEntitlements()로 서버 값을 받아온다.
   ★ intent:'return' 을 함께 보내, 아래 복원 요청(intent:'restore')과 서버가 구분할 수 있게 한다. */
var RECEIPT_FROM_URL = null; /* 결제창에서 돌아오며 검증에 성공한 영수증 번호(부팅 후 1회 안내에 쓴다) */
async function verifyReceiptFromUrl(){
  if(!BILLING.verifyEndpoint) return false;
  var m = /(?:^|[?&])receipt=([^&]+)/.exec(location.search);
  if(!m) return false;
  var receiptId = decodeURIComponent(m[1]);
  var productId = (/(?:^|[?&])product=([^&]+)/.exec(location.search) || [])[1];
  try{
    var res = await billingFetchJson(BILLING.verifyEndpoint, {
      receiptId: receiptId, productId: productId ? decodeURIComponent(productId) : null,
      intent: 'return'
    });
    if(res && res.verified){ RECEIPT_FROM_URL = receiptId; rememberReceipt(receiptId); }
    return !!(res && res.verified);
  }catch(e){
    console.warn('영수증 검증 실패', e);
    return false;
  }
}

/* =====================================================================
   구매 복원 (영수증 번호로 이용권 되찾기)
   ---------------------------------------------------------------------
   이 앱에는 로그인이 없다. 서버 권위 모드에서 이용권은 서버에 있고 이용자는 쿠키로만 식별된다.
   그래서 브라우저 저장소를 지우거나 시크릿 창을 쓰거나 기기를 바꾸면, 서버는 이 사람이
   방금 결제한 그 사람인지 알 수 없다. 되찾을 유일한 열쇠가 영수증 번호다.

   ★ 열쇠가 있다는 사실만으로는 부족하다. 결제 직후에 그 번호를 보여주고 "저장해 두라"고
     말해주지 않으면, 정작 필요할 때 이용자 손에 아무것도 남아 있지 않다.
     그래서 이 파일은 세 지점에서 같은 번호를 다룬다.
       ① 결제 성공 직후 / 결제창에서 돌아온 직후 → openReceiptSavedModal()로 번호를 보여주고 복사 안내
       ② 설정 → 이용권 → "구매 내역 복원" → openRestoreModal()로 번호를 입력받아 복원
       ③ 설정 → 이용권 패널에 이 브라우저가 기억하는 번호를 나열(메모일 뿐, 권한의 근거가 아니다)

   클라이언트가 할 수 있는 일은 여기까지다. "이 영수증을 지금 이 쿠키 세션에 다시 연결하는 것"은
   서버만 할 수 있다 — 서버가 지켜야 할 규격은 파일 상단 BILLING 주석 3) 항목과
   설정 → 결제 연동 → "서버가 지켜야 할 형식 보기"에 같은 내용으로 적혀 있다.
===================================================================== */
var RECEIPT_MEMO_MAX = 10;
/* 영수증 번호를 이 브라우저에 메모해 둔다. 잠금 판정에는 절대 쓰지 않는다. */
function rememberReceipt(receiptId){
  var id = String(receiptId==null?'':receiptId).trim();
  if(!id) return;
  if(!Array.isArray(STATE.receiptMemos)) STATE.receiptMemos = [];
  STATE.receiptMemos = STATE.receiptMemos.filter(function(x){ return x && x.id !== id; });
  STATE.receiptMemos.unshift({ id:id, at:Date.now() });
  if(STATE.receiptMemos.length > RECEIPT_MEMO_MAX) STATE.receiptMemos.length = RECEIPT_MEMO_MAX;
  saveState();
}
function receiptMemos(){ return Array.isArray(STATE.receiptMemos) ? STATE.receiptMemos : []; }
/* 지금 이 상태에서 복원이 동작할 수 있는지. 안 되면 왜 안 되는지까지 돌려준다
   (버튼만 띄워두고 눌러도 아무 일 없는 화면이 제일 나쁘다). */
function restoreAvailability(){
  if(localEntitlementMode()){
    return { ok:false, reason:'이 기기에 저장되는 체험 이용권이라 복원할 서버가 없습니다. 이용권 조회 서버가 연결된 뒤부터 복원을 쓸 수 있습니다.' };
  }
  if(!BILLING.verifyEndpoint){
    return { ok:false, reason:'영수증 검증 주소(verifyEndpoint)가 연결되지 않아 복원 요청을 보낼 곳이 없습니다.' };
  }
  return { ok:true, reason:'' };
}
/* 영수증 번호 1건으로 복원을 시도한다.
   ★ 성공 판단은 전적으로 서버 몫이다. 클라이언트는 verified가 true여도 스스로 권한을 주지 않고,
     곧바로 fetchEntitlements()로 서버가 인정한 결과만 다시 받아온다.
     실패하면 아무것도 바꾸지 않는다 — 잠금은 잠금인 채로 남는다. */
function restorePurchase(receiptId){
  var av = restoreAvailability();
  if(!av.ok) return Promise.reject(new Error(av.reason));
  var id = String(receiptId==null?'':receiptId).trim();
  if(!id) return Promise.reject(new Error('영수증 번호를 입력해 주세요.'));
  if(id.length > 200) return Promise.reject(new Error('영수증 번호가 너무 깁니다. 다시 확인해 주세요.'));
  return billingFetchJson(BILLING.verifyEndpoint, { receiptId:id, productId:null, intent:'restore' })
    .then(function(res){
      if(!(res && res.verified)){
        throw new Error((res && res.reason) || '이 번호로 확인된 구매 내역이 없습니다. 번호를 다시 확인해 주세요.');
      }
      /* 서버가 이 영수증을 현재 세션에 다시 연결했다면, 이용권 재조회에서 그 결과가 나와야 한다. */
      return fetchEntitlements().then(function(){
        rememberReceipt(id);
        var e = entitlements();
        var opened = passActive() || Object.keys(e.items).length > 0;
        return { opened:opened, restored:!!res.restored, productIds:Array.isArray(res.productIds)?res.productIds:null };
      });
    });
}

/* 화면이 잠금을 판단할 때 보는 유일한 값. */
function entitlements(){ return ENT.data; }

/* 실제로 구매(또는 서버가 인정)된 전체 이용권. 관리자 부여는 여기 섞지 않는다 —
   남은 일수 표시처럼 "실제 구매"에만 뜻이 있는 값이 거짓이 되기 때문이다. */
function realPassActive(){
  var e = entitlements();
  return !!(e.pass && e.pass.expiresAt && e.pass.expiresAt > Date.now());
}
function passActive(){ return realPassActive() || adminPassActive(); }

/* 특정 상품에 대한 접근 권한이 있는지. 전체 이용권이 살아 있으면 개별 상품도 모두 열린다.
   ★ localStorage를 직접 보지 않는다. 서버 모드에서는 ENT.data가 곧 서버 응답이다.
   ★ adminGranted()는 서버 권위 모드에서 항상 false다(관리자가 서버 판정을 이길 수 없다). */
function hasAccess(productId){
  if(adminGranted(productId)) return true;
  if(passActive()) return true;
  return !!entitlements().items[productId];
}

function passRemainingDays(){
  var e = entitlements();
  if(!realPassActive()) return 0;
  return Math.max(1, Math.ceil((e.pass.expiresAt - Date.now())/86400000));
}

/* 체험 모드에서만 쓰는 로컬 지급. 서버 모드에서는 절대 호출되지 않는다
   (서버 모드의 권한은 오직 fetchEntitlements()가 받아온 값이다). */
function grantProductLocally(productId, receipt){
  if(serverAuthoritative()){ console.warn('서버 모드에서는 클라이언트가 권한을 부여하지 않습니다.'); return; }
  var e = localTrialEntitlements();
  var prod = PRODUCTS[productId];
  if(!prod) return;
  if(prod.kind === 'pass'){
    var base = (e.pass && e.pass.expiresAt > Date.now()) ? e.pass.expiresAt : Date.now();
    e.pass = { productId:productId, purchasedAt:Date.now(), expiresAt: base + prod.days*86400000 };
  } else {
    e.items[productId] = { purchasedAt:Date.now() };
  }
  e.purchases.push({
    productId:productId, at:Date.now(), price:prod.price,
    provider:(receipt && receipt.provider) || 'trial',
    receiptId:(receipt && receipt.receiptId) || null
  });
  saveState();
  ENT.data = e; /* 체험 모드에서도 판정은 ENT를 거친다 */
}

/* =====================================================================
   유료 콘텐츠 본문 취득.
   ---------------------------------------------------------------------
   서버(contentEndpoint)가 연결돼 있으면 본문을 서버에서 받아온다.
   즉 미결제자는 애초에 본문을 손에 넣을 수 없다(원리적으로 우회 불가).
   서버가 없으면 지금까지처럼 클라이언트가 만든 로컬 섹션을 그대로 쓴다.

   나중에 서버가 생기면 "이 함수 안"만 바뀌고 렌더링 코드는 그대로다.
   반환: 섹션 배열 [{id,title,icon,paragraphs?,body?,untrusted:true}] 또는 null(서버 미연결/실패)
===================================================================== */
/* ★ 회사 서버(contentEndpoint)로 나가는 payload는 "허용 목록"으로 다시 만든다.
   본문을 쓰는 데 실제로 필요한 값만 남기고, 닉네임과 생년월일·태어난 시각 원본은 보내지 않는다.
   (개인정보처리방침 §2 ④에 적힌 목록이 바로 이 함수가 만들어내는 항목이다.
    새 항목을 추가하려면 처리방침을 함께 고쳐야 한다.) */
function contentPayloadFrom(payload){
  if(!payload || typeof payload !== 'object') return null;
  var person = payload.person || {};
  var out = { kind: payload.kind || null };
  if(person.gender) out.gender = person.gender;
  if(person.mbti)   out.mbti = person.mbti;
  if(payload.pillars)  out.pillars = payload.pillars;
  if(payload.elements) out.elements = payload.elements;
  if(payload.dayMasterStrength) out.dayMasterStrength = payload.dayMasterStrength;
  if(payload.sipseong) out.sipseong = payload.sipseong;
  if(payload.requested) out.requested = payload.requested;
  return out;
}
/* 서버 본문 안의 {{name}} 자리를 화면에 그릴 때 이 브라우저에서 채운다.
   이름을 서버로 보내지 않고도 "민지는 …" 같은 문장을 쓸 수 있게 하는 장치다. */
function fillNamePlaceholder(text, name, forHtml){
  var v = forHtml ? escapeHtml(name || '') : String(name || '');
  return String(text == null ? '' : text).replace(/\{\{\s*name\s*\}\}/g, v);
}
async function fetchPaidSection(productId, payload, displayName){
  if(!serverContentMode()) return null;
  var data = await billingFetchJson(BILLING.contentEndpoint, {
    productId: productId, sectionFrom: FREE_SECTION_COUNT, payload: contentPayloadFrom(payload)
  });
  if(!data || !Array.isArray(data.sections)) throw new Error('유료 본문 형식이 올바르지 않습니다.');
  if(!data.sections.length) throw new Error('서버가 유료 본문을 하나도 돌려주지 않았습니다.');
  return data.sections.map(function(s, i){
    return {
      id: s.id || ('srv'+i),
      title: fillNamePlaceholder(s.title || ('섹션 '+(FREE_SECTION_COUNT+i+1)), displayName, false),
      icon: safeIconPath(s.icon),
      paragraphs: Array.isArray(s.paragraphs)
        ? s.paragraphs.map(function(t){ return fillNamePlaceholder(t, displayName, false); }) : null,
      body: typeof s.body === 'string' ? fillNamePlaceholder(s.body, displayName, true) : '',
      untrusted: true /* 외부에서 온 내용 — 화면에 넣기 전 반드시 정화한다 */
    };
  });
}

/* 결제 처리기.
   체험 모드 — 실제 결제 없음. 결제 흐름과 화면 전환만 확인하는 용도(?demo=1 에서만).
   서버 모드 — 운영용. 브라우저는 결제창을 띄우고 서버가 승인/검증까지 책임진다.
              결제 승인을 클라이언트가 판단하면 누구나 콘솔에서 우회할 수 있으므로
              반드시 서버가 검증한 결과만 신뢰한다(승인 후에도 권한은 fetchEntitlements()로 다시 받아온다). */
var PaymentProvider = {
  /* ★ 우선순위: 소스 상수 > (개발 모드일 때만) 브라우저 저장본.
     저장본은 소스 상수가 "비어 있는 칸"만 채울 수 있고, 채워진 칸을 끄거나 바꿀 수 없다.
     따라서 배포본(상수가 채워진 파일)에서는 localStorage를 통째로 지워도
     서버 권위가 유지되고, 체험 모드로 강등되지 않는다. */
  load: function(){
    var stored = (DEV_FLAGS.configOverride && STATE.billingConfig) ? STATE.billingConfig : null;
    /* 구버전 스키마({mode, config:{checkoutEndpoint}}) 하위호환 */
    var legacyCfg = (stored && stored.config) || null;
    /* 어느 경로로 들어온 주소든 https 가드를 통과해야 한다 — 처리방침 §6이 "https만 허용"이라고
       적고 있고, 여기를 열어두면 BILLING_SOURCE에 http를 오기입했을 때 사주 데이터와 쿠키가
       평문으로 나간다. 설정 화면 입력은 이미 isSecureEndpoint()로 막고 있으나 이 경로는 뚫려 있었다. */
    function pick(key, legacyValue){
      var v = BILLING_SOURCE[key] || (stored && stored[key]) || legacyValue || null;
      if(v && !isSecureEndpoint(v)){
        console.warn('[결제 설정] https가 아닌 주소는 무시합니다:', key, v);
        return null;
      }
      return v;
    }
    BILLING.entitlementEndpoint = pick('entitlementEndpoint', null);
    BILLING.contentEndpoint     = pick('contentEndpoint', null);
    BILLING.verifyEndpoint      = pick('verifyEndpoint', legacyCfg && legacyCfg.verifyEndpoint);
    BILLING.checkoutEndpoint    = pick('checkoutEndpoint', legacyCfg && legacyCfg.checkoutEndpoint);
  },
  /* 개발용 덮어쓰기 저장. 소스 상수가 이미 잡고 있는 항목은 저장하지 않는다
     (저장해봐야 load()가 무시하므로, 저장된 값이 실제 동작인 것처럼 보이면 안 된다). */
  save: function(){
    if(!DEV_FLAGS.configOverride) return;
    var out = {};
    ['entitlementEndpoint','contentEndpoint','verifyEndpoint','checkoutEndpoint'].forEach(function(k){
      out[k] = BILLING_SOURCE[k] ? null : (BILLING[k] || null);
    });
    STATE.billingConfig = out;
    saveState();
  },
  isConfigured: function(){ return !!BILLING.checkoutEndpoint; },

  /* 결제 시작. 서버가 만든 결제 세션으로 넘긴다. */
  checkout: function(product){
    if(!BILLING.checkoutEndpoint) return Promise.reject(new Error('결제 서버가 연결되어 있지 않습니다.'));
    return billingFetchJson(BILLING.checkoutEndpoint, { productId:product.id, price:product.price })
      .then(function(session){
        /* 서버가 결제창 URL을 주면 그쪽으로 넘긴다. 승인 결과는 서버가 검증한다. */
        if(session && session.checkoutUrl){ location.href = session.checkoutUrl; return {redirected:true}; }
        if(session && session.granted){ return { provider:'server', receiptId:session.receiptId }; }
        throw new Error('서버가 결제 결과를 알려주지 않았습니다.');
      });
  }
};

function formatWon(n){ return n.toLocaleString('ko-KR')+'원'; }

/* =====================================================================
   잠금 표시 아이콘.
   ---------------------------------------------------------------------
   전에는 '🔒' 문자를 그대로 썼다. 이모지는 ① 플랫폼마다 그림이 달라 골드/먹색 톤과 따로 놀고
   ② 화면 낭독기가 "잠금 자물쇠"처럼 유니코드 이름을 그대로 읽어 문장이 어색해진다.
   그래서 직접 그린 SVG로 바꾸고, 대체 텍스트는 문맥에 맞는 한 단어("잠김")로 고정한다.
   글자 크기(1em)를 따라가므로 버튼·목차·카드 어디에 넣어도 주변 텍스트와 크기가 맞는다.
===================================================================== */
function lockIcon(labelText){
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 20 20');
  svg.setAttribute('class','lock-icon');
  svg.setAttribute('role','img');
  var t=document.createElementNS(ns,'title');
  t.textContent = labelText || '잠김';
  svg.appendChild(t);
  var shackle=document.createElementNS(ns,'path');
  shackle.setAttribute('d','M6.6 8.6 V6.4 A3.4 3.4 0 0 1 13.4 6.4 V8.6');
  shackle.setAttribute('fill','none');
  shackle.setAttribute('stroke','currentColor');
  shackle.setAttribute('stroke-width','1.5');
  shackle.setAttribute('stroke-linecap','round');
  svg.appendChild(shackle);
  var bodyRect=document.createElementNS(ns,'rect');
  bodyRect.setAttribute('x','4'); bodyRect.setAttribute('y','8.6');
  bodyRect.setAttribute('width','12'); bodyRect.setAttribute('height','8');
  bodyRect.setAttribute('rx','1.8');
  bodyRect.setAttribute('fill','none');
  bodyRect.setAttribute('stroke','currentColor');
  bodyRect.setAttribute('stroke-width','1.5');
  svg.appendChild(bodyRect);
  var keyhole=document.createElementNS(ns,'path');
  keyhole.setAttribute('d','M10 11.4 V13.8');
  keyhole.setAttribute('fill','none');
  keyhole.setAttribute('stroke','currentColor');
  keyhole.setAttribute('stroke-width','1.5');
  keyhole.setAttribute('stroke-linecap','round');
  svg.appendChild(keyhole);
  return svg;
}
/* 궁합 상세로 가는 버튼 앞에 붙는 자물쇠. 눌러보고 나서야 유료임을 아는 상황을 막는다.
   ★ 문자열이 아니라 노드를 돌려준다 — el(...)의 children 배열에 그대로 넣으면 되고,
     열려 있을 때는 null이라 el()이 알아서 건너뛴다. */
function compatLockMark(){ return hasAccess(PRODUCTS.compat_full.id) ? null : lockIcon('잠김 · 유료'); }

/* 잠긴 구간에 들어가는 카드.
   내용을 통째로 숨기지 않고 앞부분을 흐릿하게 남겨, 무엇이 잠겼는지 보이게 한다. */
function lockedBlock(product, teaserHtml, sectionTitle){
  var wrap = el('div',{class:'locked-block'});
  if(teaserHtml){
    var teaser = el('div',{class:'locked-teaser', html:teaserHtml, 'aria-hidden':'true'});
    wrap.appendChild(teaser);
  }
  var cta = el('div',{class:'locked-cta'});
  cta.appendChild(el('div',{class:'locked-icon'},[lockIcon('잠김')]));
  /* '내면 부터는'처럼 조사가 띄어써지지 않도록 붙여 쓴다. */
  /* ★ R52 — '유료예요'를 먼저 말하지 않는다(대표님 지시).
     여기까지 읽은 사람은 이미 이 풀이가 마음에 든 사람이다. 그 사람에게 첫마디로
     '돈을 내라'고 하면 닫는다. 무엇이 더 있는지를 먼저 말하고 값은 버튼에서 밝힌다.
     ★ 값을 감추는 것이 아니다 — 버튼에 금액이 그대로 적혀 있고, 결제 화면에서
       무엇이 열리는지 다시 보여준다. 순서를 바꾼 것이다. */
  cta.appendChild(el('div',{class:'locked-title'},[sectionTitle ? '‘'+sectionTitle+'’부터 더 깊이 이어져요' : '여기서부터 더 깊이 이어져요']));
  cta.appendChild(el('div',{class:'locked-desc'},[product.desc]));
  var btn = el('button',{class:'btn btn-primary', onclick:function(){ openPaywall(product); }},
    ['더보기 · '+formatWon(product.price)]);
  cta.appendChild(btn);
  cta.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:8px;', onclick:function(){ openPaywall(PRODUCTS.premium_pass); }},
    ['전체 이용권으로 한 번에 열기']));
  wrap.appendChild(cta);
  return wrap;
}

/* 결제 화면.
   데모 모드에서는 카드번호 등 실제 결제정보를 절대 입력받지 않는다.
   진짜처럼 생긴 결제창은 그 자체로 사용자를 속이는 물건이 되기 때문이다. */
function openPaywall(product){
  var body = el('div',{});

  var head = el('div',{class:'pay-product'});
  head.appendChild(el('div',{class:'pay-name'},[product.name]));
  head.appendChild(el('div',{class:'pay-price'},[formatWon(product.price)+(product.kind==='pass'?' / '+product.days+'일':' · 1회 결제')]));
  head.appendChild(el('div',{class:'pay-desc'},[product.desc]));
  body.appendChild(head);

  /* ★ 혜택 문구는 상태에 따라 사실이 달라진다. 고정 3줄로 두면 반드시 어느 한쪽에서 거짓말이 된다.
       - 서버 권위 모드(live/legal/partial): 이용권은 서버에 있고 이용자는 쿠키로만 식별된다.
         "같은 기기에서 계속 보관"은 저장 위치를 잘못 말하는 것이고, 쿠키를 지우면 사라지는 사실도 숨긴다.
         그래서 쿠키 기준임을 밝히고, 되찾는 방법(영수증 번호 복원)까지 함께 적는다.
       - 체험 모드(trial): 이용권이 실제로 이 브라우저 저장소에 있으므로 그대로 말한다. */
  var benefitGate = paywallGate();
  var benefits;
  /* ★ 결제 버튼이 살아 있지 않은 상태(trial/partial/legal)에서 "결제 후 바로 열람"이라고
     적으면, 지금 살 수 없는 화면이 살 수 있는 것처럼 약속하는 말이 된다.
     결제가 실제로 열려 있을 때만 약속하고, 아니면 지금 무엇을 할 수 있는지만 적는다.
     (표시광고 문제이기도 하다 — 못 파는 상태에서 구매 혜택을 내걸면 안 된다.) */
  var openLine = benefitGate.live ? '결제 후 바로 열람'
                                  : '지금은 결제를 열지 않았어요 — 아래 무료 구간은 그대로 보실 수 있어요';
  if(localEntitlementMode()){
    benefits = [openLine,
                '이 브라우저에만 저장 — 저장소를 지우거나 기기를 바꾸면 사라집니다',
                '무료 구간은 결제 없이 계속 이용 가능'];
  } else {
    benefits = [openLine,
                '같은 브라우저에서 계속 열람 (로그인 없이 쿠키로 식별)'];
    /* 복원 약속은 restoreAvailability()가 실제로 가능하다고 할 때만 한다.
       영수증 검증 주소가 없는 상태(partial)에서도 이 줄을 그대로 띄우면,
       같은 세션의 설정 화면이 "구매 내역 복원 · 지금은 불가"라고 말하는 것과 정면으로 어긋난다. */
    benefits.push(restoreAvailability().ok
      ? '브라우저 데이터를 지우거나 기기를 바꾸면 영수증 번호로 복원 (설정 화면 이용권 항목의 "구매 내역 복원")'
      : '지금은 구매 복원을 쓸 수 없습니다 — ' + restoreAvailability().reason);
    benefits.push('무료 구간은 결제 없이 계속 이용 가능');
  }
  var list = el('ul',{class:'pay-benefits'});
  benefits.forEach(function(t){ list.appendChild(el('li',{},[t])); });
  body.appendChild(list);
  if(benefitGate.live){
    body.appendChild(el('p',{class:'pay-legal-line'},[
      '결제가 끝나면 영수증 번호를 보여드립니다. 이 번호가 나중에 이용권을 되찾는 유일한 열쇠이니 브라우저 밖에도 저장해 주세요.'
    ]));
  }

  if(product.kind !== 'pass'){
    /* 개별 상품과 이용권 가격이 같아지면 "더 싸다"는 문구는 거짓이 된다.
       가격 관계에 따라 문구를 바꿔, 항상 사실만 말하도록 한다. */
    var passPrice = PRODUCTS.premium_pass.price;
    /* 개별 상품을 전부 사는 값과 이용권 값을 실제로 비교해서 말한다.
       가격을 어떻게 바꾸든 문구가 사실과 어긋나지 않게 하기 위해 계산으로 뽑는다. */
    var singlesTotal = 0;
    for(var pid in PRODUCTS){ if(PRODUCTS[pid].kind === 'once') singlesTotal += PRODUCTS[pid].price; }
    var upsellText;
    if(passPrice < product.price){
      upsellText = '전체 이용권이면 '+formatWon(passPrice)+'으로 더 싸게, 모든 상세 해석이 열려요.';
    } else if(passPrice === product.price){
      upsellText = '같은 '+formatWon(passPrice)+'으로 전체 이용권을 사면 이것 말고 나머지 상세 해석도 7일간 다 열려요.';
    } else if(passPrice < singlesTotal){
      /* '원'은 받침이 있으므로 조사는 '로'가 아니라 '으로'다. */
      upsellText = '상세 해석을 하나씩 다 사면 '+formatWon(singlesTotal)+'인데, 전체 이용권은 '+formatWon(passPrice)+'으로 7일간 다 열려요.';
    } else {
      upsellText = '전체 이용권('+formatWon(passPrice)+')이면 모든 상세 해석이 7일간 열려요.';
    }
    var upsell = el('div',{class:'pay-upsell'});
    upsell.appendChild(el('span',{},[upsellText]));
    upsell.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ closeModal(); openPaywall(PRODUCTS.premium_pass); }},['이용권 보기']));
    body.appendChild(upsell);
  }

  /* 전자상거래법상 청약철회 안내는 결제 "전"에 보여야 한다. 결제 후에 알리면 환불 거부 근거가 없다. */
  body.appendChild(buildPayLegalLine());

  /* ★ 결제 버튼은 paywallGate()가 live일 때만 살아난다.
     "일부만 연동된 상태"에서 버튼을 열어두면 사용자가 돈을 내고 아무것도 못 받는다. */
  var gate = paywallGate();
  var actions = [];
  if(gate.live){
    /* 관리자 콘솔의 결제 상태 시뮬레이션으로 열린 결제 버튼이면 그렇다고 못 박는다.
       이 줄이 없으면 테스트 화면과 실제 판매 화면이 눈으로 구분되지 않는다. */
    if(gate.sim){
      body.appendChild(el('p',{class:'pay-legal-line', style:'color:var(--red-hi);'},[
        '[관리자 테스트 모드] 지금 열려 있는 결제 버튼은 시뮬레이션입니다. 실제 결제도, 실제 서버 호출도 일어나지 않습니다.'
      ]));
    }
    /* verifyEndpoint가 없을 때의 "반영이 잠시 늦어질 수 있습니다" 안내는 삭제했다.
       verifyEndpoint가 PAYWALL_REQUIRED에 들어간 뒤로 live 상태에서는 항상 설정돼 있어
       이 분기는 도달하지 못하는 죽은 코드였고, 문구도 사실과 달랐다 —
       실제로는 "잠시 늦어지는" 것이 아니라 복원이 영구히 불가능한 상태였다. */
    actions.push({ label:'결제하기', cls:'btn-primary', onclick:function(){
      showToast('결제 페이지로 이동합니다…');
      PaymentProvider.checkout(product).then(function(r){
        if(r && r.redirected) return;
        /* 결제가 성공해도 권한을 클라이언트가 스스로 부여하지 않는다.
           서버에 다시 물어보고, 서버가 인정한 결과만 화면에 반영한다. */
        return fetchEntitlements().then(function(){
          closeModal();
          if(hasAccess(product.id)) showToast('결제가 완료되었어요.');
          else if(serverAuthoritative()) showToast('결제는 접수됐지만 아직 서버에서 확인되지 않았어요. 잠시 후 다시 확인해주세요.');
          else showToast('결제 서버는 연결됐지만 권한 조회 서버(entitlementEndpoint)가 없어 권한을 확인할 수 없습니다.');
          render();
          /* ★ 서버가 영수증 번호를 줬으면 곧바로 보여주고 저장하라고 안내한다.
             이 번호가 나중에 이용권을 되찾는 유일한 열쇠인데, 이 자리를 놓치면 이용자 손에 아무것도 안 남는다. */
          if(r && r.receiptId){
            rememberReceipt(r.receiptId);
            openReceiptSavedModal(r.receiptId, {title: product.name+' 결제가 완료되었습니다.'});
          }
        });
      }).catch(function(err){
        showToast((err && err.message) || '결제를 시작하지 못했습니다.');
      });
    }});
  } else {
    /* 결제를 열 수 없는 상태. 왜 못 여는지를 뭉뚱그리지 않고 조합별로 정확히 적는다. */
    body.appendChild(buildPaywallBlockedNotice(gate));
    /* ★ 데모 해제 버튼은 기본 상태에서 DOM에 만들어지지 않는다.
       주소에 ?demo=1 을 붙였고, 서버가 권한을 쥐고 있지 않을 때만 생성된다
       (CSS로 숨기는 방식은 개발자도구로 되살아난다). */
    if(DEV_FLAGS.demoUnlock && !serverAuthoritative()){
      actions.push({ label:'[개발용] 결제됐다고 가정하고 열기', cls:'btn-ghost', onclick:function(){
        grantProductLocally(product.id, {provider:'trial', receiptId:'trial-'+Date.now().toString(36)});
        closeModal(); showToast('개발용으로 열었어요. 실제 결제는 되지 않았습니다.'); render();
      }});
    }
    actions.push({ label: PAYWALL_BLOCKED_LABEL[gate.mode] || '결제를 열 수 없습니다',
                   cls:'btn-primary', disabled:true, onclick:null });
  }
  actions.push({ label:'닫기', onclick:function(){ closeModal(); } });

  openModal(product.kind==='pass' ? '전체 이용권' : '더 자세히 보기', body, actions);
}

/* 결제를 열 수 없는 이유를 조합별로 정확히 적는다.
   ★ "체험 모드"라는 말은 결제 서버가 하나도 연결되지 않은 상태에서만 쓴다.
      일부만 연결된 상태에서 그 말을 쓰면, 실제 결제가 나가는 화면에 "실제 결제가 아니다"라고
      적히는 사고가 난다(이번 라운드에 실제로 발생). */
function buildPaywallBlockedNotice(gate){
  var notice = el('div',{class:'pay-demo-notice'});
  if(gate.mode === 'trial'){
    notice.appendChild(el('span',{class:'trial-badge'},['체험 모드 — 실제 결제가 아닙니다']));
    notice.appendChild(el('strong',{},['아직 결제가 연결되지 않았습니다.']));
    notice.appendChild(el('p',{},['결제 서버가 하나도 연결되지 않은 상태라 실제로 결제되지 않고, 카드 정보도 받지 않습니다.']));
    notice.appendChild(el('p',{},['이용권은 이 브라우저에만 저장되는 체험용이며, 개발자도구로 위조할 수 있습니다.']));
  } else if(gate.mode === 'partial'){
    notice.appendChild(el('span',{class:'trial-badge'},['연동 미완료 — 결제를 열 수 없습니다']));
    notice.appendChild(el('strong',{},['결제 서버 설정이 끝나지 않았습니다.']));
    notice.appendChild(el('p',{},['서버 주소가 일부만 연결돼 있습니다. 이 상태로 결제하면 돈은 빠져나가는데 이용권이 부여되지 않으므로, 결제 버튼을 열지 않습니다.']));
    notice.appendChild(el('p',{},['아직 설정되지 않은 항목 — '+gate.missingEndpoints.join(' · ')]));
  } else if(gate.mode === 'legal'){
    notice.appendChild(el('span',{class:'trial-badge'},['표시사항 등록 대기 — 결제를 열 수 없습니다']));
    notice.appendChild(el('strong',{},['사업자 표시사항 등록이 완료되면 결제가 열립니다.']));
    notice.appendChild(el('p',{},['전자상거래법 제13조가 표시를 의무화한 항목(제1항 사업자 표시사항, 제2항 대금의 지급방법)이 아직 비어 있어, 유료 판매를 시작할 수 없습니다.']));
    notice.appendChild(el('p',{},['비어 있는 항목 — '+gate.missingLegal.join(' · ')]));
  }
  return notice;
}

/* 결제 화면에 들어가는 청약철회 요약 한 줄 + 약관 바로가기. */
function buildPayLegalLine(){
  var wrap = el('div',{});
  /* 전자상거래법 제13조 제2항 — 대금의 지급방법(결제수단)을 계약 체결 전에 표시해야 한다.
     PG 미확정이라 값이 없으면 지어내지 않고 "확인 중"으로 나간다(PAYMENT_METHODS 참조). */
  wrap.appendChild(el('p',{class:'pay-legal-line'},[
    '결제수단: '+paymentMethodsText()+
    (paymentMethodsMissing() ? ' (결제대행사 선정 전이라 지원 수단이 확정되지 않았습니다. 확정 전까지 결제 버튼은 열리지 않습니다.)' : '')+
    ' · 공급 시기: 결제 즉시 열람'
  ]));
  wrap.appendChild(el('p',{class:'pay-legal-line'},[
    '디지털 콘텐츠 특성상 결제 후 해당 상세 해석을 열람하면 청약철회가 제한됩니다. 열람 전이라면 결제일로부터 7일 이내 청약철회가 가능합니다.'
  ]));
  /* ★ R38 — 별도 '환불·청약철회 안내' 화면은 없앴다(대표님 지시). 다만 결제 직전 고지는
     전자상거래법 제13조 제2항이 요구하는 것이라 바로 위 문장으로 그대로 남아 있다.
     여기서는 환불 방법을 적어둔 자주 묻는 질문으로 보낸다 — 없앤 것이 아니라 옮긴 것이다. */
  wrap.appendChild(el('p',{class:'pay-legal-line'},[
    '환불은 '+companyValue(COMPANY.supportEmail)+' 로 요청하시면 됩니다. 자세한 기준은 아래 [자주 묻는 질문]에 적어 두었습니다.'
  ]));
  var links = el('div',{class:'legal-links'});
  links.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){
    closeModal(); ROUTE='faq'; render(); window.scrollTo(0,0);
  }},['자주 묻는 질문']));
  links.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ openTermsModal(); }},['이용약관']));
  wrap.appendChild(links);
  return wrap;
}

/* 설정: 지금 무엇이 열려 있는지. 결제한 사람이 "내가 뭘 샀더라"를 확인하는 자리다. */
function buildPurchasePanel(){
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['이용권']));
  var e = entitlements();

  /* 지금 이 화면의 이용권이 "서버가 확인해 준 것"인지 "이 기기에만 있는 체험분"인지 정직하게 먼저 알린다. */
  if(localEntitlementMode()){
    card.appendChild(el('span',{class:'trial-badge'},['이 기기에만 저장된 체험 이용권']));
    card.appendChild(el('p',{class:'biz-hint'},[
      '이용권 조회 서버가 연결되지 않아, 아래 이용권은 이 브라우저에만 저장된 체험용입니다. 실제로 결제된 것이 아니고, 브라우저 저장소를 지우거나 기기를 바꾸면 사라집니다.'
    ]));
  } else if(ENT.error){
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '이용권 서버에 연결하지 못했습니다('+ENT.error+'). 확인될 때까지 유료 구간은 잠긴 상태로 둡니다.'
    ]));
  } else if(!ENT.ready){
    card.appendChild(el('p',{class:'biz-hint'},['이용권을 서버에 확인하는 중입니다…']));
  }

  if(realPassActive()){
    card.appendChild(el('div',{class:'biz-row'},[
      el('span',{class:'k'},['전체 이용권']),
      el('span',{class:'v'},[passRemainingDays()+'일 남음'])
    ]));
  } else if(adminPassActive()){
    /* 관리자 테스트로 연 것을 "N일 남음"이라고 적으면 실제 구매처럼 보인다. 그대로 말한다. */
    card.appendChild(el('div',{class:'biz-row'},[
      el('span',{class:'k'},['전체 이용권']),
      el('span',{class:'v', style:'color:var(--red-hi);'},['관리자 테스트로 열림'])
    ]));
  } else {
    card.appendChild(el('div',{class:'biz-row'},[
      el('span',{class:'k'},['전체 이용권']),
      el('span',{class:'v'},['없음'])
    ]));
  }

  var adminOpened = adminPassActive();
  ['saju_full','mbti_full','compat_full'].forEach(function(id){
    var prod = PRODUCTS[id];
    var owned = !!e.items[id];
    var byAdmin = !owned && !realPassActive() && adminGranted(id);
    if(byAdmin) adminOpened = true;
    var label = owned ? '구매함'
              : realPassActive() ? '이용권으로 열림'
              : byAdmin ? '관리자 테스트로 열림'
              : formatWon(prod.price);
    card.appendChild(el('div',{class:'biz-row'},[
      el('span',{class:'k'},[prod.name]),
      el('span',{class:'v', style: byAdmin ? 'color:var(--red-hi);' : ((owned||realPassActive()) ? 'color:var(--gold);' : '')},
        [label])
    ]));
  });
  if(adminOpened){
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '관리자 테스트 모드로 열어둔 항목이 있습니다. 실제 결제가 아니며, 주소에서 ?admin= 을 빼고 새로고침하면 다시 잠깁니다.'
    ]));
  }

  if(!passActive()){
    card.appendChild(el('button',{class:'btn btn-primary btn-block', style:'margin-top:12px;',
      onclick:function(){ openPaywall(PRODUCTS.premium_pass); }},['전체 이용권 보기 · '+formatWon(PRODUCTS.premium_pass.price)]));
  }

  /* ★ 구매 복원 진입점.
     서버 권위 모드에서는 이용권이 서버에 있고 이용자는 쿠키로만 식별되므로,
     쿠키를 지우거나 기기를 바꾸면 산 것을 되찾을 길이 앱 안에 있어야 한다. */
  var restoreAv = restoreAvailability();
  card.appendChild(settingsRow('구매 내역 복원',
    restoreAv.ok ? '영수증 번호로' : '지금은 불가',
    function(){ openRestoreModal(); }));
  if(restoreAv.ok){
    card.appendChild(el('p',{class:'biz-hint'},[
      '브라우저 데이터를 지웠거나 다른 기기·시크릿 창에서 열었다면, 결제할 때 받은 영수증 번호로 이용권을 되살릴 수 있습니다.'
    ]));
  } else {
    card.appendChild(el('p',{class:'biz-hint'},[restoreAv.reason]));
  }

  /* 이 브라우저가 기억하는 영수증 번호. 권한의 근거가 아니라 "옮겨 적으라"고 보여주는 메모다. */
  var memos = receiptMemos();
  if(memos.length){
    card.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;color:var(--gold);'},[
      '이 브라우저에 기록된 영수증 번호 — 다른 곳에도 적어 두세요. 브라우저 데이터를 지우면 이 목록도 함께 사라집니다.'
    ]));
    memos.forEach(function(mm){
      var row = el('div',{class:'biz-row'});
      row.appendChild(el('span',{class:'k', style:'word-break:break-all;'},[mm.id]));
      row.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'flex:none;',
        'aria-label':'영수증 번호 '+mm.id+' 복사',
        onclick:(function(v){ return function(){ copyText(v); }; })(mm.id)},['복사']));
      card.appendChild(row);
    });
  }

  if(e.purchases.length){
    card.appendChild(el('p',{class:'biz-hint'},['결제 내역 '+e.purchases.length+'건 · 마지막 '+new Date(e.purchases[e.purchases.length-1].at).toLocaleString('ko-KR')]));
    /* 체험 모드로 연 이용권이 섞여 있으면 실제 결제로 오해할 수 있으므로 분리해서 알린다. */
    var trialCount = e.purchases.filter(function(x){ return x.provider==='trial' || x.provider==='demo'; }).length;
    if(trialCount){
      card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},
        [trialCount+'건은 결제 연동 전 체험 모드로 열린 항목이라 실제 결제된 것이 아닙니다.']));
      card.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:8px;', onclick:function(){
        confirmModal('체험 모드로 열린 이용권을 모두 초기화할까요?', function(){
          STATE.entitlements = defaultEntitlements(); saveState();
          fetchEntitlements().then(function(){ render(); showToast('초기화했어요.'); });
        });
      }},['체험 이용권 초기화']));
    }
  }
  return card;
}

/* 결제가 끝난 직후 영수증 번호를 보여주고 "저장해 두라"고 말하는 화면.
   ★ 이게 없으면 복원 기능이 있어도 소용이 없다 — 나중에 "영수증 번호를 넣으세요"라고 해봐야
      이용자 손에 그 번호가 남아 있지 않기 때문이다. 그래서 결제 성공 경로마다 이 화면을 띄운다. */
function openReceiptSavedModal(receiptId, opts){
  opts = opts || {};
  var body = el('div',{class:'sheet-body'});
  body.appendChild(el('p',{},[opts.title || '결제가 완료되었습니다. 유료 해석이 열렸어요.']));
  body.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;color:var(--gold);'},['영수증 번호 (복원 코드)']));
  var codeBox = el('div',{class:'receipt-code'});
  codeBox.appendChild(el('code',{},[String(receiptId)]));
  body.appendChild(codeBox);
  body.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:8px;',
    onclick:function(){ copyText(String(receiptId)); }},['번호 복사']));
  body.appendChild(el('p',{class:'biz-hint', style:'margin-top:12px;'},[
    '이 서비스는 회원가입이 없어서, 결제한 이용권은 지금 쓰고 계신 브라우저의 쿠키로만 연결돼 있습니다. 브라우저 데이터를 지우거나 다른 기기·시크릿 창에서 열면 이용권이 보이지 않습니다.'
  ]));
  body.appendChild(el('p',{class:'biz-hint'},[
    '그때는 설정 화면 이용권 항목의 "구매 내역 복원"에서 위 번호를 넣으면 다시 열립니다. 메모장이나 메일 등 브라우저 밖에도 꼭 적어 두세요.'
  ]));
  body.appendChild(el('p',{class:'biz-hint'},[
    '이 번호는 이 브라우저에도 함께 저장해 두지만, 브라우저 데이터를 지우면 그 기록도 같이 사라집니다.'
  ]));
  /* 이 모달은 결제 성공 콜백에서 저절로 뜨므로 "열기 전에 눌렀던 버튼"이 없다.
     복귀 지점을 본문 영역으로 명시해, 닫았을 때 포커스가 <body>로 떨어지지 않게 한다. */
  openModal('영수증 번호를 저장해 주세요', body, [
    {label:'번호 복사', cls:'btn-primary', onclick:function(){ copyText(String(receiptId)); }},
    {label:'닫기', cls:'btn-ghost', onclick:closeModal}
  ], {returnFocusTo: $('#main')});
}

/* 설정 → 이용권 → "구매 내역 복원". 영수증 번호를 받아 서버에 재연결을 요청한다. */
function openRestoreModal(){
  var body = el('div',{class:'sheet-body'});
  var av = restoreAvailability();

  /* ★ 여기 적는 설명도 상태에 따라 사실이 달라진다.
     체험 모드에서는 이용권이 실제로 이 브라우저에 있으므로 "서버에 있다"고 쓰면 거짓이 된다. */
  if(av.ok){
    body.appendChild(el('p',{class:'biz-hint'},[
      '이 서비스에는 회원가입이 없습니다. 결제한 이용권은 서버에 있고, 이용자는 브라우저 쿠키로만 식별됩니다. 그래서 브라우저 데이터를 지우거나 기기를 바꾸면 이용권이 보이지 않게 됩니다.'
    ]));
    body.appendChild(el('p',{class:'biz-hint'},[
      '결제할 때 받은 영수증 번호를 넣으면, 서버가 그 구매를 지금 이 브라우저에 다시 연결합니다.'
    ]));
  } else if(localEntitlementMode()){
    body.appendChild(el('p',{class:'biz-hint'},[
      '지금은 이용권이 서버가 아니라 이 브라우저 안에만 저장되는 체험 모드입니다. 되찾아 올 서버 기록 자체가 없어 복원을 실행할 수 없습니다.'
    ]));
  } else {
    body.appendChild(el('p',{class:'biz-hint'},[
      '결제한 이용권은 서버에 있고 이용자는 브라우저 쿠키로만 식별됩니다. 다만 아래 이유로 지금은 복원 요청을 보낼 수 없습니다.'
    ]));
  }

  if(!av.ok){
    body.appendChild(el('p',{class:'biz-hint', style:'margin-top:12px;color:var(--red-hi);'},[av.reason]));
    body.appendChild(el('p',{class:'biz-hint'},[
      '영수증 번호를 가지고 계시면 '+companyValue(COMPANY.supportEmail)+' 로 결제 일시와 함께 보내 주세요.'
    ]));
    openModal('구매 내역 복원', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
    return;
  }

  var input = el('input',{class:'biz-input', type:'text', style:'margin-top:12px;',
    placeholder:'결제할 때 받은 영수증 번호', 'aria-label':'영수증 번호(복원 코드)',
    autocomplete:'off', spellcheck:'false'});
  body.appendChild(el('label',{class:'k', style:'display:block;margin-top:12px;font-size:.82rem;'},['영수증 번호']));
  body.appendChild(input);

  /* 진행 상태·결과를 같은 자리에 말로 알린다(role=status라 화면 낭독기도 읽는다). */
  var status = el('p',{class:'biz-hint', role:'status','aria-live':'polite', style:'margin-top:10px;min-height:1.2em;'});
  body.appendChild(status);

  var memos = receiptMemos();
  if(memos.length){
    body.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;'},['이 브라우저에 기록된 번호를 눌러 채울 수 있습니다.']));
    var chips = el('div',{style:'display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;'});
    memos.forEach(function(mm){
      chips.appendChild(el('button',{class:'btn btn-ghost btn-sm', type:'button',
        onclick:(function(v){ return function(){ input.value = v; input.focus(); }; })(mm.id)},[mm.id]));
    });
    body.appendChild(chips);
  }

  var runBtn = el('button',{class:'btn btn-primary btn-block', style:'margin-top:12px;'},['이용권 복원하기']);
  runBtn.addEventListener('click', function(){
    var code = (input.value||'').trim();
    status.style.color = '';
    if(!code){ status.textContent = '영수증 번호를 입력해 주세요.'; input.focus(); return; }
    runBtn.disabled = true;
    status.textContent = '서버에 확인하는 중이에요…';
    restorePurchase(code).then(function(r){
      runBtn.disabled = false;
      if(r.opened){
        closeModal();
        showToast('이용권을 복원했어요.');
        render();
      } else {
        /* 서버가 영수증은 확인했는데 이용권이 안 나오는 상태를 조용히 넘기지 않는다.
           이용자가 "됐다"고 오해한 채 잠긴 화면을 보는 게 제일 나쁘다. */
        status.style.color = 'var(--red-hi)';
        status.textContent = '영수증은 확인됐지만 이용권이 아직 반영되지 않았습니다. 잠시 후 다시 시도하거나 '+companyValue(COMPANY.supportEmail)+' 로 문의해 주세요.';
        render();
      }
    }).catch(function(err){
      runBtn.disabled = false;
      status.style.color = 'var(--red-hi)';
      status.textContent = (err && err.message) || '복원하지 못했습니다.';
      /* 실패했으면 아무것도 열지 않는다. 잠금은 잠금인 채로 남는다. */
    });
  });
  body.appendChild(runBtn);

  body.appendChild(el('p',{class:'biz-hint', style:'margin-top:12px;'},[
    '번호를 잃어버렸다면 '+companyValue(COMPANY.supportEmail)+' 로 결제 일시와 결제하신 상품명을 알려주세요. 결제 기록을 확인해 도와드립니다.'
  ]));
  body.appendChild(el('p',{class:'biz-hint'},[
    '복원해도 청약철회 가능 여부는 달라지지 않습니다. 이미 열람한 콘텐츠는 열람한 것으로 봅니다.'
  ]));

  openModal('구매 내역 복원', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}

/* =====================================================================
   법적 고지 (전자상거래법 제13조 표시의무 + 개인정보보호법)
   ---------------------------------------------------------------------
   화면에 찍히는 사업자 정보는 전부 COMPANY 객체에서 꺼낸다(하드코딩 0건).
   아직 못 받은 값은 지어내지 않고 "확인 중"으로 표시한다.
===================================================================== */
function legalRow(k, v){
  var missing = companyMissing(v);
  return el('div',{class:'biz-row'},[
    el('span',{class:'k'},[k]),

var FOOTER_PAGES = [
  ['about',   '서비스 소개'],
  ['guideSaju', '사주 가이드'],
  ['guideMbti', 'MBTI 가이드'],
  ['faq',     '자주 묻는 질문']
];
/* 안내 페이지들은 스스로 푸터를 붙이므로 여기서 또 붙이지 않는다. */
function appendFooterOnce(){
  var main = $('#main');
  if(!main) return;
  if(main.querySelector('.site-footer')) return;
  var view = main.querySelector('.view') || main;
  view.appendChild(buildSiteFooter());
}
function buildSiteFooter(){
  var f = el('div',{class:'site-footer'});
  var row = el('div',{class:'fl-row'});
  FOOTER_PAGES.forEach(function(pair){
    row.appendChild(el('button',{class:'fl', type:'button', onclick:function(){
      ROUTE = pair[0]; render(); window.scrollTo(0,0);
    }},[pair[1]]));
  });
  /* 개선 의견 — 서버로 받는 창구가 없으므로 메일로 연다. 없는 기능을 있는 척하지 않는다. */
  row.appendChild(el('a',{class:'fl', href:'mailto:'+companyValue(COMPANY.supportEmail)+'?subject='+encodeURIComponent('['+COMPANY.serviceName+'] 개선 의견')},['개선 의견']));
  row.appendChild(el('button',{class:'fl', type:'button', onclick:openTermsModal},['이용약관']));
  row.appendChild(el('button',{class:'fl', type:'button', onclick:openPrivacyModal},['개인정보처리방침']));
  /* R38 — '환불 · 청약철회' 별도 메뉴는 없앴다(대표님 지시). 내용은 사라지지 않았다 —
     환불 방법은 자주 묻는 질문으로 옮겼고, 청약철회 조항은 이용약관 제8조에 그대로 있다.
     ★ 청약철회의 기한·행사방법은 전자상거래법 제13조가 표시하라고 정한 항목이라
       메뉴는 없애도 내용까지 없앨 수는 없다. 그래서 옮긴 것이지 지운 것이 아니다. */
  f.appendChild(row);

  var biz = el('div',{class:'biz'});
  biz.appendChild(el('p',{},[COMPANY.legalName+' · 대표 '+COMPANY.ceo]));
  biz.appendChild(el('p',{},['사업자등록번호 '+COMPANY.bizRegNo+' · 통신판매업신고 '+companyValue(COMPANY.mailOrderNo)]));
  biz.appendChild(el('p',{},[COMPANY.address]));
  biz.appendChild(el('p',{},[companyValue(COMPANY.supportPhone)+' · '+companyValue(COMPANY.supportEmail)]));
  f.appendChild(biz);
  f.appendChild(el('p',{class:'copy'},['© '+(new Date().getFullYear())+' '+COMPANY.legalNameEn]));
  return f;
}

function buildInfoPage(title, sub, build){
  var main=$('#main'); main.innerHTML='';
  var view=el('div',{class:'view'});
  view.appendChild(pageHead(title, sub));
  build(view);
  view.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:18px;', onclick:function(){
    ROUTE='home'; render(); window.scrollTo(0,0);
  }},['홈으로 돌아가기']));
  view.appendChild(buildSiteFooter());
  main.appendChild(autoTermify(view));
}
function infoCard(view, title, paras){

  view.appendChild(c);
}

/* =====================================================================
   AI 해석 연결 — 운영자용. 관리자 테스트 콘솔 안에만 있다.
   ---------------------------------------------------------------------
   ★ 예전에는 이 카드가 설정 화면(사용자용)에 그대로 있었다. 해석 서버 주소·모델 이름·
     "서버가 지켜야 할 형식 보기"는 이 앱을 운영하는 사람이 채우는 값이지, 손님이 채우는 값이 아니다.
     손님 화면에 두면 "이게 왜 여기 있나"라는 질문을 부르고, 서버 주소를 아무거나 넣어볼 수도 있다.
     그래서 결제 연동 진단(buildBillingPanel)이 이미 간 길을 그대로 따라 관리자 콘솔로 옮겼다.
   ★ ADMIN_KEY가 null인 배포본에서는 openAdminConsole()이 첫 줄에서 멈추므로
     이 카드는 DOM에 만들어지지도 않는다. 화면에서 가리는 것이 아니라 아예 안 만든다.
   ★ afterSave: 콘솔은 모달이라 render()로는 다시 그려지지 않는다. 저장/되돌리기 뒤에
     콘솔 자신을 다시 칠하라고 넘겨받는 함수다(넘기지 않으면 아무 일도 하지 않는다).
===================================================================== */
function buildInterpreterPanel(afterSave){
  var card = el('div',{class:'admin-sec'});
  card.appendChild(el('h4',{},['7. 풀이 품질 · AI 해석 연결']));
  card.appendChild(el('p',{class:'biz-hint'},[
    '사주팔자(네 기둥) 계산은 이 앱이 절기까지 직접 계산해서 뽑습니다. 하지만 그 사주를 읽어주는 문장은 기본적으로 미리 준비된 해석표를 조합한 것이라, 사람이 AI에게 직접 물어볼 때보다 얕게 느껴집니다. 아래에 해석 서버를 연결하면 같은 사주 데이터를 AI가 직접 읽고 풀이합니다.'
  ]));

  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['현재 방식']),
    el('span',{class:'v'},[Interpreter.isApiReady() ? 'AI 해석 ('+Interpreter.config.model+')' : '기본 해석표'])
  ]));

  var epInput = el('input',{class:'biz-input', type:'url', placeholder:'https://api.내도메인.com/interpret',
    value: (INTERP_EDIT ? INTERP_EDIT.endpoint : (Interpreter.config.endpoint||'')), 'aria-label':'해석 서버 주소'});
  card.appendChild(el('label',{class:'k', style:'display:block;margin-top:12px;font-size:.82rem;'},['해석 서버 주소']));
  card.appendChild(epInput);

  var modelInput = el('input',{class:'biz-input', type:'text', placeholder:'claude-opus-5',
    value: (INTERP_EDIT ? INTERP_EDIT.model : (Interpreter.config.model||'')), 'aria-label':'모델 이름'});
  card.appendChild(el('label',{class:'k', style:'display:block;margin-top:10px;font-size:.82rem;'},['모델']));
  card.appendChild(modelInput);

  card.appendChild(el('p',{class:'biz-hint'},[
    'API 키는 여기에 넣지 마세요. 브라우저에 넣은 키는 페이지를 여는 누구나 꺼내 쓸 수 있습니다. 키는 서버에만 두고, 이 앱은 브라우저에서 내 서버로, 내 서버에서 Anthropic으로 이어지는 순서로만 호출합니다.'
  ]));

  /* ★ R20 — 입력칸의 글자는 [저장]을 눌러야 실제 설정이 된다.
     예전에도 저장 버튼은 있었지만 "지금 바뀐 게 있는지"가 화면에 드러나지 않았고,
     칸에 뭔가 적어둔 채 다른 탭으로 나가면 조용히 사라졌다. 두 가지를 함께 고쳤다.
       ① 바뀐 게 없으면 저장 버튼이 비활성이다.
       ② 바뀐 채로 화면을 떠나려 하면 물어본다(INTERP_EDIT · guardRouteChange). */
  var saved = {endpoint: Interpreter.config.endpoint||'', model: Interpreter.config.model||''};
  function currentEdit(){ return {endpoint:(epInput.value||''), model:(modelInput.value||'')}; }
  var saveBtn = el('button',{class:'btn btn-primary btn-sm', disabled: interpDirty()?null:'disabled'});
  saveBtn.appendChild(document.createTextNode('저장'));
  var dirtyLine = el('p',{class:'unsaved-line', role:'status'},
    ['저장하지 않은 변경이 있어요. [저장]을 눌러야 반영돼요.']);
  dirtyLine.hidden = !interpDirty();
  function onEdit(){
    var cur = currentEdit();
    INTERP_EDIT = (cur.endpoint===saved.endpoint && cur.model===saved.model) ? null : cur;
    saveBtn.disabled = !INTERP_EDIT;
    dirtyLine.hidden = !INTERP_EDIT;
    /* 글자를 치는 동안 잠금 상태를 따라오게 한다. 이 카드는 관리자 콘솔(모달) 안에만 있으므로
       Esc·배경 클릭으로 콘솔이 닫히는 것도 여기서 함께 막힌다. */
    MODAL_GUARD = INTERP_EDIT ? interpUnsavedWarn : null;
  }
  epInput.addEventListener('input', onEdit);
  modelInput.addEventListener('input', onEdit);
  saveBtn.addEventListener('click', function(){
    var ep = (epInput.value||'').trim();
    if(ep && !isSecureEndpoint(ep)){ showToast('https:// 로 시작하는 주소를 넣어주세요. (개발용 localhost만 http도 됩니다)'); return; }
    Interpreter.config.endpoint = ep;
    Interpreter.config.model = (modelInput.value||'').trim() || 'claude-opus-5';
    Interpreter.config.mode = ep ? 'api' : 'local';
    Interpreter.lastError = null;
    Interpreter.save();
    INTERP_EDIT = null;
    MODAL_GUARD = null;   /* 저장했으므로 잠글 이유가 사라졌다 */
    showToast(ep ? 'AI 해석을 연결했어요.' : '기본 해석표로 되돌렸어요.');
    render();
    if(afterSave) afterSave();
  });

  var row = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;'});
  row.appendChild(saveBtn);
  row.appendChild(el('button',{class:'btn btn-ghost btn-sm', disabled: interpDirty()?null:'disabled', onclick:function(){
    INTERP_EDIT = null; MODAL_GUARD = null;
    showToast('입력한 내용을 되돌렸어요.'); render(); if(afterSave) afterSave();
  }},['되돌리기']));
  row.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ showInterpreterContract(); }},['서버가 지켜야 할 형식 보기']));
  card.appendChild(row);
  card.appendChild(dirtyLine);
  return card;
}
/* 관리자 콘솔의 AI 해석 입력칸에 "저장하지 않은 글자"가 있으면 여기에 담긴다. null이면 저장본과 같다는 뜻. */
var INTERP_EDIT = null;
/* 저장하지 않은 채 콘솔을 닫으려 할 때 알린다. openValueSheet의 warn()과 같은 역할·같은 말투. */
function interpUnsavedWarn(){
  showToast('AI 해석 설정에 저장하지 않은 변경이 있어요. [저장]을 누르거나 [되돌리기]로 되돌려 주세요.');
}
function interpDirty(){
  if(!INTERP_EDIT) return false;
  return INTERP_EDIT.endpoint !== (Interpreter.config.endpoint||'') ||
         INTERP_EDIT.model    !== (Interpreter.config.model||'');
}

/* 연동할 서버가 무엇을 받고 무엇을 돌려줘야 하는지. 이게 없으면 붙일 수가 없다. */
function showInterpreterContract(){
  var p = activeProfile();
  var sample = (p && getSajuResult(p)) ? Interpreter.buildSajuPayload(p, getSajuResult(p)) : {kind:'saju', note:'프로필을 만들면 실제 예시가 표시됩니다'};
  var body = el('div',{class:'sheet-body'});
  body.appendChild(el('p',{class:'biz-hint'},['앱이 보내는 요청 (POST, JSON)']));
  body.appendChild(el('pre',{style:'white-space:pre-wrap;word-break:break-all;font-size:.72rem;background:var(--panel-2);padding:10px;border-radius:8px;max-height:220px;overflow:auto;'},
    [JSON.stringify({model:Interpreter.config.model||'claude-opus-5', payload:sample}, null, 1)]));
  body.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;'},['서버가 돌려줘야 하는 응답 (권장 형식)']));
  body.appendChild(el('pre',{style:'white-space:pre-wrap;font-size:.72rem;background:var(--panel-2);padding:10px;border-radius:8px;'},
    [JSON.stringify({sections:[{id:'s1', title:'타고난 기질', icon:'M4 18 L10 6 L16 18', paragraphs:['…해석 문단 1…','…해석 문단 2…']}]}, null, 1)]));
  body.appendChild(el('p',{class:'biz-hint'},[
    'paragraphs는 평문 문단 배열입니다. 앱은 이 값을 태그로 해석하지 않고 글자 그대로만 넣으므로, 응답에 스크립트가 섞여 들어가도 실행될 수 없습니다. 이 형식을 권장합니다.'
  ]));
  body.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;'},['서식이 꼭 필요하면 body(HTML)도 받습니다']));
  body.appendChild(el('pre',{style:'white-space:pre-wrap;font-size:.72rem;background:var(--panel-2);padding:10px;border-radius:8px;'},
    [JSON.stringify({sections:[{id:'s1', title:'타고난 기질', icon:'M4 18 L10 6 L16 18', body:'<p>…<strong>강조</strong>…</p>'}]}, null, 1)]));
  body.appendChild(el('p',{class:'biz-hint'},[
    'body를 보내면 앱이 p · strong · b · em · i · br · ul · ol · li 만 남기고 나머지 태그와 모든 속성을 제거한 뒤 화면에 넣습니다. 서버에서도 사용자 입력이 그대로 섞여 들어가지 않도록 이스케이프해 주세요.'
  ]));
  openModal('해석 서버 연동 규격', body, [{label:'닫기', onclick:closeModal}]);
}

/* =====================================================================
   설정 화면의 결제 안내 (사용자용).
   ---------------------------------------------------------------------
   ★ 예전에는 이 자리에 운영자용 진단이 통째로 있었다 — 서버 주소 4칸, 엔드포인트별 설정 여부,
     "서버가 지켜야 할 형식 보기", 개발용 입력칸. 일반 사용자에게는 뜻을 알 수 없는 정보이고,
     "이게 왜 여기 있나"라는 질문을 부른다. 그 항목들은 전부 관리자 테스트 콘솔로 옮겼다.
   ★ 옮기면서 문구가 거짓이 되지 않게, 각 상태에서 실제로 참인 문장만 남긴다.
     남기는 기준은 하나다 — "사용자가 알아야 할 사실인가". 지금 결제를 할 수 있는지 없는지,
     결제한 것이 어디에 남는지가 그것이고, 서버 주소가 몇 개 채워졌는지는 아니다.
===================================================================== */
function buildPaymentStatusPanel(){
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['결제']));
  var gate = paywallGate();

  if(gate.live){
    card.appendChild(el('p',{class:'biz-hint'},[
      '유료 해석을 결제하고 바로 열람하실 수 있습니다.' +
      (restoreAvailability().ok
        ? ' 결제하시면 영수증 번호를 알려드립니다. 브라우저 데이터를 지웠거나 기기를 바꿨을 때 그 번호로 이용권을 되살릴 수 있으니 따로 보관해 주세요.'
        : '')
    ]));
    if(gate.sim){
      card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
        '[관리자 테스트 모드] 지금 열려 있는 결제는 시뮬레이션입니다. 실제 결제가 아닙니다.'
      ]));
    }
  } else if(gate.mode === 'trial'){
    /* "체험 모드"라는 말은 결제 서버가 하나도 연결되지 않은 상태에서만 쓴다(buildPaywallBlockedNotice와 같은 규칙). */
    card.appendChild(el('span',{class:'trial-badge'},['체험 모드 — 실제 결제가 아닙니다']));
    card.appendChild(el('p',{class:'biz-hint'},[
      '아직 결제 기능이 연결되지 않아 유료 해석을 구매하실 수 없습니다. 이 화면에서 실제로 결제가 발생하는 일도 없습니다. 무료로 열려 있는 부분은 그대로 이용하실 수 있습니다.'
    ]));
  } else {
    card.appendChild(el('span',{class:'trial-badge'},['판매 준비 중 — 결제가 열리지 않았습니다']));
    card.appendChild(el('p',{class:'biz-hint'},[
      '유료 해석 판매 준비가 끝나지 않아 결제 버튼을 열지 않은 상태입니다. 준비가 끝나기 전까지 이 앱에서 결제가 진행되지 않습니다. 무료로 열려 있는 부분은 그대로 이용하실 수 있습니다.'
    ]));
  }

  /* 관리자 모드일 때만 나타나는 진입점. ADMIN_KEY가 null이면 이 줄은 만들어지지 않는다. */
  if(adminOn()){
    card.appendChild(settingsRow('관리자 테스트 콘솔', '열기', function(){ openAdminConsole(); }));
  } else if(DEV_FLAGS.configOverride && ADMIN_KEY){
    /* ?demo=1 만 붙인 개발 세션이 "서버 주소 입력칸이 사라졌다"고 막다른 길에 서지 않도록 길을 알려준다.
       ★ ADMIN_KEY가 채워진 사본에서만 나온다 — 배포본(null)에서는 이 문장도 DOM에 만들어지지 않는다.
         "키가 null이면 관리자 관련 흔적이 화면에 하나도 없어야 한다"는 원칙이 이 줄에도 적용된다.
         (배포본에서 이 사실을 알아야 하는 사람은 소스를 여는 사람이고, 파일 상단 주석에 적혀 있다.) */
    card.appendChild(el('p',{class:'biz-hint'},[
      '[개발 모드] 서버 주소 설정과 연동 규격 보기는 관리자 테스트 콘솔로 옮겼습니다. 주소 뒤에 ?admin=<ADMIN_KEY 값> 을 붙이면 열립니다.'
    ]));
  }
  return card;
}

/* 관리자 콘솔로 옮긴 운영자용 결제 진단.
   ★ 여기 적히는 문장은 "지금 이 코드가 실제로 하는 일"과 정확히 일치해야 한다.
      서버가 없는데 "서버가 확인해 준 결과만 신뢰합니다"라고 적으면 그건 거짓 고지다. */
function buildBillingPanel(){
  var card = el('div',{class:'admin-sec'});
  card.appendChild(el('h4',{},['6. 결제 연동 진단 · 서버 주소']));

  var authoritative = serverAuthoritative();
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['권한 판정']),
    el('span',{class:'v', style: authoritative?'color:var(--gold);':'color:var(--red-hi);'},
      [authoritative ? '서버가 확인 (서버 권위)' : '이 브라우저에만 저장 (서버 미연결)'])
  ]));
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['유료 본문']),
    el('span',{class:'v', style: serverContentMode()?'color:var(--gold);':''},
      [serverContentMode() ? '풀이 리포트는 서버에서 받아옴' : '이 브라우저에서 생성'])
  ]));
  /* ★ R13에서 월별 운세 상세·대운 구간 상세가 유료 범위(saju_full)에 들어왔다. 이 둘은 계산값에
     한두 문장을 붙이는 형태라 서버 본문 규격(sections 배열)에 태우지 않고 이 브라우저에서 만든다.
     위 줄이 "유료 본문이 전부 서버에서 온다"는 뜻으로 읽히면 과장이므로 예외를 같은 자리에 적는다. */
  if(serverContentMode()){
    card.appendChild(el('p',{class:'biz-hint'},[
      '월별 운세 상세와 대운 구간 상세는 계산 결과에 붙는 짧은 해설이라, 서버 본문 규격을 거치지 않고 이 브라우저에서 만듭니다. 잠긴 구간은 문장 자체를 만들지 않으므로 미결제 상태에서는 화면에 나오지 않습니다.'
    ]));
  }
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['결제 세션 주소']),
    el('span',{class:'v', style:PaymentProvider.isConfigured()?'color:var(--gold);':'color:var(--red-hi);'},
      [PaymentProvider.isConfigured() ? '설정됨' : '미설정'])
  ]));

  /* ★ 결제 버튼이 실제로 열리는지를 별도 줄로 못 박는다.
     "결제창 연동됨"만 보고 결제가 되는 줄 알았다가 돈을 잃는 일이 없어야 한다. */
  var gate = paywallGate();
  var gateText = { trial:'열리지 않음 (체험 모드)', partial:'열리지 않음 (연동 미완료)',
                   legal:'열리지 않음 (표시사항 등록 대기)', live:'열림 (실제 결제)' }[gate.mode];
  card.appendChild(el('div',{class:'biz-row'},[
    el('span',{class:'k'},['결제 버튼']),
    el('span',{class:'v', style: gate.live?'color:var(--gold);':'color:var(--red-hi);'},[gateText])
  ]));

  /* ★ 현재 동작을 그대로 서술한다. 상태에 따라 문장이 달라진다. */
  if(gate.mode === 'trial'){
    card.appendChild(el('span',{class:'trial-badge'},['체험 모드 — 실제 결제가 아닙니다']));
    card.appendChild(el('p',{class:'biz-hint'},[
      '서버 주소가 하나도 설정되지 않아, 이용권이 이 기기(브라우저)에만 저장되는 체험 모드입니다. 이 상태의 이용권은 개발자도구로 위조할 수 있고, 기기를 바꾸면 사라집니다.'
    ]));
  } else if(gate.mode === 'partial'){
    card.appendChild(el('span',{class:'trial-badge'},['연동 미완료 — 결제를 열 수 없습니다']));
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      /* 개수를 글자로 박지 않는다 — PAYWALL_REQUIRED가 늘거나 줄면 문장이 곧바로 거짓이 된다.
         (실제로 verifyEndpoint가 필수로 추가됐을 때 "셋"이라는 문구만 남아 거짓이 됐던 자리다.) */
      '설정되지 않은 항목 — '+gate.missingEndpoints.join(' · ')+'. 위 '+PAYWALL_REQUIRED.length+'개 주소가 모두 채워지기 전에는 결제 버튼을 열지 않습니다. 일부만 연결된 상태로 결제를 열면, 결제는 되는데 이용권이 부여되지 않아 사용자가 실제 손해를 봅니다.'
    ]));
  } else if(gate.mode === 'legal'){
    card.appendChild(el('span',{class:'trial-badge'},['표시사항 등록 대기']));
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '서버는 모두 연결됐지만 전자상거래법 제13조 표시의무 항목('+gate.missingLegal.join(' · ')+')이 비어 있어 결제 버튼을 열지 않습니다.'
    ]));
  } else {
    card.appendChild(el('p',{class:'biz-hint'},[
      /* 서버 목록도 PAYWALL_REQUIRED에서 뽑는다. 돈이 실제로 움직이는 유일한 상태의 설명문이므로
         여기에 빠진 서버가 있으면 안 된다. */
      /* 구분자는 '·'이 아니라 ' / '를 쓴다 — 항목 이름 자체에 '·'가 들어 있어(영수증 검증·구매 복원)
         '·'로 이으면 네 개가 다섯 개처럼 읽힌다. */
      PAYWALL_REQUIRED.map(function(f){ return f[1].replace(/ ?주소$/,''); }).join(' / ')+' 서버가 모두 연결되고 사업자 표시사항도 채워져, 결제 버튼이 열려 있습니다. 이 화면에서 발생하는 결제는 실제 결제입니다.'
    ]));
  }
  if(authoritative){
    card.appendChild(el('p',{class:'biz-hint'},[
      '권한 판정은 서버 응답만 신뢰합니다. 브라우저에 저장된 이용권 값은 잠금 판단에 전혀 쓰이지 않고, 서버가 응답하지 않으면 유료 구간은 잠긴 상태로 남습니다.'
    ]));
  }
  if(authoritative && !serverContentMode()){
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
      '유료 본문 서버(contentEndpoint)가 비어 있어 유료 문장을 이 브라우저가 만들고 있습니다. 파일을 저장해 코드를 고치면 잠금을 우회할 수 있으므로, 본문 서버까지 연결해야 완전히 막힙니다.'
    ]));
  }

  /* ★ 서버 주소의 권위 있는 출처는 소스코드의 BILLING_SOURCE 상수다.
     이 화면 입력칸은 개발 모드(?demo=1)에서만 동작하는 임시 덮어쓰기이며,
     상수가 이미 잡고 있는 항목은 개발 모드에서도 바꿀 수 없다. */
  var pinnedAll = billingPinnedBySource();
  var canEdit = DEV_FLAGS.configOverride;
  card.appendChild(el('p',{class:'biz-hint', style:'margin-top:14px;'},[
    canEdit
      ? '[개발 모드] 아래 입력값은 이 브라우저에만 저장되며 개발자도구로 지울 수 있습니다. 주소 표시줄의 ?demo=1(또는 ?admin=) 을 빼면 즉시 무시됩니다. 실제 운영 배포에는 파일 상단 BILLING_SOURCE 상수에 직접 넣어야 합니다.'
      : '서버 주소는 파일 상단 BILLING_SOURCE 상수에서만 정해집니다. 브라우저에 저장한 값은 권한의 근거로 쓰지 않습니다 — 개발자도구로 지울 수 있는 값을 근거로 삼으면 페이월이 통째로 뚫리기 때문입니다. 개발 중 임시로 바꿔보려면 주소 뒤에 ?demo=1 을 붙이세요.'
  ]));

  var fields = [
    ['entitlementEndpoint', '이용권 조회 주소 (권한의 근거)', 'https://api.내도메인.com/entitlements'],
    ['contentEndpoint',     '유료 본문 조회 주소',            'https://api.내도메인.com/paid-content'],
    ['verifyEndpoint',      '영수증 검증 주소',               'https://api.내도메인.com/verify'],
    ['checkoutEndpoint',    '결제 세션 생성 주소',            'https://api.내도메인.com/checkout']
  ];
  var inputs = {};
  fields.forEach(function(f){
    var pinned = !!BILLING_SOURCE[f[0]];
    var labelText = f[1] + (pinned ? ' · 소스 상수 고정(읽기 전용)' : '');
    card.appendChild(el('label',{class:'k', style:'display:block;margin-top:12px;font-size:.82rem;'},[labelText]));
    var locked = pinned || !canEdit;
    inputs[f[0]] = el('input',{class:'biz-input', type:'url', placeholder:f[2],
      value: BILLING[f[0]] || '', 'aria-label':labelText,
      readOnly: locked ? 'readonly' : null,
      disabled: locked ? 'disabled' : null,
      style: locked ? 'opacity:.55;cursor:not-allowed;' : null});
    card.appendChild(inputs[f[0]]);
  });
  var verifyNote = buildVerifyDependencyNote();
  if(verifyNote) card.appendChild(verifyNote);

  /* ★ 시뮬레이션이 켜져 있으면 입력칸에 가짜 주소가 들어차 있다. 그 상태로 저장하면
     가짜 주소가 브라우저에 남아 다음 실행까지 따라온다. 저장 자체를 막는다. */
  if(canEdit && !pinnedAll && adminSimOn()){
    card.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);margin-top:12px;'},[
      '결제 상태 시뮬레이션이 켜져 있는 동안에는 저장할 수 없습니다(위 칸에 든 시뮬레이션 주소가 브라우저에 저장되는 것을 막기 위해서입니다). 3번에서 "시뮬레이션 끔"을 먼저 누르세요.'
    ]));
  }
  if(canEdit && !pinnedAll && !adminSimOn()){
    card.appendChild(el('button',{class:'btn btn-primary btn-sm', style:'margin-top:12px;', onclick:function(){
      var next = {};
      for(var i=0;i<fields.length;i++){
        var key = fields[i][0];
        if(BILLING_SOURCE[key]) continue; /* 소스 상수가 잡은 칸은 건드리지 않는다 */
        var v = (inputs[key].value||'').trim();
        if(v && !isSecureEndpoint(v)){ showToast('https:// 로 시작하는 주소를 넣어주세요. (개발용 localhost만 http도 됩니다)'); return; }
        next[key] = v || null;
      }
      for(var k in next){ BILLING[k] = next[k]; }
      PaymentProvider.save();
      /* 주소가 바뀌면 권한 근거 자체가 바뀐다. 즉시 다시 조회한다. */
      primeEntitlements();
      render();
      fetchEntitlements().then(function(){
        showToast(serverAuthoritative() ? '[개발용] 서버 권위 모드로 전환했어요.' : '[개발용] 로컬 이용권 모드로 되돌렸어요.');
        render();
      });
    }},['[개발용] 저장']));
  }
  card.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:8px;margin-left:8px;', onclick:function(){
    showBillingContract();
  }},['서버가 지켜야 할 형식 보기']));
  return card;
}
/* 영수증 검증 주소가 이용권 조회 주소에 종속된다는 사실을 화면에 알린다
   (조회 주소가 비면 ?receipt= 검증이 아예 실행되지 않는다). */
function buildVerifyDependencyNote(){
  if(!BILLING.verifyEndpoint || BILLING.entitlementEndpoint) return null;
  return el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
    '영수증 검증 주소는 이용권 조회 주소가 함께 설정돼야 동작합니다. 지금은 조회 주소가 비어 있어 결제창에서 돌아와도 영수증 검증이 실행되지 않습니다.'
  ]);
}
/* 결제 서버가 무엇을 받고 무엇을 돌려줘야 하는지. 백엔드가 이 화면만 보고 만들 수 있어야 한다. */
function showBillingContract(){
  var body = el('div',{class:'sheet-body'});
  function block(title, req, res, note){
    body.appendChild(el('p',{class:'biz-hint', style:'margin-top:12px;color:var(--gold);'},[title]));
    body.appendChild(el('pre',{style:'white-space:pre-wrap;word-break:break-all;font-size:.7rem;background:var(--panel-2);padding:10px;border-radius:8px;'},
      ['요청  '+JSON.stringify(req)+'\n응답  '+JSON.stringify(res)]));
    if(note) body.appendChild(el('p',{class:'biz-hint'},[note]));
  }
  body.appendChild(el('p',{class:'biz-hint'},['모두 POST · Content-Type: application/json · 쿠키 동봉(credentials: include) · 타임아웃 '+(BILLING.timeoutMs/1000)+'초']));
  block('1) 이용권 조회 (entitlementEndpoint)',
    {kind:'entitlements'},
    {items:{saju_full:{purchasedAt:1737000000000}}, pass:{productId:'premium_pass', purchasedAt:1737000000000, expiresAt:1739592000000}, purchases:[{productId:'saju_full', at:1737000000000, price:1900, receiptId:'r_1'}]},
    '이 응답이 권한의 유일한 근거입니다. 미결제 사용자에게도 200으로 { "items":{}, "pass":null, "purchases":[] } 를 돌려주세요. pass.expiresAt은 앞으로의 시각(밀리초)이어야 하며, 0이거나 과거면 이용권이 만료된 것으로 봅니다. 응답이 없거나 오류면 앱은 모든 유료 구간을 잠급니다.');
  block('2) 유료 본문 조회 (contentEndpoint)',
    {productId:'saju_full', sectionFrom:FREE_SECTION_COUNT, payload:{kind:'saju', gender:'여',
      pillars:{year:{stem:'경',branch:'오'}, month:{stem:'임',branch:'오'}, day:{stem:'신',branch:'해'}, hour:{stem:'계',branch:'사'}},
      elements:{목:0,화:3,토:0,금:3,수:2}, dayMasterStrength:'weak',
      sipseong:{비견:1,겁재:1,식신:1,상관:1,편재:0,정재:0,편관:1,정관:2,편인:0,정인:0},
      requested:{sections:13, tone:'따뜻한 반말체', language:'ko'}}},
    {sections:[{id:'s4', title:'내면 · 겉과 속의 차이', icon:'M4 18 L10 6 L16 18', paragraphs:['{{name}}는 …','문단2']}]},
    '결제 여부를 서버에서 먼저 확인하고, 미결제자에게는 403으로 본문을 주지 마세요. paragraphs(평문 배열) 권장 — 앱이 글자로만 넣으므로 스크립트가 실행될 수 없습니다. 요청 payload에는 닉네임과 생년월일·태어난 시각 원본이 들어가지 않습니다(개인정보 최소 전송). 본문에 이름을 넣으려면 {{name}} 이라고 쓰면 앱이 화면에 그릴 때 닉네임으로 바꿔 넣습니다. icon은 SVG path의 d 값(viewBox 0 0 20 20)이고, M/m으로 시작하지 않으면 앱이 기본 아이콘으로 대체합니다.');
  block('3) 영수증 검증 · 구매 복원 (verifyEndpoint)',
    {receiptId:'r_1', productId:'saju_full', intent:'return'},
    {verified:true, reason:'', restored:false, productIds:['saju_full']},
    'intent="return" — 결제창에서 돌아온 주소에 ?receipt=... 가 있을 때 1회 자동 호출합니다. verified가 true여도 앱은 권한을 스스로 주지 않고 1)을 다시 조회합니다. restored·productIds는 없어도 동작합니다(구버전 서버 호환).');
  block('3-1) 구매 복원 요청 (같은 verifyEndpoint, intent만 다름)',
    {receiptId:'r_1', productId:null, intent:'restore'},
    {verified:true, restored:true, productIds:['saju_full'], reason:''},
    '이 앱에는 로그인이 없습니다. 이용자는 쿠키로만 식별되므로, 쿠키를 지우거나 기기를 바꾸면 결제한 이용권을 되찾을 유일한 열쇠가 영수증 번호입니다. '+
    '서버는 이 요청을 받으면 ① receiptId로 결제 원장을 찾고 ② 그 구매를 ★지금 이 요청의 쿠키 세션에 다시 연결(rebind)해야 합니다(세션 쿠키가 없으면 Set-Cookie로 새로 발급). '+
    '재연결을 하지 않고 verified만 true로 돌려주면, 곧이어 나가는 1) 조회가 여전히 빈 값을 돌려주어 이용자 화면에는 "확인은 됐는데 안 열림"만 남습니다(앱은 이 상태도 숨기지 않고 그대로 알립니다). '+
    '보안은 서버 몫입니다 — 영수증 번호는 추측 불가능하게 길고 무작위여야 하고(순번 금지), 복원 시도에 속도 제한을 걸어야 하며, 실패 사유(reason)에 번호의 존재 여부를 알려주는 표현을 쓰지 마세요. reason은 화면에 그대로 표시됩니다.');
  block('4) 결제 세션 생성 (checkoutEndpoint)',
    {productId:'saju_full', price:1900},
    {checkoutUrl:'https://pg.example.com/…'},
    '{ "granted": true, "receiptId": "…" } 형태로 즉시 승인해도 됩니다. 어느 쪽이든 승인 후 앱은 1)을 다시 조회해 서버가 인정한 결과만 반영합니다.');
  openModal('결제 서버 연동 규격', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}

/* =====================================================================
   관리자 테스트 콘솔 — 여기부터 끝까지, ADMIN_KEY가 null이면 한 줄도 실행되지 않는다.
   ---------------------------------------------------------------------
   · 새 모달 컴포넌트를 만들지 않고 기존 openModal()을 그대로 쓴다
     (포커스 트랩 · Esc · 닫을 때 복귀가 이미 그 안에 들어 있다).
   · 화면 갱신은 모달을 다시 열지 않고 본문 컨테이너만 다시 그린다(포커스가 튀지 않게).
===================================================================== */

/* 항상 보이는 배지. 테스트 화면을 실제 화면으로 착각하는 일을 막는 유일한 표시다. */
function adminBadgeMount(){
  if(!adminOn()) return;                       /* 배포본에서는 이 노드가 아예 만들어지지 않는다 */
  if(document.getElementById('adminFlag')) return;
  var bar = el('div',{class:'admin-flag', id:'adminFlag', role:'status'});
  bar.appendChild(el('span',{class:'af-text'},['관리자 테스트 모드 · 실제 결제가 아닙니다']));
  bar.appendChild(el('button',{class:'af-open', type:'button',
    'aria-label':'관리자 테스트 콘솔 열기', onclick:function(){ openAdminConsole(); }},['콘솔']));
  document.body.appendChild(bar);
}

/* 결제 상태 시뮬레이션 — ★ BILLING(메모리)만 바꾼다.
   BILLING_SOURCE 상수와 localStorage의 결제 설정은 한 글자도 건드리지 않으므로,
   새로고침하면 원래 상태로 돌아온다. 'off'는 원래 설정을 다시 읽어오는 것이다. */
function adminApplyBillingSim(mode){
  ADMIN_SIM.billing = mode;
  PaymentProvider.load();                      /* 언제나 "원래 값"에서 다시 시작한다 */
  if(mode === 'off') return;
  if(mode === 'trial'){
    BILLING.entitlementEndpoint = null; BILLING.contentEndpoint = null;
    BILLING.verifyEndpoint = null;      BILLING.checkoutEndpoint = null;
    return;
  }
  if(mode === 'partial'){
    /* 일부만 연결된 상태 — 결제 세션 주소만 있고 나머지가 비었을 때가 가장 위험한 조합이다
       (결제는 되는데 권한이 부여되지 않는다). 그 조합을 그대로 재현한다. */
    BILLING.entitlementEndpoint = null; BILLING.contentEndpoint = null;
    BILLING.verifyEndpoint = null;      BILLING.checkoutEndpoint = ADMIN_SIM_PREFIX+'checkout';
    return;
  }
  BILLING.entitlementEndpoint = ADMIN_SIM_PREFIX+'entitlements';
  BILLING.contentEndpoint     = ADMIN_SIM_PREFIX+'content';
  BILLING.verifyEndpoint      = ADMIN_SIM_PREFIX+'verify';
  BILLING.checkoutEndpoint    = ADMIN_SIM_PREFIX+'checkout';
}

/* 각 주소가 어디서 온 값인지. "설정됨"만 적으면 소스 상수와 시뮬레이션을 구분할 수 없다. */
function adminEndpointOrigin(key){
  var v = BILLING[key];
  if(!v) return '미설정';
  if(BILLING_SOURCE[key]) return '설정됨 · 소스 상수';
  if(String(v).indexOf(ADMIN_SIM_PREFIX) === 0) return '설정됨 · 관리자 시뮬레이션';
  return '설정됨 · 개발용 임시값';
}
/* 이 상품이 지금 열려 있는가, 그리고 그 근거가 무엇인가. */
function adminAccessLabel(id){
  var open = (id === 'premium_pass') ? passActive() : hasAccess(id);
  if(!open) return '잠김';
  if(adminGranted(id)) return '열림 · 관리자 부여요';
  if(serverAuthoritative()) return '열림 · 서버가 인정';
  return '열림 · 이 브라우저 저장분';
}
/* "왜 결제가 안 열리는지"를 한 문장으로. 진단 화면의 결론이다. */
function adminWhyBlocked(gate){
  if(gate.live) return '결제 버튼이 열려 있습니다. 이 상태에서는 결제 모달의 결제하기 버튼이 실제로 동작합니다.';
  if(gate.mode === 'trial')   return '왜 결제가 안 열리나 — 서버 주소가 하나도 설정되지 않았습니다(BILLING_SOURCE 네 칸이 전부 null). 배포 전 기본 상태가 이것이며, 실제로 열려면 소스 상수에 주소를 넣고 법정 표시사항도 채워야 합니다.';
  if(gate.mode === 'partial') return '왜 결제가 안 열리나 — 필요한 주소 중 일부가 비어 있습니다: ' + gate.missingEndpoints.join(' · ');
  return '왜 결제가 안 열리나 — 주소는 다 찼지만 법정 표시사항이 비어 있습니다: ' + gate.missingLegal.join(' · ');
}

function adminRow(k, v, good){
  return el('div',{class:'biz-row'},[
    el('span',{class:'k'},[k]),
    el('span',{class:'v', style: good===true ? 'color:#3F6B45;' : (good===false ? 'color:var(--red-hi);' : '')},[v])
  ]);
}
function adminChip(label, pressed, onclick){
  return el('button',{type:'button', class:'admin-chip', 'aria-pressed': pressed?'true':'false', onclick:onclick},[label]);
}

function openAdminConsole(){
  if(!adminOn()) return;                       /* 이중 방어 — 어떤 경로로 불려도 여기서 멈춘다 */
  var host = el('div',{class:'sheet-body'});
  var logs = [];
  var lastReceipt = null;

  function log(t){ logs.push(new Date().toLocaleTimeString('ko-KR') + ' · ' + t); }
  function refresh(msg){ if(msg) log(msg); render(); paint(); }
  function reload(msg){                        /* 권한 근거가 바뀌었을 때: 다시 조회하고 다시 그린다 */
    primeEntitlements(); paint();
    fetchEntitlements().then(function(){ refresh(msg); });
  }

  /* ---- 1. 현재 상태 진단 ---- */
  function secDiagnose(){
    var s = el('div',{class:'admin-sec'});
    s.appendChild(el('h4',{},['1. 현재 상태 진단']));
    var gate = paywallGate();
    s.appendChild(adminRow('결제 게이트', gate.mode + ' — ' + (gate.live ? '결제 버튼 열림' : (PAYWALL_BLOCKED_LABEL[gate.mode] || '열리지 않음')), gate.live));
    PAYWALL_REQUIRED.forEach(function(f){
      s.appendChild(adminRow(f[1], adminEndpointOrigin(f[0]), !!BILLING[f[0]]));
    });
    s.appendChild(adminRow('빠진 법정 표시사항',
      gate.missingLegal.length ? gate.missingLegal.join(' · ') : '없음', !gate.missingLegal.length));
    s.appendChild(adminRow('권한 판정 주체',
      serverAuthoritative() ? '서버 (조회 ' + (ENT.ready ? '완료' : '진행 중') + ')' : '이 브라우저 (체험)', serverAuthoritative()));
    if(ENT.error) s.appendChild(adminRow('마지막 서버 오류', ENT.error, false));
    s.appendChild(adminRow('유료 본문 출처', serverContentMode() ? '서버 (풀이 리포트 13섹션)' : '이 브라우저', serverContentMode()));
    ['saju_full','mbti_full','compat_full','premium_pass'].forEach(function(id){
      var open = (id === 'premium_pass') ? passActive() : hasAccess(id);
      s.appendChild(adminRow(PRODUCTS[id].name, adminAccessLabel(id), open));
    });
    if(adminGrantsSuppressed()){
      s.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
        '서버가 거부했습니다 — 지금은 서버 권위 모드라 관리자 부여가 잠금 판정에 반영되지 않습니다. 서버가 "권한 없음"으로 답하는 동안에는 잠긴 채로 둡니다. 관리자 부여로 서버 판정을 이길 수 없습니다.'
      ]));
    }
    s.appendChild(el('p',{class:'biz-hint'},[adminWhyBlocked(gate)]));
    return s;
  }

  /* ---- 2. 상품별 권한 부여 / 회수 ---- */
  var GRANTABLE = ['saju_full','mbti_full','compat_full','premium_pass'];
  function secGrants(){
    var s = el('div',{class:'admin-sec'});
    s.appendChild(el('h4',{},['2. 상품별 권한 부여 / 회수']));
    s.appendChild(el('p',{class:'biz-hint'},[
      '일반 이용권과 다른 저장 키(' + ADMIN_STORAGE_KEY + ')에 저장하고, 관리자 모드가 아닐 때는 읽지도 않습니다. 주소에서 ?admin= 을 빼고 새로고침하면 여기서 연 것은 전부 다시 잠깁니다.'
    ]));
    if(serverAuthoritative()){
      s.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
        '지금은 서버 권위 모드라 아래 부여가 화면 잠금에 반영되지 않습니다. 권한의 근거는 서버 응답뿐입니다.'
      ]));
    }
    var chips = el('div',{class:'admin-chips'});
    GRANTABLE.forEach(function(id){
      chips.appendChild(adminChip(PRODUCTS[id].name, !!ADMIN_GRANTS[id], function(){
        if(ADMIN_GRANTS[id]) delete ADMIN_GRANTS[id]; else ADMIN_GRANTS[id] = true;
        saveAdminGrants();
        refresh((ADMIN_GRANTS[id] ? '권한 부여요 — ' : '권한 회수 — ') + PRODUCTS[id].name);
      }));
    });
    s.appendChild(chips);
    var row = el('div',{class:'admin-chips'});
    row.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){
      GRANTABLE.forEach(function(id){ ADMIN_GRANTS[id] = true; });
      saveAdminGrants(); refresh('전부 열기');
    }},['전부 열기']));
    row.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){
      ADMIN_GRANTS = {}; saveAdminGrants(); refresh('전부 잠그기');
    }},['전부 잠그기']));
    s.appendChild(row);
    return s;
  }

  /* ---- 3. 결제 상태 4가지 시뮬레이션 ---- */
  function secBillingSim(){
    var s = el('div',{class:'admin-sec'});
    s.appendChild(el('h4',{},['3. 결제 상태 시뮬레이션']));
    s.appendChild(el('p',{class:'biz-hint'},[
      '가짜 주소를 메모리에만 넣어 네 가지 상태의 화면을 그대로 봅니다. 소스 상수(BILLING_SOURCE)와 브라우저 저장값은 건드리지 않으므로, 새로고침하면 원래 상태로 돌아옵니다.'
    ]));
    var chips = el('div',{class:'admin-chips'});
    [['off','시뮬레이션 끔 (원래 설정)'],
     ['trial','trial · 체험 (주소 0개)'],
     ['partial','partial · 연동 미완 (일부만)'],
     ['legal','legal · 표시사항 대기'],
     ['live','live · 판매 중 (결제 버튼 열림)']].forEach(function(m){
      chips.appendChild(adminChip(m[1], ADMIN_SIM.billing === m[0], function(){
        adminApplyBillingSim(m[0]);
        reload('결제 상태 시뮬레이션 → ' + m[0]);
      }));
    });
    s.appendChild(chips);
    s.appendChild(el('p',{class:'biz-hint'},[
      '상태를 바꾼 뒤 결제 모달을 열어 보려면: 콘솔을 닫고 내 사주 탭 → "내 사주 풀이 읽어보기"로 들어가, 잠긴 카드의 "더보기" 버튼을 누르시면 됩니다.'
    ]));
    return s;
  }

  /* ---- 4. 서버 응답 시뮬레이션 ---- */
  function secResponseSim(){
    var s = el('div',{class:'admin-sec'});
    s.appendChild(el('h4',{},['4. 서버 응답 시뮬레이션']));
    s.appendChild(el('p',{class:'biz-hint'},[
      '위 3번의 시뮬레이션 주소로 나가는 요청에만 적용됩니다. 실제 서버 주소가 설정돼 있으면 그쪽 응답이 그대로 쓰입니다 — 진짜 서버의 판정을 이 설정이 덮어쓰지 않습니다. 실패는 전부 잠금 쪽으로 떨어지는 것이 정상입니다.'
    ]));
    if(!adminSimOn()){
      s.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
        '지금은 결제 상태 시뮬레이션이 꺼져 있어 아래 설정이 적용되지 않습니다. 3번에서 legal 또는 live를 먼저 고르세요.'
      ]));
    }
    [['ent','권한 조회', [['grant','성공 · 권한 있음'],['deny','성공 · 권한 없음(거부)'],['http4','실패 4xx'],['http5','실패 5xx'],['timeout','타임아웃'],['malformed','형식오류']]],
