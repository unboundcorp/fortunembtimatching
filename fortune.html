/* =====================================================================
   R59 — 브라우저 뒤로가기 (대표님 지시)
   ---------------------------------------------------------------------
   이 앱은 화면을 옮겨도 주소가 그대로라, 뒤로가기를 누르면 앱 안에서 한 칸
   돌아가는 게 아니라 앱 자체를 나가 버렸다. 폰에서는 화면 가장자리를 쓸어도
   같은 일이 생긴다 — 궁합을 다 보고 뒤로가기 한 번에 밖으로 나가는 셈이다.

   ★ 주소는 건드리지 않는다. 화면 이름을 방문 기록에만 얹는다.
     주소에 #saju 같은 것을 붙이면 링크(#g=, #gj=)를 읽는 코드와 부딪히고,
     손님이 주소를 복사해 보낼 때도 엉뚱한 화면이 열린다.
   ★ 모달이 떠 있으면 뒤로가기는 '모달 닫기'다. 화면을 옮기지 않는다.
     폰에서 창을 닫는 가장 익숙한 동작이 뒤로가기이기 때문이다.
   ★ 되돌아갈 때는 다시 기록을 쌓지 않는다. 안 그러면 앞뒤로 오가며 무한히 쌓인다.
===================================================================== */
var HISTORY_ON = false;      /* 첫 화면을 그린 뒤부터 기록을 쌓는다 */
var POPPING = false;         /* 뒤로가기로 되돌아가는 중 — 이때는 기록을 쌓지 않는다 */

var LAST_ROUTE = null;
/* ★ 화면 전환은 setRoute() 말고도 코드 곳곳에서 ROUTE='...'; render(); 로 일어난다.
   setRoute 한 군데만 잡으면 절반은 놓친다. 그래서 실제로 그려지는 자리에서 잡는다. */
function pushRouteHistory(route){
  if(!HISTORY_ON || POPPING) return;
  if(route === LAST_ROUTE) return;
  try{ history.pushState({app:1, route:route}, '', location.pathname + location.search); }catch(e){}
}
function pushModalHistory(){
  if(!HISTORY_ON) return;
  try{ history.pushState({app:1, modal:1, route:ROUTE}, '', location.pathname + location.search); }catch(e){}
}

window.addEventListener('popstate', function(e){
  var st = e.state;
  /* 우리가 얹은 기록이 아니면(앱에 들어오기 전 페이지) 브라우저가 하던 대로 둔다. */
  if(!st || !st.app){
    if($('#activeModal')){ closeModal(true); }
    return;
  }
  POPPING = true;
  try{
    /* 모달이 떠 있으면 그것부터 닫는다. */
    if($('#activeModal')){ closeModal(true); }
    else if(st.route && st.route !== ROUTE){ ROUTE = st.route; render(); window.scrollTo(0,0); }
  } finally { POPPING = false; }
});

function setRoute(route){
  ROUTE = route;
  /* R24 — 화면을 옮기면 돌아갈 모달도 없다. 남겨두면 엉뚱한 때 되살아난다.
     R25 — 떠 있던 모달도 함께 걷는다. 예전에는 스택만 비워서, 용어 설명을 열어 둔 채
     "용어 사전 열기"가 아닌 경로로 화면이 바뀌면 새 화면 위에 옛 모달이 남았다. */
  clearModalStack(true);
  $all('.tab-btn').forEach(function(b){
    var on=b.dataset.route===route;
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  render();
  var main=$('#main'); main.focus();
}
function updateHeader(){
  var header=$('#appHeader'), tabbar=$('#tabbarWrap');
  var hasProfiles = STATE.profiles.length>0;
  header.hidden = !hasProfiles;
  tabbar.hidden = !hasProfiles;
  if(!hasProfiles) return;
  var sw=$('#profileSwitch');
  sw.innerHTML='';
  var select=el('select',{'aria-label':'활성 프로필 선택', onchange:function(e){
    STATE.activeId = e.target.value; saveState(); render();
  }});
  STATE.profiles.forEach(function(p){
    var opt=el('option',{value:p.id},[p.name]);
    if(p.id===STATE.activeId) opt.setAttribute('selected','selected');
    select.appendChild(opt);
  });
  sw.appendChild(select);
}
function statMini(k,v){ return el('div',{class:'stat-mini'},[el('div',{class:'k'},[k]),el('div',{class:'v'},[v])]); }
/* =====================================================================
   R22 — 화면 머리말: 작은 회색 라벨 + 그 아래 큰 제목 (+ 필요하면 설명 한 줄)
   ---------------------------------------------------------------------
   레퍼런스(점신)에서 가장 크게 빌려온 규칙이다. 예전에는 큰 제목 하나뿐이라 화면이 밋밋했고,
   깊이 들어간 화면(월별 운세·사주 풀이·궁합 상세)에서는 "지금 어디인지"를 알 길이 없었다.
   eyebrow는 그래서 장식이 아니라 빵부스러기다 — 제목·본문·순서는 하나도 바꾸지 않는다.
   sub에는 문자열이나 노드를 넘길 수 있고, 넘기지 않으면 만들지 않는다.
===================================================================== */
/* =====================================================================

   1:1 궁합 요약(기능10)·그룹 궁합 네트워크 평균 게이지(기능17)에서 공용으로 재사용한다. */
var DONUT_GRAD_ID = 'donutGoldGrad';
function buildDonutGauge(score, size, label){
  size = size || 148;
  score = Math.max(0, Math.min(100, Math.round(score)));
  var stroke = Math.round(size*0.075);
  var r = (size - stroke)/2;
  var c = size/2;
  var circumference = 2*Math.PI*r;
  var offset = circumference * (1 - score/100);
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+size+' '+size);
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  svg.setAttribute('role','img'); svg.setAttribute('aria-label','점수 '+score+'점');
  var defs=document.createElementNS(ns,'defs');
  var grad=document.createElementNS(ns,'linearGradient'); grad.setAttribute('id',DONUT_GRAD_ID);
  grad.setAttribute('x1','0%'); grad.setAttribute('y1','0%'); grad.setAttribute('x2','100%'); grad.setAttribute('y2','100%');
  var s1=document.createElementNS(ns,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#57431A');
  var s2=document.createElementNS(ns,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#7A5F22');
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad); svg.appendChild(defs);
  var track=document.createElementNS(ns,'circle');
  track.setAttribute('cx',c); track.setAttribute('cy',c); track.setAttribute('r',r);
  track.setAttribute('fill','none'); track.setAttribute('stroke','#E5E1D6'); track.setAttribute('stroke-width',stroke);
  svg.appendChild(track);
  var fg=document.createElementNS(ns,'circle');
  fg.setAttribute('cx',c); fg.setAttribute('cy',c); fg.setAttribute('r',r);
  fg.setAttribute('fill','none'); fg.setAttribute('stroke','url(#'+DONUT_GRAD_ID+')'); fg.setAttribute('stroke-width',stroke);
  fg.setAttribute('stroke-linecap','round');
  fg.setAttribute('stroke-dasharray', circumference.toFixed(2));
  fg.setAttribute('stroke-dashoffset', offset.toFixed(2));
  fg.setAttribute('transform','rotate(-90 '+c+' '+c+')');
  fg.setAttribute('class','stamp-in');
  svg.appendChild(fg);
  var wrap=el('div',{class:'donut-gauge', style:'width:'+size+'px;height:'+size+'px;'});
  wrap.appendChild(svg);
  var numHtml = score+'점'+(label?('<small>'+escapeHtml(label)+'</small>'):'');
  wrap.appendChild(el('div',{class:'donut-gauge-num', html:numHtml}));
  return wrap;
}

/* =====================================================================
   R20 — 값 편집 시트. 예전 openRowSheet를 대체한다.
   ---------------------------------------------------------------------
   예전에는 시트 안에서 무엇을 고르는 순간 곧바로 실제 상태(SETUP·COMPAT_DRAFT)가 바뀌었다.
   대표님 요청은 "값을 넣고 저장이나 확인을 누르는 단계"이므로, 이 함수는 편집용 사본(draft)을
   따로 만들어 컨트롤이 그 사본만 건드리게 하고, [확인]을 눌러야 commit()이 실제 상태에 옮긴다.

   · [확인]은 바뀐 게 없으면 비활성이다(누를 이유가 없는 버튼을 살려두지 않는다).
   · 바뀐 게 있는 동안에는 Esc·배경 클릭으로 닫히지 않는다(MODAL_GUARD). 대신 알린다.
   · [취소]는 언제나 닫힌다 — 되돌릴 길이 없으면 그건 잠금이 아니라 함정이다.

   makeDraft()      편집용 사본을 만든다(원본을 건드리면 안 된다)
   build(d, redraw) 시트 본문을 그린다. 컨트롤은 d만 바꾸고 redraw()로 시트를 다시 그린다.
   commit(d)        [확인]을 눌렀을 때 실제 상태에 반영한다.
===================================================================== */
function openValueSheet(title, makeDraft, build, commit, opts){
  opts = opts || {};
  var initial = makeDraft();
  var base = JSON.stringify(initial);
  var draft = JSON.parse(base);
  function dirty(){ return JSON.stringify(draft) !== base; }
  function warn(){ showToast('저장하지 않은 변경이 있어요. [확인]으로 저장하거나 [취소]로 되돌려 주세요.'); }
  function doCommit(){
    MODAL_GUARD=null; closeModal(true);
    commit(draft);
    showToast(opts.savedToast || (title+' 저장했어요.'));
    render();
  }
  function redraw(){
    var body = el('div',{class:'sheet-body'});
    body.appendChild(build(draft, redraw));
    if(dirty()){
      body.appendChild(el('p',{class:'unsaved-line', role:'status'},
        ['저장하지 않은 변경이 있어요. [확인]을 눌러야 반영돼요.']));
    }
    /* ★ 값이 바뀔 때마다 openModal()을 다시 부르면 모달을 통째로 헐고 다시 짓게 된다.
       openModal()은 마지막에 첫 요소로 포커스를 옮기는데, 그 첫 요소가 바로 방금 고른
       <select>다. 모바일 브라우저는 select가 포커스를 받으면 선택창을 다시 여는 경우가 있어,
       "고르고 나면 닫혀야 할 창이 자꾸 다시 뜨는" 현상이 생긴다(대표님 제보, 2026-08-10).
       그래서 이미 열려 있으면 본문과 [확인] 버튼 상태만 제자리에서 갈아끼운다.
       포커스를 건드리지 않으므로 고른 자리에 그대로 머문다. */
    var box = $('#activeModal') && $('#activeModal').querySelector('.modal-box');
    var oldBody = box && box.querySelector('.sheet-body');
    if(box && oldBody){
      box.replaceChild(body, oldBody);
      var btns = box.querySelectorAll('.modal-close-row .btn');
      var confirmBtn = btns.length ? btns[btns.length-1] : null;
      if(confirmBtn){
        /* ★ R33 — alwaysConfirm이면 바꾼 게 없어도 [확인]을 누를 수 있다.
           프로필 마법사에서 필요하다. 거기서는 "고른 적이 있는가"를 따로 기록하는데,
           기본값이 이미 내가 원하는 값이면(2000년생이거나 성별이 여자인 경우)
           바꿀 것이 없어 [확인]이 죽고, 그러면 영영 고를 수가 없어 다음 단계로 못 간다.
           실제로 그 상태를 만들어 보고 발견했다. */
        if(dirty() || opts.alwaysConfirm){ confirmBtn.removeAttribute('disabled'); confirmBtn.onclick = doCommit; }
        else { confirmBtn.setAttribute('disabled','disabled'); confirmBtn.onclick = null; }
      }
      MODAL_GUARD = dirty() ? warn : null;
      return;
    }
    openModal(title, body, [
      {label:'취소', cls:'btn-ghost', onclick:function(){ MODAL_GUARD=null; closeModal(true); }},
      {label: opts.confirmLabel || '확인', cls:'btn-primary', disabled: (!dirty() && !opts.alwaysConfirm),
       onclick: doCommit}
    ]);
    /* ★ 순서가 중요하다. openModal()은 안에서 closeModal(true)로 이전 모달을 걷어내는데
       그 과정에서 MODAL_GUARD를 지운다. 그래서 잠금은 반드시 openModal "뒤에" 건다.
       (처음엔 앞에 걸었다가, 시트를 다시 그리는 순간 잠금이 풀려 Esc로 닫혀 버렸다 — 실측으로 잡았다.) */
    MODAL_GUARD = dirty() ? warn : null;
  }
  redraw();
}

   R20 — 진태양시 보정 표시 도구
   ---------------------------------------------------------------------
   "왜 결과가 달라지는지"를 사용자가 스스로 확인할 수 있어야 한다. 그래서 보정을 한 덩어리로
   숨기지 않고 경도차·균시차·서머타임을 항목별로 펼쳐서 보여주고, 켰을 때와 껐을 때의 시주를
   같은 화면에 나란히 적는다(다른 앱과 비교하는 사람이 어느 항목 때문에 다른지 짚을 수 있게).
===================================================================== */
var HOUR_BRANCH_LABEL = ['자시(子)','축시(丑)','인시(寅)','묘시(卯)','진시(辰)','사시(巳)',
                         '오시(午)','미시(未)','신시(申)','유시(酉)','술시(戌)','해시(亥)'];
function fmtSignedMin(x){
  var r = Math.round(x*10)/10;
  var body = (Math.abs(r - Math.round(r)) < 0.05) ? String(Math.round(r)) : r.toFixed(1);
  return (r>0?'+':'')+body+'분';
}
function fmtHm(o){ return pad2(o.hour)+':'+pad2(o.minute); }
function fmtYmd(o){ return o.y+'-'+pad2(o.m)+'-'+pad2(o.d); }
function placeLabelOfKey(key, lon){
  if(key && key!=='custom'){
    for(var i=0;i<SajuEngine.BIRTH_PLACES.length;i++){ if(SajuEngine.BIRTH_PLACES[i].key===key) return SajuEngine.BIRTH_PLACES[i].label; }
  }
  for(var j=0;j<SajuEngine.BIRTH_PLACES.length;j++){ if(Math.abs(SajuEngine.BIRTH_PLACES[j].lon-lon)<0.005) return SajuEngine.BIRTH_PLACES[j].label; }
  return '직접 입력';
}
function hourPillarText(saju){
  if(!saju || !saju.hour) return '시주 없음';
  return saju.hour.text+'('+saju.hour.textH+') · '+HOUR_BRANCH_LABEL[saju.hour.branchIdx];
}
/* spec: {y,m,d, timeUnknown, hour, minute, lon, lonKey, adjust} — y/m/d는 "양력으로 변환된" 날짜다. */
function buildTimeAdjustTable(spec){
  var wrap = el('div',{});
  if(spec.timeUnknown){
    /* R30 — 여기도 용어를 걷었다(시주·진태양시). 시각을 아직 모르는 사람에게는 계산 얘기가 필요 없다. */
    wrap.appendChild(el('p',{class:'ts-note'},[
      '태어난 시각을 모른다고 선택하셨어요. 그래서 태어난 시각 자리는 비워 두고, 해의 위치에 맞추는 계산도 하지 않습니다. 나중에 시각을 알게 되면 프로필을 수정해 주세요.'
    ]));
    return wrap;
  }
  var lon = (typeof spec.lon==='number' && isFinite(spec.lon)) ? spec.lon : SajuEngine.LON_DEFAULT;
  /* ★ R37 — 여기서도 자오선을 넘겨야 한다. 안 넘기면 계산(내 사주 표)은 해외 기준으로 맞는데
     이 안내표만 한국 기준으로 나와, 화면이 서로 다른 말을 하게 된다(실측으로 잡았다). */
  var merPlace = spec.lonKey ? SajuEngine.birthPlaceOf(spec.lonKey) : null;
  var mer = (merPlace && typeof merPlace.meridian==='number') ? merPlace.meridian
          : (spec.lonKey==='custom' ? Math.round(lon/15)*15 : undefined);
  var abroadHere = (typeof mer==='number');
  var on  = SajuEngine.computeSaju(spec.y, spec.m, spec.d, spec.hour, spec.minute, {lon:lon, adjust:true, meridian:mer});
  var off = SajuEngine.computeSaju(spec.y, spec.m, spec.d, spec.hour, spec.minute, {lon:lon, adjust:false, meridian:mer});
  var ta = on.timeAdjust;
  var tbl = el('div',{class:'ts-table'});
  function row(k,v,strong){
    tbl.appendChild(el('div',{class:'ts-row'+(strong?' ts-strong':'')},
      [el('span',{class:'ts-k'},[k]), el('span',{class:'ts-v'},[v])]));
  }
  var effDateNote = (ta.eff.y===spec.y && ta.eff.m===spec.m && ta.eff.d===spec.d) ? '' : (' ('+fmtYmd(ta.eff)+')');
  row('입력한 시각', pad2(spec.hour)+':'+pad2(spec.minute)+(abroadHere ? ' · 그 지역 표준시 시계 시각' : ' · 한국 표준시 시계 시각'));
  row('출생지', placeLabelOfKey(spec.lonKey, lon)+' · '+(lon<0 ? ('서경 '+Math.abs(lon).toFixed(2)) : ('동경 '+lon.toFixed(2)))+'도');
  row('당시 표준자오선', ta.beforeStd ? '표준시 제도 이전 (동경 127.5도로 가정)'
      : ((ta.meridian<0 ? ('서경 '+Math.abs(ta.meridian)) : ('동경 '+ta.meridian))+'도'));
  row('서머타임', abroadHere ? '반영하지 않음 (해외는 서머타임 이력을 싣지 않았어요)'
      : (ta.dstMin ? ('시행 중 — 시계가 '+ta.dstMin+'분 앞당겨져 있었어요') : '해당 없음'));
  row('경도차 보정', fmtSignedMin(ta.lonMin));
  row('균시차', fmtSignedMin(ta.eotMin));
  row('보정 합계', fmtSignedMin(ta.totalMin));
  /* '→' 글자를 쓰면 낭독기가 "오른쪽 화살표"라고 읽는다. 뜻은 낱말로 적는다
     (앱 전체에서 화살표 글자를 없애온 것과 같은 규칙 — R16·R17 참고). */
  row('보정 켰을 때 진태양시', fmtHm(ta.eff)+effDateNote, spec.adjust);
  row('보정 켰을 때 시주', hourPillarText(on), spec.adjust);
  row('보정 껐을 때 시주', hourPillarText(off), !spec.adjust);
  /* =====================================================================
     R30 — 이 카드가 대표님이 "일반인이 보기에 어렵다"고 짚으신 자리 중 하나였다.
     표준자오선·경도차·균시차가 표와 설명에 그대로 펼쳐져 있었고, 한 문단에 용어 버튼이 셋이었다.
     계산은 한 줄도 바꾸지 않는다. 보이는 순서만 뒤집는다.
       · 겉 = "몇 시로 보고 계산했는지" 한 문장(용어 0개)
       · 안(접이식) = 예전 표와 설명 전부. 한 줄도 지우지 않았다.
  ===================================================================== */
  var detail = el('div',{});
  detail.appendChild(tbl);

  var sameHour = on.hour && off.hour && on.hour.idx===off.hour.idx;
  var sameDay  = on.day.idx===off.day.idx;
  var msg;
  if(spec.adjust){
    msg = '입력하신 '+pad2(spec.hour)+':'+pad2(spec.minute)+'은 진태양시로 '+fmtHm(ta.eff)+effDateNote+'이고, 시주는 '+hourPillarText(on)+'입니다.';
    if(sameHour && sameDay) msg += ' 이 시각은 보정을 껐을 때와 결과가 같습니다.';
    else {
      var offTxt = hourPillarText(off), offDay = off.day.text+'('+off.day.textH+')';
      msg += ' 보정을 끄면 시주가 '+offTxt+josaOnlyText(offTxt,'으로','로');
      msg += sameDay ? ' 바뀝니다.' : (', 일주도 '+offDay+josaOnlyText(offDay,'으로','로')+' 바뀝니다(자시 경계를 넘기 때문입니다).');
    }
  } else {
    msg = '지금은 보정을 끈 상태라 입력하신 '+pad2(spec.hour)+':'+pad2(spec.minute)+'을 그대로 써서 시주는 '+hourPillarText(off)+'입니다.';
    if(sameHour && sameDay) msg += ' 이 시각은 보정을 켜도 결과가 같습니다.';
    else {
      var onTxt = hourPillarText(on), onDay = on.day.text+'('+on.day.textH+')';
      msg += ' 보정을 켜면 진태양시 '+fmtHm(ta.eff)+effDateNote+' 기준으로 시주가 '+onTxt+josaOnlyText(onTxt,'으로','로');
      msg += sameDay ? ' 바뀝니다.' : (', 일주도 '+onDay+josaOnlyText(onDay,'으로','로')+' 바뀝니다(자시 경계를 넘기 때문입니다).');
    }
  }
  detail.appendChild(el('p',{class:'ts-note', style:'color:var(--ink);'},[msg]));
  detail.appendChild(el('p',{class:'ts-note'},[
    '한국 표준시는 동경 135도를 기준으로 하는데 서울은 동경 약 127도예요. 그래서 서울에서 해가 가장 높이 뜨는 시각은 시계로 12시가 아니라 12시 32분쯤입니다. 진태양시 보정은 이 차이(경도차)와, 지구 궤도 때문에 생기는 하루 길이의 오차(균시차, 최대 약 16분)를 함께 되돌려 시주 경계를 실제 태양 위치에 맞추는 계산이에요.'
  ]));
  if(ta.dstMin){
    detail.appendChild(el('p',{class:'ts-note'},[
      '태어나신 날은 서머타임 시행 기간이라 당시 시계가 1시간 앞당겨져 있었어요. 보정을 켜면 이 1시간도 함께 되돌립니다.'
    ]));
  }
  if(ta.meridian===127.5 && !ta.beforeStd){
    detail.appendChild(el('p',{class:'ts-note'},[
      '태어나신 시기에 대한민국 표준자오선은 동경 135도가 아니라 127.5도였어요(1908~1911년, 1954~1961년). 보정을 켜면 그 시기의 기준을 씁니다.'
    ]));
  }
  if(ta.beforeStd){
    detail.appendChild(el('p',{class:'ts-note'},[
      '1908년 4월 1일 이전은 표준시 제도 자체가 없던 시기예요. 이 앱은 그 시기의 지방시 자료를 확인하지 못해 첫 표준자오선(동경 127.5도)으로 가정해 계산합니다. 이 시기의 시주는 참고만 해주세요.'
    ]));
  }
  detail.appendChild(el('p',{class:'ts-note'},[
    '보정을 끄면 입력한 시계 시각을 그대로 쓰고 표준자오선 이력·서머타임도 반영하지 않습니다. 다른 앱과 결과를 맞춰볼 때 쓰세요. 명리학계에서도 진태양시를 쓰는 쪽과 시계 시각을 그대로 쓰는 쪽이 갈리므로, 어느 한쪽이 정답이라고 말하지 않습니다.'
  ]));

  /* 겉으로 보이는 한 문장 — 같은 사실을 용어 없이 적는다. 값(시각·달라지는지 여부)은
     위에서 계산한 그대로이고, 여기서 새로 계산하는 것은 없다. */
  var changeWord = (sameHour && sameDay) ? null
                 : (sameDay ? '태어난 시각을 적은 두 글자가 달라져요.'
                            : '태어난 시각과 태어난 날을 적은 두 글자가 모두 달라져요.');
  var plain;
  if(spec.adjust){
    /* 분 단위 숫자 뒤 조사는 한국어로 읽었을 때의 받침으로 갈린다(13:39 → "구" 받침 없음).
       기존 josaNum()을 그대로 쓴다. 날짜가 덧붙는 경우(effDateNote)에는 ')' 뒤라 '입니다'로 받는다. */
    plain = '입력하신 '+pad2(spec.hour)+':'+pad2(spec.minute)+'을 그날 해가 떠 있던 위치에 맞추면 '+fmtHm(ta.eff)+effDateNote+
            (effDateNote ? '입니다.' : josaNum(ta.eff.minute,'이에요.','예요.'))+' 이 시각으로 계산했습니다.';
    plain += changeWord ? (' 맞추지 않으면 '+changeWord) : ' 맞추지 않아도 결과는 같은 시각이에요.';
  } else {
    plain = '지금은 맞추기를 꺼 두셔서, 입력하신 '+pad2(spec.hour)+':'+pad2(spec.minute)+'을 그대로 써서 계산했어요.';
    plain += changeWord ? (' 맞추기를 켜면 '+changeWord) : ' 맞추기를 켜도 결과는 같아요.';
  }
  wrap.appendChild(el('p',{class:'ts-note', style:'color:var(--ink);'},[plain]));
  wrap.appendChild(buildFoldPanel({
    label:'어떻게 맞췄는지 자세히 보기', openLabel:'자세한 설명 접기',
    regionLabel:'태어난 시각을 해의 위치에 맞추는 계산 자세히', btnStyle:'margin-top:10px;',
    children:[detail]
  }).wrap);
  /* R23 — 이 표는 여러 화면이 함께 쓴다. 여기서 한 번 훑어 두면 그 화면 모두에서 용어를 눌러 뜻을 볼 수 있다.
     ★ 다만 "값 편집 시트" 안에서는 훑지 않는다(spec.noTerms). openModal()은 새 모달을 열 때
       기존 모달을 강제로 닫으므로(closeModal(true)), 저장하지 않은 입력이 남아 있는 시트 위에서
       용어를 누르면 그 입력이 말없이 사라진다. R20이 만든 "저장 단계"를 깨뜨리지 않기 위한 예외다. */
  return spec.noTerms ? wrap : autoTermify(wrap);
}
/* 출생지 + 진태양시 보정을 한 시트에서 고른다(둘은 늘 같이 움직이는 값이라 따로 두면 오히려 헷갈린다). */
function buildPlaceAdjustSheetBody(d, redraw, spec){
  var body = el('div',{});
  body.appendChild(el('p',{class:'section-sub'},['출생지 (경도로 진태양시를 계산해요)']));
  /* R37 — 국내와 해외를 나눠 보여준다. 한 줄로 다 늘어놓으면 국내 지역을 찾기 어렵다. */
  function chipRow(list){
    var chips = el('div',{class:'admin-chips'});
    list.forEach(function(pl){
      chips.appendChild(el('button',{type:'button', class:'admin-chip',
        'aria-pressed': (d.birthLonKey===pl.key)?'true':'false',
        onclick:function(){ d.birthLonKey=pl.key; d.birthLon=pl.lon; redraw(); }},[pl.label]));
    });
    return chips;
  }
  var domestic = SajuEngine.BIRTH_PLACES.filter(function(x){ return !x.abroad; });
  var abroad   = SajuEngine.BIRTH_PLACES.filter(function(x){ return x.abroad; });
  body.appendChild(chipRow(domestic));
  body.appendChild(el('p',{class:'section-sub', style:'margin:12px 0 0;'},['해외에서 태어나셨다면']));
  var abroadChips = chipRow(abroad);
  abroadChips.appendChild(el('button',{type:'button', class:'admin-chip',
    'aria-pressed': (d.birthLonKey==='custom')?'true':'false',
    onclick:function(){ d.birthLonKey='custom'; redraw(); }},['직접 입력']));
  body.appendChild(abroadChips);

  /* ★ 해외를 골랐으면 한계를 그 자리에서 말한다. 나중에 알면 늦다. */
  var chosen = d.birthLonKey ? SajuEngine.birthPlaceOf(d.birthLonKey) : null;
  if((chosen && chosen.abroad) || d.birthLonKey==='custom'){
    body.appendChild(el('p',{class:'warn-box', style:'margin-top:10px;'},[
      d.birthLonKey==='custom'
        ? '직접 넣으신 경도는 가장 가까운 표준자오선으로 어림해 계산해요. 나라 경계가 자오선과 딱 맞지 않는 곳(인도·중국 등)은 몇 분 차이가 날 수 있어요. 그리고 해외는 서머타임 이력을 반영하지 않아요 — 서머타임 기간에 태어나셨다면 태어난 시각을 1시간 당겨 넣어주세요.'
        : '해외는 그 지역 표준시로 계산해요. 다만 서머타임 이력은 반영하지 않아요 — 서머타임 기간에 태어나셨다면 태어난 시각을 1시간 당겨 넣어주세요.'
    ]));
  }
  if(d.birthLonKey==='custom'){
    var lonInput = el('input',{class:'biz-input', type:'number', step:'0.01', min:'-180', max:'180',
      value:String(d.birthLon), 'aria-label':'출생지 경도(동경, 도 단위)'});
    /* 한 글자 칠 때마다 시트를 다시 그리면 입력칸에서 포커스가 튄다.
       입력 중에는 편집 사본의 값만 갱신하고, 칸에서 손을 뗄 때(change/blur) 미리보기를 다시 그린다.
       ★ 여기서 바뀌는 것도 편집 사본(d)이다 — 실제 프로필은 [확인]을 눌러야 바뀐다. */
    lonInput.addEventListener('input', function(){
      var v = parseFloat(lonInput.value);
      /* R37 — 예전에는 120~135도(한국)만 받아서 해외에서 태어난 분은 아예 입력을 못 했다.
         전 세계 경도를 받는다. 자오선을 모르면 가장 가까운 15도 배수로 어림한다(아래 안내 참고). */
      if(isFinite(v) && v>=-180 && v<=180){
        d.birthLon = Math.round(v*100)/100;
        d.birthMeridian = Math.round(d.birthLon/15)*15;
      }
    });
    lonInput.addEventListener('change', function(){ redraw(); });
    body.appendChild(el('label',{class:'k', style:'display:block;margin-top:10px;font-size:.82rem;'},['경도 (동경 +, 서경 −)']));
    body.appendChild(lonInput);
    body.appendChild(el('p',{class:'biz-hint'},[
      '한국은 124~132 사이예요. 해외라면 그 도시의 경도를 넣어주세요(서쪽은 음수, 예: 뉴욕 −74).'
    ]));
  }
  body.appendChild(el('div',{class:'chk-row', style:'margin-top:14px;'},[
    el('input',{type:'checkbox', id:'tsAdjChk', checked: d.solarTimeAdjust?'checked':null,
      onchange:function(e){ d.solarTimeAdjust = e.target.checked; redraw(); }}),
    el('label',{for:'tsAdjChk'},['진태양시 보정 적용'])
  ]));
  if(spec){
    body.appendChild(buildTimeAdjustTable({
      y:spec.y, m:spec.m, d:spec.d, timeUnknown:spec.timeUnknown,
      hour:spec.hour, minute:spec.minute, lon:d.birthLon, lonKey:d.birthLonKey, adjust:d.solarTimeAdjust,
      noTerms:true   /* 값 편집 시트 안 — 위 buildTimeAdjustTable 주석 참고 */
    }));
  }
  return body;
}

/* 저장된 프로필의 출생지·보정 설정을 고치는 시트. [확인]을 눌러야 반영되고, 그때 사주 캐시를 버린다. */
function openTimeAdjustEditor(p){
  var solar = {year:p.year, month:p.month, day:p.day}; /* 프로필에는 이미 양력으로 변환된 날짜가 들어 있다 */
  var bt = p.birthTime;
  openValueSheet('출생지 · 태어난 시각 보정(진태양시)',
    function(){ return {birthLonKey:p.birthLonKey||'custom', birthLon:profileLon(p), solarTimeAdjust:!!p.solarTimeAdjust}; },
    function(d, redraw){
      return buildPlaceAdjustSheetBody(d, redraw, {
        y:solar.year, m:solar.month, d:solar.day,
        timeUnknown: !bt, hour: bt?bt.hour:12, minute: bt?(bt.minute||0):0
      });
    },
    function(d){
      /* R25 — 보정을 바꾸면 시주가 바뀌고, 그러면 대표 오행도 바뀔 수 있다.
         바뀌기 전 값을 붙잡아 두었다가 실제로 달라지면 buildElementFixNotice가 알린다.
         (예전에는 저장된 대표 오행이 갱신조차 되지 않아 궁합이 옛 값을 계속 썼다.) */
      p.elementIdxBefore = (typeof p.elementIdx==='number' ? p.elementIdx : null);
      p.elementSyncMigrated = (p.elementIdxBefore!==null);
      p.birthLonKey=d.birthLonKey; p.birthLon=d.birthLon; p.solarTimeAdjust=d.solarTimeAdjust;
      p.timeAdjustMigrated = false;   /* 사용자가 직접 결정했으므로 안내 상자를 더 띄우지 않는다 */
      p.sajuCache = null;             /* 보정이 바뀌면 예전 계산 결과는 버린다 */
      saveState();
    },
    {savedToast:'출생지·보정 설정을 저장했어요.'});
}
/* R20 마이그레이션 안내 — "왜 예전 그대로인지"와 "켜면 무엇이 달라지는지"를 같은 자리에서 말한다. */
function buildMigrateNotice(p){
  if(!p || !p.timeAdjustMigrated) return null;
  var box = el('div',{class:'migrate-box'});
  box.appendChild(el('strong',{},['진태양시 보정이 새로 생겼어요 (기존 결과는 그대로 두었습니다)']));
  if(!p.birthTime){
    box.appendChild(el('p',{},['이 프로필은 태어난 시각을 모른다고 저장되어 있어서 시주를 만들지 않아요. 보정이 결과를 바꾸지 않으니 지금 하실 일은 없어요.']));
  } else {
    var on  = SajuEngine.computeSaju(p.year,p.month,p.day,p.birthTime.hour,p.birthTime.minute||0,{lon:profileLon(p), adjust:true});
    var off = SajuEngine.computeSaju(p.year,p.month,p.day,p.birthTime.hour,p.birthTime.minute||0,{lon:profileLon(p), adjust:false});
    var same = on.hour && off.hour && on.hour.idx===off.hour.idx && on.day.idx===off.day.idx;
    box.appendChild(el('p',{},[
      '한국 표준시(동경 135도)와 실제 출생지 경도의 차이를 되돌리는 계산이에요. 이 보정을 기본으로 켜면 예전에 보시던 시주가 말없이 바뀌기 때문에, 이미 저장된 이 프로필은 예전 그대로(보정 끔) 두었습니다.'
    ]));
    var offH = hourPillarText(off), onH = hourPillarText(on);
    box.appendChild(el('p',{style:'margin-top:6px;'},[ same
      ? ('이 프로필은 보정을 켜도 시주가 '+offH+josaOnlyText(offH,'으로','로')+' 같습니다.')
      /* R22 — 남아 있던 '→' 글자 2건을 낱말로 바꾼다(낭독기가 "오른쪽 화살표"라고 읽던 자리다).
         R21 자체 점검에 "고치지 않고 적어 둔다"고 남겨 둔 항목이고, 뜻은 그대로다. */
      : ('보정을 켜면 시주가 '+offH+'에서 '+onH+josaOnlyText(onH,'으로','로')+' 바뀝니다.'
         + (on.day.idx===off.day.idx ? '' : ' 일주도 '+off.day.text+'에서 '+on.day.text+josaOnlyText(on.day.text,'으로','로')+' 바뀝니다.')) ]));
    /* R25 — 글자가 바뀌면 "여덟 글자 중 가장 많은 기운"도 바뀔 수 있고, 그 값은 궁합 점수에도 쓰인다.
       켜기 전에 무엇이 달라지는지 여기서 함께 보여준다(켠 뒤에 알리는 것은 늦다). */
    var elemOff = dominantElementIdx(off).idx, elemOn = dominantElementIdx(on).idx;
    if(elemOff !== elemOn){
      box.appendChild(el('p',{style:'margin-top:6px;'},[
        '보정을 켜면 '+charCountWord(p)+' 글자 중 가장 많은 기운(대표 오행)도 '+ELEMENTS[elemOff]+'에서 '+ELEMENTS[elemOn]+
        josaOnlyText(ELEMENTS[elemOn],'으로','로')+' 바뀝니다. 이 값은 궁합의 오행 점수와 그룹 궁합 그림에도 쓰여요.'
      ]));
    }
  }
  var row = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;'});
  row.appendChild(el('button',{class:'btn btn-primary btn-sm', onclick:function(){ openTimeAdjustEditor(p); }},['보정 설정 열기']));
  row.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){
    p.timeAdjustMigrated=false; saveState(); showToast('예전 설정을 그대로 유지할게요.'); render();
  }},['지금 그대로 둘게요']));
  box.appendChild(row);
  return autoTermify(box);
}

/* =====================================================================
   R24 마이그레이션 안내 — 절기 시각을 바로잡았고, 그래서 이 프로필의 기둥이 바뀌었다.
   ---------------------------------------------------------------------
   ★ R20(진태양시)과 다른 점: 그건 "유파가 갈리는 선택"이라 토글로 두었지만, 이건 그냥 계산이
     틀려 있던 것이다. 틀린 쪽을 옵션으로 남겨 두지 않는다 — 바로잡되, 결과가 달라지는
     사람에게는 무엇이 무엇으로 바뀌었는지와 그 근거(절기 시각)를 그대로 보여준다.
   ★ 결과가 그대로인 사람(대다수)에게는 아무것도 띄우지 않고 표식만 내린다.
     바뀐 게 없는데 "바뀌었을 수 있어요"라고 알리면 그것도 사실과 다른 안내다.
===================================================================== */
function buildTermFixNotice(p){
  if(!p || !p.termAccuracyMigrated) return null;
  var opts = sajuOptsOf(p);
  var bt = p.birthTime;
  var hour = bt ? bt.hour : null, minute = bt ? (bt.minute||0) : 0;
  var now = SajuEngine.computeSaju(p.year, p.month, p.day, hour, minute, {lon:opts.lon, adjust:opts.adjust});
  var old = SajuEngine.computeSaju(p.year, p.month, p.day, hour, minute, {lon:opts.lon, adjust:opts.adjust, legacyTerms:true});
  var yChanged = now.year.idx !== old.year.idx;
  var mChanged = now.month.idx !== old.month.idx;
  if(!yChanged && !mChanged){
    p.termAccuracyMigrated = false;   /* 바뀐 게 없으니 다시 계산해 볼 이유도 없다 */
    saveState();
    return null;
  }
  var box = el('div',{class:'migrate-box'});
  box.appendChild(el('strong',{},['계절이 바뀌는 마디의 시각 계산을 바로잡았어요 (이 프로필의 결과가 달라졌습니다)']));
  box.appendChild(el('p',{},[
    /* ★ R32 — 이 24분은 "바로잡기 전"의 오차다. 다른 화면(용어 사전·이용약관)이 말하는 "최대 약 12분"은
       "바로잡은 뒤 남은" 차이라, 화면만 보면 정확도를 말하는 숫자가 두 개로 갈리는 것처럼 읽혔다(검수 지적).
       숫자를 바꾸지 않고, 어느 쪽이 언제의 값인지를 문장 안에서 구분해 준다. */
    '계절이 바뀌는 마디의 시각을 계산하는 방법에 빠진 부분이 있어서, 그 시각이 실제와 조금씩 어긋나 있었어요(바로잡기 전 기준으로 대체로 이르게, 실측 범위는 24분 이르게부터 3분 늦게까지). 이번에 바로잡았고, 그 마디 가까이에서 태어나신 이 프로필은 글자가 달라졌어요. 바로잡은 뒤에도 공개 자료와 최대 약 12분 차이는 남습니다.'
  ]));
  var list = el('div',{class:'ts-table', style:'margin-top:8px;'});
  function row(k,v){ list.appendChild(el('div',{class:'ts-row'},[el('span',{class:'ts-k'},[k]), el('span',{class:'ts-v'},[v])])); }
  if(yChanged){
    row('태어난 해의 기둥(연주)', old.year.text+'('+old.year.textH+')에서 '+now.year.text+'('+now.year.textH+')'+josaOnly(now.year.text,'으로','로')+' 바뀌었어요');
    var ipOld = SajuEngine.ipchunUTCms(p.year, true), ipNew = SajuEngine.ipchunUTCms(p.year, false);
    row('그 해 입춘 시각', '예전에는 '+kstStamp(ipOld)+'로 잡혀 있었고, 바로잡은 값은 '+kstStamp(ipNew)+'예요');
  }
  if(mChanged){
    row('태어난 달의 기둥(월주)', old.month.text+'('+old.month.textH+')에서 '+now.month.text+'('+now.month.textH+')'+josaOnly(now.month.text,'으로','로')+' 바뀌었어요');
    if(now.termBoundary && now.termBoundary.current && old.termBoundary && old.termBoundary.current){
      row('기준이 된 절기', '예전에는 '+old.termBoundary.current.name+' '+kstStamp(old.termBoundary.current.ms)+
          '로 잡혀 있었고, 바로잡은 값은 '+now.termBoundary.current.name+' '+kstStamp(now.termBoundary.current.ms)+'예요');
    }
  }
  /* ★ R25 — 기둥이 바뀌면 여덟 글자가 바뀌고, 그러면 "가장 많은 오행"도 바뀔 수 있다.
     이 값은 궁합의 오행 점수와 그룹 궁합 그림이 쓰는 값이라 궁합 점수까지 함께 달라진다.
     기둥만 알리고 이 줄을 빼면 사용자는 궁합 점수가 왜 달라졌는지 알 수 없다. */
  var elemNow = dominantElementIdx(now).idx, elemOld = dominantElementIdx(old).idx;
  if(elemNow !== elemOld){
    row(charCountWord(p)+' 글자 중 가장 많은 기운(대표 오행)',
        ELEMENTS[elemOld]+'에서 '+ELEMENTS[elemNow]+josaOnly(ELEMENTS[elemNow],'으로','로')+
        ' 바뀌었어요. 이 값은 궁합의 오행 점수와 그룹 궁합 그림에도 쓰여서, 예전에 보신 궁합 점수와 달라질 수 있어요');
    /* 이 상자가 대표 오행 변화를 이미 설명했으니, 아래 buildElementFixNotice가 같은 말을 또 하지 않게 한다.
       (원인이 절기 보정인 경우는 여기서 끝난다. 다른 이유로 어긋난 경우는 표식을 그대로 두어
        buildElementFixNotice가 따로 알린다.) */
    if(p.elementSyncMigrated){ p.elementSyncMigrated = false; p.elementIdxBefore = null; saveState(); }
  }
  box.appendChild(list);
  box.appendChild(el('p',{style:'margin-top:8px;'},[
    '바뀐 쪽이 바른 값이에요. 예전 화면을 저장해 두셨거나 다른 곳에 옮겨 적어 두셨다면 이 값으로 고쳐 주세요. 절기 경계에 아주 가까운 시각이라 다른 앱과도 갈릴 수 있으니, 아래 절기 경계 안내도 함께 봐주세요.'
  ]));
  box.appendChild(el('div',{style:'margin-top:10px;'},[
    el('button',{class:'btn btn-primary btn-sm', onclick:function(){
      p.termAccuracyMigrated=false; saveState(); showToast('확인하신 것으로 표시했어요.'); render();
    }},['확인했어요'])
  ]));
  return autoTermify(box);
}

/* =====================================================================
   R25 마이그레이션 안내 — 대표 오행 사본이 계산과 어긋나 있던 프로필.
   ---------------------------------------------------------------------
   절기 보정이 원인인 경우는 위 buildTermFixNotice 상자가 한 줄로 함께 설명하고 표식을 내린다.
   여기는 그 밖의 경우다 — 대표적으로 R20~R24 사이에 진태양시 보정을 켜거나 껐던 프로필이다.
   그때 시주가 바뀌면서 여덟 글자가 바뀌었는데도 저장된 대표 오행은 그대로였다.
   ★ 바뀐 게 없으면(대다수) 아무것도 띄우지 않고 표식만 내린다 — R24 상자와 같은 규칙이다.
===================================================================== */
function buildElementFixNotice(p){
  if(!p || !p.elementSyncMigrated) return null;
  var before = p.elementIdxBefore;
  var saju = getSajuResult(p);   /* 이 호출이 p.elementIdx를 계산 결과에 맞춘다 */
  if(before===null || before===undefined || !saju || before===p.elementIdx){
    p.elementSyncMigrated = false; p.elementIdxBefore = null; saveState();
    return null;
  }
  var box = el('div',{class:'migrate-box'});
  box.appendChild(el('strong',{},['대표 오행을 계산 결과에 맞췄어요 (이 프로필의 값이 달라졌습니다)']));
  box.appendChild(el('p',{},[
    '여덟 글자 중 가장 많은 기운은 프로필을 만들 때 한 번 계산해 저장해 두고 있었는데, 그 뒤에 계산이 달라져도(태어난 시각을 해의 위치에 맞추는 설정을 켜거나 끄면 글자가 바뀝니다) 저장된 값이 따라오지 않았어요. 그래서 이 프로필은 화면마다 다른 기운을 말하고 있었습니다. 이번에 계산 결과 하나만 쓰도록 고쳤어요.'
  ]));
  var list = el('div',{class:'ts-table', style:'margin-top:8px;'});
  list.appendChild(el('div',{class:'ts-row'},[
    el('span',{class:'ts-k'},[charCountWord(p)+' 글자 중 가장 많은 기운(대표 오행)']),
    el('span',{class:'ts-v'},[ELEMENTS[before]+'에서 '+ELEMENTS[p.elementIdx]+josaOnly(ELEMENTS[p.elementIdx],'으로','로')+' 바뀌었어요'])
  ]));
  box.appendChild(list);
  box.appendChild(el('p',{style:'margin-top:8px;'},[
    '바뀐 쪽이 지금 이 화면의 '+charCountWord(p)+' 글자에서 실제로 센 값이에요. 이 값은 궁합의 오행 점수와 그룹 궁합 그림에도 쓰이니, 예전에 보신 궁합 점수와 달라질 수 있어요.'
  ]));
  box.appendChild(el('div',{style:'margin-top:10px;'},[
    el('button',{class:'btn btn-primary btn-sm', onclick:function(){
      p.elementSyncMigrated=false; p.elementIdxBefore=null; saveState(); showToast('확인하신 것으로 표시했어요.'); render();
    }},['확인했어요'])
  ]));
  return autoTermify(box);
}

/* =====================================================================
   렌더: 온보딩
===================================================================== */
function renderOnboarding(){
  var main=$('#main'); main.innerHTML='';
  var wrap=el('div',{class:'onboard view'});
  wrap.appendChild(buildConstellationSvg());
  wrap.appendChild(el('h1',{},[COMPANY.serviceName]));
  /* ★ R22 — 첫 화면에 캐릭터 셋을 세운다. 이 앱을 처음 본 사람이 "무슨 앱인지"를
     문장보다 먼저 알게 되는 자리이고, 여기에는 계산 근거·고지·결제가 없다.
     세 종만 쓰는 이유: 21종을 다 세우면 320px에서 줄이 네 겹이 되고 첫 화면이 시끄러워진다. */
  var introKeys = ['e0','e1','e4'];
  var introRow = el('div',{class:'char-row'});
  introKeys.forEach(function(k){
    if(CHARACTERS[k]) introRow.appendChild(buildCharSvg(k, 62, {mini:true, label:CHARACTERS[k].name+' 캐릭터'}));
  });
  if(introRow.childNodes.length) wrap.appendChild(introRow);
  /* R30 — 앱을 처음 만나는 화면이다. 여기서는 용어를 한 개도 쓰지 않는다.
     ('만세력'·'사주팔자'는 내 사주 화면과 용어 사전에 그대로 있다 — 없앤 게 아니라 뒤로 미뤘다.)
     고지도 짧은 한 문장만 둔다. 아직 아무 계산도 보여주기 전이라 여기서 접이식까지 놓으면
     "시작하기" 버튼 앞에 눌러야 할 것이 하나 더 생긴다. 자세한 설명은 결과 화면마다 붙는다. */
  wrap.appendChild(el('p',{},['MBTI와 사주를 기반으로 운세와 궁합을 풀어보는 서비스입니다. 회원가입 없이 편하게 링크 하나로 가족·친구·연인과 함께 궁합도 볼 수 있어요.']));
  /* =====================================================================
     R49 — 만 14세 이상 확인 (대표님 지시)
     ---------------------------------------------------------------------
     약관 제6조와 개인정보처리방침 제9조에 "만 14세 미만은 이용할 수 없다"고 적어 두었는데
     정작 묻지를 않았다. 적어만 두고 확인하지 않으면 그건 고지가 아니라 문구일 뿐이다.
     (개인정보 보호법 제22조의2 — 만 14세 미만은 법정대리인 동의가 있어야 한다.
      우리는 동의를 받을 수단이 없으므로 아예 받지 않는 쪽을 택한다.)

     ★ 나이를 묻지 않는다. 생년월일을 이미 받지만 그건 사주를 계산하려고 받는 것이라
       나이 확인에 쓰면 목적 외 이용이 된다. 스스로 확인하는 방식으로 둔다.
     ★ 체크를 안 하면 [시작하기]가 눌리지 않는다. 확인 없이 넘어가면 안 물어본 것과 같다.
  ===================================================================== */
  var ageOk = false;
  var startBtn = el('button',{class:'btn btn-primary', disabled:'disabled', onclick:function(){
    if(!ageOk) return;
    /* ★ R50 — 곧바로 프로필 마법사로 보내지 않는다. 무엇을 받는지 모른 채
       생년월일부터 넣으라고 하지 않기 위해, 먼저 홈에서 무엇을 볼지 고르게 한다. */
    STATE.onboarded=true; saveState(); ROUTE='home'; render();
  }},['시작하기']);
  var chk = el('input',{type:'checkbox', id:'ageOk14'});
  chk.addEventListener('change', function(e){
    ageOk = !!e.target.checked;
    if(ageOk) startBtn.removeAttribute('disabled'); else startBtn.setAttribute('disabled','disabled');
  });

function buildConstellationSvg(){
  var pts=[[30,110],[70,40],[140,25],[200,60],[230,130],[180,190],[100,180]];
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 260 220'); svg.setAttribute('class','constellation'); svg.setAttribute('aria-hidden','true');
  for(var i=0;i<pts.length-1;i++){
    var line=document.createElementNS(ns,'line');
    line.setAttribute('x1',pts[i][0]); line.setAttribute('y1',pts[i][1]);
    line.setAttribute('x2',pts[i+1][0]); line.setAttribute('y2',pts[i+1][1]);
    line.style.animationDelay=(i*0.18)+'s';
    svg.appendChild(line);
  }
  pts.forEach(function(p,i){
    var c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r',4);
    c.style.animationDelay=(i*0.18+0.15)+'s';
    svg.appendChild(c);
  });
  return svg;
}

function setupSnapshot(s){

    year:s.year, month:s.month, day:s.day, timeUnknown:s.timeUnknown, hour:s.hour, minute:s.minute,
    gender:s.gender, birthLonKey:s.birthLonKey, birthLon:s.birthLon, solarTimeAdjust:s.solarTimeAdjust});
}

function startSetupWizard(editProfile){

    calendarType: editProfile? editProfile.calendarType : 'solar',
    lunarLeap: editProfile? !!editProfile.lunarLeap : false,
    year: editProfile? editProfile.year : 2000,

    timeUnknown: editProfile? !bt : false,

       R33 — "내가 어디까지 채웠는지" 알 수 있게 한다 (대표님 지적, 2026-08-11)
       ---------------------------------------------------------------------
       위 값들은 화면을 그리려면 뭐라도 들어 있어야 해서 2000-01-01 · 12:00 같은 기본값을 넣어 둔다.
       문제는 그 기본값이 **내가 고른 값과 화면에서 똑같이 보인다**는 것이다.
       그래서 "2000년으로 골랐던가?"를 알 수 없고, 아무것도 안 고르고 [다음]을 눌러도
       2000년 1월 1일 정오생 사주가 조용히 만들어진다.

       특히 성별은 위험하다 — 대운이 도는 방향을 정하는 값이라, 기본값(여자)이 그대로 넘어가면

function computeSetupSaju(){

  }
  var hour = SETUP.timeUnknown? null : SETUP.hour;
  var minute = SETUP.timeUnknown? 0 : SETUP.minute;
  var saju = SajuEngine.computeSaju(y,m,d,hour,minute,{lon:SETUP.birthLon, adjust:SETUP.solarTimeAdjust, meridian:setupMeridian()});
  return {solarY:y, solarM:m, solarD:d, saju:saju};
}

/* =====================================================================

/* opts(선택) — 넘기지 않으면 R26까지와 완전히 같다.
   ★ R27 `keepHourSlot` : 시주가 없어도 그 칸을 지우지 않고 "시간 모름"으로 비워 둔다.
     궁합처럼 두 사람 표를 나란히 놓는 자리에서, 한쪽만 시간을 모르면 기둥이 4개와 3개로
     갈려 같은 항목이 서로 다른 줄에 서던 문제를 막는다. 계산에는 아무 영향이 없다 —
     빠진 시주는 여전히 계산에서 빠져 있고, 여기서는 자리만 남긴다.
   ★ R27 `noNote` : 아래 안내 문장을 여기서 붙이지 않는다. 부르는 쪽이 두 사람 몫을
     한 문장으로 합쳐 적을 때 쓴다(같은 말을 두 번 하지 않기 위해서다). */
function buildPillarTable(saju, opts){
  opts = opts || {};
  var hasHour = !!saju.hour;
  var showHourSlot = hasHour || !!opts.keepHourSlot;
  var cols = showHourSlot ? ['hour','day','month','year'] : ['day','month','year'];
  /* R23 — 칸 이름을 "연주/월주/일주/시주"에서 "태어난 해 / 연주"로 뒤집는다.
     일상어를 위에 크게, 원래 용어는 아래에 작게 남긴다(용어를 지우지 않는다). */
  var labelMap = {year:'연주', month:'월주', day:'일주', hour:'시주'};
  var plainMap = {year:'태어난 해', month:'태어난 달', day:'태어난 날', hour:'태어난 시각'};
  var table=el('div',{class:'pillar-table no-term', style:'--cols:'+cols.length+';'});
  cols.forEach(function(pos){
    var g=saju[pos];
    var col=el('div',{class:'pillar-col'});
    col.appendChild(termChip(labelMap[pos],{plain:plainMap[pos], cls:'tchip-tight'}));
    if(!g){
      /* 비워 두는 칸. 아무 설명 없는 빈칸은 두지 않는다 — 무슨 칸인지는 위 이름표가,
         왜 비었는지는 이 두 글자가 말한다. 화면 낭독기에는 "태어난 시각 시주 시간 모름"으로 읽힌다. */
      var empty=el('div',{class:'pillar-seal is-empty'});
      empty.appendChild(el('div',{class:'ch-empty'},['시간']));
      empty.appendChild(el('div',{class:'ch-empty'},['모름']));
      col.appendChild(empty);
      table.appendChild(col);
      return;
    }
    var stemSeal=el('div',{class:'pillar-seal elem-'+SajuEngine.STEM_ELEM[g.stemIdx]});
    stemSeal.appendChild(el('div',{class:'ch'},[g.stem]));
    stemSeal.appendChild(el('div',{class:'ch-h'},[g.stemH]));
    var branchSeal=el('div',{class:'pillar-seal elem-'+SajuEngine.BRANCH_ELEM[g.branchIdx]});
    branchSeal.appendChild(el('div',{class:'ch'},[g.branch]));
    branchSeal.appendChild(el('div',{class:'ch-h'},[g.branchH]));
    col.appendChild(stemSeal);
    col.appendChild(branchSeal);
    table.appendChild(col);
  });
  var scrollWrap = el('div',{class:'pillar-table-scroll'},[table]);
  if(!hasHour && !opts.noNote){
    var note=el('p',{class:'section-sub'},['시간을 몰라서 시주는 계산에서 제외했어요.']);
    var wrap=el('div',{},[scrollWrap,note]);
    return wrap;
  }
  return scrollWrap;
}
function buildElemBars(counts){
  var total = counts.reduce(function(a,b){return a+b;},0) || 1;

/* R23 — 십성 라벨도 뒤집는다: 위에 일상어(mini), 아래에 원래 용어.
   sipseongOf() 호출과 그 결과는 그대로다 — 이름을 어떻게 보여줄지만 바뀌었다. */
function buildSipseongOverlay(saju){

    var branchSip = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.BRANCH_ELEM[g.branchIdx], SajuEngine.BRANCH_YY[g.branchIdx]);

var REL_LABEL_BRANCH = SajuEngine.BRANCHES;
/* R23 — 예전에는 `충 자오`, `파 묘오`, `상형 형`처럼 용어가 앞에 그대로 서 있었다.
   용어를 지우지 않고 자리와 크기만 바꾼다: 일상어를 위에 크게, 원래 용어를 아래에 작게.
   일상어 문장은 여기서 짓지 않고 TERMS[키].short를 그대로 읽는다(설명은 한 곳에만 있다).
   판정 결과(rel) 자체는 한 글자도 손대지 않았다 — 읽어서 그리기만 한다. */
function relationBadges(rel){
  var wrap=el('div',{class:'term-chip-row no-term'});
  function two(pair){ return REL_LABEL_BRANCH[pair[0].idx]+REL_LABEL_BRANCH[pair[1].idx]; }
  /* ★ 같은 관계가 두 자리에서 겹치면 칩 글자가 똑같아 화면에 같은 칩이 두 번 찍힌다.
     (예: 자(子) 하나가 시지의 오·일지의 오와 각각 충이면 '자오 충'이 두 번)
     계산은 맞지만 읽는 사람에게는 그냥 버그로 보인다 — 실제로 그렇게 보였다.
     그래서 **표시만** 합치고 몇 자리에서 생겼는지 덧붙인다. rel(계산 결과)은 건드리지 않는다. */
  var items=[], order=[], seen={};
  function add(key, term, cls){ items.push({key:key, term:term, cls:cls}); }
  rel.hap.forEach(function(pair){ add('육합', two(pair)+' 육합', 'tchip-hap'); });
  rel.samhap.forEach(function(s){
    var key = s.full ? '삼합' : '반합';
    add(key, ELEMENTS[s.elem]+'국 '+key, 'tchip-hap');
  });
  rel.banghap.forEach(function(s){ add('방합', ELEMENTS[s.elem]+' 방합', 'tchip-hap'); });
  rel.chung.forEach(function(pair){ add('충', two(pair)+' 충', 'tchip-chung'); });
  rel.pa.forEach(function(pair){ add('파', two(pair)+' 파', 'tchip-pa'); });
  rel.hyeong.forEach(function(h){
    /* h.type은 '삼형'·'상형'·'자형'. 예전에는 뒤에 '형'을 한 번 더 붙여 `상형 형`으로 찍혔다. */
    var chars = (h.chars||[]).map(function(b){ return REL_LABEL_BRANCH[b]; }).join('');
    add(h.type, (chars?chars+' ':'')+h.type, 'tchip-hyeong');
  });
  items.forEach(function(it){
    var k = it.key+'|'+it.term+'|'+it.cls;
    if(seen[k]) seen[k].n++;
    else { seen[k]={it:it, n:1}; order.push(k); }
  });
  order.forEach(function(k){
    var e = seen[k];
    wrap.appendChild(termChip(e.it.key, {term: e.it.term + (e.n>1 ? ' · '+e.n+'곳' : ''), cls: e.it.cls}));
  });
  if(rel.hap.length+rel.samhap.length+rel.banghap.length+rel.chung.length+rel.pa.length+rel.hyeong.length===0){
    wrap.appendChild(termChip('합충형파',{plain:'뚜렷하게 얽히는 자리가 없어요', term:'합·충·형·파 없음'}));
  }
  return wrap;
}

===================================================================== */
/* =====================================================================
   R50 — 홈: 무엇을 볼지 고르는 자리 (대표님 지시)
   ---------------------------------------------------------------------
   예전 홈은 곧바로 '오늘의 운세'였다. 처음 온 사람은 이 앱이 무엇을 해 주는지
   모른 채 운세부터 보게 됐고, 궁합이 있다는 것도 탭을 눌러 봐야 알았다.
   이제 홈에서 두 가지 중 하나를 고르고, 고른 쪽 화면만 보여준다.

   ★ 프로필이 없어도 이 화면은 열린다. 고른 다음에 필요한 정보를 받는다 —
     무엇을 받는지 모르는 채로 생년월일부터 넣으라고 하지 않는다.
   ★ 무료·유료 경계를 여기서 미리 말한다. 결제 화면에 가서야 알게 되면 안 된다.
===================================================================== */
/* =====================================================================
   R54 — 운영 현황판 (대표님 요청)
   ---------------------------------------------------------------------
   주소 끝에 #stats 를 붙여야 열린다. 화면 어디에도 이 문으로 가는 버튼은 없고,
   서버는 테스트 허가를 받은 세션에만 답한다(그 허가는 #unlock 코드로만 받는다).

   ★ 방문자 수는 없다. 이 앱은 광고·분석 도구를 하나도 쓰지 않으며
     개인정보처리방침에도 그렇게 적어 두었다. 세려면 추적을 붙여야 하고,
     그 순간 그 문장이 거짓이 된다. 없는 것을 있는 척하지 않는다.
   ★ 대신 이미 쌓여 있는 기록으로 알 수 있는 것을 보여준다 —
     링크를 몇 개 만들었고 그중 몇 개에 상대가 실제로 들어왔는지 같은 것.
     이게 방문자 수보다 서비스 상태를 더 잘 말해 준다.
===================================================================== */
var STATS_DATA = null, STATS_ERR = null, STATS_RANGE = 'd7';
function renderStats(){
  var main=$('#main'); main.innerHTML='';
  var view=el('div',{class:'view'});
  view.appendChild(pageHead('운영 현황판', '서비스가 어떻게 쓰이고 있나요',
    '대표님만 보시는 화면이에요. 새로 모으는 정보는 없고, 이미 쌓인 기록을 세어 보여드려요.'));

  if(STATS_ERR){
    view.appendChild(el('p',{class:'section-sub', style:'color:var(--red-hi);'},[STATS_ERR]));
    view.appendChild(el('button',{class:'btn btn-ghost btn-block', onclick:function(){ STATS_ERR=null; loadStats(); }},['다시 시도']));
    main.appendChild(view); return;
  }
  if(!STATS_DATA){
    view.appendChild(el('p',{class:'section-sub'},['불러오는 중이에요…']));
    main.appendChild(view); return;
  }
  var D = STATS_DATA, R = STATS_RANGE;

  /* 기간 고르기 */
  var seg=el('div',{class:'seg-toggle', style:'margin-bottom:16px;'});
  [['d1','오늘'],['d7','7일'],['d30','30일']].forEach(function(pair){
    seg.appendChild(el('button',{type:'button','aria-pressed':R===pair[0]?'true':'false',
      onclick:(function(k){ return function(){ STATS_RANGE=k; render(); }; })(pair[0])},[pair[1]]));
  });
  view.appendChild(seg);

  function card(title, rows, note){
    var c=el('div',{class:'scroll-card'});
    c.appendChild(el('h3',{},[title]));
    var t=el('div',{class:'stat-grid'});
    rows.forEach(function(r){
      t.appendChild(el('div',{class:'stat-cell'},[
        el('div',{class:'stat-k'},[r[0]]),
        el('div',{class:'stat-v'},[String(r[1])])
      ]));
    });
    c.appendChild(t);
    if(note) c.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;'},[note]));
    return c;
  }

  var rm = D.rooms[R], gp = D.groups[R], od = D.orders[R], ai = D.ai[R];

  view.appendChild(card('궁합 링크', [
    ['만든 링크', rm.made+'개'],
    ['상대가 들어옴', rm.joined+'개'],
    ['들어온 비율', rm.rate+'%']
  ], '링크를 보냈는데 상대가 안 열면 이 비율이 떨어져요. 서비스가 실제로 퍼지고 있는지 가장 잘 보여주는 숫자입니다. (전체 누적 '+D.rooms.all+'개)'));

  view.appendChild(card('그룹', [
    ['만든 그룹', gp.made+'개'],
    ['참여한 사람', gp.people+'명'],
    ['그룹당 평균', gp.avg+'명'],
    ['가장 큰 그룹', gp.max+'명']
  ], '전체 누적 '+D.groups.all+'개'));

  var prodRows = [];
  for(var k in od.byProduct){ prodRows.push([k, od.byProduct[k].count+'건 · '+formatWon(od.byProduct[k].amount)]); }
  view.appendChild(card('결제', [
    ['결제 완료', od.paid+'건'],
    ['매출', formatWon(od.revenue)],
    ['시도했다 실패', od.failed+'건'],
    ['결제창까지 감', od.created+'건']
  ], prodRows.length ? null : '아직 결제가 없어요. 토스 키를 넣으시면 여기에 쌓입니다.'));
  if(prodRows.length) view.appendChild(card('상품별', prodRows));

  view.appendChild(card('AI 해석', [
    ['새로 만든 글', ai.generated+'건'],
    ['추정 원가', formatWon(ai.costKrw)],
    ['저장된 글', D.ai.cached+'건'],
    ['다시 쓴 횟수', D.ai.reuse+'회']
  ], '원가는 1건 '+formatWon(D.ai.costPerKrw)+'로 잡은 추정이에요. 실제 청구액은 Anthropic 콘솔에서 보셔야 정확합니다. ‘다시 쓴 횟수’는 저장해 둔 글을 그대로 내어준 횟수로, 그만큼 돈이 안 나갔다는 뜻이에요.'));

  /* 최근 주문 — 환불 문의가 오면 여기서 영수증 번호를 찾는다. */
  var recent=el('div',{class:'scroll-card'});
  recent.appendChild(el('h3',{},['최근 주문']));
  if(!D.recent.length) recent.appendChild(el('p',{class:'biz-hint'},['아직 주문이 없어요.']));
  else D.recent.forEach(function(o){
    recent.appendChild(settingsRow(o.name+' · '+({paid:'결제완료',created:'미완료',failed:'실패'}[o.status]||o.status),
      formatWon(o.amount), (function(id){ return function(){ openOrderLookup(id); }; })(o.receiptId)));
  });
  view.appendChild(recent);

  /* 영수증 번호로 찾기 */
  var find=el('div',{class:'scroll-card'});
  find.appendChild(el('h3',{},['환불 문의 확인']));
  find.appendChild(el('p',{class:'biz-hint'},['손님이 보낸 영수증 번호를 넣으면 결제 내용과 열람 여부를 보여드려요. 약관 제8조에 따라 이미 열람한 콘텐츠는 청약철회가 제한되므로, 그 판단에 쓰시면 됩니다.']));
  var inp=el('input',{class:'biz-input', type:'text', placeholder:'영수증 번호', id:'statsReceipt', autocomplete:'off'});
  find.appendChild(inp);
  find.appendChild(el('button',{class:'btn btn-primary btn-block', style:'margin-top:10px;', onclick:function(){
    var v=(inp.value||'').trim(); if(v) openOrderLookup(v);
  }},['찾기']));
  view.appendChild(find);

  view.appendChild(el('p',{class:'biz-hint', style:'margin-top:14px;'},[
    '방문자 수는 여기에 없어요. 이 앱은 광고·분석 도구를 하나도 쓰지 않고 개인정보처리방침에도 그렇게 적어 두었습니다. 세려면 추적을 붙여야 하는데, 그러면 그 문장이 거짓이 됩니다.'
  ]));
  main.appendChild(view);
}

function loadStats(){
  STATS_DATA=null; STATS_ERR=null; render();
  fetch('/api/stats',{method:'POST',headers:{'Content-Type':'application/json'},
    credentials:'include', body:JSON.stringify({action:'summary'})})
    .then(function(r){ return r.json().catch(function(){return null;}).then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(r){
      if(!r.ok || !r.d) throw new Error((r.d && r.d.reason) || '불러오지 못했어요.');
      STATS_DATA = r.d; render();
    })
    .catch(function(e){ STATS_ERR = e.message || '불러오지 못했어요.'; render(); });
}

/* 주문 하나 — 환불 판단용 */
function openOrderLookup(receiptId){
  var body=el('div',{class:'sheet-body'});
  var status=el('p',{class:'biz-hint'},['찾는 중이에요…']);
  body.appendChild(status);
  openModal('주문 확인', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
  fetch('/api/stats',{method:'POST',headers:{'Content-Type':'application/json'},
    credentials:'include', body:JSON.stringify({action:'order', receiptId:receiptId})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      body.innerHTML='';
      if(!d || !d.found){ body.appendChild(el('p',{class:'biz-hint'},['그 번호로 된 주문이 없어요.'])); return; }
      var o=d.order;
      function row(k,v){ body.appendChild(el('p',{class:'legal-row'},[el('strong',{},[k]),' — ',String(v)])); }
      row('상품', o.productName);
      row('금액', formatWon(o.amount));
      row('상태', {paid:'결제완료', created:'미완료', failed:'실패'}[o.status] || o.status);
      row('영수증 번호', o.receiptId);
      row('결제 시각', o.paidAt ? new Date(o.paidAt).toLocaleString('ko-KR') : '—');
      if(d.passUntil) row('이용권 만료', new Date(d.passUntil).toLocaleString('ko-KR'));
      body.appendChild(el('h4',{style:'margin-top:14px;'},['열람 여부']));
      if(d.aiUses > 0){
        body.appendChild(el('p',{class:'biz-hint', style:'color:var(--red-hi);'},[
          'AI 해석을 '+d.aiUses+'회 만들었어요 (한도 '+d.aiQuota+'회). 처음 만든 때: '
          + (d.firstAiAt ? new Date(d.firstAiAt).toLocaleString('ko-KR') : '—')
        ]));
        body.appendChild(el('p',{class:'biz-hint'},['약관 제8조에 따라 이미 열람한 콘텐츠는 청약철회가 제한됩니다. 다만 회사 귀책(결제 오류·콘텐츠 미제공)이면 열람 여부와 관계없이 전액 환불입니다.']));
      } else {
        body.appendChild(el('p',{class:'biz-hint'},['AI 해석을 만든 기록이 없어요.']));
      }
      body.appendChild(el('p',{class:'biz-hint', style:'margin-top:8px;'},[d.note]));
      body.appendChild(el('p',{class:'biz-hint'},['환불은 토스페이먼츠 관리자 화면에서 직접 해주셔야 해요. 이 앱에는 아직 환불 기능이 없습니다.']));
    })
    .catch(function(){ body.innerHTML=''; body.appendChild(el('p',{class:'biz-hint'},['불러오지 못했어요.'])); });
}

function renderLanding(){
  var main=$('#main'); main.innerHTML='';
  var view=el('div',{class:'view landing'});
  var p=activeProfile();

  view.appendChild(brandTop());
  view.appendChild(el('p',{class:'landing-intro'},[
    'MBTI와 사주를 기반으로 운세와 궁합을 풀어보는 서비스입니다. 회원가입 없이 링크 하나로 가족·친구·연인과 함께 궁합도 볼 수 있어요.'
  ]));

  /* ★ R55 — 카드 아래 배지('회원가입 없이 바로' 등)를 없앴다(대표님 지시).
     읽는 순서상 마지막에 오는데 정작 내용과 상관없는 말이라, 눈길만 뺏고 알맹이는 없었다.
     대신 무엇을 해 주는지 적은 설명 줄을 키운다 — 사람들이 실제로 읽는 것은 그 줄이다.
     ★ R52 — 가격 이야기는 여기서 하지 않는다. 무료 부분을 다 보고 '더 보고 싶다'가
       된 다음에 한다(사주 풀이 4번째 섹션·궁합 결과 아래).
     ★ R51 — '시작하기' 줄도 없다. 카드 전체가 버튼이라 화살표만 오른쪽 위에 둔다. */
  function svc(title, desc, bullets, go){
    var c = el('button',{class:'svc-card', type:'button', onclick:go});
    c.appendChild(el('div',{class:'svc-title'},[title]));
    c.appendChild(el('div',{class:'svc-desc'},[desc]));
    var ul=el('ul',{class:'svc-list'});
    bullets.forEach(function(t){ ul.appendChild(el('li',{},[t])); });
    c.appendChild(ul);
    c.appendChild(el('span',{class:'svc-arrow','aria-hidden':'true'},[dirIcon('right')]));
    return c;
  }

  /* ★ R55 — 명리 용어를 앞세우지 않는다(대표님 지시).
     '오행·십성'은 아는 사람만 아는 말이다. 그 값으로 무엇을 알게 되는지로 바꾼다 —
     재물운·건강운처럼 사람들이 실제로 궁금해하는 말이 먼저 와야 한다.
     (용어 자체는 화면 안에 그대로 있고 눌러서 뜻도 볼 수 있다. 첫인사에서만 뒤로 뺀 것이다.) */
  view.appendChild(svc(
    '내 MBTI × 사주 분석',
    '내가 어떤 사람이고 어떤 흐름을 지나고 있는지, 타고난 사주와 성격 유형을 함께 읽어드려요.',
    ['오늘의 운세와 내 사주팔자', '재물운 · 건강운 · 인생 대운 흐름', '내 성격의 강점과 약점 (MBTI)'],
    function(){ startService('self'); }
  ));

  view.appendChild(svc(
    '타인과 궁합 보기',
    '링크 하나만 보내면 상대가 직접 넣고 바로 결과가 나와요. 앱을 깔 필요도, 가입할 필요도 없어요.',
    ['가족 · 친구 · 연인 · 직장동료 궁합', '둘이서 보는 1:1 궁합', '한 번에 최대 '+GC_MAX+'명까지 모임 궁합'],
    function(){ startService('compat'); }
  ));

  /* 이미 쓰던 분에게는 오늘의 운세로 가는 짧은 길을 남긴다. 고르는 화면이 매번 관문이 되면 번거롭다. */
  if(p){
    view.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:14px;', onclick:function(){
      setMode('self'); ROUTE='today'; render();
    }},[p.name+'님의 오늘의 운세 바로 보기']));
  }
  main.appendChild(autoTermify(view));
}

/* 서비스를 고르면 — 프로필이 없으면 먼저 받고, 있으면 바로 결과로 간다. */
function startService(mode){
  setMode(mode);
  if(!activeProfile()){
    /* ★ 어디로 가려다 프로필을 만들게 됐는지 기억해 둔다. 안 그러면 만들고 나서 홈으로 떨어진다. */
    PENDING_SERVICE = mode;
    startSetupWizard(null); render(); return;
  }
  ROUTE = (mode==='compat') ? 'compat' : 'today';
  render();
}
var PENDING_SERVICE = null;

/* 다 본 뒤 다른 쪽을 권한다. 두 서비스가 서로를 모르면 한쪽만 쓰고 끝난다. */
/* ★ R53 — 눈에 잘 띄어야 한다(대표님 지시).
   점선 카드는 '덤'처럼 보여서 그냥 지나친다. 브랜드 색을 깔고 아이콘을 세워
   화면에서 한 덩어리로 보이게 한다. 버튼도 화면 폭을 다 쓴다. */
function crossSell(kind){
  var toCompat = (kind==='toCompat');
  var card = el('div',{class:'cross-sell'});
  card.appendChild(el('div',{class:'cs-mark','aria-hidden':'true'},[brandMark(40)]));
  card.appendChild(el('div',{class:'cs-title'},[
    toCompat ? '다른 사람과 궁합도 볼까요?' : '내 사주와 MBTI도 깊게 볼까요?'
  ]));
  card.appendChild(el('p',{class:'cs-desc'},[

function buildStars(n){
  var wrap=el('div',{class:'stars', role:'img','aria-label':'5점 만점에 '+n+'점'});
  for(var i=1;i<=5;i++){
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox','0 0 20 20'); svg.setAttribute('class','star'+(i<=n?' on':'')); svg.setAttribute('aria-hidden','true');
    var path=document.createElementNS(ns,'path'); path.setAttribute('d','M10 1l2.6 5.9 6.4.6-4.8 4.3 1.5 6.2L10 14.9 4.3 18l1.5-6.2L1 7.5l6.4-.6z'); path.setAttribute('fill','currentColor');
    svg.appendChild(path); wrap.appendChild(svg);
  }
  return wrap;
}

/* =====================================================================

  var view=el('div',{class:'view'});
  /* ★ R49 — 실사용자 피드백: "눌러보니 ISTJ가 나오네, 이게 MBTI인가?"
     이름만 보고는 무엇을 보여주는 화면인지 알 수 없었다. 화면 이름과 근거를 함께 적는다. */

  view.appendChild(basisChip(['MBTI']));

  /* R19 — MBTI 캐릭터. 16종은 서로 다른 상징을 쓰고, 도감에서 한자리에 볼 수 있다. */
  var mbtiCharKey = charKeyForMbti(p.mbti);
  if(mbtiCharKey){ view.appendChild(buildCharHero(mbtiCharKey, 118, '21종 전체는 캐릭터 도감에서 볼 수 있어요.')); }

  var indCard=el('div',{class:'scroll-card'});
  indCard.appendChild(el('h3',{},['MBTI 4지표 해설']));
  var grid=el('div',{class:'grid2'});
  p.mbti.split('').forEach(function(letter){
    var info=INDICATOR[letter];
    var mini=el('div',{class:'stat-mini', style:'text-align:left;'});
    mini.appendChild(el('div',{class:'v', style:'margin-bottom:4px;'},[info.title]));
    mini.appendChild(el('div',{class:'k'},[info.strength]));
    grid.appendChild(mini);
  });
  indCard.appendChild(grid);
  view.appendChild(indCard);

  var elCard=el('div',{class:'scroll-card'});
  elCard.appendChild(cardHead('타고난 기운의 결 — '+p.element+' ('+charCountWord(p)+' 글자 중 가장 많은 기운)', ['오행']));
  elCard.appendChild(el('p',{},[ELEMENT_TRAIT[p.element]]));
  var saju = getSajuResult(p);
  if(saju){ elCard.appendChild(buildElemBars(dominantElementIdx(saju).counts)); }
  view.appendChild(elCard);

  var letters=p.mbti.split('');
  var strengths = letters.map(function(l){return INDICATOR[l].strength;}).join(' ');
  var cautions = letters.map(function(l){return INDICATOR[l].caution;}).join(' ');
  var advice = buildAdvice(p.mbti);

  var report=el('div',{class:'grid3'});
  report.appendChild(reportCol('강점', strengths));
  report.appendChild(reportCol('주의점', cautions));
  report.appendChild(reportCol('추천 행동', advice));
  view.appendChild(report);

  view.appendChild(circleCTA(CTA_ICON.arrow, '내 MBTI 풀이 읽어보기', function(){ ROUTE='mbtiReport'; render(); }));
  view.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:4px;', onclick:function(){ openShareModal('report', p, null); }},['리포트 요약 공유하기']));
  /* R50 — 여기까지 본 사람에게 다른 서비스를 권한다. 두 서비스가 서로를 모르면 한쪽만 쓰고 끝난다. */
  view.appendChild(crossSell('toCompat'));
  view.appendChild(glossaryLinkButton());
  main.appendChild(autoTermify(view));

function reportCol(title, text){
  var c=el('div',{class:'scroll-card'});
  c.appendChild(el('h3',{},[title]));
  c.appendChild(el('p',{},[text]));

}
function buildAdvice(mbti){
  var jp = mbti[3]==='J' ? '계획한 틀은 유지하되, 하루 한 가지는 즉흥적인 선택을 허용해보세요.' : '큰 방향만 정해두고 나머지는 흐름에 맡기되, 마감일만은 미리 표시해두세요.';
  var tf = mbti[2]==='T' ? '결정을 내리기 전 상대의 감정을 먼저 한 문장 물어보세요.' : '결정을 내릴 때 근거 한 가지를 스스로에게 먼저 설명해보세요.';
  return jp+' '+tf;
}

function renderSaju(){

  if(!p){ main.appendChild(emptyState('프로필이 필요합니다','내 사주를 보려면 프로필을 먼저 만들어주세요.', function(){ startSetupWizard(null); render(); })); return; }

  }

  var pillarCard=el('div',{class:'scroll-card stamp-in'});
  pillarCard.appendChild(cardHead('태어난 때를 적은 '+charCountWord(p)+' 글자', ['사주팔자','간지']));
  pillarCard.appendChild(buildPillarTable(saju));
  if(saju.nearBoundary){ pillarCard.appendChild(el('p',{class:'warn-box'},['태어난 날이 계절이 바뀌는 마디와 아주 가까워요. 그래서 태어난 달과 태어난 해를 적은 글자가 다르게 나올 수도 있어요.'])); }
  if(!saju.hour){ pillarCard.appendChild(el('p',{class:'section-sub'},['내면·자녀운 관련 해석은 참고만 해주세요.'])); }

  var termNotice = buildTermFixNotice(p);
  if(termNotice) view.appendChild(termNotice);
  /* R25 — 대표 오행 사본이 계산과 어긋나 있던 프로필에만 뜬다(절기 보정이 원인이면 위 상자가 이미 설명했다). */
  var elemNotice = buildElementFixNotice(p);
  if(elemNotice) view.appendChild(elemNotice);
  /* R20 — 진태양시 보정. 계산이 왜 이렇게 나왔는지 같은 화면에서 확인하고, 여기서 바로 켜고 끌 수 있다. */
  var migNotice = buildMigrateNotice(p);
  if(migNotice) view.appendChild(migNotice);
  var tsCard=el('div',{class:'scroll-card'});
  tsCard.appendChild(cardHead('태어난 시각을 실제 해의 위치에 맞추기', ['진태양시'])  /* R30 — '균시차'는 접힌 표 안에 그대로 있다(제목줄에서만 뺐다) */);
  tsCard.appendChild(buildTimeAdjustTable({
    y:p.year, m:p.month, d:p.day, timeUnknown: !p.birthTime,
    hour: p.birthTime?p.birthTime.hour:12, minute: p.birthTime?(p.birthTime.minute||0):0,
    lon: profileLon(p), lonKey: p.birthLonKey, adjust: !!p.solarTimeAdjust
  }));
  tsCard.appendChild(el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:10px;',
    onclick:function(){ openTimeAdjustEditor(p); }},['출생지·보정 설정 바꾸기']));
  view.appendChild(tsCard);

  var elemInfo = dominantElementIdx(saju);
  var elemCard=el('div',{class:'scroll-card'});
  elemCard.appendChild(cardHead('다섯 가지 기운이 얼마나 있나요', ['오행'])  /* R30 — 신강·신약은 바로 아래 문장에 이미 붙는다(같은 줄에 셋을 늘어놓지 않는다) */);
  elemCard.appendChild(buildElemBars(elemInfo.counts));
  elemCard.appendChild(el('p',{class:'section-sub'},['가장 진한 기운은 '+ELEMENTS[elemInfo.idx]+' 기운이에요. 내 힘의 세기는 '+
    (sinGangJak(saju)==='strong'?'넘치는 편(신강)':'모자란 편(신약)')+'이에요 — 글자 수만 세는 간단한 판정이라 참고로만 봐주세요.']));
  view.appendChild(elemCard);

  var sipCard=el('div',{class:'scroll-card'});
  sipCard.appendChild(cardHead('각 글자가 나에게 어떤 자리인가요', ['십성','일간']));
  sipCard.appendChild(el('p',{class:'section-sub'},['태어난 날의 나(일간)를 기준으로 나머지 글자가 어떤 역할인지 보여줘요. 칸마다 위가 쉬운 말, 아래가 사주 용어이고 눌러보면 뜻이 떠요.']));
  sipCard.appendChild(buildSipseongOverlay(saju));
  view.appendChild(sipCard);

  var branchList = [{idx:saju.year.branchIdx},{idx:saju.month.branchIdx},{idx:saju.day.branchIdx}];
  if(saju.hour) branchList.push({idx:saju.hour.branchIdx});
  var rel = SajuEngine.branchRelations(branchList);
  var relCard=el('div',{class:'scroll-card'});
  relCard.appendChild(cardHead('글자끼리 어떻게 얽혀 있나요', ['지지','합충형파']));
  relCard.appendChild(el('p',{class:'section-sub'},['아래 글자 넷(또는 셋)이 서로 짝이 되는지 부딪히는지 본 결과예요.']));
  relCard.appendChild(relationBadges(rel));
  view.appendChild(relCard);

  var dwCard=el('div',{class:'scroll-card'});
  dwCard.appendChild(cardHead('10년마다 바뀌는 큰 흐름', ['대운','대운수']));
  var dw = SajuEngine.daewoonList(saju.birthUTCms, p.year, saju.year.stemIdx, SajuEngine.STEM_YY[saju.year.stemIdx], p.gender, saju.month.idx);
  dwCard.appendChild(el('p',{class:'section-sub'},['글자가 도는 방향은 '+(dw.forward?'앞으로 나아가는 쪽(순행)':'거꾸로 가는 쪽(역행)')+
    '이고, 대운수는 '+dw.daeunNumber+josaNum(dw.daeunNumber,'이에요','예요')+' — 약 '+dw.daeunNumber+'세부터 10년마다 큰 흐름이 바뀌어요.']));
  var ageNow = (new Date().getFullYear()) - p.year + 1;
  var curIdx=0; for(var i=0;i<dw.list.length;i++){ if(ageNow>=dw.list[i].startAge) curIdx=i; }

  /* ★ R21 — 구간별 기운 강도(0~100)와 나이별 흐름 그래프.
     별점·간지·십성과 같은 성격의 무료 요약 지표다. 구간 상세 문장의 잠금은 아래 그대로 유지된다. */
  var dwStr = daeunStrengthList(saju, dw.list, elemInfo.counts, sinGangJak(saju));
  var dwBest = dwStr.list[dwStr.bestIdx], dwCur = dwStr.list[curIdx];
  var peakBox = el('div',{class:'dw-peak'});
  peakBox.appendChild(el('p',{html:'지금 계산으로는 <strong>'+dwBest.startAge+'세~'+dwBest.endAge+'세</strong>가 기운이 가장 크게 열리는 구간이에요. 정해진 결과가 아니라, 아래 네 가지만 놓고 봤을 때 상대적으로 높다는 뜻이에요.'}));
  peakBox.appendChild(el('p',{class:'dw-now'},['지금은 '+ageNow+'세 · '+dwCur.startAge+'세~'+dwCur.endAge+'세 구간(강도 '+dwCur.total+')을 지나고 있어요.'+
    (dwStr.bestIdx===curIdx ? ' 지금 지나는 구간이 그 구간이에요.' : (dwStr.bestIdx>curIdx ? ' 가장 큰 구간은 아직 앞에 있어요.' : ' 가장 큰 구간은 이미 지나온 자리예요.'))]));
  /* 전체 최고 구간이 이미 지나갔거나 지금이면, 앞으로 남은 구간 중 가장 큰 곳도 함께 알려준다.
     "가장 컸던 때는 이미 지났다"만 남기면 정작 알고 싶은 다음 자리가 안 보인다. */
  if(dwStr.bestIdx <= curIdx && curIdx < dwStr.list.length-1){
    var aheadIdx = curIdx+1;
    for(var ai=curIdx+2; ai<dwStr.list.length; ai++){ if(dwStr.list[ai].total > dwStr.list[aheadIdx].total) aheadIdx = ai; }
    var ah = dwStr.list[aheadIdx];
    peakBox.appendChild(el('p',{class:'dw-now'},['앞으로 남은 구간 중에서는 '+ah.startAge+'세~'+ah.endAge+'세(강도 '+ah.total+')가 가장 크게 열리는 편이에요.']));
  }
  dwCard.appendChild(peakBox);
  dwCard.appendChild(buildDaeunFlowSvg(dwStr, curIdx, ageNow));
  dwCard.appendChild(buildDaeunWhyPanel(dwStr, curIdx));

  /* R13 — 구간 상세는 유료(saju_full). 타임라인 자체와 요약 지표(나이·간지·십성·강도)는 무료로 두고,
     "지금 지나는 대운" 1개만 무료 미리보기로 연다. 월별 운세와 같은 경계다. */
  var dwUnlocked = sajuDetailUnlocked();
  dwCard.appendChild(el('p',{class:'section-sub', style:'margin-top:14px;'},[ dwUnlocked
    ? '구간을 탭하면 그 시기의 흐름·금전운·건강운을 자세히 볼 수 있어요.'
    : '구간마다의 두 글자와 나에게 어떤 자리인지, 기운 강도는 모두 볼 수 있어요. 구간을 눌렀을 때 나오는 자세한 풀이는 지금 지나는 구간을 열어두었어요.' ]));
  var scroll=el('div',{class:'daewoon-scroll'});
  dw.list.forEach(function(item,i){
    var sipName = SajuEngine.sipseongOf(saju.day.stemIdx, SajuEngine.STEM_ELEM[item.ganji.stemIdx], SajuEngine.STEM_YY[item.ganji.stemIdx]);
    var dwLocked = !dwUnlocked && i!==curIdx;
    var strItem = dwStr.list[i];
    var box=el('button',{type:'button', class:'daewoon-item'+(i===curIdx?' current':'')+(i===dwStr.bestIdx?' peak':''), onclick:function(){
      /* ★ 잠긴 구간은 아래 문장 조립을 아예 하지 않고 잠금 카드만 띄운다.
         (본문을 만들어 두고 화면에서만 가리면 개발자도구 한 번으로 새어 나간다.) */
      if(!sajuDetailUnlocked() && i!==curIdx){
        var lockBody = el('div',{});
        lockBody.appendChild(lockedBlock(PRODUCTS.saju_full, '', item.startAge+'세 대운 상세'));
        openModal(item.startAge+'세부터 10년 흐름 · '+item.ganji.text+'('+item.ganji.textH+')', autoTermify(lockBody),
          [{label:'닫기',cls:'btn-ghost',onclick:closeModal}]);
        return;
      }
      /* v5-C: 대운=계절 비유 + 금전운·건강운 문장(daeunMoneyHealthLines, 기능6 s10~s12와 동일 함수) 확장.
         R14 — 계절 비유도 리포트와 같은 daeunSeasonLine()을 쓴다. 예전에는 이 자리에 같은 문장이 손으로
         복사돼 있었고, 그래서 문구뱅크를 넓혀도 이 화면만 2문장에 묶여 있었다. */
      var seasonLine = daeunSeasonLine(sipName);
      var mh = daeunMoneyHealthLines(saju.day.stemIdx, item.ganji, elemInfo.counts, i); // R16: slot=대운 목록에서의 자리(리포트 s10~s12와 같은 값)
      var body = el('div',{},[
        el('p',{class:'section-sub'},['이 구간은 나에게 '+termMini(sipName)+'('+sipName+')의 자리예요.']),
        el('p',{html: seasonLine}),
        el('p',{},[PB.sipseongLine[sipName]]),
        el('p',{html: mh.stageLine}),
        el('p',{html: mh.moneyLine+' '+mh.healthLine})
      ]);
      openModal(item.startAge+'세부터 10년 흐름 · '+item.ganji.text+'('+item.ganji.textH+')', autoTermify(body), [{label:'닫기',cls:'btn-ghost',onclick:closeModal}]);
    }});
    /* 잠긴 구간은 눌러보기 전에 알 수 있게 자물쇠를 붙인다(기존 lockIcon 재사용). */
    box.appendChild(el('div',{class:'age'},[
      (i===curIdx?'현재 ':'')+item.startAge+'세~',
      dwLocked ? lockIcon('잠김 · 유료') : null
    ]));
    box.appendChild(el('div',{class:'gz'},[item.ganji.text]));
    /* R23 — 십성 이름만 있던 자리를 뒤집었다: 위에 쉬운 말, 아래에 원래 용어.
       (타일 자체가 버튼이라 안에 버튼을 또 넣을 수 없어, 여기서는 눌러서 뜻 보기 대신
        타일을 눌러 열리는 상세 첫 줄에 같은 설명을 넣었다.) */
    box.appendChild(el('div',{class:'ss'},[termMini(sipName)]));
    box.appendChild(el('div',{class:'ss-term'},[sipName]));
    /* R21 — 타일에도 강도를 얹는다. 그래프에서 본 값과 같은 값이라 서로 대조할 수 있다.
       막대는 그림이라 role='img'+수치 낭독을 주고, 옆 숫자는 두 번 읽히지 않게 감춘다. */
    box.appendChild(el('div',{class:'dw-str', role:'img',
      'aria-label':'기운 강도 '+strItem.total+'점 ('+DAEUN_MAX_TOTAL+'점 만점)'+(i===dwStr.bestIdx?', 가장 큰 구간':'')},[
      el('i',{style:'width:'+(strItem.total/DAEUN_MAX_TOTAL*100).toFixed(1)+'%;'})
    ]));
    box.appendChild(el('div',{class:'dw-strnum','aria-hidden':'true'},['강도 '+strItem.total]));
    scroll.appendChild(box);
  });
  dwCard.appendChild(scroll);
  /* 잠긴 구간이 있으면 다른 유료 지점과 똑같은 잠금 카드로 결제를 안내한다. */
  if(!dwUnlocked && dw.list.length > 1){
    var dBlock = lockedBlock(PRODUCTS.saju_full, '', '대운 구간 상세');
    dBlock.insertBefore(el('div',{class:'locked-count'},[(dw.list.length-1)+'개 구간 상세가 잠겨 있어요']), dBlock.firstChild);
    dwCard.appendChild(dBlock);

  view.appendChild(circleCTA(CTA_ICON.arrow, '내 사주 풀이 읽어보기', function(){ ROUTE='report13'; render(); }));
  view.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:4px;', onclick:function(){ ROUTE='monthlyFortune'; render(); }},['올해 월별 운세 보기']));
  view.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:4px;', onclick:function(){ openShareModal('saju', p, saju); }},['사주 요약 카드 저장하기']));
  /* ★ R53 — 내 사주에도 궁합 권유를 넣는다(대표님 지적: MBTI에만 있었다).
     이 화면이 사주 쪽에서 가장 오래 머무는 자리인데 여기가 비어 있었다. */
  view.appendChild(crossSell('toCompat'));
  view.appendChild(glossaryLinkButton());

/* =====================================================================
   렌더: 월별 올해 운세 (기능19 — v5-B 신규)
   기존 대운 타임라인(.daewoon-scroll/.daewoon-item)과 모달(openModal) 컴포넌트를 그대로 재사용한다.
===================================================================== */
function renderMonthlyFortune(){
  var main=$('#main'); main.innerHTML='';
  var p=activeProfile();
  if(!p){ main.appendChild(emptyState('프로필이 필요합니다','월별 운세를 보려면 프로필을 먼저 만들어주세요.', function(){ startSetupWizard(null); render(); })); return; }
  var year = (new Date()).getFullYear();
  /* R13 — 상세는 유료(saju_full). 현재 달 1개만 무료 미리보기로 연다.
     잠긴 달은 buildMonthlyFortune이 문장 자체를 만들지 않는다. */
  var unlocked = sajuDetailUnlocked();
  var previewMonth = monthlyPreviewMonth(year);
  var mf = buildMonthlyFortune(p, year, function(m){ return unlocked || (previewMonth>0 && m===previewMonth); });
  /* buildMonthlyFortune은 사주 계산이 실패하면 null을 돌려준다(4536행 부근). 활성 프로필이 있으면
     getSajuResult()가 실패하지 않으므로 지금은 도달하지 않는 경로지만, 방어 없이 두면 여기서
     TypeError로 화면 전체가 빈 채로 멈춘다. 지원 범위 밖 생년월일 같은 입력이 새로 생겨도
     최소한 안내 화면은 뜨게 한다. */
  if(!mf){
    main.appendChild(emptyState('월별 운세를 만들 수 없어요','생년월일이나 태어난 시각을 다시 확인해 주세요. 지원 범위(1900~2100년) 밖이면 계산이 되지 않아요.',
      function(){ ROUTE='saju'; render(); }, '내 사주로 돌아가기'));
    return;
  }
  var view=el('div',{class:'view'});
  view.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){ ROUTE='saju'; render(); }},[dirIcon('left'), '내 사주로 돌아가기']));
  /* 안내 문구는 실제 열려 있는 범위를 그대로 말한다. 잠긴 상태에서 "한 달을 탭하면 다섯 가지를
     볼 수 있어요"라고 적으면 그 문장이 곧바로 거짓이 된다. */
  view.appendChild(pageHead('내 사주 · 올해 월별', p.name+'님의 '+year+'년 월별 운세', ( unlocked
    ? '한 달을 탭하면 총운·애정운·금전운·학업·직장운·건강운 다섯 가지를 자세히 볼 수 있어요.'
    : (previewMonth>0
        /* ★ R52 — '무료/유료'로 나눠 말하지 않는다(대표님 지시). 값은 버튼에 적혀 있어 다들 안다.
           여기서는 '무엇을 볼 수 있는지'만 말한다. */
        ? '달마다의 두 글자(간지)와 총운 별점은 모두 볼 수 있어요. 상세 다섯 가지(총운·애정운·금전운·학업·직장운·건강운)는 이번 '+previewMonth+'월을 열어두었어요.'
        : '달마다의 두 글자(간지)와 총운 별점은 모두 볼 수 있어요.') ), {marginTop:'14px'}));

  if(mf.daeunIntro){
    var introCard=el('div',{class:'scroll-card stamp-in'});
    introCard.appendChild(cardHead('올해를 지나는 큰 흐름', ['대운']));
    introCard.appendChild(el('p',{},[mf.daeunIntro]));
    view.appendChild(introCard);
  }

  var monthCard=el('div',{class:'scroll-card'});
  monthCard.appendChild(cardHead('달마다의 흐름', ['월운','간지']));
  monthCard.appendChild(el('p',{class:'section-sub', style:'margin-bottom:0;'},['1월부터 12월까지 열두 달이 한 화면에 있어요. 달을 누르면 상세가 열려요.']));
  var nowYm = previewMonth;
  /* ★ R20 — 가로 스크롤(.daewoon-scroll)에서 12칸 격자로 바꿨다.
     대운은 사람마다 구간 수가 달라 가로 목록이 맞지만, 월별은 언제나 12개이고
     "12월까지 한눈에" 보이는 것이 이 화면의 목적이다. 대운 타임라인은 그대로 둔다. */
  var grid=el('div',{class:'month-grid'});
  mf.months.forEach(function(mo){
    var box=el('button',{type:'button', class:'month-cell'+(mo.month===nowYm?' current':''), onclick:function(){
      openMonthlyFortuneSheet(p.name, mo);
    }});
    /* 잠긴 달은 눌러보기 전에 알 수 있게 자물쇠를 붙인다(기존 lockIcon 재사용).
       궁합 상세 버튼의 compatLockMark()와 같은 취지다. */
    box.appendChild(el('div',{class:'mc-top'},[
      (mo.month===nowYm?'현재 ':'')+mo.month+'월',
      mo.locked ? lockIcon('잠김 · 유료') : null
    ]));
    /* R23 — 두 글자만 덩그러니 있으면 무슨 글자인지 알 수 없다. 타일 자체가 버튼이라
       안에 버튼을 또 넣을 수 없으므로, 글자가 무엇인지만 작게 적는다(뜻은 카드 제목 줄에서 볼 수 있다).
       ★ R24 — 순서를 뒤집었다. R23이 세운 규칙은 "일상어가 먼저, 용어(글자)는 그 다음"인데
         이 타일만 반대(기축 → 그 달의 두 글자)로 되어 있어 대운 타일과도 어긋나 있었다. */
    box.appendChild(el('div',{class:'mc-term'},['그 달의 두 글자']));
    box.appendChild(el('div',{class:'mc-gz'},[mo.ganji.text]));
    /* ★ 글자를 그대로 두면 낭독기가 "검은 별"이라고 읽는다. 보이는 모습은 그대로 두되
       낭독은 aria-label이 대신하게 한다(타일이 좁아 buildStars의 별 5개는 들어가지 않는다). */
    /* role='img'가 없으면 낭독기가 div의 aria-label을 무시할 수 있다.
       안의 '★'은 aria-hidden이라, role이 빠지면 점수가 통째로 안 읽힌다. */
    box.appendChild(el('div',{class:'mc-st', role:'img', 'aria-label':'운세 '+mo.stars+'점 (5점 만점)'},[
      el('span',{'aria-hidden':'true'},[mo.stars+'★'])
    ]));
    grid.appendChild(box);
  });
  monthCard.appendChild(grid);
  view.appendChild(monthCard);

  /* 잠긴 달이 하나라도 있으면, 다른 유료 지점과 똑같은 잠금 카드로 결제를 안내한다.
     (새 컴포넌트를 만들지 않고 lockedBlock + locked-count를 그대로 쓴다.) */
  if(!unlocked){
    var lockedCount = mf.months.filter(function(mo){ return mo.locked; }).length;
    var mBlock = lockedBlock(PRODUCTS.saju_full, '', '월별 운세 상세');
    mBlock.insertBefore(el('div',{class:'locked-count'},[lockedCount+'개월 상세가 잠겨 있어요']), mBlock.firstChild);
    view.appendChild(mBlock);
  }

  view.appendChild(glossaryLinkButton());
  main.appendChild(autoTermify(view));
}
/* '기축(己丑)이에요' / '경오(庚午)예요' — 받침 판정은 괄호 앞 한글 음절로 한다(josaOnlyText).
   잠긴 달 모달과 열린 달 모달이 같은 문장을 쓰므로 한 곳에서 만든다. */
function monthGanjiLine(mo){
  var gz = mo.ganji.text+'('+mo.ganji.textH+')';
  return gz + josaOnlyText(gz,'이에요.','예요.');
}
/* 월별 상세를 바텀시트형 모달(기존 openModal 재사용)로 펼친다 — v4-A 바텀시트 패턴, 새 컴포넌트 아님 */
function openMonthlyFortuneSheet(name, mo){
  var body=el('div',{class:'sheet-body'});
  /* ★ 잠긴 달. mo.items 자체가 없으므로 가릴 본문이 없다 — 만들지 않았기 때문이다.
     간지(무료 요약 지표)만 남기고 다른 유료 지점과 같은 잠금 카드를 띄운다. */
  if(!mo.items){
    body.appendChild(el('p',{class:'section-sub'},['이 달의 두 글자(간지)는 '+monthGanjiLine(mo)]));
    body.appendChild(lockedBlock(PRODUCTS.saju_full, '', mo.month+'월 운세 상세'));
    openModal(mo.month+'월 운세', autoTermify(body), [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
    return;
  }
  body.appendChild(el('p',{class:'section-sub'},['이 달의 두 글자(간지)는 '+monthGanjiLine(mo)]));
  ['total','love','money','work','health'].forEach(function(key){
    var item=mo.items[key];
    var row=el('div',{style:'margin-bottom:14px;'});
    var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;'});
    head.appendChild(el('strong',{},[item.label]));
    head.appendChild(buildStars(item.stars));
    row.appendChild(head);
    row.appendChild(el('p',{style:'margin:0;'},[item.text]));
    body.appendChild(row);
  });
  openModal(mo.month+'월 운세', autoTermify(body), [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}

/* =====================================================================
   히스토리 자동 기록 (기능13)
   ---------------------------------------------------------------------
   SPEC 기능13은 "생성된 사주 풀이 리포트도 히스토리에 누적 저장"이라고 정해 두었고,
   히스토리 빈 화면도 "풀이를 읽으면 자동으로 기록돼요"라고 안내한다. 그런데 실제 기록은
   "요약 카드로 저장하기"를 눌러 공유 모달을 열 때만 일어났다 — 문구가 아니라 구현이
   어긋난 것이라, 풀이 화면을 실제로 열람하는 시점에 기록하도록 바꿨다.

   ★ 이 함수가 반드시 지켜야 하는 두 가지.

   1) 중복이 쌓이지 않는다.
      (프로필 + 날짜)를 키로 삼는 upsert다. 같은 프로필의 같은 날짜 풀이는 항목을 새로 만들지
      않고 기존 항목만 갱신한다. 같은 풀이를 몇 번을 다시 열어도 기록은 1건이다. 리포트 화면은
      결제 상태가 바뀔 때마다 render()로 다시 그려지므로, "열 때마다 unshift"로 두면 목록이
      순식간에 상한선까지 차 버린다. 공유 모달 경로도 같은 함수를 부르므로 "읽고 나서 카드까지
      저장"해도 여전히 1건이다.

   2) 유료 본문이 히스토리로 새지 않는다.
      요약은 언제나 로컬 문구뱅크가 만든 0번 섹션(오프닝)에서만 뽑는다. 0번은
      FREE_SECTION_COUNT 안쪽이라 결제 여부와 무관하게 무료 구간이고, 서버가 준 유료 본문
      (paintReportInto 안의 state.sections)은 이 경로에 아예 전달되지 않는다. 그래서 미결제
      상태에서 남은 기록을 나중에 다시 열어도 잠금이 그대로 유지된다.
      (히스토리는 이 앱에서 두 번이나 유료 콘텐츠 누출 경로였다. 요약의 출처를 무료 구간
       한 곳으로 고정하는 것이 이 경로를 다시 열지 않는 가장 단순한 방법이다.)
===================================================================== */
var REPORT_HISTORY_MAX = 20; /* 처리방침 §3의 "사주풀이·MBTI풀이 최근 20건"과 같은 값 */
function reportOpeningSummary(section, prefix){
  var plain = String((section && section.body) || '').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  return (prefix || '') + plain.slice(0,40) + '…';
}
/* 같은 키가 있으면 갱신, 없으면 앞에 추가하고 상한선까지 자른다. 실제로 바뀐 게 있을 때만 true. */
function upsertHistoryEntry(list, matches, entry, max){
  for(var i=0;i<list.length;i++){
    if(matches(list[i])){
      var cur = list[i], changed = false;
      for(var k in entry){ if(k!=='id' && cur[k]!==entry[k]){ cur[k]=entry[k]; changed=true; } }
      return changed;
    }
  }
  list.unshift(entry);
  if(list.length>max) list.length=max;
  return true;
}
function recordSajuReportHistory(p, report){
  if(!p || !report || !report.sections || !report.sections.length) return;
  var d = todayStr();
  var changed = upsertHistoryEntry(STATE.sajuHistory,
    function(x){ return x.profileId===p.id && x.date===d; },
    {id:uid(), date:d, profileId:p.id, summary:reportOpeningSummary(report.sections[0], '오프닝: ')},
    REPORT_HISTORY_MAX);
  if(changed) saveState();
}
function recordMbtiReportHistory(p, report){
  if(!p || !report || !report.sections || !report.sections.length) return;
  var d = todayStr();
  var changed = upsertHistoryEntry(STATE.mbtiReportHistory,
    function(x){ return x.profileId===p.id && x.date===d; },
    {id:uid(), date:d, profileId:p.id, mbti:p.mbti, summary:reportOpeningSummary(report.sections[0], '')},
    REPORT_HISTORY_MAX);
  if(changed) saveState();
}

/* =====================================================================
   렌더: 용어 사전 (R23 신규) — TERMS를 한자리에 모아 보는 화면.
   ---------------------------------------------------------------------
   이 앱이 처음인 사람이 "오행이 뭐지" 싶을 때 갈 곳이다.
   ★ 전부 무료다. 새 유료 상품을 만들지 않았고, 유료 해석 문장은 한 줄도 여기 넣지 않았다
     — 여기 있는 것은 낱말의 뜻뿐이고, 그 사람의 사주에 대한 서술이 아니다.
   ★ 문장은 전부 TERMS에서 온다. 이 함수 안에 설명을 따로 적지 않는다.
===================================================================== */
var GLOSSARY_BACK = null;   /* 어디서 들어왔는지 — 돌아가기 버튼이 쓴다 */
var GLOSSARY_FOCUS = null;  /* 용어 설명 모달에서 넘어왔을 때 그 항목으로 스크롤 */
var GLOSSARY_Q = '';        /* 찾기 입력값 */
function openGlossary(focusKey){
  if(ROUTE !== 'glossary') GLOSSARY_BACK = ROUTE;
  GLOSSARY_FOCUS = focusKey || null;
  ROUTE = 'glossary';
  render();
}
function glossaryEntries(){
  var out = [];
  TERM_CATS.forEach(function(c){
    var items = [];
    for(var k in TERMS){ if(TERMS[k].cat === c.key) items.push(k); }
    items.sort(function(a,b){ return a.localeCompare(b, 'ko'); });
    if(items.length) out.push({cat:c, keys:items});
  });
  return out;
}
function glossaryMatches(key, q){
  if(!q) return true;
  var t = TERMS[key];
  return (key+' '+(t.h||'')+' '+t.short+' '+(t.mini||'')+' '+t.long).indexOf(q) >= 0;
}
function buildGlossaryList(host){
  host.innerHTML = '';
  var q = (GLOSSARY_Q||'').trim();
  var shown = 0;
  glossaryEntries().forEach(function(grp){
    var keys = grp.keys.filter(function(k){ return glossaryMatches(k, q); });
    if(!keys.length) return;
    var card = el('div',{class:'scroll-card no-term'});
    card.appendChild(cardHead(grp.cat.label, grp.cat.terms));
    keys.forEach(function(k){
      var t = TERMS[k];
      shown++;
      var item = el('div',{class:'gl-item', id:'glTerm'+shown});
      item.dataset.term = k;
      item.appendChild(el('div',{class:'gl-plain'},[t.short]));
      item.appendChild(el('div',{class:'gl-term'},['사주 용어로는 '+termLabel(k)]));
      item.appendChild(el('div',{class:'gl-long'},[t.long]));
      /* 이 앱이 판정하지 않는 관계는 사전에서도 그 사실을 함께 적는다(목록에만 있으면 "이것도 봐준다"로 읽힌다). */
      if(t.notCalc) item.appendChild(el('div',{class:'gl-src'},[TERM_NOT_CALC_NOTE]));
      item.appendChild(el('div',{class:'gl-src'},[ t.src==='app'
        ? '이 앱이 무엇을 계산하는지에 대한 설명이에요.'
        : '명리학 통설을 정리한 설명이에요. 유파마다 갈릴 수 있어요.' ]));
      card.appendChild(item);
    });
    host.appendChild(card);
  });
  if(!shown){
    host.appendChild(el('p',{class:'section-sub no-term'},['"'+q+'"에 해당하는 용어가 없어요. 다른 말로 찾아보시겠어요?']));
  }
  return shown;
}
function renderGlossary(){
  var main=$('#main'); main.innerHTML='';
  var view=el('div',{class:'view no-term'});
  var backTo = GLOSSARY_BACK || 'saju';
  view.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){
    ROUTE = backTo; GLOSSARY_BACK = null; render();
  }},[dirIcon('left'), '돌아가기']));
  var total = 0; for(var k in TERMS) total++;
  view.appendChild(pageHead('모아보기 · 용어 '+total+'종', '사주 용어 사전',
    '이 앱에 나오는 사주 용어를 일상어로 풀어 뒀어요. 전부 무료이고, 앱 어디서든 점선 밑줄이 그어진 말을 누르면 같은 설명이 바로 떠요.'));

  var listHost = el('div',{});
  var search = el('input',{type:'search', class:'biz-input', value:GLOSSARY_Q,
    placeholder:'찾을 말을 적어보세요 (예: 대운, 돈, 부딪)', 'aria-label':'용어 찾기'});
  var countLine = el('p',{class:'gl-count'},['']);
  function repaint(){
    var n = buildGlossaryList(listHost);
    countLine.textContent = GLOSSARY_Q.trim() ? (n+'개를 찾았어요.') : ('모두 '+total+'종이에요.');
  }
  search.addEventListener('input', function(e){ GLOSSARY_Q = e.target.value; repaint(); });
  var tools = el('div',{class:'gl-tools'},[search]);
  view.appendChild(tools);
  view.appendChild(countLine);
  view.appendChild(listHost);
  repaint();

  view.appendChild(el('p',{class:'disclaimer'},['사주 용어의 뜻은 유파에 따라 달리 읽히기도 합니다. 여기 적은 것은 널리 쓰이는 통설을 쉬운 말로 옮긴 것이라, 정해진 답이 아니라 읽기를 돕는 참고로 봐주세요.']));
  main.appendChild(view);

  /* 용어 설명 모달에서 "전체 보기"로 넘어왔으면 그 항목으로 데려간다. */
  if(GLOSSARY_FOCUS){
    var target = $all('.gl-item', view).filter(function(n){ return n.dataset.term === GLOSSARY_FOCUS; })[0];
    if(target && target.scrollIntoView) target.scrollIntoView({block:'center'});
    GLOSSARY_FOCUS = null;
  }
}
