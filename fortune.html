function submitCompat(){
  var p=activeProfile();
  var pSaju = getSajuResult(p);
  var pA = {mbti:p.mbti, elementIdx:p.elementIdx, zodiacIdx:p.zodiacIdx, name:p.name, element:p.element, zodiac:p.zodiac, saju:pSaju, gender:p.gender};
  var y=COMPAT_DRAFT.year, m=COMPAT_DRAFT.month, d=COMPAT_DRAFT.day;
  if(COMPAT_DRAFT.calendarType==='lunar'){
    var solar=SajuEngine.lunarToSolar(y,m,d,COMPAT_DRAFT.lunarLeap);
    if(solar){ y=solar.year; m=solar.month; d=solar.day; }
  }
  var bSaju = SajuEngine.computeSaju(y,m, d,
    COMPAT_DRAFT.timeUnknown?null:COMPAT_DRAFT.hour, COMPAT_DRAFT.timeUnknown?0:COMPAT_DRAFT.minute,
    {lon:COMPAT_DRAFT.birthLon, adjust:COMPAT_DRAFT.solarTimeAdjust, meridian:draftMeridian(COMPAT_DRAFT)});
  var bElemInfo = dominantElementIdx(bSaju);
  var legacyZ = calcZodiac(y);
  var pB = {mbti:COMPAT_DRAFT.mbti, elementIdx:bElemInfo.idx, zodiacIdx:legacyZ.idx, name:(COMPAT_DRAFT.name||'상대방').slice(0,20),
    element:ELEMENTS[bElemInfo.idx], zodiac:legacyZ.name, saju:bSaju, gender:COMPAT_DRAFT.gender};
  var res = computeCompat(pA, pB);
  /* 화면에서 지금 보고 있는 결과는 메모리(COMPAT_DRAFT)에만 둔다 — 저장소로 가지 않는다. */
  COMPAT_DRAFT.result = {pA:pA, pB:pB, res:res};
  /* R34 — 방을 거쳐 온 결과면 그 방을 기억해 둔다. 다음에 궁합 화면에서 다시 열 수 있다. */
  if(CURRENT_ROOM_ID) rememberRoom(CURRENT_ROOM_ID, pB.name);
  COMPAT_SUB = null;
  /* ★ R24 — 기록에는 입력값과 점수·등급만 담는다. 상세 문장(elemDetail·branchRel·comment·
     연애/우정/갈등)은 한 글자도 저장하지 않는다. 다시 볼 때는 권한을 확인하고 다시 계산한다. */
  var histEntry = {id:uid(), date:todayStr(), profileId:p.id,
    partnerName:pB.name, partnerMbti:pB.mbti, score:res.combined, tier:res.combinedTier,
    inputs:{
      a: compatPersonInput(pA, {y:p.year, m:p.month, d:p.day,
            hour: p.birthTime?p.birthTime.hour:null, minute: p.birthTime?(p.birthTime.minute||0):0,
            lon: profileLon(p), adjust: !!p.solarTimeAdjust}),
      b: compatPersonInput(pB, {y:y, m:m, d:d,
            hour: COMPAT_DRAFT.timeUnknown?null:COMPAT_DRAFT.hour,
            minute: COMPAT_DRAFT.timeUnknown?0:COMPAT_DRAFT.minute,
            lon: COMPAT_DRAFT.birthLon, adjust: !!COMPAT_DRAFT.solarTimeAdjust})
    }};
  STATE.compatHistory.unshift(histEntry);
  if(STATE.compatHistory.length>200) STATE.compatHistory.length=200;
  saveState();
  render();
}
/* 궁합 기록에 담을 "입력값". 여기에 문장은 한 줄도 들어가지 않는다 — 이름·MBTI·성별과
   점수 계산에 쓰이는 index 두 개, 그리고 사주를 다시 계산할 생년월일시뿐이다. */
function compatPersonInput(person, birth){
  return { name:person.name, mbti:person.mbti, gender:person.gender,
           elementIdx:person.elementIdx, zodiacIdx:person.zodiacIdx,
           element:person.element, zodiac:person.zodiac, birth:birth };
}
/* 입력값에서 궁합 계산에 넣을 사람 객체를 되살린다. 사주는 저장돼 있지 않으므로 여기서 다시 계산한다. */
function compatPersonFromInput(inp){
  if(!inp || !inp.mbti) return null;
  var b = inp.birth, saju = null;
  if(b && typeof b.y==='number' && typeof b.m==='number' && typeof b.d==='number'){
    try{
      saju = SajuEngine.computeSaju(b.y, b.m, b.d, (b.hour==null?null:b.hour), (b.minute||0),
        {lon:b.lon, adjust:!!b.adjust});
    }catch(e){ saju = null; }
  }
  /* ★ R25 — 기록에 적힌 대표 오행도 저장값을 그대로 믿지 않는다. 사주를 다시 계산했으면
     그 계산에서 뽑고, 계산할 입력이 없는 아주 옛 기록만 저장값으로 되돌아간다.
     저장된 값은 프로필의 사본이라 옛 프로필의 어긋난 값을 그대로 물려받았을 수 있다. */
  var elemIdx = inp.elementIdx, elemName = inp.element;
  if(saju){ elemIdx = dominantElementIdx(saju).idx; elemName = ELEMENTS[elemIdx]; }
  return { mbti:inp.mbti, elementIdx:elemIdx, zodiacIdx:inp.zodiacIdx, name:inp.name,
           element:elemName, zodiac:inp.zodiac, saju:saju, gender:inp.gender };
}
/* 기록 한 건을 "다시 계산"한다. ★ 권한 확인은 부르는 쪽 책임이다 — 이 함수는 잠금을 보지 않으므로
   반드시 hasAccess()를 통과한 뒤에만 부른다. 결과는 화면에만 쓰고 저장소로 되돌려 넣지 않는다. */
function compatResultFromHistory(c){
  if(!c || !c.inputs) return null;
  var a = compatPersonFromInput(c.inputs.a), b = compatPersonFromInput(c.inputs.b);
  if(!a || !b) return null;
  if(!MBTI_MATRIX[a.mbti] || MBTI_MATRIX[a.mbti][b.mbti]==null) return null;
  try{ return computeCompat(a, b); }catch(e){ console.warn('궁합 기록 재계산 실패', e); return null; }
}
/* 잠긴 상태에서 필요한 것은 무료 범위(케미 한 줄)뿐이다.
   유료 문장을 만드는 경로(computeCompat)를 아예 타지 않고 MBTI 점수만으로 한 줄을 만든다. */
function compatHistoryChemistry(c){
  var ia = c && c.inputs && c.inputs.a, ib = c && c.inputs && c.inputs.b;
  if(!ia || !ib) return null;
  var row = MBTI_MATRIX[ia.mbti];
  var v = row ? row[ib.mbti] : null;
  return (v==null) ? null : compatChemistryLine(v);
}

function buildRadarSvg(pA, pB){

  var titleEl=document.createElementNS(ns,'title'); titleEl.textContent='오행 균형 레이더 차트'; svg.appendChild(titleEl);

    var p=[]; for(var i=0;i<5;i++){ var xy=pt(i,R*f); p.push(xy[0]+','+xy[1]); }

    var pts=[]; for(var i=0;i<5;i++){ var xy=pt(i, R*(vals[i]/100)); pts.push(xy[0]+','+xy[1]); }

    for(j=i+1;j<members.length;j++){
      pairs.push({ai:i, bi:j, a:members[i], b:members[j],
                  res:computeCompat(members[i].person, members[j].person)});
    }
  }
  GC_PAIRS_CACHE = {key:key, pairs:pairs, ms:gcNow()-t0, computed:pairs.length};
  return pairs;
}

/* ---------------------------------------------------------------------
   배치표 — 인원이 늘면 고리를 늘리고 아바타를 줄인다.
   ---------------------------------------------------------------------
   숫자는 전부 "가장 좁은 화면"을 기준으로 잡았다. 320px에서 main 좌우 여백이 13px씩이라
   무대 한 변은 실측 294px이다(실제 브라우저에서 잰 값).
     · f = 무대 한 변 대비 고리 반지름 비율(중심에서). 실제 반지름 = f × 294px
     · cap = 그 고리에 세울 수 있는 최대 인원 = 2πr / (아바타 지름 + 최소 여유)
   세 고리(30명, 17/9/4명)일 때 294px 기준 실제 값:
     반지름 114.7 / 66.2 / 27.9px → 같은 고리 이웃 간격 42.4 / 46.2 / 39.5px,
     고리 사이 간격 48.5 / 38.3px. 아바타가 30px이므로 어느 쪽도 그림이 겹치지 않는다.
   ★ 다만 누르는 자리는 44px을 유지하므로(터치 목표를 줄이지 않는다) 20명을 넘어서면
     이웃한 두 버튼의 판정 영역이 조금 겹친다. 그림이 겹치는 게 아니라 판정만 겹치는 것이고,
     겹치는 쪽을 없애려면 손가락 목표를 44px 아래로 내려야 해서 이 쪽을 택했다.
     실측 겹침 넓이는 SELF_CHECK R28 표에 그대로 적었다(판단이지 검증이 아니다).
--------------------------------------------------------------------- */
function gcLayoutSpec(n){
  if(n<=6)  return {rings:[{f:0.335, cap:6}],                                     av:'clamp(48px,12vw,66px)',   avMin:48, fs:12, tagfs:11, max:'440px'};
  if(n<=10) return {rings:[{f:0.365, cap:10}],                                    av:'clamp(44px,10.5vw,58px)', avMin:44, fs:11, tagfs:11, max:'480px'};
  if(n<=15) return {rings:[{f:0.385, cap:15}],                                    av:'clamp(38px,9vw,52px)',    avMin:38, fs:10, tagfs:10, max:'520px'};
  if(n<=25) return {rings:[{f:0.390, cap:17},{f:0.205, cap:9}],                   av:'clamp(34px,8vw,46px)',    avMin:34, fs:10, tagfs:10, max:'560px'};
  return      {rings:[{f:0.390, cap:18},{f:0.225, cap:10},{f:0.095, cap:4}],      av:'clamp(30px,7vw,42px)',    avMin:30, fs:9,  tagfs:10, max:'580px'};
}
/* 고리별 인원 배분. 바깥 고리부터 수용력에 비례해 나누고, 남으면 여유 있는 고리에 채운다. */
function gcAllocate(n, caps){
  var total=0, i;
  for(i=0;i<caps.length;i++) total+=caps[i];
  var out=[], left=n;
  for(i=0;i<caps.length;i++){
    var want = Math.min(caps[i], left, Math.round(n*caps[i]/total));
    if(i===caps.length-1) want = Math.min(caps[i], left);
    out.push(want); left -= want;
  }
  for(i=0;i<out.length && left>0;i++){
    var add = Math.min(caps[i]-out[i], left);
    out[i]+=add; left-=add;
  }
  return out;
}
/* 사람 자리(0~100 상대 좌표). 12시 방향부터 시계 방향으로, 안쪽 고리는 반 칸 어긋나게 둔다
   (같은 각도로 겹쳐 놓으면 선이 한 방향으로만 뻗어 실뭉치처럼 보인다). */
function gcPositions(n){
  var spec = gcLayoutSpec(n);
  var alloc = gcAllocate(n, spec.rings.map(function(r){ return r.cap; }));
  var pos = [];
  spec.rings.forEach(function(ring, ri){
    var cnt = alloc[ri];
    if(!cnt) return;
    var off = -Math.PI/2 + (ri%2 ? Math.PI/cnt : 0);
    for(var i=0;i<cnt;i++){
      var a = off + Math.PI*2*i/cnt;
      pos.push({x:50 + ring.f*100*Math.cos(a), y:50 + ring.f*100*Math.sin(a), ring:ri});
    }
  });
  return {spec:spec, pos:pos};
}
/* 두 사각형이 겹치는지. 이름표 자리를 고를 때만 쓴다(단위는 "무대 한 변의 %"). */
function gcOverlap(a,b){
  return !(a.x+a.w <= b.x || b.x+b.w <= a.x || a.y+a.h <= b.y || b.y+b.h <= a.y);
}

/* ---------------------------------------------------------------------
   그림 — 원형 배치 + 캐릭터 아바타 + 관계선 + 일상어 이름표 (전부 인라인 SVG/DOM, 외부 라이브러리 0)
   ---------------------------------------------------------------------
   30명이면 쌍이 435개다. 다 그리면 실뭉치가 되므로 선은 "눈에 띄는 것만" 그린다.
     · 쌍이 10개 이하(사람 5명까지)  → 전부 그린다. 참고 이미지와 같은 그림이 나오는 구간이다.
     · 그보다 많으면              → 제일 잘 맞는 K쌍 + 제일 안 맞는 K쌍만 (K는 4~6)
     · 사람을 누르면              → 그 사람과 나머지 사이의 선만
--------------------------------------------------------------------- */
function buildGroupCompatGraph(members, pairs, onSelect){
  var n = members.length;
  var lay = gcPositions(n), spec = lay.spec, pos = lay.pos;
  var wrap = el('div',{});
  var stage = el('div',{class:'gc-stage',
    style:'--gc-av:'+spec.av+';--gc-fs:'+spec.fs+'px;--gc-tagfs:'+spec.tagfs+'px;--gc-max:'+spec.max+';'});
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 100 100');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.setAttribute('class','gc-svg');
  /* 선 그림 자체에 이름을 붙인다. 사람 버튼은 아래에 진짜 버튼으로 따로 있으므로,
     여기 role='img'가 버튼을 삼키지 않는다(형제 관계다). */
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label','그룹 궁합 그림');
  stage.appendChild(svg);
  var tagLayer = el('div',{class:'gc-tags','aria-hidden':'true'});
  stage.appendChild(tagLayer);
  /* 이름표를 다 못 놓았을 때 그림 아래에 글로 옮겨 적는 자리(paint에서 채운다) */
  var drawnBox = el('div',{});

  /* 사람 노드 — 아바타는 캐릭터 그림(MBTI 21종 중 하나), 없으면 이름 첫 글자 */
  var nodeBtns = [];
  members.forEach(function(m, i){
    var pt = pos[i];
    var btn = el('button',{type:'button', class:'gc-node',
      style:'left:'+pt.x.toFixed(2)+'%;top:'+pt.y.toFixed(2)+'%;',
      'aria-pressed':'false', 'aria-label':m.name+'님 기준으로 궁합 보기'});
    var av = el('div',{class:'gc-avatar'});
    var ck = charKeyForMbti(m.mbti) || charKeyForElementIdx(m.elementIdx);
    if(ck) av.appendChild(buildCharSvg(ck, 100, {mini:true, label:m.name+'님의 캐릭터'}));
    else av.appendChild(el('span',{},[(m.name||'?').trim().slice(0,1) || '?']));
    btn.appendChild(av);
    btn.appendChild(el('div',{class:'gc-label'},[m.name]));
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      select(this.getAttribute('aria-pressed')==='true' ? null : i);
    });
    stage.appendChild(btn);
    nodeBtns.push(btn);
  });
  /* 빈 곳을 누르면 전체로 돌아온다 */
  stage.addEventListener('click', function(){ select(null); });

  /* 이름표를 놓을 때 피해야 하는 자리 = 얼굴(아바타)이 차지하는 칸.
     아래 이름 글자까지 통째로 피하게 하면 30명일 때 놓을 자리가 아예 없어져 이름표가 한 개도
     안 남는다(실측으로 확인했다). 그래서 "얼굴은 절대 가리지 않는다"만 지키고, 이름 글자와는
     겹칠 수 있게 뒀다 — 이름 글자는 이름표보다 뒤(z축 아래)에 있고, 정말 필요하면 사람을 눌러
     그 사람만 보면 된다. 대신 겹친 정도는 실측해 SELF_CHECK에 적는다. */
  function byScoreDesc(a,b){ return b.res.combined - a.res.combined; }
  /* 이름표를 놓는 순서 = 중요한 것부터. 자리가 모자라면 뒤쪽이 밀리므로,
     "제일 잘 맞는 짝"과 "제일 부딪히는 짝"을 번갈아 맨 앞에 세운다. */
  function interleaveEnds(sorted, k){
    var out=[], i;
    for(i=0;i<k;i++){
      if(sorted[i] && out.indexOf(sorted[i])<0) out.push(sorted[i]);
      var back = sorted[sorted.length-1-i];
      if(back && out.indexOf(back)<0) out.push(back);
    }
    return out;
  }
  function pickHighlights(sel){
    if(sel!=null){
      var mine = pairs.filter(function(pr){ return pr.ai===sel || pr.bi===sel; });
      var s = mine.slice().sort(byScoreDesc);
      return {lines:mine, labels:interleaveEnds(s, 3)};
    }
    /* ★ R35 — 쌍이 10개 이하라도 이름표를 다 붙이지 않는다.
       5명이면 선이 10개인데 거기에 이름표를 10개 얹으니 그림이 글자로 덮였다(대표님 지적).
       선은 전부 그리되 이름표는 눈에 띄는 것만 — 가장 잘 맞는 쪽과 가장 부딪히는 쪽 두 개씩.
       나머지 선은 아래에서 흐리게 그려, 관계는 보이되 읽을 것은 네 개로 줄어든다. */
    if(pairs.length<=10){
      var srt = pairs.slice().sort(byScoreDesc);
      return {lines:pairs, labels:interleaveEnds(srt, Math.min(2, Math.ceil(pairs.length/2)))};
    }
    var sorted = pairs.slice().sort(byScoreDesc);
    /* 사람이 많을수록 선을 적게 그린다. 30명이면 435쌍이라 다 그리면 실뭉치가 되고,
       선이 많으면 이름표를 놓을 자리도 함께 사라진다(실측으로 확인했다). */
    var k = n<=15 ? 4 : 3;
    var lines = interleaveEnds(sorted, k);
    return {lines:lines, labels:lines.slice()};
  }

  /* ---------------------------------------------------------------------
     이름표 놓기 — 실제로 그려진 크기를 재서 놓는다.
     ---------------------------------------------------------------------
     ★ 처음에는 "글자 수 × 글자 크기"로 어림해 놓았는데, 어림값은 무대 폭을 320px 기준으로만
       잡아 두므로 화면이 넓어져도 이름표가 여전히 크다고 착각해 넓은 화면에서도 이름표가
       사라졌다(실제 브라우저에서 잡았다). 그래서 한 번 붙여 놓고 rAF에서 실제 크기를 재
       그 값으로 자리를 정한다. 얼굴 자리도 어림하지 않고 실제 아바타 사각형을 잰다.
     ★ 되돌릴 것이 없는 1회성 rAF다(setInterval·resize 리스너를 남기지 않는다).
       화면 폭이 바뀌면 다음 렌더에서 다시 잰다 — 그동안은 이름표가 조금 어긋날 수 있다.
  --------------------------------------------------------------------- */
  var TAG_RAF = 0;
  var pending = null;   /* {items:[{el,pr,a,b}], hi:..., sel:..., desc:...} */
  function layoutTags(){
    TAG_RAF = 0;
    if(!pending) return;
    var job = pending;
    var sr = stage.getBoundingClientRect();
    if(!sr.width){ return; }                       /* 아직 화면에 붙지 않았으면 그냥 둔다 */
    var W = sr.width;
    function toPctX(px){ return (px - sr.left)/W*100; }
    function toPctY(px){ return (px - sr.top)/W*100; }
    /* 얼굴 자리(실측) */
    var faces = nodeBtns.map(function(b){
      var r = b.firstChild.getBoundingClientRect();
      return {x:toPctX(r.left)-0.4, y:toPctY(r.top)-0.4, w:r.width/W*100+0.8, h:r.height/W*100+0.8};
    });
    /* 이름 글자 자리(실측) — 가능하면 이것도 피하지만, 못 피하면 얼굴만 피한다. */
    var labels = nodeBtns.map(function(b){
      var r = b.lastChild.getBoundingClientRect();
      return {x:toPctX(r.left), y:toPctY(r.top), w:r.width/W*100, h:r.height/W*100};
    });
    var tOffs = [0.50,0.42,0.58,0.35,0.65,0.28,0.72,0.22,0.78];
    var placed = [], skipped = 0;
    job.items.forEach(function(it){
      var tr = it.el.getBoundingClientRect();
      var w = tr.width/W*100, h = tr.height/W*100;
      var a=it.a, b=it.b;
      var dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy) || 1;
      var nx=-dy/len, ny=dx/len;                   /* 선에 수직인 방향 */
      var perp = [0, h*0.9, -h*0.9, h*1.9, -h*1.9];
      /* 1바퀴: 얼굴+이름 글자 둘 다 피한다. 2바퀴: 자리가 없으면 얼굴만 피한다. */
      for(var pass=0; pass<2; pass++){
        for(var si=0; si<tOffs.length; si++){
          for(var pi=0; pi<perp.length; pi++){
            var t = tOffs[si];
            var cx = a.x + dx*t + nx*perp[pi], cy = a.y + dy*t + ny*perp[pi];
            var box = {x:cx-w/2, y:cy-h/2, w:w, h:h};
            if(box.x<0 || box.y<0 || box.x+box.w>100 || box.y+box.h>100) continue;
            var bad=false, q;
            for(q=0;q<placed.length && !bad;q++) if(gcOverlap(box, placed[q])) bad=true;
            for(q=0;q<faces.length && !bad;q++) if(gcOverlap(box, faces[q])) bad=true;
            if(!bad && pass===0){ for(q=0;q<labels.length && !bad;q++) if(gcOverlap(box, labels[q])) bad=true; }
            if(bad) continue;
            placed.push(box);
            it.el.style.left = cx.toFixed(2)+'%';
            it.el.style.top = cy.toFixed(2)+'%';
            it.el.style.visibility = 'visible';
            return;
          }
        }
      }
      if(it.el.parentNode) it.el.parentNode.removeChild(it.el);
      skipped++;
    });
    finishDesc(job, skipped);
    pending = null;
  }
  /* 그림 설명(낭독용)과 "그림에 그린 선" 목록. 몇 개를 못 놓았는지까지 알아야 문장이 정확해지므로
     이름표를 다 놓은 뒤에 쓴다. */
  function finishDesc(job, skipped){
    var desc = job.desc;
    if(skipped>0) desc += ' 이름표 '+skipped+'개는 자리가 겹쳐 그림에서 생략했고, 바로 아래 목록에 그대로 있습니다.';
    svg.setAttribute('aria-label', desc);

    /* 사람이 많아지면 이름표를 놓을 자리가 실제로 사라진다(20명 이상 320px에서 실측).
       그때는 이름표를 억지로 겹쳐 찍는 대신, 지금 그림에 그린 선을 그대로 글로 옮겨 적는다.
       ★ 여기 적히는 것은 이름·점수·등급(일상어)까지다 — 유료인 쌍별 해설 문장은 넣지 않는다. */
    while(drawnBox.firstChild) drawnBox.removeChild(drawnBox.firstChild);
    if(skipped>0){
      drawnBox.appendChild(el('p',{class:'section-sub', style:'margin:12px 0 4px;text-align:center;'},
        ['그림에 그린 선 '+job.hi.lines.length+'개']));
      var list = el('div',{});
      job.hi.lines.slice().sort(byScoreDesc).forEach(function(pr){
        var row = el('div',{class:'gc-rank-row'});
        row.appendChild(el('span',{class:'gr-no'},[el('span',{style:'display:inline-block;width:9px;height:9px;border-radius:50%;background:'+GC_TIER_COLORS[pr.res.combinedTier]+';'})]));
        row.appendChild(el('span',{class:'gr-who'},[pr.a.name+' × '+pr.b.name]));
        row.appendChild(el('span',{class:'gr-val'},[
          pr.res.combined+'점',
          el('span',{class:'gr-plain', style:'color:'+GC_TIER_COLORS[pr.res.combinedTier]+';'},[gcPlain(pr.res.combinedTier)])
        ]));
        list.appendChild(row);
      });
      drawnBox.appendChild(list);
    }
  }

  function paint(sel){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    while(tagLayer.firstChild) tagLayer.removeChild(tagLayer.firstChild);
    var hi = pickHighlights(sel);
    /* 이름표가 붙는 선만 진하게 그린다. 나머지는 관계가 있다는 것만 보이게 흐리게 둔다. */
    var labeled = {};
    hi.labels.forEach(function(pr){ labeled[pr.ai+'-'+pr.bi] = 1; });
    hi.lines.forEach(function(pr){
      var a=pos[pr.ai], b=pos[pr.bi];
      var on = !!labeled[pr.ai+'-'+pr.bi];
      var line=document.createElementNS(ns,'line');
      line.setAttribute('x1',a.x.toFixed(2)); line.setAttribute('y1',a.y.toFixed(2));
      line.setAttribute('x2',b.x.toFixed(2)); line.setAttribute('y2',b.y.toFixed(2));
      line.setAttribute('stroke', GC_TIER_COLORS[pr.res.combinedTier]);
      line.setAttribute('stroke-width', on ? (sel!=null ? '2.4' : '2') : '1.1');
      line.setAttribute('stroke-linecap','round');
      line.setAttribute('vector-effect','non-scaling-stroke');
      line.setAttribute('class','gc-line');
      line.setAttribute('opacity', on ? '0.95' : '0.28');
      svg.appendChild(line);
    });
    /* 이름표를 일단 다 붙여 둔다(안 보이게). 자리는 바로 아래 rAF에서 실제 크기를 재 정한다. */
    var items = hi.labels.map(function(pr){
      var sp = el('span',{class:'gc-tag',
        style:'left:50%;top:50%;visibility:hidden;color:'+GC_TIER_COLORS[pr.res.combinedTier]+';'},
        [gcPlain(pr.res.combinedTier)]);
      tagLayer.appendChild(sp);
      return {el:sp, pr:pr, a:pos[pr.ai], b:pos[pr.bi]};
    });

    var sorted = pairs.slice().sort(byScoreDesc);
    var top = sorted[0], bot = sorted[sorted.length-1];
    var desc;
    if(sel!=null){
      var mine = pairs.filter(function(pr){ return pr.ai===sel || pr.bi===sel; }).slice().sort(byScoreDesc);
      var bestOther = mine[0] ? (mine[0].ai===sel ? mine[0].b : mine[0].a) : null;
      var worstOther = mine.length ? (mine[mine.length-1].ai===sel ? mine[mine.length-1].b : mine[mine.length-1].a) : null;
      desc = members[sel].name+'님을 가운데 두고 나머지 '+(n-1)+'명과의 선만 보이는 그림입니다.';
      if(bestOther) desc += ' 제일 잘 맞는 사람은 '+bestOther.name+'('+mine[0].res.combined+'점 · '+gcPlain(mine[0].res.combinedTier)+')';
      if(worstOther) desc += ', 제일 부딪히는 사람은 '+worstOther.name+'('+mine[mine.length-1].res.combined+'점 · '+gcPlain(mine[mine.length-1].res.combinedTier)+')입니다.';
    } else {
      /* ★ 이름이 문장에 들어가므로 '과/와'를 고정으로 쓰면 반드시 틀린다("민수과 하늘"). */
      desc = n+'명을 원으로 놓고 '+hi.lines.length+'쌍을 선으로 이은 그림입니다. 전체 '+pairs.length+'쌍 가운데 '+
        '제일 잘 맞는 짝은 '+josa(top.a.name,'과','와')+' '+top.b.name+'('+top.res.combined+'점 · '+gcPlain(top.res.combinedTier)+'), '+
        '제일 부딪히는 짝은 '+josa(bot.a.name,'과','와')+' '+bot.b.name+'('+bot.res.combined+'점 · '+gcPlain(bot.res.combinedTier)+')입니다.';
    }
    svg.setAttribute('aria-label', desc);
    pending = {items:items, hi:hi, sel:sel, desc:desc};
    if(TAG_RAF) cancelAnimationFrame(TAG_RAF);
    TAG_RAF = requestAnimationFrame(layoutTags);
  }

  function select(idx){
    GC_SEL = idx;
    nodeBtns.forEach(function(b, i){
      var on = (i===idx);
      b.setAttribute('aria-pressed', on?'true':'false');
      b.classList.toggle('dim', idx!=null && !on);
    });
    paint(idx);
    if(onSelect) onSelect(idx);
  }

  wrap.appendChild(stage);
  wrap.appendChild(el('p',{class:'gc-hint'},['궁금한 친구를 눌러보세요. 다시 누르면 전체로 돌아와요.']));
  wrap.appendChild(drawnBox);

  /* ★ R36 — 예전에는 '일상어 (등급 이름)' 두 벌을 나란히 적었다. 이름이 하나로 합쳐진 지금
     그대로 두면 '찰떡 케미 (찰떡 케미)'가 된다. 점수 구간을 대신 적어 범례가 실제로 쓸모 있게 한다. */
  var TIER_RANGE = {'찰떡 케미':'85점 이상','강한 케미':'70~84점','무난한 케미':'55~69점',
                    '엇갈린 케미':'40~54점','상극 케미':'39점 이하'};
  var legend=el('div',{class:'gc-legend'});
  GC_TIER_ORDER.forEach(function(t){
    legend.appendChild(el('span',{},[
      el('span',{class:'dot', style:'background:'+GC_TIER_COLORS[t]+';'}),
      t,
      el('span',{class:'gl-term'},[TIER_RANGE[t] || ''])
    ]));
  });
  wrap.appendChild(legend);

  select(GC_SEL!=null && GC_SEL<n ? GC_SEL : null);
  return wrap;
}

/* ---------------------------------------------------------------------
   전체 순위 목록 — 30명이면 435쌍이라 전부 늘어놓지 않는다.
   잘 맞는 순 / 안 맞는 순을 골라 10쌍씩 끊어 보여주고 "더 보기"로 늘린다.
   ★ 무료 범위: 이름 · 점수 · 등급(일상어)까지만. 쌍별 해설 문장은 여기 넣지 않는다.
--------------------------------------------------------------------- */
var GC_RANK_STEP = 10;
var GC_RANK = {order:'best', shown:GC_RANK_STEP};
function buildGroupRankPanel(pairs){
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['전체 순위']));
  card.appendChild(el('p',{class:'section-sub'},
    [pairs.length+'쌍을 모두 견줘 봤어요. 점수와 등급까지는 무료로 보여드려요.']));
  var tabs = el('div',{class:'gc-members', role:'group', 'aria-label':'순위 정렬 방식'});
  var listBox = el('div',{});
  var moreWrap = el('div',{});

  function paintList(){
    while(listBox.firstChild) listBox.removeChild(listBox.firstChild);
    while(moreWrap.firstChild) moreWrap.removeChild(moreWrap.firstChild);
    var sorted = pairs.slice().sort(function(a,b){
      return GC_RANK.order==='best' ? (b.res.combined-a.res.combined) : (a.res.combined-b.res.combined);
    });
    var show = Math.min(GC_RANK.shown, sorted.length);
    sorted.slice(0, show).forEach(function(pr, i){
      var row = el('div',{class:'gc-rank-row'});
      row.appendChild(el('span',{class:'gr-no'},[(i+1)+'.']));
      row.appendChild(el('span',{class:'gr-who'},[pr.a.name+' × '+pr.b.name]));
      row.appendChild(el('span',{class:'gr-val'},[
        pr.res.combined+'점',
        el('span',{class:'gr-plain', style:'color:'+GC_TIER_COLORS[pr.res.combinedTier]+';'},[gcPlain(pr.res.combinedTier)])
      ]));
      listBox.appendChild(row);
    });
    if(show < sorted.length){
      moreWrap.appendChild(el('button',{class:'btn btn-ghost btn-sm', type:'button', style:'margin-top:10px;',
        onclick:function(){ GC_RANK.shown += GC_RANK_STEP; paintList(); }},
        ['더 보기 (남은 '+(sorted.length-show)+'쌍)']));
    } else if(sorted.length > GC_RANK_STEP){
      moreWrap.appendChild(el('button',{class:'btn btn-ghost btn-sm', type:'button', style:'margin-top:10px;',
        onclick:function(){ GC_RANK.shown = GC_RANK_STEP; paintList(); }}, ['접기']));
    }
  }
  [['best','잘 맞는 순'],['worst','안 맞는 순']].forEach(function(pair){
    var b = el('button',{type:'button', class:'gc-member',
      'aria-pressed': GC_RANK.order===pair[0] ? 'true':'false'}, [pair[1]]);
    b.addEventListener('click', function(){
      GC_RANK.order = pair[0]; GC_RANK.shown = GC_RANK_STEP;
      $all('button', tabs).forEach(function(x){ x.setAttribute('aria-pressed', x===b ? 'true':'false'); });
      paintList();
    });
    tabs.appendChild(b);
  });
  card.appendChild(tabs);
  card.appendChild(listBox);
  card.appendChild(moreWrap);
  paintList();
  return card;
}

/* 인물별 궁합 요약 카드 리스트 — 사주+MBTI 두 축을 항상 병기, "이어보기"로 1:1 상세 펼치기
   ★ 무료 범위는 1:1 궁합 화면과 같은 기준으로 맞춘다.
     무료: 이름 · 등급 배지 · 한 줄 요약(사주 관점 한 줄 + MBTI 케미 한 줄) · 최고/최저 상대(점수·등급)
     유료(compat_full): 쌍별 상세 — 종합/사주/MBTI 점수, 쌍마다의 오행 관계와 케미 문장
     잠긴 부분은 흐리게 가리는 게 아니라 아예 DOM에 만들지 않는다. */
function buildGroupCompatCards(members, pairs, unlocked){
  var wrap=el('div',{class:'gc-cards'});
  members.forEach(function(m, mi){
    var related = pairs.filter(function(pr){ return pr.ai===mi || pr.bi===mi; });
    if(!related.length) return;
    var avg = Math.round(related.reduce(function(s,pr){ return s+pr.res.combined; },0)/related.length);
    var tier = avg>=85?'찰떡 케미':avg>=70?'강한 케미':avg>=55?'무난한 케미':avg>=40?'엇갈린 케미':'상극 케미';
    var best = related.reduce(function(x,pr){ return pr.res.combined>x.res.combined?pr:x; }, related[0]);
    var worst = related.reduce(function(x,pr){ return pr.res.combined<x.res.combined?pr:x; }, related[0]);
    var bestOther = best.ai===mi ? best.b : best.a;
    var worstOther = worst.ai===mi ? worst.b : worst.a;
    var elemPhrase = best.res.saju.elemRel.indexOf(' — ')>=0 ? best.res.saju.elemRel.split(' — ')[1] : best.res.saju.elemRel;
    var mbtiPhrase = best.res.categories.chemistry;

    var card=el('div',{class:'scroll-card'});
    var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;'});
    head.appendChild(el('h3',{style:'margin-bottom:0;'},[m.name]));
    head.appendChild(el('span',{class:'badge', style:'border-color:'+GC_TIER_COLORS[tier]+';color:'+GC_TIER_COLORS[tier]+';'},[tier]));
    card.appendChild(head);
    card.appendChild(el('p',{class:'section-sub', style:'margin-top:8px;'},['사주로는 '+elemPhrase+', MBTI로는 '+mbtiPhrase]));
    /* 사람별 "나와 제일 잘 맞는 사람 / 제일 부딪히는 사람" — 점수와 등급까지가 무료다. */
    card.appendChild(el('p',{class:'section-sub', style:'margin-top:6px;'},
      ['제일 잘 맞는 사람: '+bestOther.name+' ('+best.res.combined+'점 · '+gcPlain(best.res.combinedTier)+')']));
    if(related.length>1){
      card.appendChild(el('p',{class:'section-sub', style:'margin-top:2px;'},
        ['제일 부딪히는 사람: '+worstOther.name+' ('+worst.res.combined+'점 · '+gcPlain(worst.res.combinedTier)+')']));
    }

    if(unlocked){
      /* aria-expanded만 있고 aria-controls가 없으면 "무엇이 펼쳐지는지"를 보조기술이 알 수 없다.
         펼쳐지는 영역에 id를 부여하고 그 id를 그대로 가리킨다(가리키는 id가 실제로 존재해야 한다). */
      var detailId = 'gcDetail-'+m.id;
      /* 라벨 글자와 방향 아이콘을 분리해 둔다 — 예전에는 '↓'/'↑' 문자를 라벨에 섞어
         낭독기가 "아래쪽 화살표"까지 읽었다. 아래 토글에서 이 둘을 따로 갈아 끼운다. */
      var expandLabel=el('span',{},[m.name+'의 쌍별 상세 이어보기']);
      var expandBtn=el('button',{class:'btn btn-ghost btn-sm', type:'button', style:'margin-top:6px;',
        'aria-expanded':'false', 'aria-controls':detailId},[expandLabel, dirIcon('down')]);
      var detail=el('div',{id:detailId, class:'hidden', style:'margin-top:8px;', role:'region', 'aria-label':m.name+'의 쌍별 상세'});
      related.forEach(function(pr){
        var other = pr.ai===mi ? pr.b : pr.a;
        var row=el('div',{class:'gc-pair-row'});
        var left=el('div',{style:'min-width:0;'},[
          el('div',{},[other.name]),
          el('div',{class:'section-sub', style:'margin:2px 0 0;'},[pr.res.saju.elemRel])
        ]);
        var right=el('div',{style:'text-align:right;flex:none;'},[
          el('div',{},[pr.res.combined+'점 · '+pr.res.combinedTier]),
          el('div',{class:'section-sub', style:'margin-top:2px;'},['사주 '+pr.res.saju.score+'점 · MBTI '+pr.res.mbtiScore+'점'])
        ]);
        row.appendChild(left); row.appendChild(right);
        detail.appendChild(row);
        /* R35 — 쌍마다 근거를 접어서 붙인다. 1:1 결과와 같은 함수를 쓰므로 두 화면이 같은 말을 한다. */
        detail.appendChild(buildPairReasonBlock(pr.a, pr.b, pr.res, true));
      });
      expandBtn.addEventListener('click', (function(personName){ return function(){
        var open = this.getAttribute('aria-expanded')==='true';
        this.setAttribute('aria-expanded', open?'false':'true');
        expandLabel.textContent = personName + (open ? '의 쌍별 상세 이어보기' : '의 쌍별 상세 접기');
        this.replaceChild(dirIcon(open ? 'down' : 'up'), this.lastChild);
        this._detail.classList.toggle('hidden', open);
      }; })(m.name));
      expandBtn._detail = detail;
      card.appendChild(expandBtn);
      card.appendChild(detail);
    } else {
      /* 잠긴 상태에서는 쌍별 상세를 만들지 않는다. 무엇이 잠겼는지만 알린다. */
      card.appendChild(el('p',{class:'biz-hint', style:'margin-top:6px;'},
        [compatLockMark(), related.length+'명과의 자세한 궁합이 더 있어요']));
    }
    wrap.appendChild(card);
  });
  return wrap;
}

/* =====================================================================
   그룹 링크 — 여러 사람을 한 주소에 담아 보낸다 (서버 없음)
   ---------------------------------------------------------------------
   담기는 항목은 궁합 초대 링크와 완전히 같다. 그래서 항목표도 INVITE_FIELDS 하나를 그대로 쓴다
   (초대 링크는 그 표를 JSON으로, 그룹 링크는 같은 표를 사람당 한 줄씩 쉼표로 잇는다).
   ★ 왜 JSON을 안 쓰나 — 30명이면 따옴표·중괄호만으로도 주소가 1,000자 넘게 길어진다.
     아래 방식은 한 사람당 약 60~70자다(한글 3글자 이름 기준, 실측값은 SELF_CHECK R28 참고).
   ★ 기존 초대 링크(#invite=...)는 한 글자도 건드리지 않았다 — 이미 나간 링크가 그대로 열린다.
     새 형식은 다른 이름표(#meet=)를 쓰고, 맨 앞에 형식 번호를 붙여 나중에 바꿔도 옛 링크를 구분한다.
   ★ 구분자로 쉼표(,)와 세미콜론(;)을 쓰는 이유: 둘 다 encodeURIComponent가 반드시 %XX로 바꾸는
     글자라, 이름 안에 들어 있어도 구분자와 헷갈리지 않는다. (물결표 ~ 나 느낌표 ! 는 안 바뀐다.)
===================================================================== */
var GC_MEET_VER = '1';
/* 주소 길이 상한. 브라우저 자체 한계는 훨씬 크지만(크롬 2MB · 파이어폭스 6.5만 · 사파리 8만 자),
   링크는 메신저·QR·문서를 거쳐 다니고 그 쪽 한계가 훨씬 낮다. 옛 IE 한계(2,083자)에서 굳어진
   "2,000자 이하로 유지" 관행을 그대로 따른다. 실제로 몇 명이 들어가는지는 아래 buildMeetLink가
   한 명씩 붙여 보며 재고, 화면에도 그 숫자를 그대로 적는다(지어낸 숫자를 쓰지 않는다). */
var GC_URL_SAFE_MAX = 2000;
function gcMeetRow(p){
  return INVITE_FIELDS.map(function(f){
    var v = f.get(p);
    if(v===null || v===undefined) return '';
    if(f.k==='n') return encodeURIComponent(String(v).slice(0,20));
    if(f.k==='lo') return String(Math.round(Number(v)*100)/100);
    if(f.k==='ts') return v ? '1' : '0';
    return String(v);
  }).join(',');
}
/* 프로필 목록을 앞에서부터 담다가 상한을 넘으면 멈춘다. 몇 명이 담겼는지 함께 돌려준다. */
function buildMeetLink(profiles){
  var base = location.href.split('#')[0];
  var used = [], link = base + '#meet=' + GC_MEET_VER, i;
  for(i=0;i<profiles.length;i++){
    var cand = base + '#meet=' + GC_MEET_VER + ';' + used.concat([gcMeetRow(profiles[i])]).join(';');
    if(cand.length > GC_URL_SAFE_MAX && used.length >= 2) break;
    used.push(gcMeetRow(profiles[i]));
    link = cand;
  }
  return {url:link, count:used.length, total:profiles.length, len:link.length};
}
function decodeMeetFromHash(hash){
  var m = /[#&]meet=([^&]+)/.exec(hash||'');
  if(!m) return null;
  var parts = String(m[1]).split(';');
  if(parts.shift() !== GC_MEET_VER) return null;
  var rows = [];
  for(var i=0;i<parts.length && rows.length<GC_MAX;i++){
    var f = parts[i].split(',');
    if(f.length < INVITE_FIELDS.length) continue;
    var o = {};
    INVITE_FIELDS.forEach(function(fd, ix){ o[fd.k] = f[ix]; });
    var name='';
    try{ name = decodeURIComponent(o.n||'').slice(0,20); }catch(e){ name=''; }
    var mbti = /^[EI][NS][FT][JP]$/.test(o.m||'') ? o.m : null;
    var y=parseInt(o.y,10), mo=parseInt(o.mo,10), d=parseInt(o.d,10);
    if(!mbti || !MBTI_MATRIX[mbti]) continue;
    if(!(y>=1900 && y<=2100) || !(mo>=1 && mo<=12) || !(d>=1 && d<=31)) continue;
    var h = (o.h==='' || o.h==null) ? null : parseInt(o.h,10);
    if(h!=null && !(h>=0 && h<=23)) h=null;
    var mi = parseInt(o.mi,10); if(!(mi>=0 && mi<=59)) mi=0;
    var lo = parseFloat(o.lo); if(!isFinite(lo) || lo<-180 || lo>180) lo = SajuEngine.LON_DEFAULT;
    rows.push({n: name || ('친구'+(rows.length+1)), m:mbti, y:y, mo:mo, d:d, h:h, mi:mi,
               g:(o.g==='M'?'M':'F'), lo:lo, ts:(o.ts==='1')});
  }
  return rows.length>=2 ? rows : null;
}
function openMeetLinkModal(profiles){
  var made = buildMeetLink(profiles);
  var body = el('div',{});
  body.appendChild(el('p',{},['이 링크를 보내면, 링크를 연 사람 화면에 지금 이 그룹 그림이 그대로 떠요. 받는 사람이 정보를 따로 입력하지 않아도 돼요.']));
  body.appendChild(el('div',{class:'field'},[ el('input',{type:'text', value:made.url, readOnly:'readonly', id:'meetLinkInput'}) ]));
  body.appendChild(el('p',{class:'biz-hint'},[
    '주소 길이는 '+made.len+'자예요. 브라우저 자체 한계는 이보다 훨씬 크지만(크롬 약 2MB), 메신저·QR·문서를 거치며 잘리는 일이 있어 '+
    GC_URL_SAFE_MAX+'자를 넘지 않도록 인원을 끊었어요.'
  ]));
  if(made.count < made.total){
    body.appendChild(el('p',{class:'biz-hint'},[
      '지금 그룹 '+made.total+'명 가운데 앞에서부터 '+made.count+'명까지만 링크에 담겼어요. 이름이 길수록 한 사람이 차지하는 주소 길이가 늘어나서, 담기는 인원은 그때그때 달라져요. 나머지는 링크를 나눠 보내주세요.'
    ]));
  }
  /* 링크에 무엇이 들어가는지 만들기 전에 알린다. 개인정보처리방침에도 같은 표(INVITE_FIELDS)로 적혀 있다. */
  body.appendChild(el('p',{class:'biz-hint'},[
    '이 링크 주소 안에는 그룹에 담긴 '+made.count+'명의 '+inviteFieldsText()+josaOnly(inviteFieldsText(),'이','가')+
    ' 암호화 없이 그대로 담깁니다. 내 정보만이 아니라 다른 사람의 정보까지 함께 나가는 링크예요. 받는 사람의 대화 기록과 브라우저 방문 기록에도 남으니, 그룹에 있는 사람들에게만 보내주세요.'
  ]));
  openModal('그룹 링크', body, [
    {label:'닫기', cls:'btn-ghost', onclick:closeModal},
    {label:'공유하기', cls:'btn-primary', onclick:function(){
      if(navigator.share){
        navigator.share({title:COMPANY.serviceName+' 그룹 궁합', text:'우리 그룹 궁합을 한 그림으로 봤어요.', url:made.url}).catch(function(){});
      } else {
        copyText(made.url);
      }
    }}
  ]);
}

/* =====================================================================
   렌더: 그룹 궁합 화면 (renderCompat()과 별개 화면, 기존 1:1 궁합 입력/상태 건드리지 않음)
===================================================================== */
var GC_SEL = null;      /* 지금 눌러 둔 사람의 자리 번호. null이면 전체 보기 */
var GC_PICK = null;     /* 그룹에 넣기로 고른 프로필 id 목록. null이면 저장된 순서대로 앞에서 30명 */
/* =====================================================================
   R34 — 저장된 그룹 (이름 + 관리용 PIN)
   ---------------------------------------------------------------------
   대표님 지시: 지속가능한 별도 URL + 그룹 이름 + 관리용 PIN.

   · 저장하면 주소(#g=...)가 생긴다. 그 주소로 언제든 같은 그룹이 열린다.
   · 링크를 아는 사람은 볼 수 있고, 고치거나 지우는 것만 PIN이 필요하다.
   · PIN은 서버가 되돌릴 수 없는 형태로만 갖고 있어서, 잊으면 아무도 못 연다.
     그래서 만들 때 그 사실을 분명히 적는다 — 나중에 알면 늦다.
   ★ 이 기기에는 그룹 주소와 이름만 기억한다. 명단(남의 생년월일)은 저장하지 않는다.
===================================================================== */
var GROUP_ENDPOINT = '/api/group';
var GROUP_VIEW = null;   /* {id, name, members[], mine} — 그룹 주소로 열었을 때만 값이 있다 */

function groupFetch(payload){
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;
  return fetch(GROUP_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload||{}), signal: ctrl?ctrl.signal:undefined
  }).then(function(r){
    if(timer) clearTimeout(timer);
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok){ var e=new Error(d && d.reason ? d.reason : ('HTTP '+r.status)); e.status=r.status; throw e; }
      return d;
    });
  }).catch(function(e){ if(timer) clearTimeout(timer); throw e; });
}

/* 이 기기가 기억하는 저장된 그룹 목록 — 주소와 이름뿐이다. */
function savedGroups(){ return Array.isArray(STATE.savedGroups) ? STATE.savedGroups : []; }
function rememberGroup(id, name, token){
  var prev = savedGroups().filter(function(x){ return x && x.id === id; })[0];
  var list = savedGroups().filter(function(x){ return x && x.id !== id; });
  /* ★ R39 — 소유자 토큰을 함께 기억한다. 이 기기에서는 PIN 없이 그룹을 고치고 지울 수 있다.
     토큰은 이 기기 밖으로 나가지 않는다(링크에도, 화면에도 넣지 않는다). */
  list.unshift({id:id, name:(name||'').slice(0,40), at:Date.now(),
                token: token || (prev && prev.token) || null});
  STATE.savedGroups = list.slice(0, 20);
  saveState();
}
function groupToken(id){
  var g = savedGroups().filter(function(x){ return x && x.id === id; })[0];
  return g && g.token ? g.token : null;
}
function forgetGroup(id){
  STATE.savedGroups = savedGroups().filter(function(x){ return x && x.id !== id; });
  saveState();
}
/* ★ location.href 로 만들면 안 된다. 짧은 주소(/g/…)로 들어온 화면에서는
   그 주소가 다시 붙어 …/g/AAA/g/BBB 같은 것이 나온다. origin에서 새로 만든다.

   ★ R45 — 주소 뒤에 그룹 이름을 붙이지 않는다 (대표님 결정).
     한글은 주소에 들어가면 한 글자가 아홉 자로 늘어난다
     (민준님의-궁합 → %EB%AF%BC%EC%A4%80…). 이름을 붙이면 57자짜리가 113자가 되어,
     짧게 만들려던 것보다 옛 주소(71자)보다도 길어졌다.
     이름을 안 붙여도 받는 사람은 링크를 열면 "○○ 그룹에 참여할까요?"를 보게 되므로
     무슨 그룹인지 모르는 일은 생기지 않는다.
   ★ 이름이 붙은 주소도 계속 받는다(/g/<번호>/이름). 이미 그렇게 보낸 링크가 있을 수 있다. */
function groupLink(id){ return location.origin + '/g/' + id; }

/* 궁합 입력의 상대 정보를 링크 한 줄로 만든다(그룹에 넣을 때 쓴다). */
function compatDraftRow(d){
  return inviteObjToRow({
    n:d.name||'', m:d.mbti, y:d.year, mo:d.month, d:d.day,
    h:d.timeUnknown?null:d.hour, mi:d.timeUnknown?null:(d.minute||0),
    g:d.gender||'F', lo:d.birthLon, ts:d.solarTimeAdjust?1:0
  });
}

/* 값 객체를 다시 한 줄로 되돌린다(inviteRowToObj의 반대). 받은 명단을 다시 저장할 때 쓴다. */
function inviteObjToRow(o){
  return INVITE_FIELDS.map(function(f){
    var v = o[f.k];
    if(v===null || v===undefined) return '';
    if(f.k==='n') return encodeURIComponent(String(v).slice(0,20));
    if(f.k==='lo') return String(Math.round(Number(v)*100)/100);
    if(f.k==='ts') return v ? '1' : '0';
    return String(v);
  }).join(',');
}

/* =====================================================================
   지금 화면에 세워진 사람들을 서버에 보낼 한 줄로 만든다(그룹 링크와 같은 형식).
   ---------------------------------------------------------------------
   ★ gcMembers()가 돌려주는 것은 "화면에 그리기 위한 객체"({id,name,mbti,elementIdx,person})이지
     프로필이 아니다. 처음에 그걸 그대로 gcMeetRow()에 넘겼더니 생년월일 자리가 전부 비어
     저장은 되는데 다시 열면 명단을 못 읽었다(실측으로 잡았다).
     그래서 원본을 쓴다 — 내 프로필이면 프로필을, 링크로 받은 명단이면 읽어 둔 값 객체를.
===================================================================== */
/* 1:1 궁합에서 넘어올 때 쓰는 씨앗 명단. 쓰고 나면 반드시 비운다. */
var PENDING_GROUP_SEED = null;
function currentGroupMembersText(){
  if(PENDING_GROUP_SEED) return PENDING_GROUP_SEED;
  if(GC_SOURCE==='link' && PENDING_MEET){
    return PENDING_MEET.slice(0, GC_MAX).map(inviteObjToRow).join(';');
  }
  var list = gcUsableProfiles();
  if(GC_PICK){
    var set={}; GC_PICK.forEach(function(id){ set[id]=1; });
    var picked = list.filter(function(p){ return set[p.id]; });
    if(picked.length>=2) list = picked;
  }
  return list.slice(0, GC_MAX).map(gcMeetRow).join(';');
}

  ]));
  /* ★ 잊으면 못 연다는 사실을 만들기 "전에" 말한다. 나중에 알면 늦다. */

  ]));
  body.appendChild(el('p',{class:'biz-hint'},[
    '그룹에는 담긴 분들의 '+inviteFieldsText()+josaOnly(inviteFieldsText(),'이','가')+' 함께 저장돼요. 그분들의 동의를 받고 저장해 주세요. '+GROUP_TTL_PHRASE+' 동안 보관됩니다.'
  ]));

  openModal('그룹 저장하기', body, [
    {label:'취소', cls:'btn-ghost', onclick:function(){ PENDING_GROUP_SEED=null; closeModal(); }},
    {label:'저장', cls:'btn-primary', onclick:function(){
      var name = (nameInput.value||'').trim();
      var pin  = (pinInput.value||'').trim();
      if(!name){ showToast('그룹 이름을 적어주세요.'); return; }
      if(!/^\d{4,8}$/.test(pin)){ showToast('PIN은 숫자 4~8자리로 정해주세요.'); return; }
      var members = currentGroupMembersText();
      if(!members){ showToast('저장할 사람이 없어요.'); return; }
      closeModal();
      showToast('그룹을 저장하는 중이에요…');
      groupFetch({action:'create', name:name, pin:pin, members:members})
        .then(function(d){
          if(!d || !d.groupId) throw new Error('저장에 실패했어요.');
          rememberGroup(d.groupId, name);
          /* ★ 저장했으면 이 화면은 이제 "저장된 그룹"이다. 이걸 안 세우면 모달을 닫아도
             여전히 [이름 붙여 저장하기]만 보이고, 주소·관리·접수 카드가 나오지 않는다.
             (실측으로 잡았다 — 저장은 됐는데 접수 주소가 어디에도 없었다.) */
          GROUP_VIEW = {id:d.groupId, name:name};
          if(PENDING_GROUP_SEED){
            /* 1:1에서 넘어온 경우 — 씨앗을 비우고 그룹 화면으로 데려간다.
               궁합 결과 화면에 남겨두면 방금 만든 그룹을 볼 길이 없다. */
            PENDING_GROUP_SEED = null;
            openSavedGroup(d.groupId);

          openGroupSavedModal(d.groupId, name);
        })
        .catch(function(err){ showToast(String(err && err.message || '지금은 저장할 수 없어요.')); });
    }}
  ]);
}

/* ---- 열기 ---- */
/* 누가 들어온 그룹은 더 이상 '아직 비어 있는 링크'가 아니다. 다음에 [링크 보내기]를 누르면
   새로 만들어야 한다 — 이미 쓰고 있는 그룹에 다른 사람을 끌어들이면 안 된다. */
function clearPendingInviteIfJoined(id, memberCount){
  if(STATE.pendingInviteGroup === id && memberCount > 1){
    STATE.pendingInviteGroup = null; saveState();
  }
}
function openSavedGroup(id){
  showToast('그룹을 불러오는 중이에요…');
  groupFetch({action:'get', groupId:id}).then(function(d){
    if(!d || !d.members) throw new Error('그룹을 찾을 수 없어요.');
    var rows = String(d.members).split(';').filter(Boolean);
    PENDING_MEET = rows.map(function(r){ return inviteRowToObj(r); }).filter(inviteObjValid);
    if(!PENDING_MEET.length) throw new Error('명단을 읽지 못했어요.');
    GROUP_VIEW = {id:id, name:d.name};
    rememberGroup(id, d.name);
    clearPendingInviteIfJoined(id, PENDING_MEET.length);
    GC_SOURCE='link'; GC_SEL=null; GC_PAIRS_CACHE={key:null,pairs:null,ms:0,computed:0};
    ROUTE='groupCompat'; render(); window.scrollTo(0,0);
  }).catch(function(err){
    var st = err && err.status;
    if(st===404){ forgetGroup(id); showToast('이 그룹은 없거나 보관 기간이 지났어요.'); }
    else showToast(String(err && err.message || '지금은 불러올 수 없어요.'));
    render();
  });
}

  /* ★ R39 — 이 기기에서 만든 그룹이면 PIN을 묻지 않는다. 만든 사람이 자기 그룹을 만지는 것이라
     매번 PIN을 요구하면 그게 더 이상하다. 대신 "다른 기기에서도 관리하려면" PIN을 정할 수 있게 한다. */
  var pinInput = el('input',{type:'text', inputMode:'numeric', maxLength:'8',

  ]));
  body.appendChild(el('p',{class:'biz-hint'},[ mine
    ? '이 그룹은 이 기기에서 만드셨어요. 여기서는 PIN 없이 바로 고칠 수 있어요. 다른 기기나 다른 분도 관리하게 하려면 PIN을 정해 알려주세요. 한 번 정한 PIN은 저희도 알 수 없으니 꼭 기억해 두세요.'
    : '저장할 때 정한 PIN을 넣어주세요.' ]));
  body.appendChild(el('p',{class:'biz-hint'},['이름을 바꾸거나, 지금 화면에 있는 사람들로 명단을 다시 저장할 수 있어요.']));

  openModal('그룹 관리', body, [
    {label:'닫기', cls:'btn-ghost', onclick:closeModal},
    {label:'저장', cls:'btn-primary', onclick:function(){
      var pin=(pinInput.value||'').trim(), nm=(nameInput.value||'').trim();
      var newPinVal = null;
      if(mine){
        /* 이 기기에서 만든 그룹 — 칸에 적힌 값은 "새로 정하는 PIN"이다. */
        if(pin && !/^\d{4,8}$/.test(pin)){ showToast('PIN은 숫자 4~8자리예요.'); return; }
        newPinVal = pin || null; pin = '';
      } else {
        if(!/^\d{4,8}$/.test(pin)){ showToast('PIN은 숫자 4~8자리예요.'); return; }
      }
      closeModal();
      groupFetch({action:'update', groupId:GROUP_VIEW.id, pin:pin, newPin:newPinVal, name:nm,

        .then(function(){
          GROUP_VIEW.name = nm || GROUP_VIEW.name;
          rememberGroup(GROUP_VIEW.id, GROUP_VIEW.name);

          render();
        })
        .catch(function(err){ showToast(String(err && err.message || '고치지 못했어요.')); });
    }}
  ]);
}

/* =====================================================================
   R35 — 접수 주소: 각자 스스로 그룹에 참여한다 (대표님 지시)
   ---------------------------------------------------------------------
   지금까지 그룹 명단은 "저장하는 사람"이 자기 프로필에서 골라 채웠다. 즉 남의 생년월일을
   그 사람 대신 올리는 구조였다. 접수 주소는 방향을 뒤집는다 — 각자 자기 정보를 스스로 올린다.
   동의가 본인에게서 나오므로 개인정보 면에서도 낫다.

   ★ 참여에는 PIN을 요구하지 않는다. 요구하면 접수라는 말이 성립하지 않는다.
     대신 참여 전에 "무엇이 올라가고 누가 볼 수 있는지"를 반드시 보여주고 동의를 받는다.
===================================================================== */
function groupJoinLink(id){ return location.origin + '/j/' + id; }

var GROUP_JOIN_STATE = {busy:false, error:null, done:false, name:null, lookedUp:false};

function renderGroupJoin(){
  var main=$('#main'); main.innerHTML='';
  var wrap=el('div',{class:'envelope-wrap view'});
  wrap.appendChild(brandTop());

  if(GROUP_JOIN_STATE.error){
    wrap.appendChild(pageHead('그룹 참여', '참여하지 못했어요'));
    wrap.appendChild(el('p',{class:'section-sub'},[GROUP_JOIN_STATE.error]));
    wrap.appendChild(el('button',{class:'btn btn-ghost btn-block', onclick:function(){
      PENDING_GROUP_JOIN=null; GROUP_JOIN_STATE={busy:false,error:null,done:false,name:null,lookedUp:false};
      ROUTE='home'; render();
    }},['홈으로']));
    main.appendChild(autoTermify(wrap));
    return;
  }

  /* ★ 어느 그룹인지 모르고 참여시키면 안 된다. 이름을 먼저 받아와 보여준다.
     (처음엔 안 불러와서 "그룹에 참여할까요?"라고만 떴다 — 실측으로 잡았다.) */
  if(GROUP_JOIN_STATE.name === null && !GROUP_JOIN_STATE.lookedUp){
    GROUP_JOIN_STATE.lookedUp = true;
    groupFetch({action:'get', groupId:PENDING_GROUP_JOIN})
      .then(function(d){ GROUP_JOIN_STATE.name = (d && d.name) || ''; render(); })
      .catch(function(err){
        GROUP_JOIN_STATE.error = (err && err.status===404)
          ? '이 그룹은 없거나 보관 기간이 지났어요. 주소를 다시 받아주세요.'
          : '지금은 그룹을 확인할 수 없어요. 잠시 뒤 다시 시도해 주세요.';
        render();
      });
  }
  var me = activeProfile();
  wrap.appendChild(pageHead('그룹 참여', GROUP_JOIN_STATE.name ? ('"'+GROUP_JOIN_STATE.name+'" 그룹에 참여할까요?') : '그룹을 확인하는 중이에요…'));
  wrap.appendChild(el('p',{class:'section-sub'},[
    me ? (me.name+'님으로 참여해요. 다른 프로필로 하시려면 화면 위에서 프로필을 바꿔주세요.') : ''
  ]));
  /* ★ 무엇이 올라가고 누가 볼 수 있는지를 참여 "전에" 보여준다. 누른 뒤에 알리면 늦다. */
  wrap.appendChild(el('p',{class:'warn-box'},[
    /* ★ R47 — 세 줄로 줄였다(대표님 지시). 항목을 하나하나 나열하니 아무도 안 읽었다.
       읽히지 않는 고지는 고지가 아니다. 꼭 알아야 할 세 가지만 남긴다:
       누구에게 보이는가 · 얼마나 남는가 · 어떻게 빠지는가.
       (자세한 항목은 개인정보처리방침에 그대로 있다.) */
    '참여하면 입력하신 정보가 이 그룹에 참여한 분들에게 보여요. '
    + GROUP_TTL_PHRASE + ' 동안 보관되고, 그룹을 만든 분께 빼달라고 하실 수 있어요.'
  ]));
  var notReady = GROUP_JOIN_STATE.busy || GROUP_JOIN_STATE.name === null;
  wrap.appendChild(el('button',{class:'btn btn-primary', disabled: notReady?'disabled':null, onclick:function(){
    doGroupJoin();
  }},[GROUP_JOIN_STATE.busy ? '참여하는 중…' : '동의하고 참여하기']));
  wrap.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:10px;', onclick:function(){
    PENDING_GROUP_JOIN=null; ROUTE='home'; render();
  }},['참여하지 않기']));
  main.appendChild(autoTermify(wrap));
}

function doGroupJoin(){
  var me = activeProfile();
  if(!me || !PENDING_GROUP_JOIN) return;
  GROUP_JOIN_STATE.busy = true; render();
  var gid = PENDING_GROUP_JOIN;
  groupFetch({action:'join', groupId:gid, member: gcMeetRow(me)})
    .then(function(d){
      GROUP_JOIN_STATE.busy = false;
      PENDING_GROUP_JOIN = null;
      showToast(d && d.already ? '이미 참여하고 계셨어요.' : '그룹에 참여했어요.');
      openSavedGroup(gid);
    })
    .catch(function(err){
      GROUP_JOIN_STATE.busy = false;
      GROUP_JOIN_STATE.error = String(err && err.message || '지금은 참여할 수 없어요.');
      render();
    });
}

/* 궁합 화면에 두는 "저장한 그룹" 목록 */
function buildSavedGroupsCard(){
  var list = savedGroups();
  if(!list.length) return null;
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['저장한 그룹']));
  card.appendChild(el('p',{class:'biz-hint'},['눌러서 다시 열 수 있어요. '+GROUP_TTL_PHRASE+' 동안 보관돼요.']));
  list.forEach(function(g){
    card.appendChild(settingsRow(g.name || '이름 없는 그룹', '열기', function(){ openSavedGroup(g.id); }));
  });
  /* ★ R60 — 눌러만 보고 안 보낸 링크가 쌓였을 때 한 번에 치운다.
     내가 만든 것 중 '아직 아무도 안 들어온 것'만 지운다 — 이 두 조건을 다 만족해야
     지워도 아무도 잃는 게 없다. 사람이 들어와 있는 그룹은 건드리지 않는다. */
  /* 하나만 있어도 보여준다 — 그 하나가 눌러만 보고 안 보낸 링크일 수 있다. */
  if(list.length >= 1){
    card.appendChild(el('button',{class:'btn btn-ghost btn-sm btn-block', style:'margin-top:10px;',
      onclick:function(){ tidyEmptyGroups(); }},['아무도 안 들어온 링크 정리하기']));
  }
  return card;
}

function tidyEmptyGroups(){
  var mine = savedGroups().filter(function(g){ return g && g.token; });
  if(!mine.length){ showToast('정리할 것이 없어요.'); return; }
  showToast('확인하는 중이에요…');
  var removed = 0, done = 0;
  mine.forEach(function(g){
    groupFetch({action:'get', groupId:g.id})
      .then(function(d){
        var n = String((d && d.members) || '').split(';').filter(Boolean).length;
        /* 나 혼자만 있는 것 = 링크를 만들었지만 아무도 안 들어온 것 */
        if(n === 1){
          return groupFetch({action:'delete', groupId:g.id, ownerToken:g.token})
            .then(function(){ forgetGroup(g.id); removed++; });
        }
      })
      .catch(function(err){
        /* 이미 없는 그룹(404)이면 목록에서만 지운다. 서버에 없는 것을 계속 들고 있을 이유가 없다. */
        if(err && err.status === 404){ forgetGroup(g.id); removed++; }
      })
      .then(function(){
        done++;
        if(done === mine.length){
          if(STATE.pendingInviteGroup && !savedGroups().some(function(x){ return x.id===STATE.pendingInviteGroup; })){
            STATE.pendingInviteGroup = null; saveState();
          }
          showToast(removed ? (removed+'개를 정리했어요.') : '정리할 것이 없어요.');
          render();
        }
      });
  });
}

var GC_SOURCE = 'profiles';  /* 'profiles' = 내 저장 프로필 / 'link' = 그룹 링크로 받은 명단 */
function gcUsableProfiles(){
  return STATE.profiles.filter(function(p){
    return p && typeof p.year==='number' && p.mbti && MBTI_MATRIX[p.mbti];
  });
}
function gcMembers(){
  if(GC_SOURCE==='link' && PENDING_MEET){
    return PENDING_MEET.slice(0, GC_MAX).map(gcMemberFromMeetRow);
  }
  var list = gcUsableProfiles();
  if(GC_PICK){
    var set={}; GC_PICK.forEach(function(id){ set[id]=1; });
    var picked = list.filter(function(p){ return set[p.id]; });
    if(picked.length>=2) list = picked;
  }
  return list.slice(0, GC_MAX).map(gcMemberFromProfile);
}
function renderGroupCompat(){

    GROUP_VIEW=null; ROUTE='compat'; render();
  }},[dirIcon('left'), fromLink ? '내 프로필로 그룹 보기' : '궁합 보기로 돌아가기']));

    (GROUP_VIEW && GROUP_VIEW.name) ? GROUP_VIEW.name : (fromLink ? '받은 그룹 궁합' : '모두의 궁합 보기'),
    null, {marginTop:'14px'}));
  /* ★ 링크로 열었을 때의 안내문은 뺐다(대표님 지시). 그룹은 어차피 링크로 관리되므로
     들어올 때마다 같은 말을 되풀이할 이유가 없다. 저장하지 않는다는 사실은
     개인정보처리방침에 적혀 있고, 화면 위에는 그룹 이름이 이미 떠 있다. */
  if(!fromLink){
    view.appendChild(el('p',{class:'section-sub'},
      ['저장된 프로필로 그룹을 만들어요. 한 그룹에 최대 '+GC_MAX+'명까지 한 그림에서 볼 수 있어요.']));
  }

  var usable = gcUsableProfiles();
  if(!fromLink && usable.length<2){
    view.appendChild(emptyState('프로필이 2명 이상 필요합니다','그룹 궁합을 보려면 생년월일과 MBTI가 채워진 프로필이 2명 이상 필요합니다.', function(){ startSetupWizard(null); render(); }, '새 프로필 추가하기'));
    main.appendChild(view);
    return;
  }

  /* 그룹 멤버 고르기 — 저장된 프로필이 많으면 이번 그룹에 넣을 사람만 고른다. */
  if(!fromLink && usable.length>2){
    var chosen = {};
    (GC_PICK || usable.slice(0, GC_MAX).map(function(p){ return p.id; })).forEach(function(id){ chosen[id]=1; });
    view.appendChild(el('p',{class:'section-sub', style:'margin-bottom:0;'},['이번 그룹에 넣을 사람을 골라요.']));
    var chips = el('div',{class:'gc-members', role:'group','aria-label':'그룹 멤버 고르기'});
    usable.forEach(function(p){
      var on = !!chosen[p.id];
      var b = el('button',{type:'button', class:'gc-member', 'aria-pressed':on?'true':'false'},[p.name]);
      b.addEventListener('click', function(){
        var cur = {};
        $all('button', chips).forEach(function(x, ix){ if(x.getAttribute('aria-pressed')==='true') cur[usable[ix].id]=1; });
        if(on) delete cur[p.id]; else cur[p.id]=1;
        var ids = usable.map(function(q){ return q.id; }).filter(function(id){ return cur[id]; });
        if(ids.length<2){ showToast('그룹에는 2명 이상이 있어야 해요.'); return; }
        if(ids.length>GC_MAX){ showToast('한 그룹에는 '+GC_MAX+'명까지 넣을 수 있어요.'); return; }
        GC_PICK = ids; GC_SEL = null; render();
      });
      chips.appendChild(b);
    });
    view.appendChild(chips);
    if(usable.length>GC_MAX){
      view.appendChild(el('p',{class:'biz-hint'},
        ['저장된 프로필이 '+usable.length+'명이라 한 화면에 다 세우면 서로 겹쳐서 못 읽어요. 한 그룹에는 '+GC_MAX+'명까지만 넣을 수 있어요.']));
    }
  }

  var members = gcMembers();
  if(members.length<2){
    view.appendChild(emptyState('그룹을 만들 수 없어요','생년월일과 MBTI가 모두 채워진 사람이 2명 이상 필요합니다.', function(){ ROUTE='compat'; render(); }, '궁합 보기로 돌아가기'));
    main.appendChild(view);
    return;
  }
  var pairs = buildGroupCompatPairs(members);
  var avgAll = Math.round(pairs.reduce(function(s,pr){ return s+pr.res.combined; },0)/pairs.length);

  var gaugeCard=el('div',{class:'scroll-card'});
  gaugeCard.appendChild(el('div',{class:'gauge-label'},[members.length+'명 · 전체 평균 궁합 지수']));
  gaugeCard.appendChild(el('div',{style:'display:flex;justify-content:center;'},[buildDonutGauge(avgAll, 152)]));
  var best = pairs.reduce(function(m,pr){ return pr.res.combined>m.res.combined?pr:m; }, pairs[0]);
  var worst = pairs.reduce(function(m,pr){ return pr.res.combined<m.res.combined?pr:m; }, pairs[0]);
  if(pairs.length===1){
    gaugeCard.appendChild(el('p',{style:'text-align:center;color:var(--ink-dim);margin-top:6px;'},['이 두 사람의 궁합: '+best.a.name+' × '+best.b.name+' ('+best.res.combined+'점)']));
  } else {
    gaugeCard.appendChild(el('p',{style:'text-align:center;color:var(--ink-dim);margin-top:6px;'},['최고 궁합: '+best.a.name+' × '+best.b.name+' ('+best.res.combined+'점)']));
    gaugeCard.appendChild(el('p',{style:'text-align:center;color:var(--ink-dim);'},['가장 부딪히는 짝: '+worst.a.name+' × '+worst.b.name+' ('+worst.res.combined+'점)']));
  }
  view.appendChild(gaugeCard);

  /* 누른 사람 기준 요약 — 그림 아래에 글로도 남긴다(그림을 못 보는 경우를 위해서다). */
  var focusBox = el('p',{class:'section-sub', style:'text-align:center;', role:'status'},['']);
  function updateFocus(idx){
    if(idx==null){ focusBox.textContent = ''; return; }
    var mine = pairs.filter(function(pr){ return pr.ai===idx || pr.bi===idx; }).sort(function(a,b){ return b.res.combined-a.res.combined; });
    if(!mine.length){ focusBox.textContent=''; return; }
    var hi = mine[0], lo = mine[mine.length-1];
    focusBox.textContent = members[idx].name+'님 기준 — 제일 잘 맞는 사람 '+
      (hi.ai===idx?hi.b:hi.a).name+' ('+hi.res.combined+'점 · '+gcPlain(hi.res.combinedTier)+'), 제일 부딪히는 사람 '+
      (lo.ai===idx?lo.b:lo.a).name+' ('+lo.res.combined+'점 · '+gcPlain(lo.res.combinedTier)+')';
  }
  view.appendChild(buildGroupCompatGraph(members, pairs, updateFocus));
  view.appendChild(focusBox);
  view.appendChild(buildGroupRankPanel(pairs));

  /* 그룹 궁합도 1:1 궁합과 같은 상품(compat_full)·같은 잠금 정책을 따른다.
     쌍별 상세를 무료로 열어두면 1:1 유료 상세보다 더 많은 것을 공짜로 주게 된다. */
  var groupUnlocked = hasAccess(PRODUCTS.compat_full.id);
  view.appendChild(buildGroupCompatCards(members, pairs, groupUnlocked));
  if(!groupUnlocked){
    var gBlock = lockedBlock(PRODUCTS.compat_full, '', '모두의 궁합 상세');
    gBlock.insertBefore(el('div',{class:'locked-count'},
      [pairs.length+'쌍의 사주·MBTI 상세 점수가 잠겨 있어요']), gBlock.firstChild);
    view.appendChild(gBlock);
  }
  if(!fromLink){
    view.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:16px;', onclick:function(){
      openMeetLinkModal(members.map(function(m){ return STATE.profiles.filter(function(p){ return p.id===m.id; })[0]; }).filter(Boolean));
    }},[svgIcon('M8 12 L12 8 M7.5 10.5 L6 12 A2.8 2.8 0 0 0 10 16 L11.5 14.5 M12.5 9.5 L14 8 A2.8 2.8 0 0 0 10 4 L8.5 5.5','btn-lead-icon'), '그룹 링크 만들기 (지금 멤버 그대로)']));
  }

  /* =====================================================================
     R34 — 그룹 저장 / 관리
     ---------------------------------------------------------------------
     · 아직 저장 안 한 그룹  → [이 그룹 저장하기]
     · 저장된 그룹을 열어 봄 → 주소 + [그룹 관리] + [지우기]
     ★ 링크로 받은 명단(fromLink)이라도 저장할 수 있게 둔다. 받은 그룹을 내가 이름 붙여
       보관하고 싶은 것이 자연스럽고, 그때도 담긴 분들의 동의는 저장하는 사람의 몫이다
       (그 안내는 저장 화면에 적혀 있다).
  ===================================================================== */
  var gsCard = el('div',{class:'scroll-card', style:'margin-top:16px;'});
  if(GROUP_VIEW){
    gsCard.appendChild(el('h3',{},['이 그룹 주소']));
    gsCard.appendChild(el('p',{class:'biz-hint'},['이 주소로 다시 열 수 있어요. '+GROUP_TTL_PHRASE+' 동안 보관됩니다.']));
    gsCard.appendChild(el('div',{class:'field'},[
      el('input',{type:'text', value:groupLink(GROUP_VIEW.id), readOnly:'readonly', id:'groupViewLink'})
    ]));
    var gRow = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;'});
    gRow.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){
      var lk = groupLink(GROUP_VIEW.id);
      if(navigator.share){ navigator.share({title:COMPANY.serviceName+' 그룹 · '+(GROUP_VIEW.name||''), url:lk}).catch(function(){}); }
      else { copyText(lk); }
    }},['주소 공유']));
    gRow.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:openGroupManageModal},['그룹 관리']));
    gRow.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:confirmDeleteGroup},['그룹 지우기']));
    gsCard.appendChild(gRow);
    view.appendChild(gsCard);
    var joinCard = buildGroupJoinCard();
    if(joinCard) view.appendChild(joinCard);
    gsCard = null;
  } else {
    gsCard.appendChild(el('h3',{},['이 그룹 저장하기']));
    gsCard.appendChild(el('p',{class:'biz-hint'},['이름을 붙여 저장하면 주소가 생겨요. 새로고침하거나 나중에 다시 와도 그 주소로 같은 그룹이 열려요.']));
    gsCard.appendChild(el('button',{class:'btn btn-primary btn-block', style:'margin-top:10px;', onclick:openGroupSaveModal},['이름 붙여 저장하기']));
    gsCard.appendChild(el('p',{class:'biz-hint', style:'margin-top:10px;'},[
      '저장하면 "접수 주소"도 함께 생겨요. 그 주소를 보내면 다른 분들이 스스로 참여할 수 있어요.'
    ]));
  }
  if(gsCard) view.appendChild(gsCard);
  view.appendChild(el('p',{class:'disclaimer'},['사주 궁합도, MBTI 궁합도 정해진 답이 아니라 서로를 이해하는 참고 자료로 봐주세요.']));
  /* R50 — 그룹으로 들어온 분에게도 다른 서비스를 권한다.
     1:1 궁합에만 붙이면, 링크로 그룹에 들어온 사람은 이 앱에 사주 풀이가 있는 줄도 모른다. */
  view.appendChild(crossSell('toSelf'));
  main.appendChild(autoTermify(view));
}

/* =====================================================================
   기능12: 공유 링크로 함께 참여하기 (서버 없이 URL 해시로 프로필 전달)
===================================================================== */
/* =====================================================================
   초대 링크에 실리는 항목표 — 이 표 하나가 유일한 출처다.
   ---------------------------------------------------------------------
   encodeInvite()가 이 표를 읽어 payload를 만들고, 초대 모달 문구와 개인정보처리방침 §2 ②도
   같은 표를 읽어 문장을 만든다. R20에서 링크에 '출생지 경도'와 '보정 여부'를 새로 실으면서
   초대 모달 문구만 고치고 처리방침 본문은 옛말로 남았던 적이 있다. SPEC은 "데이터 전송 문구가
   코드와 어긋나면 그것 하나만으로 불합격"이라고 못박고 있으므로, 다음에 항목이 늘어도
   문구가 자동으로 따라오게 구조를 바꾼다.
   ★ 항목을 추가할 때는 반드시 label도 함께 적을 것 — label이 곧 사용자에게 보이는 고지문이다.
===================================================================== */
var INVITE_FIELDS = [
  {k:'n',  label:'닉네임',                  get:function(p){ return p.name; }},
  {k:'m',  label:'MBTI',                    get:function(p){ return p.mbti; }},
  {k:'y',  label:'생년월일',                get:function(p){ return p.year; }},
  {k:'mo', label:'생년월일',                get:function(p){ return p.month; }},
  {k:'d',  label:'생년월일',                get:function(p){ return p.day; }},
  {k:'h',  label:'태어난 시각(분 단위)',     get:function(p){ return p.birthTime?p.birthTime.hour:null; }},
  {k:'mi', label:'태어난 시각(분 단위)',     get:function(p){ return p.birthTime?(p.birthTime.minute||0):null; }},
  {k:'g',  label:'성별',                    get:function(p){ return p.gender; }},
  /* R20 — 출생지 경도·진태양시 보정도 함께 보낸다. 이게 없으면 링크를 연 쪽에서
     같은 사람의 시주가 다르게 계산된다(보정 기본값이 다르기 때문). */
  {k:'lo', label:'출생지 경도',              get:function(p){ return profileLon(p); }},
  {k:'ts', label:'진태양시 보정 사용 여부',   get:function(p){ return p.solarTimeAdjust?1:0; }}
];
/* 같은 label이 여러 키에 걸쳐 있으면(생년월일 = y·mo·d) 한 번만 적는다. */
function inviteFieldsText(){
  var seen={}, out=[];
  INVITE_FIELDS.forEach(function(f){ if(!seen[f.label]){ seen[f.label]=1; out.push(f.label); } });
  return out.join('·');
}
/* =====================================================================
   R33 — 초대 링크를 짧게 (대표님 제보: "링크가 너무 길다")
   ---------------------------------------------------------------------
   예전 형식은 JSON을 통째로 주소에 넣었다. 그런데 주소에는 따옴표를 그대로 못 써서
   `"` 하나가 `%22` 세 글자로 부풀고, 열쇠 이름(`"n":`)까지 전부 실려 나간다.
   그래서 열 개 값을 보내는 데 270자쯤 들었다.

   새 형식은 값만 쉼표로 이어 붙인다. 순서는 INVITE_FIELDS 그대로다.
     #i1=TS,ENTJ,1992,2,14,19,0,F,126.98,1
   같은 내용이 90자 안팎으로 줄어든다(약 3분의 1).

   ★ 이미 보낸 옛 링크(#invite=)도 계속 열린다. 형식 이름을 다르게 했기 때문이다.
     받는 쪽은 두 형식을 모두 읽고, 만드는 쪽만 새 형식을 쓴다.
   ★ 구분자로 쉼표를 쓰는 이유는 그룹 링크와 같다 — 이름 안에 쉼표가 들어가도
     encodeURIComponent가 %2C로 바꿔주므로 구분자와 헷갈리지 않는다.
===================================================================== */
var INVITE_VER = 'i1';
function encodeInvite(profile){
  return INVITE_FIELDS.map(function(f){
    var v = f.get(profile);
    if(v===null || v===undefined) return '';
    if(f.k==='n') return encodeURIComponent(String(v).slice(0,20));
    if(f.k==='lo') return String(Math.round(Number(v)*100)/100);
    if(f.k==='ts') return v ? '1' : '0';
    return String(v);
  }).join(',');
}
/* 값 배열을 옛 JSON과 같은 모양의 객체로 되돌린다. 이후 코드는 형식을 몰라도 된다. */
function inviteRowToObj(row){
  var parts = String(row).split(',');
  if(parts.length < INVITE_FIELDS.length) return null;
  var obj = {};
  INVITE_FIELDS.forEach(function(f, i){
    var raw = parts[i];
    if(raw === '' ){ obj[f.k] = null; return; }
    if(f.k==='n')  { obj[f.k] = decodeURIComponent(raw); return; }
    if(f.k==='m' || f.k==='g'){ obj[f.k] = raw; return; }
    if(f.k==='ts'){ obj[f.k] = (raw==='1') ? 1 : 0; return; }
    var num = Number(raw);
    obj[f.k] = isFinite(num) ? num : null;
  });
  return obj;
}
function inviteObjValid(obj){
  return !!obj && typeof obj.y==='number' && typeof obj.mo==='number'
      && typeof obj.d==='number' && typeof obj.m==='string' && obj.m.length===4;
}
function decodeInviteFromHash(hash){
  var h = hash || '';
  /* 새 형식 먼저 */
  var mNew = /[#&]i1=([^&]+)/.exec(h);
  if(mNew){
    var o = inviteRowToObj(mNew[1]);
    return inviteObjValid(o) ? o : null;
  }
  /* 옛 형식(이미 나간 링크) */
  var m = /invite=([^&]+)/.exec(h);
  if(!m) return null;
  try{
    var obj = JSON.parse(decodeURIComponent(m[1]));
    return inviteObjValid(obj) ? obj : null;
  }catch(e){ return null; }
}
/* =====================================================================
   R33 — 궁합 방: 두 사람 화면을 실시간으로 잇는다 (대표님 지시)
   ---------------------------------------------------------------------
   예전에는 링크 안에 보낸 사람 정보를 통째로 담아 보냈다. 그래서 결과는 받는 쪽에서만
   나왔고, 보낸 쪽 화면은 상대가 열었는지조차 몰랐다.
   이제는 서버에 "방"을 만들고 링크에는 방 번호만 담는다.
     · 보낸 사람 — 방을 만들고, 상대가 들어올 때까지 방을 들여다본다(몇 초마다).
     · 받은 사람 — 방에서 상대 정보를 받고, 자기 정보를 놓는다. 그 순간 양쪽에 결과가 뜬다.

   ★ 덤으로 개인정보가 주소에서 빠진다. 예전 링크에는 생년월일이 그대로 적혀 있어
     대화 기록·방문 기록에 남았는데, 이제 링크에는 뜻 없는 번호만 남는다.
   ★ 대신 그 정보가 서버에 잠시 저장된다. 그래서 기한을 두고(30일), 지나면 못 읽는다.
   ★ 서버가 없거나 실패하면 예전 방식(링크에 정보 담기)으로 되돌아간다.
     서버가 죽었다고 궁합 기능 자체가 멈추면 안 된다.
===================================================================== */
/* ★ 서버(api/_lib/rooms.js)의 ROOM_TTL_HOURS와 같은 값이어야 한다.
   화면에 적은 보관 기간과 서버가 실제로 지키는 기간이 다르면 그건 거짓 고지다. */
var ROOM_TTL_TEXT = '30일';   /* 서버 ROOM_TTL_HOURS(24*30)와 같은 기간이어야 한다 */
/* ★ R47 — 기한은 '만든 날'부터 센다 (대표님 지시, 2026-08-12).
   예전에는 열 때마다 다시 밀었는데, 그러면 이용자가 자기 정보가 언제 지워지는지 알 수 없다.
   이제 처음부터 "언제까지 남는다"를 한 문장으로 말할 수 있다.
   ★ 매일 쓰는 그룹도 기한이 되면 사라진다. 부작용이 아니라 정한 규칙이다.
   ★ 서버(api/_lib/rooms.js·groups.js)도 미는 일을 멈췄다. 한쪽만 바꾸면 앱이 거짓말을 한다.
   (옛 주석) 기한은 "만든 지"가 아니라 "마지막으로 연 지"부터 센다.
   그래서 계속 보는 궁합은 사라지지 않고, 아무도 안 보는 궁합만 조용히 없어진다.
   문구도 그 사실대로 적어야 한다 — "30일 뒤 사라진다"고만 하면 실제와 다르다. */
var ROOM_TTL_PHRASE = '만든 날로부터 '+ROOM_TTL_TEXT;
/* 저장된 그룹의 보관 기간. 서버 GROUP_TTL_DAYS(365)와 같아야 하고, 세는 방식도 같다. */
var GROUP_TTL_TEXT = '1년';
var GROUP_TTL_PHRASE = '그룹을 처음 만든 날로부터 '+GROUP_TTL_TEXT;
var ROOM_TTL_HOURS_TEXT = ROOM_TTL_TEXT;   /* 옛 이름 — 문구에서 '...시간'으로 쓰던 자리를 함께 정리한다 */
var ROOM_ENDPOINT = '/api/room';
var ROOM_POLL_MS = 3000;      /* 몇 초마다 방을 들여다볼지 */
var ROOM_POLL_MAX_MIN = 10;   /* 이 시간이 지나면 그만 본다 — 배터리를 계속 쓰지 않는다 */
var ROOM_WAIT = null;         /* {roomId, link, timer, startedAt, ttlHours} — 기다리는 중일 때만 값이 있다 */

function roomFetch(payload){
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;
  return fetch(ROOM_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload||{}), signal: ctrl?ctrl.signal:undefined
  }).then(function(r){
    if(timer) clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).catch(function(e){ if(timer) clearTimeout(timer); throw e; });
}

/* 방에서 받은 한 줄을 COMPAT_DRAFT에 옮긴다. 초대 링크를 풀 때와 같은 표를 쓰므로
   형식이 한 곳에서만 정의된다(INVITE_FIELDS). */
function applyRowToCompatDraft(row){
  var o = inviteRowToObj(row);
  if(!inviteObjValid(o)) return false;
  COMPAT_DRAFT = defaultCompatDraft();
  COMPAT_DRAFT.name = o.n||''; COMPAT_DRAFT.mbti = o.m||null;
  COMPAT_DRAFT.year = o.y; COMPAT_DRAFT.month = o.mo; COMPAT_DRAFT.day = o.d;
  if(o.h!=null){ COMPAT_DRAFT.timeUnknown=false; COMPAT_DRAFT.hour=o.h; COMPAT_DRAFT.minute=o.mi||0; }
  COMPAT_DRAFT.gender = o.g||'F';
  if(typeof o.lo==='number' && isFinite(o.lo)){ COMPAT_DRAFT.birthLon=o.lo; COMPAT_DRAFT.birthLonKey='custom'; }
  if(o.ts!=null) COMPAT_DRAFT.solarTimeAdjust = !!o.ts;
  COMPAT_DRAFT.fromInvite = true;
  /* 링크에 담겨 온 값은 보낸 사람이 이미 고른 값이다. '입력 안 함'으로 보이면 안 된다. */
  COMPAT_DRAFT._set = {cal:true, date:true, time:true, place:true, gender:true};
  return true;
}

/* =====================================================================
   R34 — 본 궁합을 다시 열 수 있게 한다 (대표님 지적)
   ---------------------------------------------------------------------
   "새로고침하거나 다른 탭 갔다가 궁합을 다시 누르면 없어진다."
   맞는 말이었다. 결과를 메모리(COMPAT_DRAFT)에만 두고 아무 데도 남기지 않았다.

   고치는 방법은 두 가지를 함께 둔다.
     ① 방 번호를 이 기기에 기억해 둔다 → 궁합 화면에 "다시 보기" 목록이 생긴다.
     ② 결과에 주소를 준다 → 그 주소를 저장해 두면 다른 기기·다른 사람도 열 수 있다.
   ★ 기억하는 것은 방 번호와 상대 이름뿐이다. 상대의 생년월일을 이 기기에 저장하지 않는다 —
     그 값은 서버의 방에 있고, 열 때마다 받아온다.
===================================================================== */
var RECENT_ROOM_MAX = 10;
function recentRooms(){
  return Array.isArray(STATE.recentRooms) ? STATE.recentRooms : [];
}
function rememberRoom(roomId, otherName){
  if(!roomId) return;
  var list = recentRooms().filter(function(x){ return x && x.id !== roomId; });
  list.unshift({id:roomId, name:(otherName||'').slice(0,20), at:Date.now()});
  STATE.recentRooms = list.slice(0, RECENT_ROOM_MAX);
  saveState();
}
function forgetRoom(roomId){
  STATE.recentRooms = recentRooms().filter(function(x){ return x && x.id !== roomId; });
  saveState();
}
/* 지금 보고 있는 궁합의 주소. 방을 거쳐 온 결과일 때만 있다. */
var CURRENT_ROOM_ID = null;
function currentRoomLink(){
  return CURRENT_ROOM_ID ? (location.href.split('#')[0] + '#r=' + CURRENT_ROOM_ID) : null;
}

/* 저장해 둔 방을 다시 연다. 서버에서 두 사람 정보를 받아 그 자리에서 계산한다. */
function reopenRoom(roomId){
  showToast('궁합을 불러오는 중이에요…');
  roomFetch({action:'get', roomId:roomId}).then(function(d){
    if(!d || !d.a || !d.b) throw new Error('아직 상대방이 들어오지 않았어요.');
    var me = activeProfile();
    var mine = encodeInvite(me);
    /* 두 자리 중 내가 아닌 쪽을 상대로 삼는다. 내가 만든 방이면 a가 나다. */
    var other = (d.a === mine) ? d.b : d.a;
    if(!applyRowToCompatDraft(other)) throw new Error('상대 정보를 읽지 못했어요.');
    CURRENT_ROOM_ID = roomId;
    ROUTE='compat';
    submitCompat();
  }).catch(function(err){
    var msg = String(err && err.message || err);
    if(/404/.test(msg)){
      forgetRoom(roomId);
      showToast('이 궁합은 보관 기간('+ROOM_TTL_PHRASE+')이 지나 열 수 없어요.');
    } else {
      showToast(msg.indexOf('아직')===0 ? msg : '지금은 불러올 수 없어요. 잠시 뒤 다시 시도해 주세요.');
    }
    render();
  });
}

/* 궁합 화면 맨 위의 "최근에 본 궁합" 목록 */
function buildRecentRoomsCard(){
  var list = recentRooms();
  if(!list.length) return null;
  var card = el('div',{class:'scroll-card'});
  card.appendChild(el('h3',{},['최근에 본 궁합']));
  card.appendChild(el('p',{class:'biz-hint'},['눌러서 다시 볼 수 있어요. '+ROOM_TTL_PHRASE+' 동안 열 수 있어요.']));
  list.forEach(function(x){
    card.appendChild(settingsRow((x.name||'이름 없음')+'님과의 궁합', '다시 보기', function(){ reopenRoom(x.id); }));
  });
  return card;
}

function stopRoomWait(){
  if(ROOM_WAIT && ROOM_WAIT.timer){ clearTimeout(ROOM_WAIT.timer); }
  ROOM_WAIT = null;
}

/* 보낸 사람이 방을 들여다보는 고리. 상대가 들어오면 그 자리에서 결과를 그린다. */
function pollRoom(){
  if(!ROOM_WAIT) return;
  var minutes = (Date.now() - ROOM_WAIT.startedAt) / 60000;
  if(minutes > ROOM_POLL_MAX_MIN){
    ROOM_WAIT.timedOut = true;
    if(ROUTE==='compat') render();
    stopRoomWaitKeepFlag();
    return;
  }
  roomFetch({action:'get', roomId:ROOM_WAIT.roomId}).then(function(d){
    if(!ROOM_WAIT) return;
    if(d && d.b){
      var roomId = ROOM_WAIT.roomId;
      stopRoomWait();
      CURRENT_ROOM_ID = roomId;   /* R34 */
      if(applyRowToCompatDraft(d.b)){
        showToast('상대방이 정보를 입력했어요. 궁합을 보여드릴게요.');
        try{ submitCompat(); return; }catch(e){ console.warn('방 결과 계산 실패', e); }
      }
      ROUTE='compat'; render();
      return;
    }
    ROOM_WAIT.timer = setTimeout(pollRoom, ROOM_POLL_MS);
  }).catch(function(){
    /* 한 번 실패했다고 그만두지 않는다 — 지하철에서 잠깐 끊기는 일이 흔하다. */
    if(ROOM_WAIT) ROOM_WAIT.timer = setTimeout(pollRoom, ROOM_POLL_MS*2);
  });
}
function stopRoomWaitKeepFlag(){
  if(ROOM_WAIT && ROOM_WAIT.timer){ clearTimeout(ROOM_WAIT.timer); ROOM_WAIT.timer=null; }
}
function startRoomWait(roomId, link, ttlHours){
  stopRoomWait();
  ROOM_WAIT = {roomId:roomId, link:link, ttlHours:ttlHours||48, startedAt:Date.now(), timer:null, timedOut:false};
  ROOM_WAIT.timer = setTimeout(pollRoom, ROOM_POLL_MS);
}

/* =====================================================================
   R39 — 초대 링크를 만드는 순간 그룹이 된다 (대표님 지시)
   ---------------------------------------------------------------------
   예전에는 초대 링크가 "두 사람 전용 방(#r=)"이었다. 그래서 셋째 사람을 넣으려면
   1:1 결과에서 [그룹 만들기]를 한 번 더 눌러야 했고, 그 사실을 아는 사람이 없었다.

   이제 링크를 누르는 순간 그룹을 만들고, 그 그룹의 접수 주소(#gj=)를 건넨다.
   받은 사람은 자기 정보를 넣고 들어온다 — 두 명이든 서른 명이든 같은 링크 하나로 된다.

   ★ 링크 한 번 만들자고 이름과 PIN까지 정하라고 하지 않는다.
     이름은 "○○님의 궁합"으로 자동으로 짓고, PIN은 안 정해도 된다.
     대신 만든 기기에 소유자 토큰을 저장해 두어 그 기기에서는 PIN 없이 관리할 수 있다.
     다른 기기에서도 관리하고 싶으면 나중에 그룹 관리에서 PIN을 정하면 된다.
   ★ 서버가 죽어 있으면 예전처럼 링크에 정보를 담아 보낸다(그때는 1:1이다).
     서버가 안 된다고 공유 자체가 막히면 안 된다.
===================================================================== */
/* =====================================================================
   R60 — 누를 때마다 새 그룹이 생기던 문제 (대표님 지적)
   ---------------------------------------------------------------------
   R39에서 '링크를 만드는 순간 그룹이 된다'로 바꿨는데, 버튼을 누를 때마다
   꼬박꼬박 새 그룹을 만들었다. 그래서 저장한 그룹에 'TS님의 궁합'이 다섯 줄 쌓였다.
   대표님은 저장한 적이 없는데 목록이 늘어난 것으로 보였다 — 맞는 말이다.

   ★ 아직 아무도 안 들어온 링크가 있으면 그것을 다시 쓴다. 링크를 새로 뽑을 이유가 없다.
     한 사람이 여러 링크를 들고 있으면 어느 것을 보냈는지도 헷갈린다.
   ★ 누가 들어온 뒤에 다시 누르면 그때는 새로 만든다. 이미 쓰고 있는 그룹에
     다른 사람을 끌어들이면 안 되기 때문이다.
   ★ 서버 쪽 쓰레기도 같이 준다. 눌러 보기만 해도 그룹이 쌓이던 것을 막는다.
===================================================================== */
function openInviteLinkModal(profile){
  var base = location.href.split('#')[0];
  var fallback = base + '#' + INVITE_VER + '=' + encodeInvite(profile);
  var autoName = (profile.name || '나') + '님의 궁합';
  var pending = STATE.pendingInviteGroup;

  function makeNew(){
    showToast('궁합 링크를 만드는 중이에요…');
    return groupFetch({action:'create', name:autoName, members: gcMeetRow(profile)})
      .then(function(d){
        if(!d || !d.groupId) throw new Error('groupId 없음');
        rememberGroup(d.groupId, autoName, d.ownerToken);
        STATE.pendingInviteGroup = d.groupId; saveState();
        GROUP_VIEW = {id:d.groupId, name:autoName};
        showInviteModal(profile, groupJoinLink(d.groupId), true, d.ttlDays);
      });
  }

  if(!pending){ makeNew().catch(function(){ showInviteModal(profile, fallback, false, 0); }); return; }

  /* 만들어 둔 링크가 아직 비어 있으면(나 혼자면) 그것을 그대로 쓴다. */
  groupFetch({action:'get', groupId:pending})
    .then(function(d){
      var n = String((d && d.members) || '').split(';').filter(Boolean).length;
      if(!d || n !== 1) throw new Error('다시 만들어야 함');
      GROUP_VIEW = {id:pending, name:(d.name || autoName)};
      showInviteModal(profile, groupJoinLink(pending), true, d.ttlDays);
    })
    .catch(function(){
      STATE.pendingInviteGroup = null; saveState();
      makeNew().catch(function(){ showInviteModal(profile, fallback, false, 0); });
    });
}

function joinRoomNow(){
  var me = activeProfile();
  if(!me || !PENDING_ROOM) return;
  ROOM_JOIN_STATE.busy = true;
  roomFetch({action:'join', roomId:PENDING_ROOM, payload: encodeInvite(me)})
    .then(function(d){
      ROOM_JOIN_STATE.busy = false;
      if(!d || !d.a) throw new Error('상대 정보 없음');
      if(!applyRowToCompatDraft(d.a)) throw new Error('상대 정보를 읽지 못함');
      CURRENT_ROOM_ID = PENDING_ROOM;   /* R34 — 결과 주소와 "다시 보기" 목록에 쓰인다 */
      PENDING_ROOM = null;
      ROUTE='compat';
      try{ submitCompat(); }
      catch(e){ console.warn('방 결과 계산 실패', e); render(); }
    })
    .catch(function(err){
      ROOM_JOIN_STATE.busy = false;
      var msg = String(err && err.message || err);
      ROOM_JOIN_STATE.error = /404/.test(msg)
        ? '이 초대장은 만료됐거나 찾을 수 없어요. 상대방에게 링크를 다시 받아주세요. (초대장은 '+ROOM_TTL_PHRASE+' 동안 열려요.)'
        : '지금은 연결이 되지 않아요. 잠시 뒤 다시 시도해 주세요.';
      render();
    });
}

var HIST_TABS = [['fortune','운세 기록'],['compat','궁합 기록'],['saju','사주풀이 기록'],['mbtiReport','MBTI풀이 기록']];
/* 탭을 바꾸면 화면이 통째로 다시 그려지므로, 키보드로 옮긴 경우에는 새로 그려진 같은 탭으로 포커스를 되돌린다. */
function histTabSelect(key, moveFocus){
  HIST_TAB = key;
  render();
  if(moveFocus){ var b = document.getElementById('histTab-'+key); if(b) b.focus(); }
}
function renderHistory(){
  var main=$('#main'); main.innerHTML='';
  var view=el('div',{class:'view'});
  view.appendChild(pageHead('내 기록', '히스토리 보관함'));
  /* ★ role="tab"을 선언했으면 그 탭이 무엇을 여는지(aria-controls)와 열린 영역(role="tabpanel")이
     실제로 있어야 한다. 전에는 tablist/tab만 있고 패널도 aria-controls도 없어서,
     화면 낭독기에는 "탭"이라고 알려주면서 정작 무엇이 바뀌는지는 알려주지 못했다.
     아래 histPanel이 그 대상이고, aria-controls가 가리키는 id는 같은 렌더에서 반드시 만들어진다. */
  var tg=el('div',{class:'tabgroup', role:'tablist', 'aria-label':'히스토리 종류'});
  HIST_TABS.forEach(function(pair){
    var on = HIST_TAB===pair[0];
    tg.appendChild(el('button',{type:'button', id:'histTab-'+pair[0], role:'tab',
      'aria-selected': on?'true':'false', 'aria-controls':'histPanel',
      tabindex: on?'0':'-1',
      onclick:function(){ histTabSelect(pair[0], false); }},[pair[1]]));
  });
  /* 탭 위젯의 키보드 규약: 좌우/상하 화살표로 이동, Home/End로 처음·끝 */
  tg.addEventListener('keydown', function(e){
    var keys = HIST_TABS.map(function(x){ return x[0]; });
    var i = keys.indexOf(HIST_TAB);
    if(i < 0) return;
    if(e.key==='ArrowRight' || e.key==='ArrowDown'){ e.preventDefault(); histTabSelect(keys[(i+1)%keys.length], true); }
    else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); histTabSelect(keys[(i-1+keys.length)%keys.length], true); }
    else if(e.key==='Home'){ e.preventDefault(); histTabSelect(keys[0], true); }
    else if(e.key==='End'){ e.preventDefault(); histTabSelect(keys[keys.length-1], true); }
  });
  view.appendChild(tg);

  /* 탭이 실제로 바꾸는 영역. 위 aria-controls가 가리키는 id가 바로 이것이다. */
  var panel = el('div',{id:'histPanel', role:'tabpanel', 'aria-labelledby':'histTab-'+HIST_TAB, tabindex:'0'});
  view.appendChild(panel);

  var p=activeProfile();
  if(HIST_TAB==='fortune'){

    else{

        var item=el('div',{class:'hist-item'});
        /* R22 — 네 탭 중 여기만 캐릭터 칩이 없었다(R19에서 빠진 자리).
           궁합·사주풀이 기록과 같은 규칙으로 그 프로필의 일간 오행 칩을 단다. */

        var fTxt=el('div',{class:'hi-text'});
        fTxt.appendChild(el('div',{},[f.date]));
        fTxt.appendChild(el('div',{class:'meta'},['총운: '+f.items.total.text.slice(0,24)+'…']));
        left.appendChild(fTxt);

            saveState(); render();

/* 히스토리에서 다시 여는 궁합 상세.
   ★ 이 모달은 유료 상품 compat_full의 "MBTI 궁합 상세"와 같은 내용을 담는다.
      본 화면(renderCompatMbtiDetail)과 정확히 같은 잠금 규칙을 태운다.
      잠긴 항목은 흐리게 가리는 게 아니라 아예 만들지 않는다 — 만들어두고 가리면 개발자도구로 되살아난다.
   ★ R24 — 상세 문장은 저장소에 없다(그게 유료 누출의 원인이었다).
      권한을 통과했을 때만 compatResultFromHistory()로 다시 계산해서 그 자리에서 만든다.
      잠긴 상태에서는 계산 자체를 하지 않으므로, 메모리에도 유료 문장이 만들어지지 않는다. */
function openCompatDetailModal(c){
  var body=el('div',{});
  var unlocked = hasAccess(PRODUCTS.compat_full.id);
  var res = unlocked ? compatResultFromHistory(c) : null;
  var cats = (res && res.categories) || {};

  body.appendChild(el('p',{},['종합 점수: '+c.score+'점 ('+c.tier+')']));
  /* 케미 한 줄은 무료 요약 화면(renderCompatSummary)에도 이미 나오는 범위라 그대로 남긴다. */
  var chem = cats.chemistry || compatHistoryChemistry(c);
  if(chem) body.appendChild(el('p',{style:'margin-top:8px;'},['케미: '+chem]));

  if(unlocked){
    if(res){
      if(cats.love)     body.appendChild(el('p',{style:'margin-top:8px;'},['연애: '+cats.love]));
      if(cats.friend)   body.appendChild(el('p',{style:'margin-top:8px;'},['우정: '+cats.friend]));
      if(cats.conflict) body.appendChild(el('p',{style:'margin-top:8px;'},['갈등 요소: '+cats.conflict]));
    } else {
      /* 아주 오래된 기록이라 다시 계산할 입력값이 남아 있지 않은 경우. 빈칸으로 두지 않고 이유를 적는다. */
      body.appendChild(el('p',{class:'section-sub', style:'margin-top:8px;'},[
        '이 기록은 예전 형식이라 상세 문장을 다시 만들 입력값이 남아 있지 않아요. 궁합 화면에서 같은 상대로 한 번 더 보시면 상세가 그대로 열립니다.'
      ]));
    }
  } else {
    body.appendChild(lockedBlock(PRODUCTS.compat_full, '', '궁합 상세'));
  }
  /* 이름 끝 받침에 따라 '과의/와의'가 갈린다. */
  openModal(josa(c.partnerName,'과의','와의')+' 궁합 · '+c.date, autoTermify(body), [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}

   R20에서 "저장 안 하고 나가기" 확인이 생기면서, 버튼에 '삭제'라고 적혀 있으면 안 되는 자리가 생겼다. */
function confirmModal(msg, onYes, yesLabel){
  var body=el('p',{},[msg]);
  openModal('확인', body, [
    {label:'취소', cls:'btn-ghost', onclick:closeModal},
    {label: yesLabel || '삭제', cls:'btn-primary', onclick:function(){ closeModal(); onYes(); }}
  ]);
}

     둘 다 관리자 테스트 콘솔로 옮겼다. 운영자가 채우는 값이지 손님이 채우는 값이 아니다.
     여기에는 사용자가 알아야 할 사실 — 지금 결제를 할 수 있는지 — 만 남긴다. */
  view.appendChild(buildPaymentStatusPanel());

  STATE.profiles.forEach(function(p){
    var label = p.name + (p.id===STATE.activeId?' (활성)':'');
    /* =====================================================================
       R44 — 프로필 줄이 상자를 넘치던 문제 (대표님 지적)
       ---------------------------------------------------------------------
       'ENTJ · 남자 · 1992-02-14 19:00' 은 이 줄에 담기에 너무 길었다.
       값이 자리를 다 먹으니 이름 쪽이 밀려 '테스트 (…' 로 잘렸고, 값 자체도 화살표를 넘었다.

       ★ 날짜를 짧게 쓴다(1992-02-14 → 920214). 이 줄은 '누구인지 알아보는' 자리이지
         정확한 날짜를 읽는 자리가 아니다 — 눌러서 들어가면 온전한 날짜가 나온다.
       ★ 시트 안(자세히 보기)에서는 예전 그대로 길게 적는다. 거기는 자리가 넉넉하다.
    ===================================================================== */
    var shortYmd = String(p.year).slice(2)+pad2(p.month)+pad2(p.day);

    var rowChipKey = charKeyForMbti(p.mbti);
    var rowChip = rowChipKey ? buildCharChip(rowChipKey, 34, p.mbti+' 캐릭터') : null;
    view.appendChild(settingsRow(label, valueText, function(){
      var body=el('div',{class:'sheet-body'});
