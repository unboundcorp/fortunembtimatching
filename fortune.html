/* 리포트 한 벌(목차 + 안내 띠 + 섹션)을 host 안에 그린다.
   AI 해석이 연결돼 있으면, 먼저 기본 풀이를 즉시 보여주고(빈 화면으로 기다리게 하지 않는다)
   응답이 오면 그 자리를 AI 해석으로 바꿔 끼운다. 실패하면 기본 풀이를 그대로 두고 이유를 알린다. */
function paintReportInto(host, localSections, product, tocLabel, payloadFn, displayName){
  var payload = null;
  try{ payload = payloadFn ? payloadFn() : null; }catch(e){ payload = null; }

  /* ★ 유료 본문 서버가 연결돼 있으면, 클라이언트는 유료 섹션의 "본문"을 아예 갖지 않는다.
     제목만 남기고 본문을 비워, 결제하지 않은 사람은 브라우저 안에서 본문을 얻을 방법이 없게 만든다. */
  var baseSections = serverContentMode() ? stripPaidBodies(localSections) : localSections;
  var paidNeeded = serverContentMode() && hasAccess(product.id);

  /* ★ R42 — AI 해석은 결제한 사람에게만 부른다. 그래서 '불러오는 중' 표시도 그때만 뜬다.
     예전에는 isApiReady()만 보고 켰는데, 이제 기본이 api 모드라 잠긴 사람 화면에도
     "AI 해석 중"이 떠 버린다. 부르지도 않을 것을 부르는 중이라고 말하면 안 된다. */
  var willAsk = Interpreter.isApiReady() && hasAccess(product.id);
  var state = { sections: baseSections, source: 'local', loading: willAsk, error: null,
                attempted: willAsk, paidLoading: false, paidError: null };

  function paint(){
    host.innerHTML = '';
    host.appendChild(buildGatedToc(state.sections, product, tocLabel));
    host.appendChild(interpreterNotice(state));
    /* AI 해석이 이미 13섹션을 통째로 갈아끼운 뒤라면 본문이 비어 있지 않으므로 대체 카드를 쓰지 않는다. */
    var showPending = paidNeeded && state.source !== 'api' && (state.paidLoading || state.paidError);
    if(showPending) host.appendChild(paidContentNotice(state, loadPaidBody));
    renderGatedSections(host, state.sections, product, {
      pendingFrom: showPending ? FREE_SECTION_COUNT : -1,
      pendingLoading: state.paidLoading,
      onRetry: loadPaidBody
    });
  }

  /* 유료 본문을 서버에서 받아온다. 권한이 없으면 요청조차 하지 않는다.
     ★ 실패를 조용히 삼키지 않는다 — 결제한 사람이 아무 설명 없이 빈 화면을 보는 게 제일 나쁘다. */
  function loadPaidBody(){
    state.paidLoading = true; state.paidError = null;
    paint();
    fetchPaidSection(product.id, payload, displayName).then(function(remote){
      state.paidLoading = false;
      state.paidError = null;
      state.sections = baseSections.slice(0, FREE_SECTION_COUNT).concat(remote);
      paint();
    }).catch(function(err){
      state.paidLoading = false;
      state.paidError = (err && err.message) || '유료 해석을 불러오지 못했습니다.';
      state.sections = baseSections;
      console.warn('유료 본문 조회 실패', err);
      paint();
    });
  }

  paint();
  if(paidNeeded) loadPaidBody();

  if(!Interpreter.isApiReady()) return;
  /* ★ 잠긴 사람에게는 AI 해석을 부르지 않는다.
     이 경로는 응답을 받아 state.sections를 통째로 갈아끼우는데, 거기에는 유료 13섹션이 전부 들어 있다.
     "잠긴 것은 만들지도 않는다"는 이 앱의 원칙은 로컬 문구뱅크든 서버 응답이든 똑같이 적용돼야 한다.
     (요청 자체를 안 보내므로 사주 데이터가 밖으로 나가는 것도 함께 막힌다 —
      개인정보처리방침에 "결제하신 분의 사주가 해석 서버로 나간다"고 적은 것과 같은 동작이다.) */
  if(!hasAccess(product.id)){ return; }
  if(!payload){ state.loading=false; state.error='해석에 넘길 데이터를 만들지 못했습니다.'; paint(); return; }

  /* =====================================================================
     R42 — 써지는 대로 화면에 얹는다
     ---------------------------------------------------------------------
     ★ 목차 제목은 우리가 정한 것을 그대로 넘긴다. 안 넘기면 AI가 제목을 새로 지어
       목차와 본문이 서로 다른 이름을 갖게 된다(목차를 눌러도 그 자리로 안 간다).
     ★ 글자가 올 때마다 다시 그리면 화면이 떨린다. 0.4초에 한 번만 그린다.
     ★ 실패하면 원래 풀이로 되돌린다. 반쯤 쓰다 만 글을 남겨 두면 그게 결과인 줄 안다.
  ===================================================================== */
  var titles = baseSections.map(function(x){ return x.title; });
  try{ payload.requested = payload.requested || {}; payload.requested.sectionTitles = titles; }catch(e){}

  var lastPaint = 0, pendingPaint = null;
  function applyText(text, force){
    var secs = Interpreter.parseSections(text, titles);
    if(!secs.length) return;
    /* 마지막 섹션은 아직 쓰는 중이다. 그래도 보여준다 — 읽는 사람은 그게 자연스럽다. */
    state.sections = baseSections.map(function(base, i){
      var got = secs[i];
      if(!got || !got.paras.length) return base;
      return { id: base.id, title: base.title, icon: base.icon,
               paragraphs: got.paras, body: '' };
    });
    state.source = 'api';
    var now = Date.now();
    if(force || now - lastPaint > 400){
      lastPaint = now;
      if(pendingPaint){ clearTimeout(pendingPaint); pendingPaint = null; }
      paint();
    } else if(!pendingPaint){
      pendingPaint = setTimeout(function(){ pendingPaint = null; lastPaint = Date.now(); paint(); }, 400);
    }
  }

  Interpreter.generateStream(product.id, payload, function(text){ applyText(text, false); })
    .then(function(full){
      var secs = Interpreter.parseSections(full, titles);
      if(!secs.length) throw new Error('해석 결과가 비어 있습니다.');
      applyText(full, true);
      state.source = 'api'; state.loading = false; state.error = null;
      paint();
    })
    .catch(function(err){
      if(pendingPaint){ clearTimeout(pendingPaint); pendingPaint = null; }
      state.sections = baseSections;     /* 쓰다 만 글은 남기지 않는다 */
      state.source = 'local';
      state.loading = false;
      state.error = (err && err.message) || '해석 서버 호출에 실패했습니다.';
      paint();
    });
}
/* 유료 구간의 본문만 비운다(제목·아이콘은 목차와 잠금 카드에 필요하므로 남긴다). */
function stripPaidBodies(sections){
  return sections.map(function(s, i){
    if(i < FREE_SECTION_COUNT) return s;
    return { id:s.id, title:s.title, icon:s.icon, body:'', paragraphs:null };
  });
}
/* 섹션 본문을 화면에 넣는다.
   - paragraphs(평문 배열) : textContent로만 조립 → 스크립트가 실행될 수 없다
   - untrusted body(HTML)  : 허용 태그 목록으로 정화한 뒤 삽입
   - 로컬 문구뱅크 body     : 이 파일이 직접 만든 문자열이므로 그대로 삽입 (이름은 이미 escapeHtml 처리됨) */
function appendSectionBody(sec, s){
  if(s.paragraphs && s.paragraphs.length){ sec.appendChild(paragraphsToFragment(s.paragraphs)); return; }
  if(s.untrusted){
    var wrap = el('div',{});
    wrap.appendChild(sanitizeHtmlToFragment(s.body || ''));
    sec.appendChild(wrap);
    return;
  }
  sec.appendChild(el('div',{html:s.body||''}));
}
/* 티저에 쓸 평문. paragraphs든 body든 태그를 벗겨 한 줄로 만든다.
   ★ R16 — 예전에는 모든 태그를 공백 하나로 바꿨다. 그러면 본문의 `<strong>일지 묘(卯)</strong>는` 이
     "일지 묘(卯) 는" 이 되어 조사 앞에 없던 공백이 생긴다. 이 앱은 josa()/josaOnly()로 받침까지 따져
     조사를 붙이는데, 평문화 한 줄 때문에 그 공이 티저에서만 무너지고 있었다.
     그래서 문단을 나누는 블록 태그만 공백으로 바꾸고, 글자 사이에 끼는 인라인 태그
     (strong·em·b·i·span·a·u·small 등)는 공백 없이 지운다. */
function sectionPlainText(s){
  if(!s) return '';
  if(s.paragraphs && s.paragraphs.length) return s.paragraphs.join(' ').replace(/\s+/g,' ').trim();
  return String(s.body||'')
    .replace(/<\s*(br|hr)\s*\/?\s*>/gi, ' ')                                   // 줄바꿈 태그 = 띄어쓰기
    .replace(/<\s*\/?\s*(p|div|li|ul|ol|h[1-6]|section|blockquote|tr|td|th|table)\b[^>]*>/gi, ' ') // 블록 태그 = 문단 경계
    .replace(/<[^>]*>/g, '')                                                    // 나머지(인라인) 태그 = 흔적 없이 제거
    .replace(/\s+/g, ' ').trim();
}

/* 목차. 잠긴 섹션도 제목은 보여준다 — 무엇을 사는 건지 알 수 있어야 하기 때문이다.
   다만 눌렀을 때 아무 데도 안 가는 링크를 남기면 고장난 것처럼 보이므로,
   잠긴 항목은 결제 화면으로 연결한다. */
function buildGatedToc(sections, product, ariaLabel){
  var unlocked = hasAccess(product.id);
  var freeCount = unlocked ? sections.length : Math.min(FREE_SECTION_COUNT, sections.length);
  var toc = el('nav',{class:'toc-nav','aria-label':ariaLabel});
  sections.forEach(function(s,i){
    var label = s.title.split(' · ')[0];
    if(i < freeCount){
      toc.appendChild(el('a',{href:'#'+s.id, onclick:function(e){ e.preventDefault(); var t=document.getElementById(s.id); if(t) t.scrollIntoView(); }},[label]));
    } else {
      toc.appendChild(el('a',{href:'#', class:'toc-locked', title:'유료 구간이에요',
        onclick:function(e){ e.preventDefault(); openPaywall(product); }},[lockIcon('잠김'), label]));
    }
  });
  return toc;
}

/* 결제한 사람이 유료 본문을 못 받았을 때, 그 사실을 화면에 정직하게 알리고 재시도 수단을 준다.
   AI 해석 실패에는 이미 같은 처리가 있었는데 정작 돈을 낸 경로에만 없었다. */
function paidContentNotice(state, onRetry){
  var box = el('div',{class:'interp-notice warn'});
  if(state.paidLoading){
    box.classList.remove('warn');
    box.appendChild(el('span',{class:'interp-badge'},['유료 해석']));
    box.appendChild(el('span',{},['결제하신 유료 해석을 서버에서 불러오는 중이에요.']));
    return box;
  }
  box.appendChild(el('span',{class:'interp-badge'},['유료 해석']));
  box.appendChild(el('span',{class:'interp-err'},['유료 해석을 불러오지 못했어요: '+state.paidError]));
  box.appendChild(el('span',{},['이용권은 그대로 있어요. 잠시 후 다시 시도해 주세요.']));
  box.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:onRetry},['다시 시도']));
  return box;
}

/* 리포트 섹션을 무료 구간까지만 그리고, 그 다음부터는 잠금 카드로 대체한다.
   사주 풀이와 MBTI 풀이가 같은 구조라 한 함수로 공유한다.
   opts.pendingFrom 이후의 섹션은 본문이 아직/끝내 없는 구간이므로, 제목만 덩그러니 두지 않고
   "불러오는 중"·"불러오지 못했어요 + 다시 시도" 카드로 대체한다. */
function renderGatedSections(view, sections, product, opts){
  opts = opts || {};
  var pendingFrom = (typeof opts.pendingFrom === 'number') ? opts.pendingFrom : -1;
  var unlocked = hasAccess(product.id);
  var freeCount = unlocked ? sections.length : Math.min(FREE_SECTION_COUNT, sections.length);

  sections.forEach(function(s,i){
    if(i >= freeCount) return;
    var sec=el('section',{class:'report-section', id:s.id});
    var h=el('h3',{});
    /* R22 — 아이콘을 옅은 원 배경에 담는다(레퍼런스의 목록 아이콘 규칙).
       svgIcon()은 이미 aria-hidden이라 낭독되는 글자는 늘지 않는다. */
    h.appendChild(el('span',{class:'icon-dot','aria-hidden':'true'},[svgIcon(s.icon)]));
    h.appendChild(document.createTextNode(s.title));
    sec.appendChild(h);
    if(pendingFrom >= 0 && i >= pendingFrom){
      if(opts.pendingLoading){
        sec.appendChild(el('p',{class:'section-sub'},['본문을 불러오는 중이에요…']));
      } else {
        sec.appendChild(el('p',{class:'section-sub'},['본문을 불러오지 못했어요. 이용권은 그대로 남아 있어요.']));
        /* 재시도 버튼은 첫 실패 섹션에만 둔다(섹션마다 달면 같은 버튼이 열 개 늘어선다). */
        if(opts.onRetry && i === pendingFrom){
          sec.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:opts.onRetry},['다시 시도']));
        }
      }
    } else {
      appendSectionBody(sec, s);
    }
    /* R23 — 본문에 이미 쓰여 있는 용어에 점선 밑줄을 그어 눌러서 뜻을 볼 수 있게 한다.
       ★ 여기 오는 것은 무료 구간(또는 결제해서 열린 구간)뿐이다 — 잠긴 섹션은 위에서 return하므로
         이 줄이 잠긴 본문을 만들어 내거나 노출시키는 일은 없다. */
    autoTermify(sec);
    view.appendChild(sec);
    var hasNext = (i < freeCount-1);
    if(hasNext){
      view.appendChild(el('div',{class:'next-sec-btn'},[
        el('button',{class:'btn btn-ghost btn-sm', onclick:(function(nextId){ return function(){ var t=document.getElementById(nextId); if(t) t.scrollIntoView(); }; })(sections[i+1].id)},['다음 섹션', dirIcon('down')])
      ]));
    }
  });

  if(!unlocked && sections.length > freeCount){
    var next = sections[freeCount];
    /* 맛보기는 다음 섹션의 앞부분만 보여준다. 통째로 넣으면 잠금이 무의미해진다.
       (유료 본문 서버 모드에서는 본문 자체가 비어 있어 티저도 나오지 않는다.) */
    var teaser = sectionPlainText(next).slice(0, 160);
    var remain = sections.length - freeCount;
    var block = lockedBlock(product, teaser ? '<p>'+escapeHtml(teaser)+'…</p>' : '', next.title.split(' · ')[0]);
    block.insertBefore(el('div',{class:'locked-count'},['남은 '+remain+'개 섹션이 잠겨 있어요']), block.firstChild);
    view.appendChild(block);
  }
}

/* 지금 풀이가 어떻게 만들어지고 있는지 알린다.
   "왜 Claude에 직접 물어볼 때보다 얕은가"에 대한 정직한 답이기도 하다. */
function interpreterNotice(state){
  /* =====================================================================
     R42 — 무엇으로 쓴 풀이인지 사실대로 말한다
     ---------------------------------------------------------------------
     예전에는 "설정에 AI가 연결돼 있는가"만 보고 문구를 골랐다. 이제 AI는 기본으로 켜져 있고
     실제로 부르는지는 결제 여부·서버 상태에 따라 갈린다. 그래서 설정이 아니라
     '이 화면에 지금 보이는 글이 무엇으로 쓰였는가'를 기준으로 말한다.
     설정을 보고 말하면, 서버에 열쇠가 없어 기본 풀이가 떠 있는데도 "AI 해석"이라 적히게 된다.
  ===================================================================== */
  var box = el('div',{class:'interp-notice'});
  var st = state || {};

  if(st.source === 'api'){
    box.classList.add('on');
    box.appendChild(el('span',{class:'interp-badge'},[st.loading ? 'AI 해석 쓰는 중' : 'AI 해석']));
    box.appendChild(el('span',{},[st.loading
      ? '사주 여덟 글자를 읽고 쓰는 중이에요. 다 쓰기까지 1~3분쯤 걸리니, 먼저 온 부분부터 읽으셔도 돼요.'
      : '이 풀이는 이 사주의 계산 결과를 직접 읽고 쓴 것이에요.']));
    return box;
  }

  if(st.loading){
    box.classList.add('on');
    box.appendChild(el('span',{class:'interp-badge'},['AI 해석 준비 중']));
    box.appendChild(el('span',{},['해석을 시작하는 중이에요. 먼저 기본 풀이를 보여드릴게요.']));
    return box;
  }

  box.appendChild(el('span',{class:'interp-badge'},['기본 풀이']));
  if(st.attempted && st.error){
    /* ★ 실패를 조용히 삼키지 않는다. 결제한 사람이 이유도 모르고 기본 풀이를 보면
       "돈 냈는데 똑같다"가 된다. 이유를 적고, 이용권은 그대로라는 것도 함께 알린다. */
    box.classList.add('warn');
    box.appendChild(el('span',{class:'interp-err'},[String(st.error)]));
    box.appendChild(el('span',{},['— 지금은 기본 해석표로 보여드리고 있어요. 이용권은 그대로 남아 있어요.']));
    return box;
  }
  box.appendChild(el('span',{},['사주팔자 계산은 이 앱이 직접 합니다. 풀이 문장은 사주 여덟 글자와 오행·십신 관계에 따라 미리 준비된 해석표를 조합해 만듭니다.']));
  return box;
}

/* =====================================================================
   상용화 계층 2 — 해석 엔진(Interpreter)
   ---------------------------------------------------------------------
   사주팔자(사주 기둥) 계산은 이 파일 안의 SajuEngine이 천문 계산으로 직접 한다.
   반면 "풀이 문장"은 지금까지 미리 써둔 문구 표에서 골라 조합하는 방식이었다.
   같은 사주라도 사람이 Claude에게 직접 물어볼 때보다 얕게 느껴지는 이유가 바로 이것이다.
   (계산이 틀린 게 아니라, 해석하는 주체가 없었다.)

   그래서 해석을 갈아끼울 수 있는 층으로 분리한다.
     local — 지금까지의 문구 표 조합. 오프라인에서 즉시 동작. 무료 기본값.
     api   — 실제 LLM이 해석. 서버를 거쳐 호출한다.

   API 키를 브라우저에 두면 페이지를 여는 누구나 키를 훔쳐 쓸 수 있으므로,
   반드시 [브라우저 → 내 서버 → Anthropic] 순서로 호출한다. 이 파일은 내 서버의
   엔드포인트 주소만 알고 있으면 되고 키는 서버에만 둔다.
===================================================================== */
var Interpreter = {
  /* =====================================================================
     R42 — AI 해석을 우리 서버 함수(/api/interpret)에 연결한다
     ---------------------------------------------------------------------
     ★ 열쇠(ANTHROPIC_API_KEY)는 브라우저가 모른다. 서버 함수 안에서만 쓴다.
       HTML에 키를 넣으면 개발자도구만 열면 누구나 가져가 남의 요금으로 쓴다.
     ★ 기본이 'api'다. 예전에는 'local'이라 아무도 켜지 않으면 영영 안 켜졌다.
       서버에 열쇠가 없으면 서버가 503으로 답하고, 화면은 기본 풀이 그대로 남는다 —
       켜고 끄는 것을 코드가 아니라 환경변수가 정하게 한다.
     ★ 시간이 넉넉해야 한다. 7천 토큰짜리 글이라 다 쓰는 데 1~3분 걸린다.
       예전 30초로는 항상 중간에 끊긴다. 다만 첫 글자는 몇 초 만에 오고,
       그 뒤로는 계속 흘러 들어오므로 손님이 30초를 멍하니 보지는 않는다.
  ===================================================================== */
  config: {
    mode: 'api',              /* 'local' | 'api' */
    endpoint: '/api/interpret',
    model: 'claude-sonnet-5',
    timeoutMs: 240000
  },
  lastError: null,

  load: function(){
    var c = STATE.interpreterConfig;
    if(c){ for(var k in c){ if(k in this.config) this.config[k] = c[k]; } }
  },
  save: function(){
    STATE.interpreterConfig = {
      mode:this.config.mode, endpoint:this.config.endpoint,
      model:this.config.model, timeoutMs:this.config.timeoutMs
    };
    saveState();
  },
  isApiReady: function(){
    return this.config.mode === 'api' && isSecureEndpoint(this.config.endpoint || '');
  },

  /* LLM에 넘길 재료. 여기 담기는 값은 전부 이 앱이 실제로 계산한 것이다.
     해석 품질은 결국 이 재료를 얼마나 정확하고 빠짐없이 넘기느냐로 갈린다. */
  buildSajuPayload: function(profile, saju){
    var counts = dominantElementIdx(saju).counts;
    return {
      kind: 'saju',
      person: {
        name: profile.name || '',
        gender: profile.gender === 'M' ? '남' : '여',
        birth: { year:profile.year, month:profile.month, day:profile.day,
                 time: profile.birthTime || null, calendar: profile.calendarType || 'solar' }
      },
      pillars: {
        year:  { stem:SajuEngine.STEMS[saju.year.stemIdx],  branch:SajuEngine.BRANCHES[saju.year.branchIdx] },
        month: { stem:SajuEngine.STEMS[saju.month.stemIdx], branch:SajuEngine.BRANCHES[saju.month.branchIdx] },
        day:   { stem:SajuEngine.STEMS[saju.day.stemIdx],   branch:SajuEngine.BRANCHES[saju.day.branchIdx] },
        hour:  saju.hour ? { stem:SajuEngine.STEMS[saju.hour.stemIdx], branch:SajuEngine.BRANCHES[saju.hour.branchIdx] } : null
      },
      elements: { 목:counts[0], 화:counts[1], 토:counts[2], 금:counts[3], 수:counts[4] },
      dayMasterStrength: sinGangJak(saju),
      sipseong: sipseongCounts(saju),
      /* ★ 제목 목록을 함께 보낸다. 이게 없으면 AI가 제목을 제멋대로 지어,
         화면의 목차(로컬에서 만든 것)와 본문이 서로 다른 이름을 갖게 된다. */
      requested: { sections: 13, tone: '따뜻한 반말체', language: 'ko', sectionTitles: null }
    };
  },

  buildCompatPayload: function(pA, pB, res){
    return {
      kind: 'compat',
      a: { name:pA.name, mbti:pA.mbti, pillars: pA.saju ? this.buildSajuPayload(pA, pA.saju).pillars : null },
      b: { name:pB.name, mbti:pB.mbti, pillars: pB.saju ? this.buildSajuPayload(pB, pB.saju).pillars : null },
      computed: { combined:res.combined, tier:res.combinedTier, sajuScore:res.saju.score, mbtiScore:res.mbtiScore },
      requested: { language:'ko', tone:'따뜻한 반말체' }
    };
  },

  /* =====================================================================
     R42 — 써지는 대로 받아 화면에 얹는다 (스트리밍)
     ---------------------------------------------------------------------
     이 글은 다 쓰는 데 1~3분 걸린다. 결제한 사람을 그동안 빈 화면 앞에 두면
     그건 고장으로 보이고, 실제로 환불 요청이 된다.
     흘려받으면 몇 초 만에 첫 문단이 뜨고 읽는 동안 나머지가 채워진다.

     서버는 SSE로 보낸다:  data: {"type":"delta","text":"…"}
                          data: {"type":"done"}
                          data: {"type":"error","reason":"…"}
     ★ EventSource를 쓰지 않는다. 그건 GET만 되는데 우리는 사주를 본문에 담아 POST해야 한다.
     ★ onText는 지금까지 받은 '전체'를 넘긴다. 조각만 넘기면 화면 쪽에서 다시 이어붙여야 하고,
       그 이어붙이기가 한 군데라도 어긋나면 문장이 깨진 채로 굳는다.
  ===================================================================== */
  generateStream: function(productId, payload, onText){
    var self = this;
    if(!this.isApiReady()){
      return Promise.reject(new Error('AI 해석이 연결되어 있지 않습니다.'));
    }
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, this.config.timeoutMs) : null;
    function done(){ if(timer) clearTimeout(timer); }

    return fetch(this.config.endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',   /* 권한·횟수를 세션 쿠키로 판단한다 */
      body: JSON.stringify({ productId: productId, payload: payload }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if(!res.ok){
        /* 서버가 이유를 한 문장으로 준다(권한 없음·횟수 초과·아직 연결 안 됨).
           그 말을 그대로 화면에 보여준다 — 우리가 다시 지어내면 실제와 어긋난다. */
        return res.json().catch(function(){ return null; }).then(function(d){
          done();
          throw new Error((d && d.reason) || ('해석 서버 응답 오류 (HTTP '+res.status+')'));
        });
      }
      if(!res.body || !res.body.getReader){
        done();
        throw new Error('이 브라우저에서는 실시간 표시를 지원하지 않아요.');
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '', full = '', failed = null;

      function pump(){
        return reader.read().then(function(r){
          if(r.done){
            done();
            if(failed) throw new Error(failed);
            return full;
          }
          buf += dec.decode(r.value, {stream:true});
          var parts = buf.split('\n\n');
          buf = parts.pop() || '';   /* 마지막 조각은 아직 안 끝났을 수 있다 */
          for(var i=0;i<parts.length;i++){
            var lines = parts[i].split('\n');
            for(var j=0;j<lines.length;j++){
              if(lines[j].indexOf('data:') !== 0) continue;
              var raw = lines[j].slice(5).replace(/^\s+/,'');
              if(!raw) continue;
              var ev = null;
              try{ ev = JSON.parse(raw); }catch(e){ continue; }
              if(ev.type === 'delta' && typeof ev.text === 'string'){
                full += ev.text;
                if(onText) { try{ onText(full); }catch(e){} }
              } else if(ev.type === 'error'){
                failed = ev.reason || '해석을 만들다가 끊겼어요.';
              }
            }
          }
          return pump();
        });
      }
      return pump();
    }).catch(function(err){
      done();
      self.lastError = (err && err.name === 'AbortError')
        ? '해석 시간이 초과되었습니다.' : (err.message || String(err));
      throw err;
    });
  },

  /* '##제목' 으로 나뉜 글을 섹션으로 자른다.
     ★ 아직 다 안 온 상태에서도 부를 수 있어야 한다. 마지막 섹션은 쓰는 중일 수 있다. */
  parseSections: function(text, titles){
    var out = [], cur = null;
    var lines = String(text||'').split('\n');
    for(var i=0;i<lines.length;i++){
      var m = /^##\s*(.+?)\s*$/.exec(lines[i]);
      if(m){
        if(cur) out.push(cur);
        cur = { title: m[1], paras: [] };
      } else if(cur){
        var t = lines[i].trim();
        if(t) cur.paras.push(t);
      }
    }
    if(cur) out.push(cur);
    /* 제목은 우리가 정한 것을 쓴다. AI가 조금 다르게 적어도 목차와 어긋나지 않게. */
    return out.map(function(sec, i){
      return { title: (titles && titles[i]) ? titles[i] : sec.title, paras: sec.paras };
    });
  },

  /* 옛 호출부 호환 — 한 번에 받아 섹션 배열로 준다. */
  generate: function(payload){
    var self = this;
    if(!this.isApiReady()){
      return Promise.reject(new Error('AI 해석이 연결되어 있지 않습니다.'));
    }
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, this.config.timeoutMs) : null;

    return fetch(this.config.endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:this.config.model, payload:payload }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if(timer) clearTimeout(timer);
      if(!res.ok) throw new Error('해석 서버 응답 오류 (HTTP '+res.status+')');
      return res.json();
    }).then(function(data){
      if(!data || !Array.isArray(data.sections)) throw new Error('해석 결과 형식이 올바르지 않습니다.');
      self.lastError = null;
      return data.sections;
    }).catch(function(err){
      if(timer) clearTimeout(timer);
      self.lastError = (err && err.name === 'AbortError') ? '해석 시간이 초과되었습니다.' : (err.message || String(err));
      throw err;
    });
  }
};

/* =====================================================================

   ★ 원본 시트가 1280×853이라 캐릭터 한 종이 90~150px이다. 224px로 키워 두었지만
     없던 선명함이 생기지는 않는다. 디자이너에게 낱장 원본을 받으면 더 깨끗해진다.

function charImgSrc(key){ return 'char/' + key + '.webp'; }

function buildCharSvg(key, size, opts){
  opts = opts || {};
  var spec = CHARACTERS[key];
  var px = size || 120;
  return el('img', {
    src: charImgSrc(key),
    width: String(px), height: String(px),
    alt: opts.label || ((spec ? spec.name : '') + ' 캐릭터'),
    loading: 'lazy', decoding: 'async',
    class: 'char-svg' + (opts.cls ? ' ' + opts.cls : '')
  });
}

/* 공유 카드(캔버스)용 — 그림이 도착해야 그릴 수 있으므로 받아 두고 알려준다. */
var CHAR_IMG_CACHE = {};
function charImage(key, onReady){
  var im = CHAR_IMG_CACHE[key];
  if(im) { if(im._ok && onReady) onReady(); return im; }
  im = new Image();
  im.onload = function(){ im._ok = true; if(onReady) onReady(); };
  im.onerror = function(){ im._ok = false; };
  im.src = charImgSrc(key);
  CHAR_IMG_CACHE[key] = im;
  return im;
}

function buildCharHero(key, size, note){
  var spec = CHARACTERS[key];

  var box = el('div',{class:'scroll-card char-hero stamp-in'});
  box.appendChild(buildCharSvg(key, size||118));

  t.appendChild(el('div',{class:'ch-name'},[spec.name]));

  return box;

/* 궁합 화면에서 두 사람을 나란히 세운다. 각자 MBTI 캐릭터를 쓰고, 일간 오행은 아래 한 줄로만 적는다
   (오행 캐릭터까지 네 마리를 세우면 화면이 시끄러워지고 320px에서 무너진다). */
function buildCompatCharPair(nameA, pA, pB){
  var wrap = el('div',{class:'char-pair'});

    side.appendChild(el('div',{class:'cp-name'},[pair[0]]));
    var elemKey = charKeyForDayStem(who.saju);

       뜻이 같은 일상어로 바꿨다. 가리키는 값(일간의 오행)은 그대로다. */
    side.appendChild(el('div',{class:'cp-sub'},[ who.mbti + (elemKey ? ' · 타고난 기운 '+CHARACTERS[elemKey].name.split(' · ')[0] : '') ]));

      var score=50;
      for(var i=0;i<4;i++){ score += (a[i]===b[i]) ? 4 : -1; }

/* ---- 프로필의 사주 계산 결과를 구해 캐시(기능3 구현 가능성: sajuCache) ---- */
function getSajuResult(profile){
  if(!profile) return null;
  /* R20 — 캐시는 "같은 보정 설정으로 계산한 것"일 때만 쓴다.
     옛 캐시(optsKey 없음)는 무조건 다시 계산한다. 옛 프로필은 보정이 꺼진 채 마이그레이션되므로
     다시 계산해도 결과는 예전과 같은 값이 나온다(그 점을 실측으로 확인했다). */
  var opts = sajuOptsOf(profile), key = sajuOptsKey(opts);
  var inState = !!(profile.id && STATE.profiles.indexOf(profile) >= 0);
  if(profile.sajuCache && profile.sajuCache.optsKey===key){
    /* ★ R25 — 캐시를 그대로 쓰는 경로에서도 대표 오행 사본을 맞춘다.
       캐시는 살아 있는데 사본만 옛 값인 프로필이 실제로 있었다(절기 보정으로 기둥이 바뀐 경우). */
    if(syncProfileElement(profile, profile.sajuCache) && inState) saveState();
    return profile.sajuCache;
  }
  var bt = profile.birthTime;
  var r = SajuEngine.computeSaju(profile.year, profile.month, profile.day,
    bt?bt.hour:null, bt?(bt.minute||0):0, opts);
  r.optsKey = key;
  profile.sajuCache = r;
  syncProfileElement(profile, r);
  /* 캐시를 메모리에만 넣으면 다음 로드에서 절기 계산을 다시 한다. 저장까지 해야 캐시가 캐시로 동작한다. */
  if(inState) saveState();
  return r;
}
/* =====================================================================
   R25 — 대표 오행(elementIdx / element)의 출처를 하나로 만든다.
   ---------------------------------------------------------------------
   무엇이 문제였나: 대표 오행은 프로필을 만들 때 딱 한 번 계산해 저장하고(설정 마법사),
   그 뒤로 갱신되는 경로가 없었다. 그런데 사주 계산은 그 뒤로도 두 번 바뀐다 —
   R20의 진태양시 보정을 켜고 끌 때, 그리고 R24가 절기 시각을 바로잡았을 때다.
   그래서 `내 사주`는 계산에서 바로 뽑은 새 값을 보여주고, 궁합 오행 점수(computeCompat)와
   그룹 궁합 레이더(elementProfile)는 저장된 옛 값을 써서, 같은 사람에 대해
   화면끼리 다른 답을 냈다(R24 독립 검수 §5-3, 경계 표본 9건 중 3건).

   어떻게 고쳤나: **저장값을 없애지 않되 권위를 뺏었다.**
   이제 유일한 출처는 `dominantElementIdx(계산된 사주)`이고, `p.elementIdx`·`p.element`는
   그 결과의 사본일 뿐이다. 사본은 사주를 구하는 길목(getSajuResult) 한 곳에서만 쓰이고,
   값이 다르면 언제나 계산 쪽이 이긴다. 두 출처가 공존할 자리를 남기지 않는다.
   (저장값을 아예 지우지 않은 이유: 프로필 목록의 아바타 테두리·공유 카드처럼 사주를
    다시 계산하지 않고 이름만 필요로 하는 자리가 여럿이고, 그 자리들이 전부 이 사본을 읽는다.
    render() 맨 앞에서 프로필 전체를 한 번 맞추므로 그리기 전에 이미 최신이다.)

   조용히 바꾸지 않는다: 값이 실제로 달라지는 프로필에는 무엇이 무엇으로 바뀌었는지 알린다.
   원인이 절기 보정이면 R24 안내 상자 안에 한 줄로 합쳐 넣고(buildTermFixNotice),
   그 밖의 이유(진태양시 설정 변경 등)면 buildElementFixNotice가 따로 알린다.
===================================================================== */
function syncProfileElement(profile, saju){
  if(!profile || !saju || !saju.day) return false;
  var idx = dominantElementIdx(saju).idx;
  var name = ELEMENTS[idx];
  if(profile.elementIdx === idx && profile.element === name) return false;
  profile.elementIdx = idx;
  profile.element = name;
  return true;
}
/* 화면을 그리기 전에 저장된 사본을 전부 맞춘다.
   렌더 순서에 기대지 않기 위해서다 — 예전에는 같은 화면 안에서도 p.element를 읽는 줄이
   getSajuResult()를 부르는 줄보다 위에 있으면 그 한 번은 옛 값이 찍혔다. */
function syncAllProfileElements(){
  var list = (STATE && STATE.profiles) || [];
  for(var i=0;i<list.length;i++){
    var p = list[i];
    if(!p || typeof p.year!=='number') continue;
    try{ getSajuResult(p); }catch(e){ /* 계산이 안 되는 프로필은 손대지 않고 넘어간다 */ }
  }
}
function sajuChars(sajuResult){ // 8자(또는 6자) 배열: {pos,label,stemIdx,branchIdx,stemElem,stemYY,branchElem,branchYY}
  var out=[];
  ['year','month','day'].forEach(function(pos){
    var g=sajuResult[pos];
    out.push({pos:pos, part:'stem', g:g});
    out.push({pos:pos, part:'branch', g:g});
  });
  if(sajuResult.hour){
    out.push({pos:'hour', part:'stem', g:sajuResult.hour});
    out.push({pos:'hour', part:'branch', g:sajuResult.hour});
  }
  return out;
}
function dominantElementIdx(sajuResult){
  var chars = sajuChars(sajuResult);
  var counts=[0,0,0,0,0];
  chars.forEach(function(c){
    var elem = c.part==='stem' ? SajuEngine.STEM_ELEM[c.g.stemIdx] : SajuEngine.BRANCH_ELEM[c.g.branchIdx];
    counts[elem]++;
  });
  var best=0; for(var i=1;i<5;i++){ if(counts[i]>counts[best]) best=i; }
  return {idx:best, counts:counts};
}
/* 신강/신약 간이 판정: 일간과 같은 오행(비겁)+나를 생하는 오행(인성) 글자수가 전체 절반 이상이면 신강 */
function sinGangJak(sajuResult){
  var dayStemIdx = sajuResult.day.stemIdx;
  var dayElem = SajuEngine.STEM_ELEM[dayStemIdx];
  var chars = sajuChars(sajuResult);
  var supportive=0, total=chars.length;
  chars.forEach(function(c){
    if(c.pos==='day' && c.part==='stem') return; // 일간 자기 자신 제외
    var elem = c.part==='stem' ? SajuEngine.STEM_ELEM[c.g.stemIdx] : SajuEngine.BRANCH_ELEM[c.g.branchIdx];
    var diff = ((elem-dayElem)%5+5)%5;
    if(diff===0 || diff===4) supportive++; // 비겁(0) 또는 인성(4=나를 생함)
  });
  return supportive >= (total-1)/2 ? 'strong' : 'weak';
}
/* 10종 십성 카운트(사주 8자/6자 전체, 일간 자신 제외) */
var SIPSEONG10 = ['비견','겁재','식신','상관','편재','정재','편관','정관','편인','정인'];
function sipseongCounts(sajuResult){
  var dayStemIdx = sajuResult.day.stemIdx;
  var chars = sajuChars(sajuResult);
  var counts={}; SIPSEONG10.forEach(function(s){ counts[s]=0; });
  chars.forEach(function(c){
    if(c.pos==='day' && c.part==='stem') return;
    var elem = c.part==='stem' ? SajuEngine.STEM_ELEM[c.g.stemIdx] : SajuEngine.BRANCH_ELEM[c.g.branchIdx];
    var yy = c.part==='stem' ? SajuEngine.STEM_YY[c.g.stemIdx] : SajuEngine.BRANCH_YY[c.g.branchIdx];
    var name = SajuEngine.sipseongOf(dayStemIdx, elem, yy);
    counts[name]++;
  });
  return counts;
}
function dominantSipseong(counts){
  var best='비견', bestN=-1;
  SIPSEONG10.forEach(function(s){ if(counts[s]>bestN){ bestN=counts[s]; best=s; } });
  return best;
}
function groupCategory(sipseongName){ // 5대분류: 비겁/식상/재성/관성/인성
  if(sipseongName==='비견'||sipseongName==='겁재') return '비겁';
  if(sipseongName==='식신'||sipseongName==='상관') return '식상';
  if(sipseongName==='편재'||sipseongName==='정재') return '재성';
  if(sipseongName==='편관'||sipseongName==='정관') return '관성';
  return '인성';
}
/* v5-A/v5-B 공용: 대운=계절 비유의 "상승기/준비기" 판정 — groupCategory(기존 함수) 재사용, 새 판정 로직 아님.
   비겁/식상/재성=확장·도전에 유리한 상승기, 관성/인성=안정·정리에 유리한 준비기. */
function isExpandingGroup(sipseongName){
  var grp = groupCategory(sipseongName);
  return (grp==='비겁'||grp==='식상'||grp==='재성');
}

function hasDohwa(sajuResult){

     ★ 수정 전 표는 사유축→인(2), 인오술→해(11), 해묘미→오(6)로 세 값이 틀려 있었다.
       인·해는 자오묘유에 아예 없는 지지라, 같은 파일의 SHINSAL_BY_BRANCH(자오묘유=도화살)와
       이 함수가 서로 다른 답을 내고 있었다. 도화 유무는 유료 s5(사랑·연애운)의 문단 하나를
       넣고 빼는 값이라 표본 960건 중 164건(17%)에서 결과가 뒤집혔다.
     신자진(수국)→유 / 사유축(금국)→오 / 인오술(화국)→묘 / 해묘미(목국)→자 */
  var groups = [ {set:[8,0,4], dohwa:9}, {set:[5,9,1], dohwa:6}, {set:[2,6,10], dohwa:3}, {set:[11,3,7], dohwa:0} ];
  var yearBranch = sajuResult.year.branchIdx;
  var target=null;
  groups.forEach(function(g){ if(g.set.indexOf(yearBranch)>=0) target=g.dohwa; });
  if(target==null) return false;
  var checks=[sajuResult.day.branchIdx];
  if(sajuResult.hour) checks.push(sajuResult.hour.branchIdx);
  return checks.indexOf(target)>=0;
}

function twelveStageOf(stemIdx, branchIdx){
  var start = TWELVE_STAGE_START[stemIdx];
  var forward = (stemIdx%2===0); // 양간(갑병무경임)=순행, 음간(을정기신계)=역행 — 기존 STEM_YY 규칙과 동일한 짝/홀 판정
  var diff = forward ? ((branchIdx-start+12)%12) : ((start-branchIdx+12)%12);
  return TWELVE_STAGE_NAMES[diff];
}

/* v5-C 신규: 대운 구간 1개의 금전운·건강운 문장을 함께 만드는 공용 함수 —
   기능5 타임라인(renderSaju)과 기능6 리포트(s10~s12)가 같은 대운 구간에 대해 동일한 근거로 서술하도록
   공용 함수로 분리했다(서로 다른 얘기를 하지 않게). 새 계산 없음: sipseongOf(십성)·counts(오행 카운트, 이미 계산됨)·
   ELEM_ORGAN(v5-A 룩업)만 조합한다. */
function daeunMoneyHealthLines(dayStemIdx, ganji, counts, slot){
  var sipName = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[ganji.stemIdx], SajuEngine.STEM_YY[ganji.stemIdx]);
  var moneyLine = DAEUN_MONEY_LINE[sipName];

  var branchElem = SajuEngine.BRANCH_ELEM[ganji.branchIdx];
  var weakestElem = counts.indexOf(Math.min.apply(null,counts));
  var mostElem = counts.indexOf(Math.max.apply(null,counts));
  /* R16 — 상태(여림/진함/그 외)에 맞는 템플릿을 "대운 목록에서의 자리(slot)"로 고른다.
     대운은 9구간이고 뱅크도 9문장이므로 9구간이 서로 다른 템플릿을 받는다.
     (R14는 일간 + BRANCH_ELEM_RANK로 골랐는데, 한 사람 안에서 일간은 상수이고 RANK는 0·1에 몰려 있어
      9구간이 6~7종으로 수렴했다 — 오행 이름만 바뀐 문장이 무료 구간과 유료 구간에 함께 나왔다.)
     ★ slot은 대운 목록에서의 위치라, 같은 구간이면 대운 타임라인 모달과 리포트 s10~s12가 같은 문장을 낸다.
       (slot을 넘기지 않은 호출부가 생기면 0으로 떨어져 첫 문장을 쓴다 — 문장이 없어지지는 않는다.) */
  var hState = (branchElem === weakestElem) ? 'weak' : (branchElem === mostElem ? 'most' : 'other');
  var hBank = DAEUN_HEALTH_LINES[hState];
  var healthLine = fillElemOrgan(hBank[(slot||0) % hBank.length], branchElem);
  // 신규(대운 서술 심화 후속): 십이운성 — 이 대운 지지가 일간 기준으로 어느 단계인지 조회해 생애주기 비유 문장 추가.
  // 새 계산 없음: twelveStageOf()는 위 고정 조견표(TWELVE_STAGE_START)를 조회할 뿐이다.
  var stageName = twelveStageOf(dayStemIdx, ganji.branchIdx);
  var stageLine = '이 대운은 십이운성으로 보면 '+TWELVE_STAGE_LINE[stageName];
  return { sipName:sipName, moneyLine:moneyLine, healthLine:healthLine, stageName:stageName, stageLine:stageLine };
}

   ---------------------------------------------------------------------
   왜 만들었나: 대운이 가로 스크롤 목록뿐이라 "몇 살 때가 가장 크게 열리는지"가 보이지 않았다.

   ★ 근거를 댈 수 있는 네 가지만 쓴다. 가중치는 아래 DAEUN_W 한 곳에서만 정하고,
     같은 값을 화면(강도 근거 접이식)에도 그대로 적는다 — 코드와 화면이 어긋나면 안 된다.
     (근거 출처는 전부 agents/knowledge_saju_mbti.md)

     A. 억부(抑扶) 적합도 — 40점   · §6 용신 이론. "신강하면 억제, 신약하면 보강"이 억부용신의
        기본 원리이고 전체 사주의 약 70%에 적용된다고 정리돼 있다. 그래서 이 앱이 이미 쓰고 있는
        간이 신강/신약 판정(sinGangJak)을 그대로 받아, 대운 천간의 십성이 어느 쪽인지로 점수를 준다.
        신약이면 비겁·인성(보강)이 높고, 신강이면 식상·재성·관성(설기·억제)이 높다.
     B. 원국 지지와의 합충 — 25점  · §3 합충형파해. 육합·삼합·방합은 결합, 충·형·파는 마찰로 본다.
        새 판정표를 만들지 않고 기존 SajuEngine.branchRelations()를 두 번 불러(원국만 / 원국+대운지지)
        늘어난 관계만 센다. 12점에서 시작해 합이면 올리고 충·형·파면 내린다.
     C. 부족한 오행(용신 근사) 유입 — 20점 · §6 + 이 앱의 기존 관행. 정통 용신 산출은 유파가 갈리므로
        리포트 s8이 쓰는 것과 똑같은 근사("원국에서 가장 적은 오행이 지금 필요한 기운")를 그대로 쓴다.
        대운의 천간·지지 오행이 그 오행이면 올리고, 이미 가장 진한 오행이면 조금 내린다.
     D. 십이운성 왕쇠 — 15점        · §2. 강한 순서(장생·관대·건록·제왕) / 중간(목욕·쇠·태·양) /
        약함(병·사·묘·절)이라는 통설을 그대로 점수화했다. 조견표는 기존 twelveStageOf()를 쓴다.

   ★ 일부러 쓰지 않은 것: 신살(§4)·격국(§5)·조후/통관 용신은 "구간의 강약"을 판정할 근거로
     쓰기에는 이 앱 안에 판정 로직이 없거나(조후·통관) 구간이 아니라 원국 전체의 성격을
     말하는 값이라(격국) 대운 구간별로 차등을 줄 이유를 댈 수 없었다.
   ★ 이 점수는 "좋은 인생/나쁜 인생"이 아니라 이 계산 안에서의 상대적 세기다. 화면 문구도
     단정형을 쓰지 않는다("가장 크게 열리는 편이에요").
===================================================================== */
var DAEUN_W = { eokbu:40, branch:25, yongsin:20, stage:15 };
/* A. 억부 — 5대분류(groupCategory)별 배점. 합이 아니라 "그중 하나"를 고르는 표다. */
var DAEUN_EOKBU = {
  weak:   { '비겁':38, '인성':34, '식상':14, '재성':10, '관성':8 },
  strong: { '비겁':8,  '인성':6,  '식상':34, '재성':38, '관성':34 }
};
/* D. 십이운성 왕쇠 배점 (§2의 강/중/약 3분류를 12단계로 폈다)
   ★ R25 — 태(胎)를 6에서 7로 올렸다. 근거는 knowledge_saju_mbti.md §2 한 줄이다:
     "장생·관대·건록·제왕이 강한 기운, 목욕·쇠·태·양이 중간 기운, 병·사·묘·절이 약한 기운".
     태는 중간, 병은 약함인데 둘 다 6이라 자료가 나눠 놓은 경계가 점수에서 사라져 있었다.
     이제 세 무리가 겹치지 않는다: 강 12~15 / 중 7~9 / 약 3~6.
   ★ 태 말고는 한 칸도 건드리지 않았다. 무리 안에서의 순서(예: 묘 5 > 사 4)는 자료가
     "병·사·묘·절"이라고 나열만 할 뿐 세기의 우열을 적지 않아, 근거 없이 숫자를 바꾸지 않는다.
     이 자리는 SELF_CHECK R25에 "근거 없어 그대로 둔 것"으로 남긴다.
   ★ 최고점(제왕 15)이 그대로라 DAEUN_MAX.stage와 화면에 적는 만점(98점)은 바뀌지 않는다. */
var DAEUN_STAGE_POWER = { '제왕':15,'건록':14,'관대':13,'장생':12,'쇠':9,'양':9,'목욕':8,'태':7,'병':6,'묘':5,'사':4,'절':3 };
/* =====================================================================
   R24 — 화면에 적는 만점을 "실제로 도달 가능한 값"에서 뽑는다.
   ---------------------------------------------------------------------
   R21은 DAEUN_W의 가중치(40/25/20/15)를 그대로 화면에 적고 "네 가지를 더해 100점으로 봐요"라고
   썼는데, 억부 표(DAEUN_EOKBU)의 최대값은 38이라 실제 도달 가능한 총점은 98이었다.
   도달할 수 없는 만점을 적어 두면 "화면에 적힌 주장 = 코드 동작"이라는 이 앱의 합격 조건에 걸린다.
   ★ 배점 자체는 손대지 않았다. 배점을 올리면 이미 본 사람의 강도 숫자가 말없이 바뀌기 때문이고,
     이 라운드에서 이미 절기 보정으로 결과가 바뀌는 사람이 생겼기 때문이다. 대신 표기를 실제에 맞춘다.
   ★ 이 값들은 상수를 직접 훑어서 구한다. 다음에 표를 고쳐도 화면 숫자가 저절로 따라오므로
     같은 종류의 어긋남이 다시 생기지 않는다.
===================================================================== */
function maxOfTable(obj){
  var mx = 0;
  for(var k in obj){ if(obj[k] > mx) mx = obj[k]; }
  return mx;
}
var DAEUN_MAX = {
  eokbu:   Math.min(DAEUN_W.eokbu,   Math.max(maxOfTable(DAEUN_EOKBU.weak), maxOfTable(DAEUN_EOKBU.strong))),
  branch:  DAEUN_W.branch,     /* branchScore는 [0, DAEUN_W.branch]로 클램프된다 */
  yongsin: DAEUN_W.yongsin,    /* 6+7+7=20 = DAEUN_W.yongsin */
  stage:   Math.min(DAEUN_W.stage, maxOfTable(DAEUN_STAGE_POWER))
};
var DAEUN_MAX_TOTAL = DAEUN_MAX.eokbu + DAEUN_MAX.branch + DAEUN_MAX.yongsin + DAEUN_MAX.stage;
var DAEUN_W_LABEL = [
  ['십성이 지금의 나에게 보탬이 되는지', DAEUN_MAX.eokbu, '신강·신약에 따라 필요한 기운이 달라져요(억부).'],
  ['대운 지지가 원국과 합인지 충인지', DAEUN_MAX.branch, '육합·삼합·방합은 올리고, 충·형·파는 내려요.'],
  ['부족한 오행이 채워지는지', DAEUN_MAX.yongsin, '원국에서 가장 적은 오행을 지금 필요한 기운으로 봐요.'],
  /* R25 — 자료(§2)가 나눠 놓은 세 무리를 화면 문장에도 그대로 적는다.
     예전 문장은 강·약만 예로 들어서, 중간 무리가 있다는 것 자체가 보이지 않았다. */
  ['십이운성으로 본 기운의 왕쇠', DAEUN_MAX.stage, '센 자리(장생·관대·건록·제왕)가 높고, 중간(목욕·쇠·태·양)을 거쳐 약한 자리(병·사·묘·절)가 낮아요.']
];

function origBranchList(saju){
  var a=[{idx:saju.year.branchIdx},{idx:saju.month.branchIdx},{idx:saju.day.branchIdx}];
  if(saju.hour) a.push({idx:saju.hour.branchIdx});
  return a;
}
/* 삼합/방합은 개수가 아니라 "조(組)"로 센다. 새로 생긴 조 + 반합에서 완성으로 올라선 조를 이득으로 본다. */
function hapGroupGain(baseArr, nowArr){
  var gain=0;
  nowArr.forEach(function(n){
    var b=null;
    baseArr.forEach(function(x){ if(x.elem===n.elem) b=x; });
    if(!b) gain++;
    else if(n.full && !b.full) gain++;
  });
  return gain;
}
function daeunStrengthOf(saju, ganji, counts, gangjak){
  var dayStemIdx = saju.day.stemIdx;
  /* A. 억부 */
  var sipName = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[ganji.stemIdx], SajuEngine.STEM_YY[ganji.stemIdx]);
  var grp = groupCategory(sipName);
  var eokbu = DAEUN_EOKBU[gangjak==='strong' ? 'strong' : 'weak'][grp];

  /* B. 원국 지지와의 합충 — 기존 branchRelations를 두 번 불러 "늘어난 관계"만 센다 */
  var baseList = origBranchList(saju);
  var base = SajuEngine.branchRelations(baseList);
  var now  = SajuEngine.branchRelations(baseList.concat([{idx:ganji.branchIdx}]));
  var dHap = now.hap.length - base.hap.length;
  var dChung = now.chung.length - base.chung.length;
  var dPa = now.pa.length - base.pa.length;
  var dHyeong = now.hyeong.length - base.hyeong.length;
  var dSam = hapGroupGain(base.samhap, now.samhap);
  var dBang = hapGroupGain(base.banghap, now.banghap);
  var branchScore = 12 + 5*dHap + 3*(dSam+dBang) - 5*dChung - 3*dHyeong - 2*dPa;
  branchScore = Math.max(0, Math.min(DAEUN_W.branch, branchScore));

  /* C. 부족한 오행(용신 근사) 유입 */
  var weakest = counts.indexOf(Math.min.apply(null, counts));
  var most = counts.indexOf(Math.max.apply(null, counts));
  var sElem = SajuEngine.STEM_ELEM[ganji.stemIdx], bElem = SajuEngine.BRANCH_ELEM[ganji.branchIdx];
  var yong = 6 + (sElem===weakest?7:0) + (bElem===weakest?7:0) - (sElem===most?2:0) - (bElem===most?2:0);
  yong = Math.max(0, Math.min(DAEUN_W.yongsin, yong));

  /* D. 십이운성 왕쇠 */
  var stageName = twelveStageOf(dayStemIdx, ganji.branchIdx);
  var stage = DAEUN_STAGE_POWER[stageName];

  /* 클램프 상한도 화면에 적는 만점과 같은 값을 쓴다(합이 이 값을 넘을 수 없으므로 결과는 바뀌지 않는다). */
  var total = Math.max(0, Math.min(DAEUN_MAX_TOTAL, Math.round(eokbu + branchScore + yong + stage)));

  var terms=[];
  if(dHap>0) terms.push('육합 '+dHap);
  if(dSam>0) terms.push('삼합 '+dSam);
  if(dBang>0) terms.push('방합 '+dBang);
  if(dChung>0) terms.push('충 '+dChung);
  if(dHyeong>0) terms.push('형 '+dHyeong);
  if(dPa>0) terms.push('파 '+dPa);
  return { total:total, sipName:sipName, group:grp, stageName:stageName,
    parts:{ eokbu:eokbu, branch:branchScore, yongsin:yong, stage:stage },
    branchTerms: terms.length ? terms.join(' · ') : '해당 없음' };
}
/* 9구간 전체의 강도 + 가장 큰 구간의 자리. 동점이면 이른 나이 쪽을 고른다. */
function daeunStrengthList(saju, dwList, counts, gangjak){
  var arr = dwList.map(function(it){
    var s = daeunStrengthOf(saju, it.ganji, counts, gangjak);
    s.startAge = it.startAge; s.endAge = it.startAge + 9; s.ganji = it.ganji;
    return s;
  });
  var bestIdx = 0;
  for(var i=1;i<arr.length;i++){ if(arr[i].total > arr[bestIdx].total) bestIdx = i; }
  return { list:arr, bestIdx:bestIdx };
}
/* 나이(가로) × 강도(세로) 선 그래프. 외부 라이브러리 없이 SVG를 직접 만든다.
   viewBox 고정 + width:100%라 320px에서도 그대로 줄어들 뿐 깨지지 않는다. */
function buildDaeunFlowSvg(str, curIdx, ageNow){
  var ns='http://www.w3.org/2000/svg';
  var W=340, H=200, padL=30, padR=12, padT=16, padB=34;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var arr=str.list, n=arr.length;
  var xOf=function(i){ return n<=1 ? padL+plotW/2 : padL + plotW*i/(n-1); };
  var yOf=function(v){ return padT + plotH*(1 - Math.max(0,Math.min(DAEUN_MAX_TOTAL,v))/DAEUN_MAX_TOTAL); };
  var mk=function(tag, attrs){
    var e=document.createElementNS(ns,tag);
    for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
    return e;
  };
  var best=arr[str.bestIdx], cur=arr[curIdx];
  var svg=mk('svg',{viewBox:'0 0 '+W+' '+H, width:'100%', role:'img',
    'aria-label':'나이별 대운 기운 강도 흐름 그래프입니다. 세로축은 '+DAEUN_MAX_TOTAL+'점 만점이고 '+arr[0].startAge+'세부터 '+arr[n-1].endAge+'세까지 '+n+'개 구간이에요. '+
      '가장 높은 구간은 '+best.startAge+'세~'+best.endAge+'세 '+best.total+'점, 지금 지나는 구간은 '+cur.startAge+'세~'+cur.endAge+'세 '+cur.total+'점이에요.'});
  var t=mk('title',{}); t.textContent='대운 기운 강도 흐름'; svg.appendChild(t);

  /* 가로 눈금 0·50·100 */
  [0, Math.round(DAEUN_MAX_TOTAL/2), DAEUN_MAX_TOTAL].forEach(function(v){
    var y=yOf(v);
    svg.appendChild(mk('line',{x1:padL, y1:y, x2:W-padR, y2:y, stroke:'rgba(35,31,24,.14)', 'stroke-width':1}));
    var lab=mk('text',{x:padL-6, y:y+3.5, 'text-anchor':'end', 'font-size':9, fill:'#544E40'});
    lab.textContent=String(v); svg.appendChild(lab);
  });

  /* 선 아래 옅은 면 */
  var dArea='M '+xOf(0)+' '+yOf(arr[0].total);
  for(var i=1;i<n;i++) dArea += ' L '+xOf(i)+' '+yOf(arr[i].total);
  dArea += ' L '+xOf(n-1)+' '+yOf(0)+' L '+xOf(0)+' '+yOf(0)+' Z';
  svg.appendChild(mk('path',{d:dArea, fill:'rgba(88,68,22,.10)', stroke:'none'}));

  /* 지금 나이 위치 — 구간 안에서의 비율만큼 보간해 세로 점선으로 표시 */
  var nowX=null;
  if(ageNow<=arr[0].startAge) nowX=xOf(0);
  else if(ageNow>=arr[n-1].startAge) nowX=xOf(n-1);
  else {
    var seg=curIdx, frac=(ageNow-arr[seg].startAge)/10;
    frac=Math.max(0,Math.min(1,frac));
    nowX = xOf(seg) + (xOf(Math.min(seg+1,n-1))-xOf(seg))*frac;
  }
  svg.appendChild(mk('line',{x1:nowX, y1:padT-4, x2:nowX, y2:padT+plotH, stroke:'#8F2413',
    'stroke-width':1.2, 'stroke-dasharray':'3 3', opacity:.85}));
  var nowLab=mk('text',{x:Math.max(padL+12, Math.min(W-padR-12, nowX)), y:padT-6, 'text-anchor':'middle', 'font-size':9, fill:'#8F2413'});
  nowLab.textContent='지금 '+ageNow+'세'; svg.appendChild(nowLab);

  /* 흐름선 */
  var pts=[]; for(var j=0;j<n;j++) pts.push(xOf(j)+','+yOf(arr[j].total));
  svg.appendChild(mk('polyline',{points:pts.join(' '), fill:'none', stroke:'#584416', 'stroke-width':2,
    'stroke-linejoin':'round', 'stroke-linecap':'round'}));

  /* 점 + 나이 라벨(칸이 좁아 한 칸 걸러 적되, 가장 큰 구간과 지금 구간은 반드시 적는다) */
  for(var k=0;k<n;k++){
    var isBest=(k===str.bestIdx), isCur=(k===curIdx);
    svg.appendChild(mk('circle',{cx:xOf(k), cy:yOf(arr[k].total), r:isBest?4.6:2.8,
      /* R29 — 점의 안쪽 색이 뒤집힌 자리. 예전엔 '어두운 배경색으로 속을 비운' 점이었는데,
         밝은 화면에서 #0d0d0f를 그대로 두면 검은 점이 박혀 가장 큰 구간과 구분이 안 된다. */
      fill:isBest?'#8C7134':'#FCFAF6', stroke:isCur?'#8F2413':'#584416', 'stroke-width':isCur?2:1.4}));
    if(k%2===0 || isBest || isCur){
      var ax=mk('text',{x:xOf(k), y:H-14, 'text-anchor':'middle', 'font-size':9, fill:'#544E40'});
      ax.textContent=arr[k].startAge+'세'; svg.appendChild(ax);
    }
  }
  /* 가장 큰 구간 표시 */
  var bx=Math.max(padL+16, Math.min(W-padR-16, xOf(str.bestIdx)));
  var bl=mk('text',{x:bx, y:Math.max(padT+9, yOf(best.total)-9), 'text-anchor':'middle', 'font-size':9.5, fill:'#584416'});
  bl.textContent='가장 큼'; svg.appendChild(bl);
  /* 축 이름. 나이 라벨 줄(y=H-14) 왼쪽에 두면 첫 칸('1세')과 글자가 겹친다(실측으로 확인) —
     한 줄 아래, 오른쪽 끝에 앉힌다. */
  var axisLab=mk('text',{x:W-padR, y:H-2, 'text-anchor':'end', 'font-size':8.5, fill:'#544E40'});
  axisLab.textContent='가로=나이 · 세로=기운 강도'; svg.appendChild(axisLab);
  return el('div',{class:'dw-flow'},[svg]);
}
/* =====================================================================
   R30 — 접이식 하나짜리 부품 (buildFoldPanel)
   ---------------------------------------------------------------------
   같은 접이식이 이미 두 곳(대운 강도 근거 · 궁합 근거)에 글자 단위로 복사돼 있었다.
   이번에 "계산 방법 자세히"를 접으면서 세 번째 사본을 만들지 않으려고, 그 두 곳이 쓰던
   모양·동작을 그대로 하나로 모았다. 바뀐 것은 없다 —
     · 버튼: .btn.btn-ghost.btn-block + aria-expanded + aria-controls + 방향 아이콘
     · 패널: .why-panel.hidden + role='region' + aria-label
     · 누르면 라벨이 바뀌고 아이콘이 위/아래로 뒤집힌다
   id를 안 주면 자동으로 붙인다. 같은 접이식이 화면에 둘 이상 뜰 수 있는 자리
   (진태양시 표는 내 사주 화면과 값 편집 시트에 동시에 존재할 수 있다)에서
   id가 겹치면 aria-controls가 엉뚱한 패널을 가리키기 때문이다.
===================================================================== */
var FOLD_SEQ = 0;
function buildFoldPanel(opts){
  var panelId = opts.id || ('fold'+(++FOLD_SEQ));
  var closedLabel = opts.label;
  var openedLabel = opts.openLabel || '접기';
  var label = el('span',{},[closedLabel]);
  var btn = el('button',{class:'btn btn-ghost btn-block', type:'button',
    'aria-expanded':'false','aria-controls':panelId,
    style: opts.btnStyle || 'margin-top:14px;'},[label, dirIcon('down')]);
  var panel = el('div',{id:panelId, class:'why-panel hidden', role:'region',
    'aria-label': opts.regionLabel || closedLabel});
  (opts.children||[]).forEach(function(c){ if(c) panel.appendChild(c); });
  btn.addEventListener('click', function(){
    var open = this.getAttribute('aria-expanded')==='true';
    this.setAttribute('aria-expanded', open?'false':'true');
    label.textContent = open ? closedLabel : openedLabel;
    this.replaceChild(dirIcon(open?'down':'up'), this.lastChild);
    panel.classList.toggle('hidden', open);
  });
  return { wrap: el('div',{},[btn, panel]), panel: panel, btn: btn };
}

/* 섹션11 "타 유형과의 궁합 경향" — 기존 MBTI_MATRIX를 그대로 재사용해 상위/하위 유형을 뽑고,
   정반대 유형(4지표 전부 반대)까지 함께 언급해 "2~3개 그룹으로 뭉뚱그려" 짧게 안내한다. 새 계산 없음. */
function buildMbtiCompatTrend(mbti){
  var scores = MBTI_TYPES.filter(function(t){ return t!==mbti; }).map(function(t){ return {t:t, s:MBTI_MATRIX[mbti][t]}; });
  scores.sort(function(a,b){ return b.s-a.s; });
  var top = scores.slice(0,3).map(function(x){ return x.t; });
  var bottom = scores.slice(-2).map(function(x){ return x.t; });
  var opposite = mbti.split('').map(function(l){
    var d = DIM_LETTERS.filter(function(pair){ return pair.indexOf(l)>=0; })[0];
    return d[0]===l ? d[1] : d[0];
  }).join('');
  return '경험상 <strong>'+top.join('·')+'</strong> 같은 유형과는 대화가 술술 풀리고 손발이 잘 맞는 편이고, <strong>'+bottom.join('·')+'</strong> 유형과는 처음엔 속도나 표현 방식이 달라 답답하게 느껴질 수 있어요. 특히 정반대 유형인 <strong>'+opposite+'</strong>와는 부딪히는 지점도 있지만 그만큼 배우는 것도 많은 조합이에요. 물론 이건 유형 하나만 놓고 본 일반적인 경향이고, 실제 궁합은 사주까지 함께 볼 때 훨씬 더 정확해지니 위쪽 \'궁합 보기\'에서 직접 확인해봐요.';
}
/* 기능6 buildReport13(profile, saju)와 동일한 패턴의 13섹션 리포트 생성 함수.
   profile.mbti만 조회 키로 쓰고 새 입력 UI는 만들지 않는다. */
function buildMbtiReport16(profile){
  var mbti = profile.mbti;
  var name = (profile.name||'').trim() || '너';
  var safeName = escapeHtml(name);
  var sym = MBTI_SYMBOL[mbti];
  var pb = MBTI_PB[mbti];
  function T(s){
    return s
      .replace(/\{n\}(은|는)/g, josa(safeName,'은','는'))
      .replace(/\{n\}(을|를)/g, josa(safeName,'을','를'))
      .replace(/\{n\}(이|가)/g, josa(safeName,'이','가'))
      .replace(/\{n\}(과|와)/g, josa(safeName,'과','와'))
      .replace(/\{n\}(이랑|랑)/g, josa(safeName,'이랑','랑'))
      .replace(/\{n\}/g, safeName);
  }
  function pick(sectionKey){ return MBTI_SUFFIX[sectionKey][djb2(name+mbti+sectionKey) % MBTI_SUFFIX[sectionKey].length]; }
  var intensity = (djb2(name+mbti+'opening')%2===0) ? 'typical' : 'mild';

  var sections=[];
  function add(id,title,iconPath,bodyHtml){ sections.push({id:id, title:title, icon:iconPath, body:bodyHtml}); }

  // 1. 오프닝
  add('m1','오프닝 · 한 문장 요약', MBTI_ICONS.star,
    '<p>'+josa(safeName,'은','는')+' <strong>'+sym.img+'</strong> 같은 사람이에요. '+TYPE_TAGLINE[mbti]+' — 이게 '+mbti+'인 '+josa(safeName,'을','를')+' 한 문장으로 요약한 말이에요.</p>'+
    '<p>'+T(MBTI_OPENING_INTENSITY[intensity])+'</p>'+
    '<p>지금부터 '+safeName+'의 MBTI 네 글자 안에 담긴 결을 하나씩 같이 짚어볼게.</p>');

  // 2. 핵심 성향 (4지표 각 한 줄, 기존 INDICATOR 재사용 + v4-B: 인지기능 스택으로 "왜 이런 순서로 행동하는지" 한 줄 추가)
  var indHtml = mbti.split('').map(function(l){ return '<p><strong>'+INDICATOR[l].title+'</strong> — '+INDICATOR[l].strength+'</p>'; }).join('');
  var cog = MBTI_COGFUNC[mbti];
  /* 괄호 뒤 조사는 괄호가 아니라 그 앞 한글 음절의 받침으로 갈린다.
     인지기능 이름은 '사고'(받침 없음)·'감각'·'직관'·'감정'(받침 있음)이 섞여 있어 고정하면 8유형이 틀린다. */
  indHtml += '<p>이 네 글자가 실제로 어떤 순서로 쓰이는지는 <strong>인지기능</strong>으로 더 정확히 볼 수 있어요. '+mbti+'인 '+josa(safeName,'은','는')+' <strong>'+cog[0]+'('+MBTI_FUNC_NAME[cog[0]]+')</strong>'+josaOnly(MBTI_FUNC_NAME[cog[0]],'을','를')+' 가장 먼저 꺼내 쓰고, <strong>'+cog[1]+'('+MBTI_FUNC_NAME[cog[1]]+')</strong>'+josaOnly(MBTI_FUNC_NAME[cog[1]],'으로','로')+' 그걸 받쳐주는 순서예요 — 이 조합이 앞으로 나올 강점과 약점, 스트레스 반응까지 다 이어져 있어요.</p>';
  add('m2','핵심 성향 · 네 글자 안의 결', MBTI_ICONS.wind, indHtml);

  // 3. 타고난 강점
  add('m3','타고난 강점', MBTI_ICONS.mountain, '<p>'+pb.strengths.join('</p><p>')+'</p><p>'+pick('strengths')+'</p>');

  // 4. 그림자 · 약점
  add('m4','그림자 · 솔직한 약점', MBTI_ICONS.river, '<p>'+pb.weakness+'</p><p>'+pick('weakness')+'</p>');

  // 5. 연애 스타일
  add('m5','연애 스타일', MBTI_ICONS.field,
    '<p>'+pb.love+'</p><p>'+pick('love')+'</p><p>더 정밀한 상대와의 궁합은 사주까지 함께 보는 \'궁합 보기\'에서 확인할 수 있어요.</p>');

  // 6. 직업 적성 · 커리어
  add('m6','직업 적성 · 커리어요', MBTI_ICONS.mountain, '<p>'+pb.career+'</p><p>'+pick('career')+'</p>');

  // 7. 금전관
  add('m7','금전관', MBTI_ICONS.river,
    '<p>'+pb.money+'</p><p>'+pick('money')+'</p><p>다만 큰돈이 오가는 결정은 이 풀이가 아니라 실제 상황과 전문가 조언을 먼저 참고해줘요 — 여긴 성향을 짚어보는 참고용이에요.</p>');

  // 8. 인간관계 패턴
  add('m8','인간관계 패턴', MBTI_ICONS.field, '<p>'+pb.relationship+'</p><p>'+pick('relationship')+'</p>');

  // 9. 스트레스 대처
  add('m9','스트레스 대처', MBTI_ICONS.wind, '<p>'+pb.stress+'</p><p>'+pick('stress')+'</p>');

  // 10. 성장 포인트
  add('m10','성장 포인트', MBTI_ICONS.star, '<p>'+pb.growth+'</p><p>'+pick('growth')+'</p>');

  // 11. 타 유형과의 궁합 경향 (MBTI_MATRIX 재사용, 새 계산 없음)
  add('m11','타 유형과의 궁합 경향', MBTI_ICONS.mountain, '<p>'+buildMbtiCompatTrend(mbti)+'</p>');

  // 12. 어울리는 활동 · 취미
  add('m12','어울리는 활동 · 취미', MBTI_ICONS.river, '<p>'+pb.activities+'</p><p>'+pick('activities')+'</p>');

  // 13. 클로징
  add('m13','클로징', MBTI_ICONS.field,
    '<p>'+pb.closing+'</p><p>'+pick('closing')+'</p>');

  return { sections: sections };
}

/* =====================================================================
   MBTI 미니 테스트 (v1 유지)
===================================================================== */
function computeMbtiFromAnswers(answers){
  var counts=[[0,0],[0,0],[0,0],[0,0]];
  answers.forEach(function(ansIdx, qIdx){
    var dim=MBTI_TEST_Q[qIdx].dim;
    counts[dim][ansIdx]++;
  });
  var result='';
  for(var d=0; d<4; d++){
    result += counts[d][0] >= counts[d][1] ? DIM_LETTERS[d][0] : DIM_LETTERS[d][1];
  }
  return result;
}

/* =====================================================================
   오늘의 운세 (v1 유지 + v2: 오늘 일진 + 합충 코멘트 반영)
===================================================================== */
function getTodayFortune(profile){
  var cacheKey = profile.id+'_'+todayStr();
  var cached = STATE.fortuneHistory.find(function(f){ return f.cacheKey===cacheKey; });
  if(cached) return cached;

  var seedBase = djb2(profile.mbti+(profile.name||'')+todayStr()+profile.id);
  var result = {id:uid(), cacheKey:cacheKey, profileId:profile.id, date:todayStr(), items:{}};
  FORTUNE_CATS.forEach(function(cat, ci){
    var seed = (seedBase + ci*97) >>> 0;
    var phrase = seededPick(seed, FORTUNE_PHRASES[cat.key]);
    var mbtiLetter = profile.mbti[ (seed>>>2) % 4 ];
    var flavor = MBTI_FLAVOR[mbtiLetter];
    var stars = 1 + (seed % 5);
    result.items[cat.key] = {label:cat.label, text:flavor+' '+phrase, stars:stars};
  });
  result.luckyItem = seededPick((seedBase+11)>>>0, LUCKY_ITEMS);
  result.luckyColor = seededPick((seedBase+23)>>>0, LUCKY_COLORS);

  // v2: 오늘의 실제 일진 + 원국과의 합충 반영 코멘트
  try{
    var now=new Date();
    var todayIdx = SajuEngine.dayPillarIndexForCivilDate(now.getFullYear(), now.getMonth()+1, now.getDate(), null);
    var todayGz = SajuEngine.ganjiOf(todayIdx);
    result.todayIljin = todayGz;
    var saju = getSajuResult(profile);
    if(saju){
      var branchList=[{idx:saju.year.branchIdx},{idx:saju.month.branchIdx},{idx:saju.day.branchIdx}];
      if(saju.hour) branchList.push({idx:saju.hour.branchIdx});
      var withToday = SajuEngine.branchRelations(branchList.concat([{idx:todayGz.branchIdx}]));
      var baseRel = SajuEngine.branchRelations(branchList);
      /* R23 — 예전에는 "원국과 합이 들어오는 날입니다"처럼 용어가 문장 한가운데 그냥 서 있었다.
         뜻을 앞에 풀어 쓰고 원래 용어는 괄호로 남긴다(지우지 않는다). 판정 조건은 그대로다. */
      if(withToday.chung.length>baseRel.chung.length){
        result.iljinComment = '오늘은 '+todayGz.text+'('+todayGz.textH+') 날이라, 타고난 여덟 글자 가운데 곁에 있는 사람 자리와 정면으로 부딪히는 기운이 들어옵니다. 마음이 붕 뜨거나 갑자기 계획이 틀어질 수 있으니 큰 결정은 하루 미루는 편이 좋습니다.';
      } else if(withToday.hap.length>baseRel.hap.length || withToday.samhap.length>baseRel.samhap.length){
        result.iljinComment = '오늘은 '+todayGz.text+'('+todayGz.textH+') 날이라, 타고난 여덟 글자와 짝이 맞아 떨어지는 기운이 들어옵니다. 사람이나 기회가 자연스럽게 다가올 수 있는 하루입니다.';
      } else {
        result.iljinComment = '오늘은 '+todayGz.text+'('+todayGz.textH+') 날입니다. 타고난 여덟 글자와 크게 부딪히는 기운은 없어서 평소 리듬대로 움직이면 무난합니다.';
      }
    }
  }catch(e){ /* 사주 계산 실패해도 기존 v1 운세는 그대로 표시 */ }

  STATE.fortuneHistory.unshift(result);
  if(STATE.fortuneHistory.length>200) STATE.fortuneHistory.length=200;
  saveState();
  return result;
}

/* =====================================================================
   v5-B 신규(기능19): 월별 올해 운세 — 새 계산 없이 기존 함수만 조합한다.
   (a) 월지-원국 합충 여부: SajuEngine.branchRelations 재사용(기존 iljinComment와 동일 패턴을 월 단위로 적용)
   (b) 월간-일간 십성 관계: SajuEngine.sipseongOf 재사용, 재성(정재/편재) 여부로 금전운 판정
   (c) 오행-장부: v5-A의 ELEM_ORGAN 룩업 재사용, 그 달 지지 오행이 원국의 가장 여린/진한 오행과 겹치는지로 건강운 판정
   (d) 현재 대운 상승기/준비기: isExpandingGroup(v5-A 로직과 동일한 groupCategory 기반) 재사용, 화면 상단에 1회만 안내

   ★ R13 — 상세 본문은 유료(saju_full)다. isOpen(month)가 false인 달은 items를 만들지 않고
     null로 돌려준다. "만들어 두고 화면에서만 가리는" 방식이면 개발자도구 한 번으로 새어 나가므로,
     잠긴 달의 문장은 이 함수 안에서 애초에 조립하지 않는다. 타일에 필요한 요약 지표
     (간지 · 총운 별점)는 무료 범위라 잠금과 무관하게 항상 계산한다.
===================================================================== */
function buildMonthlyFortune(profile, year, isOpen){
  var saju = getSajuResult(profile);
  if(!saju) return null;
  year = year || (new Date()).getFullYear();
  if(typeof isOpen !== 'function'){
    /* 호출부가 경계를 지정하지 않으면 가장 안전한 쪽(전부 잠김)으로 둔다.
       기본값을 "전부 열림"으로 두면, 새 호출부가 하나 생길 때마다 조용히 유료 본문이 샌다. */
    var _u = sajuDetailUnlocked();
    isOpen = function(){ return _u; };
  }
  var pillars = SajuEngine.monthlyPillarsOfYear(year);
  var dayStemIdx = saju.day.stemIdx;
  var branchList = [{idx:saju.year.branchIdx},{idx:saju.month.branchIdx},{idx:saju.day.branchIdx}];
  if(saju.hour) branchList.push({idx:saju.hour.branchIdx});
  var baseRel = SajuEngine.branchRelations(branchList);
  var elemInfo = dominantElementIdx(saju);
  var counts = elemInfo.counts;
  var weakestElem = counts.indexOf(Math.min.apply(null,counts));
  var mostElem = counts.indexOf(Math.max.apply(null,counts));

  // 현재 대운 상승기/준비기 안내(화면 상단 1회 — 대운은 원국 전체에 걸리는 흐름이라 달마다 반복하지 않는다)
  var daeunIntro = null;
  if(profile.gender){
    var dw = SajuEngine.daewoonList(saju.birthUTCms, profile.year, saju.year.stemIdx, SajuEngine.STEM_YY[saju.year.stemIdx], profile.gender, saju.month.idx);
    var ageNow = (new Date().getFullYear()) - profile.year + 1;
    var curIdx=0; for(var i=0;i<dw.list.length;i++){ if(ageNow>=dw.list[i].startAge) curIdx=i; }
    var cur = dw.list[curIdx];
    var curSip = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[cur.ganji.stemIdx], SajuEngine.STEM_YY[cur.ganji.stemIdx]);
    daeunIntro = isExpandingGroup(curSip)
      ? '지금 지나는 10년 흐름(대운)은 확장하고 도전하기 좋은 상승기입니다. 이번 해의 달들도 이 흐름 안에서 움직입니다.'
      : '지금 지나는 10년 흐름(대운)은 다지고 준비하기 좋은 시기입니다. 이번 해의 달들도 차분히 내실을 채우는 쪽에 무게가 실립니다.';
  }

  /* ── 1단계: 12개월의 "조회 키"만 먼저 계산한다 ──────────────────────────
     여기서 나오는 것은 전부 숫자·분류값(별점, 티어 이름)이다. 유료 본문 문장은 한 글자도 만들지 않는다.
     잠긴 달까지 티어를 계산하는 이유는 2단계의 인덱스 배분 때문이다 — 12개월 전체의 티어 분포를 알아야
     "같은 티어의 달끼리 서로 다른 문장"을 배분할 수 있고, 그래야 결제 전후로 미리보기 달의 문장이
     흔들리지 않는다(잠금 상태가 배분에 영향을 주지 않는다). */
  var dayBranchIdx = saju.day.branchIdx; // 일지 = 배우자궁(지식자료 §10 근묘화실)
  var seedBase = (profile.name||'') + profile.id + year;
  var previewMonth = monthlyPreviewMonth(year);
  var monthNums = [], meta = {};
  pillars.forEach(function(mp){
    var mStemIdx = mp.ganji.stemIdx, mBranchIdx = mp.ganji.branchIdx;
    var seed = djb2(seedBase + mp.month);
    monthNums.push(mp.month);

    // (a) 월지-원국 합충 → 총운
    var monthRel = SajuEngine.branchRelations(branchList.concat([{idx:mBranchIdx}]));
    var newChung = monthRel.chung.length>baseRel.chung.length;
    var newHap = monthRel.hap.length>baseRel.hap.length || monthRel.samhap.length>baseRel.samhap.length;

    // (b) 월간-일간 십성 → 금전운(재성이면 정재/편재로 갈라 보고, 그 외는 십성 그룹으로 본다) · 학업/직장운(십성 그룹)
    var monthSip = SajuEngine.sipseongOf(dayStemIdx, SajuEngine.STEM_ELEM[mStemIdx], SajuEngine.STEM_YY[mStemIdx]);
    var sipGroup = groupCategory(monthSip);

    /* (c) 월지 ↔ 일지(배우자궁) 관계 → 애정운.
       새 판정 로직을 만들지 않고 이미 있는 branchRelations()에 두 글자만 넣어 조회한다
       (합충 판정표가 두 벌이 되면 언젠가 서로 다른 답을 내게 된다). 인해처럼 육합과 파가 겹치는
       조합이 있으므로 육합 → 충 → 삼합 → 파 순으로 본다. */
    var pairRel = SajuEngine.branchRelations([{idx:mBranchIdx},{idx:dayBranchIdx}]);
    var loveTier;
    /* R16 — 월지와 일지가 같은 글자인 달은 'none'(관계 없음)이 아니라 별도 티어로 본다.
       같은 글자가 겹치는 것을 "얽히지 않는다"고 말하면 사실과 어긋난다. */
    if(mBranchIdx === dayBranchIdx) loveTier = 'same';
    else if(pairRel.hap.length) loveTier = 'hap';
    else if(pairRel.chung.length) loveTier = 'chung';
    else if(pairRel.samhap.length) loveTier = 'samhap';
    else if(pairRel.pa.length) loveTier = 'pa';
    else loveTier = 'none';

    // (d) 오행-장부 → 건강운(그 달 지지 오행이 원국에서 가장 여린/진한 오행과 겹치는지)
    var monthElem = SajuEngine.BRANCH_ELEM[mBranchIdx];

    meta[mp.month] = {
      mp: mp,
      /* 타일에 찍히는 총운 별점 — 무료 요약 지표라 잠금 여부와 무관하게 계산한다. */
      stars: 1+((seed+1)%5),
      seed: seed,
      total: newChung?'chung':(newHap?'hap':'none'),
      money: monthSip==='정재' ? 'jeongjae' : (monthSip==='편재' ? 'pyeonjae' : sipGroup),
      work: sipGroup,
      love: loveTier,
      elem: monthElem,
      health: (monthElem===weakestElem) ? 'weak' : (monthElem===mostElem ? 'most' : 'other')
    };
  });

  /* ── 2단계: 같은 티어의 달끼리 서로 다른 문구 인덱스를 나눠 갖게 배분한다 ── */
  function tierMap(field){ var t={}; monthNums.forEach(function(m){ t[m]=meta[m][field]; }); return t; }
  var idxTotal = assignPhraseIndexes(monthNums, tierMap('total'), MONTHLY_TOTAL_PHRASES, previewMonth, seedBase+'#total');
  var idxMoney = assignPhraseIndexes(monthNums, tierMap('money'), MONTHLY_MONEY_PHRASES, previewMonth, seedBase+'#money');
  var idxWork  = assignPhraseIndexes(monthNums, tierMap('work'),  MONTHLY_WORK_PHRASES,  previewMonth, seedBase+'#work');
  var idxLove  = assignPhraseIndexes(monthNums, tierMap('love'),  MONTHLY_LOVE_PHRASES,  previewMonth, seedBase+'#love');
  /* R16 — 건강운도 나머지 4항목과 같은 배분으로 통일했다.
     R14까지는 이 항목만 (offset + BRANCH_ELEM_RANK) % 6 으로 골랐는데, RANK가 토를 뺀 지지에서
     0·1 두 값뿐이라 12개월이 실질 8종 템플릿으로 수렴했다. 오행이 달라 {e}·{o}만 바뀐 문장들이
     서로 "절반 이상 같은 문장"이 되었고, 무료 미리보기 달과 유료 달 사이에서도 그 일이 생겼다.
     assignPhraseIndexes를 쓰면 ① 같은 상태의 달끼리 서로 다른 템플릿을 받고
     ② 미리보기 달의 인덱스가 예약되어 유료 달이 그 템플릿을 다시 쓰지 않는다. */
  var idxHealth = assignPhraseIndexes(monthNums, tierMap('health'), MONTHLY_HEALTH_LINES, previewMonth, seedBase+'#health');

  /* ── 3단계: 열려 있는 달만 실제 문장을 조립한다 ────────────────────────── */
  var months = pillars.map(function(mp){
    var m = meta[mp.month];
    /* ★ 잠긴 달은 여기서 끝. 아래 문장 조립을 통째로 건너뛴다. */
    if(!isOpen(mp.month)) return { month:mp.month, ganji:mp.ganji, stars:m.stars, items:null, locked:true };

    var hBank = MONTHLY_HEALTH_LINES[m.health];
    var healthText = fillElemOrgan(hBank[idxHealth[mp.month]], m.elem)
      + ' (전통 오행 이론에 기반한 참고용 근사이며 의학적 진단이 아닙니다.)';

    var items = {
      total: { label:'총운', stars: m.stars, text: MONTHLY_TOTAL_PHRASES[m.total][idxTotal[mp.month]] },
      love: { label:'애정운', stars: 1+((m.seed+2)%5), text: MONTHLY_LOVE_PHRASES[m.love][idxLove[mp.month]] },
      money: { label:'금전운', stars: 1+((m.seed+3)%5), text: MONTHLY_MONEY_PHRASES[m.money][idxMoney[mp.month]] },
      work: { label:'학업·직장운', stars: 1+((m.seed+4)%5), text: MONTHLY_WORK_PHRASES[m.work][idxWork[mp.month]] },
      health: { label:'건강운', stars: 1+((m.seed+5)%5), text: healthText }
    };
    return { month:mp.month, ganji:mp.ganji, stars:m.stars, items:items, locked:false };
  });

  return { year:year, daeunIntro:daeunIntro, months:months };
}

/* =====================================================================
   궁합 계산 (v1 MBTI/띠/오행 + v2 사주 정밀 궁합)
===================================================================== */
function computeCompat(pA, pB){
  var mbti = MBTI_MATRIX[pA.mbti][pB.mbti];
  var elem = elementScore(pA.elementIdx, pB.elementIdx);
  var zod = zodiacScore(pA.zodiacIdx, pB.zodiacIdx);
  var total = Math.round(mbti*0.5 + elem*0.3 + zod*0.2);
  total = Math.max(1, Math.min(100, total));
  var tier = total>=85?'최상':total>=70?'좋음':total>=55?'무난':total>=40?'노력필요':'상극주의';
  var cats = buildCompatCategories(total, mbti, elem, zod, pA, pB);
  var saju = buildSajuCompat(pA, pB);
  var combined = Math.round(mbti*0.4 + saju.score*0.4 + elem*0.1 + zod*0.1);
  combined = Math.max(1, Math.min(100, combined));
  var combinedTier = combined>=85?'찰떡 케미':combined>=70?'강한 케미':combined>=55?'무난한 케미':combined>=40?'엇갈린 케미':'상극 케미';
  return {total:total, tier:tier, mbtiScore:mbti, elemScore:elem, zodScore:zod, categories:cats,
    saju:saju, combined:combined, combinedTier:combinedTier};
}
/* =====================================================================
   R35 — "어떤 점이 잘 맞고 어디가 부딪히는지"를 근거를 대며 말한다 (대표님 지시)
   ---------------------------------------------------------------------
   예전에는 점수와 등급, 그리고 등급에 딸린 한 줄이 전부였다. 그래서 "왜 77점인지"를
   알 수 없었다. 여기서는 이미 계산해 둔 값만 가지고 그 이유를 사람 말로 되돌려 준다.

   ★ 새로 계산하지 않는다. MBTI 네 글자, 오행 관계(비화/상생/상극), 일지 관계(합/충),
     띠 점수 — 전부 computeCompat()이 이미 만든 값이다. 없는 근거를 지어내지 않는다.
   ★ 좋은 점만 늘어놓지 않는다. 부딪히는 자리를 함께 말해야 쓸모가 있다.
===================================================================== */
var MBTI_AXIS = [
  { i:0, same:['둘 다 사람들 속에서 기운을 얻는 편이라 함께 있는 시간이 자연스러워요.',
               '둘 다 혼자만의 시간으로 기운을 채우는 편이라, 서로의 조용한 시간을 이해해요.'],
        diff:'한 사람은 밖에서, 한 사람은 안에서 기운을 얻어요. 약속의 양과 쉬는 방식만 미리 맞춰두면 오히려 서로의 균형이 돼요.',
        goodWhenDiff:true },
  { i:1, same:['둘 다 지금 눈앞의 사실을 먼저 보는 편이라, 대화가 구체적이고 헛도는 일이 적어요.',
               '둘 다 그 너머의 가능성을 먼저 보는 편이라, 이야기가 잘 확장되고 서로의 상상을 재밌어해요.'],
        diff:'한 사람은 구체적인 사실을, 한 사람은 그 너머의 가능성을 먼저 봐요. 같은 이야기를 다른 층에서 하고 있을 때가 있으니 "지금 말하는 게 계획인지 느낌인지"를 짚어주면 좋아요.',
        goodWhenDiff:false },
  { i:2, same:['판단하는 기준이 비슷해서, 무언가를 정할 때 결론이 잘 모입니다.',
               '판단하는 기준이 비슷해서, 무언가를 정할 때 결론이 잘 모입니다.'],
        diff:'한 사람은 논리를, 한 사람은 사람의 마음을 먼저 봐요. 서로에게 없는 쪽을 채워주는 조합이라, 결정 전에 두 관점을 한 번씩 꺼내면 훨씬 단단해져요.',
        goodWhenDiff:true },
  { i:3, same:['일을 매듭짓는 속도가 비슷해서 서로 답답할 일이 적어요.',
               '일을 매듭짓는 속도가 비슷해서 서로 답답할 일이 적어요.'],
        diff:'한 사람은 정해두고 움직이고, 한 사람은 열어두고 움직여요. 계획을 세우는 쪽과 여지를 남기는 쪽이 만나면 일정만 합의해두면 잘 굴러가요.',
        goodWhenDiff:false }
];

/* 두 사람의 MBTI 네 글자를 축별로 견줘 "무엇이 같고 무엇이 다른지"를 문장으로 만든다. */
function mbtiAxisLines(a, b){
  var good = [], care = [];
  if(!a || !b || a.length!==4 || b.length!==4) return {good:good, care:care};
  MBTI_AXIS.forEach(function(ax){
    var ca = a[ax.i], cb = b[ax.i];
    if(ca === cb){
      /* 같은 축 — E/I는 어느 쪽인지에 따라 문장이 다르다. 나머지는 한 문장으로 충분하다. */
      var idx = (ax.i===0) ? (ca==='E'?0:1) : (ax.i===1 ? (ca==='S'?0:1) : 0);
      good.push(ax.same[idx]);
    } else {
      (ax.goodWhenDiff ? good : care).push(ax.diff);
    }
  });
  return {good:good, care:care};
}

/* 궁합 결과 하나를 받아 "잘 맞는 점 / 조심할 점"을 만든다. 근거는 전부 이미 계산된 값이다. */
function buildPairReasons(pA, pB, res){
  var good = [], care = [];
  var A = pA.name || '이쪽', B = pB.name || '상대방';

  /* ① MBTI 네 축 */
  var ax = mbtiAxisLines(pA.mbti, pB.mbti);
  good = good.concat(ax.good);
  care = care.concat(ax.care);
  if(pA.mbti && pA.mbti === pB.mbti){
    good.unshift('둘 다 '+pA.mbti+'예요. 말하지 않아도 통하는 대목이 많은 대신, 같은 약점도 함께 가지고 있으니 서로가 서로의 거울이 되기 쉬워요.');
  }

  /* ② 오행 — 사주에서 두 사람의 일간이 어떤 관계인지 */
  var st = res.saju && res.saju.elemTerm ? res.saju.elemTerm : '';
  if(/상생/.test(st)){
    good.push(res.saju.elemRel + ' 한쪽이 애쓰지 않아도 기운이 흐르는 방향이라, 오래 볼수록 편해지는 조합이에요.');
  } else if(/비화/.test(st)){
    good.push(res.saju.elemRel + ' 결이 닮아 처음부터 말이 잘 통하는 대신, 부족한 부분도 같이 비어 있을 수 있어요.');
  } else if(/상극/.test(st)){
    care.push(res.saju.elemRel + ' 서로를 자극하는 기운이라 짧게는 재밌고 길게는 지칠 수 있어요. 다툰 날은 결론을 미루고 하루 자고 이야기하는 편이 좋아요.');
  }

  /* ③ 일지 — 태어난 날의 아래 글자끼리 맺는 관계.
     ★ 값은 '육합' / '충' / '해당 없음' 세 가지뿐이다. 처음에 /충|형|파|해/ 로 걸렀더니
       '해당 없음'의 "해"가 걸려서 관계가 없는 사람에게 "부딪히는 관계"라고 말했다.
       부분 일치로 뜻을 판정하지 않는다 — 값을 그대로 비교한다. */
  var bt = res.saju && res.saju.branchTerm ? res.saju.branchTerm : '';
  if(bt === '육합'){
    good.push('태어난 날의 아래 글자끼리 짝을 이루는 관계(육합)예요. 가까이 지낼수록 편해지고, 사소한 일에도 손발이 맞는 편이에요.');
  } else if(bt === '충'){
    care.push('태어난 날의 아래 글자끼리 정면으로 부딪히는 관계(충)예요. 생활 리듬이나 속도가 어긋나기 쉬우니, 함께 지내는 시간을 미리 정해두면 훨씬 나아요.');
  }

  /* ④ 띠 — 점수대만 말한다. 근거가 얕은 항목이라 강하게 말하지 않는다. */
  if(typeof res.zodScore === 'number'){
    if(res.zodScore >= 85) good.push('띠로 봐도 서로 받쳐주는 자리예요.');
    else if(res.zodScore <= 40) care.push('띠로 보면 결이 어긋나는 자리예요. 다만 이건 참고 정도로만 봐주세요.');
  }

  /* ⑤ 아무것도 안 걸렸을 때 — 빈칸으로 두지 않는다 */
  if(!good.length) good.push('크게 튀는 자리는 없지만, 그만큼 부딪힐 일도 적은 무던한 조합이에요.');
  if(!care.length) care.push('눈에 띄는 갈등 요소는 없어요. 다만 사소한 습관 차이는 미리 이야기해두면 좋아요.');

  return {good:good, care:care, A:A, B:B};
}

/* 화면에 그린다. 1:1 결과와 그룹 쌍별 상세가 같은 함수를 쓴다 —
   두 곳이 서로 다른 설명을 내놓지 않게 하려면 만드는 자리가 하나여야 한다. */
function buildPairReasonBlock(pA, pB, res, compact){
  var r = buildPairReasons(pA, pB, res);
  var box = el('div',{class: compact ? '' : 'scroll-card'});
  if(!compact) box.appendChild(el('h3',{},['왜 이런 점수가 나왔을까']));
  var g = el('div',{style:'margin-top:6px;'});
  g.appendChild(el('p',{class:'cm-label', style:'margin:0 0 4px;'},['잘 맞는 점']));
  var gu = el('ul',{class:'reason-list'});
  r.good.slice(0,4).forEach(function(t){ gu.appendChild(el('li',{},[t])); });
  g.appendChild(gu);
  box.appendChild(g);
  var c = el('div',{style:'margin-top:12px;'});
  c.appendChild(el('p',{class:'cm-label', style:'margin:0 0 4px;'},['조심하면 좋은 점']));
  var cu = el('ul',{class:'reason-list'});
  r.care.slice(0,3).forEach(function(t){ cu.appendChild(el('li',{},[t])); });
  c.appendChild(cu);
  box.appendChild(c);
  return box;
}

function tierText(score, high, mid, low){
  if(score>=75) return high; if(score>=50) return mid; return low;
}
/* 케미 한 줄만 따로 뽑아 둔다. 이 한 줄은 무료 범위라(요약 화면에 그대로 나온다) 잠긴
   기록을 열 때도 필요한데, 그 자리에서 buildCompatCategories()를 부르면 유료 문장까지
   함께 만들어진다. 문구를 복사해 두 벌로 만들지 않기 위해 함수로 나눈다. */
function compatChemistryLine(mbti){
  return tierText(mbti,
    '함께 있을 때 시너지가 크게 나는 케미입니다.',
    '합을 맞춰가는 과정 자체가 즐거운 조합입니다.',
    '처음엔 어색해도 시간이 지나며 합이 맞아갑니다.');
}
function buildCompatCategories(total, mbti, elem, zod, pA, pB){
  var love = tierText(total,
    '서로에게 자연스럽게 끌리는 좋은 흐름입니다. 표현에 솔직해질수록 관계가 깊어집니다.',
    '천천히 알아갈수록 매력이 드러나는 사이입니다. 서두르지 않는 편이 좋습니다.',
    '초반엔 결이 달라 보일 수 있지만, 서로의 차이를 인정하면 특별한 관계가 됩니다.');
  var friend = tierText((mbti+zod)/2,
    '함께 있으면 편안하고 대화가 끊이지 않는 조합입니다.',
    '관심사가 다를 수 있지만 서로에게 새로운 시야를 열어줍니다.',
    '가치관 차이로 부딪힐 수 있으니 서로의 방식을 존중해야 합니다.');
  var chemistry = compatChemistryLine(mbti);
  var conflictParts=[];
  if(elem<60) conflictParts.push('두 사람의 기운이 부딪히기 쉬우니 감정이 격해질 때 한 박자 쉬어가세요.');
  if(mbti<60) conflictParts.push('성향 차이로 오해가 생기기 쉬우니 결론보다 과정을 자주 공유하세요.');
  if(zod<60) conflictParts.push('생활 리듬이나 속도 차이가 갈등의 씨앗이 될 수 있습니다.');
  if(conflictParts.length===0) conflictParts.push('큰 갈등 요소는 적지만, 사소한 습관 차이는 미리 이야기해두면 좋습니다.');
  return {love:love, friend:friend, chemistry:chemistry, conflict:conflictParts.join(' ')};
}
/* v2: 사주 정밀 궁합 — 두 사람의 일간 오행 상생상극 + 일지 합충 + 십성 상호작용 */
function buildSajuCompat(pA, pB){
  if(!pA.saju || !pB.saju) return {score:60, elemRel:'정보 부족', branchRel:'정보 부족', comment:'두 사람 모두 사주 계산이 준비되면 더 정밀한 궁합을 볼 수 있습니다.',
    /* R21 — 아래 네 값은 점수 계산에 쓰이지 않는다. 요약 화면의 "일상어 항목별 지표"가
       무엇을 그리는지 알 수 있게 이미 계산된 중간값을 그대로 내보내는 것뿐이다. */
    elemScore60:60, branchScore:60, elemTerm:'정보 부족', branchTerm:'정보 부족'};
  var aElem = SajuEngine.STEM_ELEM[pA.saju.day.stemIdx], bElem = SajuEngine.STEM_ELEM[pB.saju.day.stemIdx];
  var aStem = SajuEngine.STEMS[pA.saju.day.stemIdx], bStem = SajuEngine.STEMS[pB.saju.day.stemIdx];
  var aElemName = SajuEngine.ELEM_NAMES[aElem], bElemName = SajuEngine.ELEM_NAMES[bElem];
  var nameA = pA.name || '이쪽', nameB = pB.name || '상대방';
  var diff = ((bElem-aElem)%5+5)%5;
  var elemScore60, elemRel, elemDetail, elemTerm;
  /* elemRel  = 무료 요약 화면(궁합 요약 "사주 관점 한 줄 요약")에 쓰는 한 줄.
     elemDetail = 유료 상세 화면 전용. 두 사람의 실제 일간 글자와 오행을 짚고,
                  그 관계가 생활에서 어떻게 드러나는지까지 이어서 쓴다.
     ★ 두 값이 같은 문장이면 결제한 사람이 첫 카드에서 방금 무료로 읽은 문장을 다시 본다.
        (직전 라운드에 실제로 그랬다.) 절대 같은 문자열을 쓰지 않는다. */
  /* ★ 이름과 오행 글자가 문장 안에 들어가므로 조사를 고정으로 쓰면 반드시 틀린다
     ("토이 금을", "상대방가 주고"). 받침 판정은 josaOnly()로 한다. */
  var stemLine = nameA+'의 일간은 '+aStem+'('+aElemName+'), '+nameB+'의 일간은 '+bStem+'('+bElemName+')'+
                 josaOnly(bElemName,'이에요','예요')+'. ';
  if(diff===0){
    elemScore60=70; elemTerm='비화(같은 오행)'; elemRel='비화(같은 기운) — 편하지만 닮은 단점도 함께 보일 수 있습니다';
    elemDetail = stemLine+'같은 '+aElemName+' 기운을 나눠 가진 사이라, 설명하지 않아도 통하는 대목이 많습니다. '+
      '다만 강점이 겹치는 만큼 약점도 겹칩니다 — 둘 다 미루는 일, 둘 다 피하는 대화가 있으면 그 자리는 끝내 비어 있게 됩니다. '+
      '역할을 일부러 나눠 맡고, 한쪽이 싫어하는 일을 다른 쪽이 대신 해주는 규칙을 만들어 두면 이 조합의 약점이 거의 사라집니다.';
  } else if(diff===1){
    elemScore60=95; elemTerm='상생(내가 상대를 생함)'; elemRel='상생(내가 상대를 북돋는 관계) — 서로를 자연스럽게 살려주는 흐름입니다';
    elemDetail = stemLine+aElemName+josaOnly(aElemName,'이','가')+' '+bElemName+josaOnly(bElemName,'을','를')+
      ' 낳는 자리라, '+nameA+josaOnly(nameA,'이','가')+' 주고 '+nameB+josaOnly(nameB,'이','가')+' 받는 흐름이 자연스럽습니다. '+
      '이 방향은 관계 초반에 특히 편안하게 느껴집니다. 대신 오래되면 한쪽만 계속 주는 구도로 굳기 쉬우니, '+
      nameB+josaOnly(nameB,'이','가')+' 받은 것을 말로 돌려주는 습관이 이 조합의 수명을 결정합니다.';
  } else if(diff===4){
    elemScore60=90; elemTerm='상생(상대가 나를 생함)'; elemRel='상생(상대가 나를 북돋는 관계) — 기대지 않아도 자연스럽게 도움을 주고받습니다';
    elemDetail = stemLine+bElemName+josaOnly(bElemName,'이','가')+' '+aElemName+josaOnly(aElemName,'을','를')+
      ' 낳는 자리라, '+nameB+josaOnly(nameB,'이','가')+' 주고 '+nameA+josaOnly(nameA,'이','가')+' 받는 흐름이 자연스럽습니다. '+
      nameA+josaOnly(nameA,'은','는')+' 이 관계에서 유난히 일이 잘 풀린다고 느낄 텐데, 그건 운이 아니라 상대가 대주고 있는 몫입니다. '+
      '그 사실을 알아차리고 말로 표현하는 순간부터 관계가 한 단계 더 단단해집니다.';
  } else {
    elemScore60=45; elemTerm='상극(서로 극함)'; elemRel='상극(서로 부딪히는 기운) — 자극이 되기도 하지만 의식적으로 배려가 필요합니다';
    elemDetail = stemLine+'두 오행이 서로를 누르는 자리라, 같은 사안을 봐도 먼저 눈에 들어오는 지점이 다릅니다. '+
      '그래서 상대의 지적이 유난히 아프게 느껴지는데, 사실 그건 내가 놓친 자리를 정확히 짚었기 때문인 경우가 많습니다. '+
      '결론을 먼저 맞추려 하지 말고 각자 무엇을 보고 있는지부터 꺼내 놓으면, 상극은 곧바로 가장 좋은 감시자 관계로 바뀝니다.';
  }
  var relBranch = SajuEngine.branchRelations([{idx:pA.saju.day.branchIdx},{idx:pB.saju.day.branchIdx}]);
  var branchScore, branchRel, branchTerm;
  if(relBranch.hap.length>0){ branchScore=90; branchTerm='육합'; branchRel='일지 육합 — 생활 리듬이 잘 맞는 편입니다'; }
  else if(relBranch.chung.length>0){ branchScore=40; branchTerm='충'; branchRel='일지 충 — 서로 다른 리듬 탓에 부딪히는 순간이 잦을 수 있습니다'; }
  else { branchScore=65; branchTerm='해당 없음'; branchRel='특별한 합충 없음 — 무난하게 맞춰가는 관계입니다'; }
  var score = Math.round(elemScore60*0.6 + branchScore*0.4);
  var sipA = SajuEngine.sipseongOf(pA.saju.day.stemIdx, bElem, SajuEngine.STEM_YY[pB.saju.day.stemIdx]);
  var comment = sipA+' 관계에 가까워서, '+groupCategory(sipA)+' 기운으로 서로를 자극하거나 채워주는 조합입니다.';
  /* R21 — elemScore60 / branchScore / elemTerm / branchTerm 네 개를 함께 내보낸다.
     ★ score 계산식(위 한 줄)은 한 글자도 바뀌지 않았다. 이미 이 함수 안에서 만들어 쓰고 있던
       중간값을 밖에서도 읽을 수 있게 노출할 뿐이다 — 요약 화면의 일상어 막대가 이 값을 그린다.
       (표현을 바꾸느라 계산을 바꾸면 예전에 본 궁합 점수가 전부 달라진다.) */
  return {score:score, elemRel:elemRel, elemDetail:elemDetail, branchRel:branchRel, comment:comment,
    elemScore60:elemScore60, branchScore:branchScore, elemTerm:elemTerm, branchTerm:branchTerm};
}

/* =====================================================================
   R21 — 궁합을 "일상어 항목별 지표"로 보여주기 위한 표시 전용 계층
   ---------------------------------------------------------------------
   ★ 계산은 한 줄도 바뀌지 않았다. computeCompat()이 이미 내놓는 하위 점수를 그대로 읽어
     사람 말로 이름을 붙이고 막대로 그릴 뿐이다. 아래가 항목 ↔ 계산 대응표다(추적용).

   | 화면에 보이는 항목       | 실제 값            | 그 값이 나온 계산                                        |
   |--------------------------|--------------------|----------------------------------------------------------|
   | 대화가 잘 통해요          | res.mbtiScore      | MBTI_MATRIX[A][B] — 4지표 일치/보완 가중 (30~98)          |
   | 서로 부족한 걸 채워줘요   | res.saju.elemScore60 | 두 사람 '일간(日干)'의 오행 관계. 상생95/90·비화70·상극45 |
   | 하루 생활 리듬이 맞아요   | res.saju.branchScore | 두 사람 '일지(日支)'의 육합90 / 무관65 / 충40             |
   | 곁에 있으면 편안해요      | res.elemScore      | elementScore() — 원국에서 가장 진한 오행끼리 상생92/같음75/상극40 |
   | 티격태격해도 금방 풀려요  | res.zodScore       | zodiacScore() — 띠 사이 거리. 삼합각(4칸)90 / 충(6칸)35 등 |

   종합 점수(res.combined)는 이 중 넷을 MBTI 0.4 · 사주 0.4 · 오행 0.1 · 띠 0.1로 합친 값이고,
   그 식 역시 computeCompat() 안의 기존 코드 그대로다.
   ※ '서로 부족한 걸 채워줘요'와 '하루 생활 리듬'을 합쳐 0.6:0.4로 묶은 것이 res.saju.score다.
===================================================================== */
var COMPAT_METRICS = [
  { key:'talk', label:'대화가 잘 통해요', src:'성격 유형',
    pick:function(r){ return r.mbtiScore; },
    words:['말이 잘 통하는 편이에요','대화의 결이 무난히 맞아요','말이 어긋날 때가 있어요'] },
  { key:'fill', label:'서로 부족한 걸 채워줘요', src:'사주 · 타고난 기운',
    pick:function(r){ return r.saju.elemScore60; },
    words:['한쪽이 비면 다른 쪽이 채워줘요','있는 그대로 편한 사이예요','서로 눌러 지치게 할 수 있어요'] },
  { key:'rhythm', label:'하루 생활 리듬이 맞아요', src:'사주 · 생활 자리',
    pick:function(r){ return r.saju.branchScore; },
    words:['같이 지내는 하루가 잘 맞아요','맞춰가면 무난한 편이에요','생활 속도가 어긋나기 쉬워요'] },
  { key:'calm', label:'곁에 있으면 편안해요', src:'사주 · 기운 균형',
    pick:function(r){ return r.elemScore; },
    words:['같이 있으면 기운이 편해요','무난하게 지낼 수 있어요','오래 붙어 있으면 지칠 수 있어요'] },
  { key:'heal', label:'티격태격해도 금방 풀려요', src:'태어난 해(띠)',
    pick:function(r){ return r.zodScore; },
    words:['다퉈도 오래 끌지 않는 편이에요','풀리는 데 시간이 조금 걸려요','한 번 어긋나면 길어질 수 있어요'] }
];
/* 값 → 한마디. 점수를 바꾸는 게 아니라 이미 나온 점수에 말을 붙이는 것뿐이다. */
function compatMetricWord(m, v){ return v>=75 ? m.words[0] : (v>=50 ? m.words[1] : m.words[2]); }
/* R29 — 세 단계 전부 불투명 색으로 바꿨다. 예전 가운데 단계는 금색 55% 투명이었는데,
   밝은 홈(--track) 위에 얹으면 2:1대로 떨어져 막대가 있는지도 안 보인다. */
function compatBarColor(v){ return v>=75 ? 'var(--gold)' : (v>=50 ? '#8C7134' : '#B4442C'); }
/* 종합 점수 한 줄 — 등급(combinedTier)에서만 고른다. 새 판정이 아니다. */
var COMPAT_TIER_LINE = {
  '찰떡 케미':'설명하지 않아도 통하는 대목이 많은 사이예요. 잘 맞는 만큼, 당연하게 여기지만 않으면 오래 가요.',
  '강한 케미':'서로 다른 부분이 오히려 잘 물리는 사이예요. 맞춰가는 재미가 있는 조합이에요.',
  '무난한 케미':'첫인상보다 지낼수록 편해지는 쪽이에요. 급하게 결론 내지 않는 편이 좋아요.',
  '엇갈린 케미':'가만히 두면 어긋나기 쉬운 대신, 말로 맞추면 눈에 띄게 좋아지는 사이예요.',
  '상극 케미':'결이 많이 다른 조합이에요. 서로 다르다는 걸 인정하는 데서 출발하면 훨씬 수월해져요.'
};
function buildCompatMetricBars(res){
  var list = el('div',{class:'cm-list'});
  COMPAT_METRICS.forEach(function(m){
    var raw = m.pick(res);
    /* 옛 히스토리 기록처럼 하위 점수가 없는 자료는 이 항목만 건너뛴다(0으로 그리면 거짓말이 된다). */
    if(raw===null || raw===undefined || isNaN(raw)) return;
    var v = Math.max(0, Math.min(100, Math.round(raw)));
    var row = el('div',{class:'cm-row'});
    row.appendChild(el('div',{class:'cm-head'},[
      el('span',{class:'cm-label'},[m.label]),
      el('span',{class:'cm-num','aria-hidden':'true'},[v+'점']) ]));
    /* 막대는 그림이라 role='img' + 수치를 담은 aria-label을 준다. 옆의 숫자는 같은 값을
       두 번 읽지 않도록 aria-hidden으로 감춘다(라벨·한마디는 실제 글자로 읽힌다). */
    row.appendChild(el('div',{class:'cm-track', role:'img',
      /* ★ R32 — 예전에는 "(0~100 눈금)"이라고 읽어 줬다. 그런데 실제 도달 범위는
         성격 30~98 · 오행 45~95 · 지지 40~90 · 띠 35~90이라, 낭독기 사용자는
         닿지도 않는 0과 100을 양 끝으로 듣게 된다(검수가 R24부터 6라운드째 지적한 자리).
         "100점 기준"은 눈금의 기준만 말하고 도달 범위를 약속하지 않으므로 사실과 어긋나지 않는다.
         바로 옆 대운 막대가 이미 "(98점 만점)"으로 정확하게 말하고 있어 표현도 같은 결이 된다. */
      'aria-label':m.label+' '+v+'점 (100점 기준)'},[
      el('div',{class:'cm-fill', style:'width:'+v+'%;background:'+compatBarColor(v)+';'}) ]));
    row.appendChild(el('div',{class:'cm-foot'},[
      el('span',{class:'cm-verdict'},[compatMetricWord(m, v)]),
      el('span',{class:'cm-src'},[m.src]) ]));
    list.appendChild(row);
  });
  return list;
}
/* 접이식 "왜 이런 결과가 나왔나요?" — 예전 요약 화면에 그대로 노출돼 있던 용어(합충·십성·간지·
   사주팔자 표)를 지우지 않고 여기로 옮겼다. 아는 사람에게는 이게 근거이기 때문이다.
   ★ 유료 상세 문장(elemDetail·branchRel·comment·연애/우정/갈등)은 여기에 넣지 않는다.
     여기 들어가는 것은 용어 이름과 이미 무료였던 한 줄 요약뿐이다. */
function buildCompatWhyPanel(p, r){
  var fold = buildFoldPanel({id:'compatWhy', label:'왜 이런 결과가 나왔나요?', openLabel:'근거 접기',
    regionLabel:'궁합 계산 근거'});
  var panel = fold.panel;

  panel.appendChild(el('h4',{},['항목마다 무엇을 계산했나요']));
  /* R30 — 한 줄에 용어 버튼이 넷까지 들어가 있었다("두 사람 일간(日干) 오행 — 비화(같은 오행)").
     값은 그대로 두고 앞머리만 일상어로 바꾼다. 뒤에 붙는 용어(비화·육합 등)는 계산 결과라 남긴다. */
  var rows = [
    ['대화가 잘 통해요', r.pA.mbti+' × '+r.pB.mbti+' 유형 대조 · '+r.res.mbtiScore+'점'],
    ['서로 부족한 걸 채워줘요', '태어난 날의 윗글자끼리 — '+(r.res.saju.elemTerm||'정보 부족')+' · '+(r.res.saju.elemScore60!=null?r.res.saju.elemScore60+'점':'—')],
    ['하루 생활 리듬이 맞아요', '태어난 날의 아랫글자끼리 — '+(r.res.saju.branchTerm||'정보 부족')+' · '+(r.res.saju.branchScore!=null?r.res.saju.branchScore+'점':'—')],
    ['곁에 있으면 편안해요', '여덟 글자 중 가장 진한 기운 '+r.pA.element+' × '+r.pB.element+' · '+r.res.elemScore+'점'],
    ['티격태격해도 금방 풀려요', '띠 '+r.pA.zodiac+' × '+r.pB.zodiac+' · '+r.res.zodScore+'점']
  ];
  rows.forEach(function(kv){
    panel.appendChild(el('div',{class:'why-row'},[
      el('span',{class:'why-k'},[kv[0]]), el('span',{class:'why-v'},[kv[1]]) ]));
  });
  panel.appendChild(el('p',{class:'why-note'},['종합 점수는 성격(MBTI) 40% · 사주 40% · 다섯 기운 10% · 띠 10%로 합쳐요. 사주 점수는 태어난 날 윗글자끼리의 관계 60%와 아랫글자끼리의 관계 40%를 합한 값이에요.']));

  panel.appendChild(el('h4',{},['사주 용어로 보면']));
  panel.appendChild(el('p',{class:'why-note', style:'margin-top:2px;'},[r.res.saju.elemRel]));

  /* ★ R27 — 한쪽만 시간을 모르면 기둥이 4개와 3개로 갈려, 두 사람의 같은 항목이 서로 다른
     자리에 섰다(320px에서 세로로 접히면 특히 어긋난다). 이제 한 사람이라도 시주가 있으면
     양쪽 다 네 칸으로 그리고, 없는 쪽은 "시간 모름"으로 자리를 비워 둔다.
     양쪽 다 모르면 둘 다 세 칸이라 원래 맞으므로 빈 칸을 만들지 않는다(자리 표시가 두 번 뜨면 지저분하다).
     안내 문장도 표마다 붙이지 않고 아래 한 줄로만 적는다 — 같은 말을 두 번 하지 않기 위해서다. */
  if(r.pA.saju && r.pB.saju){
    var aHour = !!r.pA.saju.hour, bHour = !!r.pB.saju.hour;
    var anyHour = aHour || bHour;
    panel.appendChild(el('h4',{},['두 사람의 사주팔자']));
    panel.appendChild(el('div',{class:'compat-pair'},[
      el('div',{class:'compat-side'},[el('h4',{},[p.name]),
        buildPillarTable(r.pA.saju, {keepHourSlot:anyHour, noNote:true})]),
      el('div',{class:'compat-side'},[el('h4',{},[r.pB.name]),
        buildPillarTable(r.pB.saju, {keepHourSlot:anyHour, noNote:true})])
    ]));
    if(!aHour || !bHour){
      panel.appendChild(el('p',{class:'why-note'},[ (!aHour && !bHour)
        ? '두 분 다 태어난 시간을 몰라서, 시주 없이 세 기둥만 놓고 봤어요.'
        : (aHour ? r.pB.name : p.name)+'님은 태어난 시간을 몰라서 시주 칸을 비워 뒀어요. 비워 둔 칸은 계산에서도 빠져 있어요.' ]));
    }
  }

  return fold.wrap;
}
