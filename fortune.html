      body.appendChild(el('p',{class:'section-sub'},[valueFull]));
      body.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:6px;', onclick:function(){
        closeModal(); STATE.activeId=p.id; saveState(); render();
      }},['이 프로필로 전환']));
      body.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:8px;', onclick:function(){
        closeModal(); startSetupWizard(p);
      }},['정보 수정']));
      body.appendChild(el('button',{class:'btn btn-ghost btn-block', style:'margin-top:8px;color:var(--red-hi);border-color:rgba(143,36,19,.4);', onclick:function(){
        closeModal();
        confirmModal(p.name+' 프로필을 삭제할까요? 관련 기록은 유지됩니다.', function(){
          STATE.profiles = STATE.profiles.filter(function(x){return x.id!==p.id;});
          if(STATE.activeId===p.id){ STATE.activeId = STATE.profiles.length? STATE.profiles[0].id : null; }
          saveState(); render();
          showToast('프로필을 삭제했습니다.');
        });
      }},['프로필 삭제']));
      openModal(p.name+' 프로필', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
    }, rowChip));
  });

  view.appendChild(circleCTA(CTA_ICON.plus, '새 프로필 추가', function(){ startSetupWizard(null); }));
  /* R23 — 용어 사전 입구. 무료이고, 여기서도 바로 갈 수 있어야 "이 앱이 처음인 사람이 갈 곳"이 된다. */
  view.appendChild(settingsRow('사주 용어 사전', '어려운 말을 쉬운 말로', function(){ openGlossary(null); }));
  /* ★ R58 — '약관 · 사업자 정보' 카드를 뺐다(대표님 지시).
     같은 내용이 모든 화면 맨 아래(buildSiteFooter)에 이미 있다 —
     이용약관·개인정보처리방침 버튼과 법인명·대표·사업자등록번호·통신판매업신고·
     주소·연락처가 전부 거기 들어 있다. 설정에만 한 번 더 두면 같은 말을 두 번 하는 셈이고,
     전자상거래법 제13조 표시의무는 푸터 쪽만으로도 충족된다.
     ★ 지운 것은 '중복된 자리'이지 '내용'이 아니다. 하나라도 빠졌으면 위반이 되므로
       푸터에 무엇이 들어 있는지 확인한 뒤에 뺐다. */
  main.appendChild(autoTermify(view));
}

/* =====================================================================
   공유 카드 (Canvas) — v1 유지 + 사주풀이/궁합요약 카드 신규
===================================================================== */
function openShareModal(kind, profile, data){
  var body=el('div',{});
  var canvas=document.createElement('canvas');
  /* R19 — 캐릭터가 들어가는 카드는 아래쪽에 그림 자리를 두느라 100px 더 길다.
     '오늘의 운세' 카드는 본문(4개 영역 × 여러 줄)이 이미 아래까지 차서 그림을 넣지 않는다. */
  canvas.width=640; canvas.height = SHARE_CARD_WITH_CHAR[kind] ? 860 : 800;
  drawShareCard(canvas, kind, profile, data);
  /* R62 — 캐릭터 그림은 파일이라 늦게 도착할 수 있다. 오면 카드를 다시 그린다. */
  shareCardCharKeys(kind, profile, data).forEach(function(ck){
    charImage(ck, function(){ drawShareCard(canvas, kind, profile, data); });
  });
  var preview=el('div',{class:'share-preview'},[canvas]);
  body.appendChild(preview);
  var btnRow=el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;'});
  btnRow.appendChild(el('button',{class:'btn btn-primary btn-sm', onclick:function(){
    canvas.toBlob(function(blob){
      if(!blob){ showToast('이미지 생성에 실패했습니다.'); return; }
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download='inyeonjeom_'+kind+'_'+todayStr()+'.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      trackTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast('이미지를 저장했습니다.');
    }, 'image/png');
  }},['이미지로 저장']));
  btnRow.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:function(){
    var text = buildShareText(kind, profile, data);
    copyText(text);
  }},['텍스트 복사']));
  body.appendChild(btnRow);
  openModal('결과 공유하기', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);

  /* 카드 저장 경로도 기록을 남긴다 — 다만 이제는 풀이 화면 진입 때 이미 기록됐으므로
     같은 upsert를 거쳐 "한 건을 갱신"만 한다. 예전처럼 unshift하면 카드를 저장할 때마다
     같은 날짜 기록이 한 줄씩 늘어난다. */
  if(kind==='saju' && profile){
    var p2=activeProfile();
    if(p2) recordSajuReportHistory(p2, buildReport13(p2, (data && data.year) ? data : getSajuResult(p2)));
  }
  if(kind==='mbtiReport' && profile){
    var p3=activeProfile();
    if(p3) recordMbtiReportHistory(p3, buildMbtiReport16(p3));
  }
}
function buildShareText(kind, profile, data){
  if(kind==='fortune'){
    var f=data;
    return '['+COMPANY.serviceName+'] '+profile.name+'님의 오늘의 운세 ('+f.date+')\n'+
      FORTUNE_CATS.map(function(c){ return c.label+': '+f.items[c.key].text; }).join('\n')+
      '\n행운 아이템: '+f.luckyItem+' / 행운 색상: '+f.luckyColor;
  } else if(kind==='report'){
    return '['+COMPANY.serviceName+'] '+profile.name+'님의 성향 리포트\nMBTI: '+profile.mbti+' ('+TYPE_TAGLINE[profile.mbti]+')\n오행: '+profile.element+' — '+ELEMENT_TRAIT[profile.element];
  } else if(kind==='saju'){
    var s=data;
    return '['+COMPANY.serviceName+'] '+profile.name+'님의 사주팔자\n연주 '+s.year.text+'('+s.year.textH+') · 월주 '+s.month.text+'('+s.month.textH+') · 일주 '+s.day.text+'('+s.day.textH+')'+(s.hour?(' · 시주 '+s.hour.text+'('+s.hour.textH+')'):' · 시주 모름');
  } else if(kind==='mbtiReport'){
    var rpt=buildMbtiReport16(profile);
    return '['+COMPANY.serviceName+'] '+profile.name+'님의 MBTI 풀이\n유형: '+profile.mbti+' ('+TYPE_TAGLINE[profile.mbti]+')\n'+rpt.sections[0].body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  } else {
    var r=data;
    return '['+COMPANY.serviceName+'] '+profile.name+' × '+r.pB.name+' 궁합 결과\n종합 점수: '+r.res.combined+'점 ('+r.res.combinedTier+')\n사주: '+r.res.saju.elemRel+'\nMBTI: '+r.res.categories.chemistry;
  }
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast('텍스트를 복사했습니다.'); }).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(ok?'텍스트를 복사했습니다.':'복사에 실패했습니다. 직접 선택해 복사해주세요.');
  }catch(e){ showToast('복사를 지원하지 않는 환경입니다.'); }
}
function wrapCanvasText(ctx, text, x, yy, maxWidth, lineHeight){
  var words=text.split(''); var line=''; var yy2=yy;
  for(var i=0;i<words.length;i++){
    var test=line+words[i];
    if(ctx.measureText(test).width>maxWidth && line!==''){
      ctx.fillText(line, x, yy2); line=words[i]; yy2+=lineHeight;
    } else { line=test; }
  }
  ctx.fillText(line, x, yy2);
  return yy2+lineHeight;
}
/* 캐릭터를 얹는 카드 종류. openShareModal(캔버스 높이)과 drawShareCard(그리는 자리)가 같은 표를 본다. */
var SHARE_CARD_WITH_CHAR = { saju:1, report:1, mbtiReport:1, compatSummary:1 };
/* R62 — 이 카드에 어떤 캐릭터가 들어가는지. 그림을 미리 받아 두려고 쓴다.
   ★ 아래 drawShareCard가 고르는 규칙과 같아야 한다. 다르면 엉뚱한 그림을 받아 놓고
     정작 필요한 그림은 없어서 카드에 캐릭터가 빈다. */
function shareCardCharKeys(kind, profile, data){
  if(!SHARE_CARD_WITH_CHAR[kind] || !profile) return [];
  if(kind === 'compatSummary'){
    var kA = charKeyForMbti(profile.mbti);
    var kB = (data && data.pB) ? charKeyForMbti(data.pB.mbti) : null;
    return [kA, kB].filter(Boolean);
  }
  var k = (kind === 'saju')
    ? charKeyForDayStem(data && data.year ? data : getSajuResult(profile))
    : charKeyForMbti(profile.mbti);
  return k ? [k] : [];
}
/* R29 — 공유 카드도 함께 밝은 톤으로 뒤집었다. 앱만 밝히고 내보내는 그림만 어두우면

var CARD_SERIF = "'Nanum Myeongjo','AppleMyungjo','Batang',serif";
function drawShareCard(canvas, kind, profile, data){

  ctx.fillStyle='#8F2413'; ctx.font='700 26px '+CARD_SERIF; ctx.textAlign='center'; ctx.textBaseline='middle';

  (function drawLogoMark(cx, cy, sc){
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(sc, sc);
    ctx.strokeStyle = '#F76391'; ctx.lineWidth = 3.4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(0, 16.5);
    ctx.bezierCurveTo(-17.5, 6.2, -17.5, -5.2, -8.5, -9.5);
    ctx.bezierCurveTo(-3.5, -11.5, 0, -8, 0, -8);
    ctx.bezierCurveTo(0, -8, 3.5, -11.5, 8.5, -9.5);
    ctx.bezierCurveTo(17.5, -5.2, 15.5, 4.5, 10.5, 10);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7.5, -0.5); ctx.lineTo(-2, 5); ctx.lineTo(8.5, -5.5); ctx.stroke();
    ctx.restore();
  })(w-84, 78, 1.15);

  ctx.fillStyle='#584416'; ctx.font='700 30px '+CARD_SANS; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(COMPANY.serviceName, 50, 100);

  ctx.fillStyle='#231F18'; ctx.font='400 17px '+CARD_SANS;
  var y=170;

  if(kind==='fortune'){
    ctx.font='700 22px '+CARD_SANS; ctx.fillStyle='#231F18';

    ctx.font='400 14px '+CARD_SANS; ctx.fillStyle='#544E40';

      ctx.fillText(item.label, 50, y); y+=22;
      ctx.font='400 15px '+CARD_SANS; ctx.fillStyle='#231F18';
      y=wrapCanvasText(ctx, item.text, 50, y, w-100, 21); y+=14;
    });
    y+=6; ctx.font='400 14px '+CARD_SANS; ctx.fillStyle='#584416';
    ctx.fillText('행운 아이템 '+data.luckyItem+' · 행운 색상 '+data.luckyColor, 50, y);
  } else if(kind==='report'){
    ctx.font='700 22px '+CARD_SANS; ctx.fillText(profile.name+'님의 성향 리포트', 50, y); y+=40;
    ctx.font='700 26px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.fillText(profile.mbti, 50, y); y+=8;
    ctx.font='400 16px '+CARD_SANS; ctx.fillStyle='#231F18'; ctx.fillText(TYPE_TAGLINE[profile.mbti], 50, y+26); y+=60;
    ctx.font='700 16px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.fillText('오행 · '+profile.element, 50, y); y+=26;
    ctx.font='400 15px '+CARD_SANS; ctx.fillStyle='#231F18';
    y=wrapCanvasText(ctx, ELEMENT_TRAIT[profile.element], 50, y, w-100, 21);
  } else if(kind==='saju'){
    var s=data.year?data:getSajuResult(profile);
    ctx.font='700 22px '+CARD_SANS; ctx.fillText(profile.name+'님의 사주팔자', 50, y); y+=44;
    var cols = s.hour?['year','month','day','hour']:['year','month','day'];
    var labelMap={year:'연주',month:'월주',day:'일주',hour:'시주'};
    var colW=(w-100)/cols.length;
    cols.forEach(function(pos,i){
      var g=s[pos]; var cx=50+colW*i+colW/2;
      ctx.textAlign='center';
      ctx.font='400 13px '+CARD_SANS; ctx.fillStyle='#544E40'; ctx.fillText(labelMap[pos], cx, y);
      /* 간지 두 글자만 명조로 남긴다 — 화면의 인장 칸(.pillar-seal .ch)과 같은 규칙이다. */
      ctx.font='700 30px '+CARD_SERIF; ctx.fillStyle='#231F18'; ctx.fillText(g.stem+g.branch, cx, y+42);
      ctx.font='400 13px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.fillText(g.stemH+g.branchH, cx, y+62);
    });
    ctx.textAlign='left';
    y+=110;
    /* R32 — 계산 한계 고지를 화면·공유 카드에서 전부 뺐다(대표님 지시). 이용약관 제11조에만 남는다.
       ★ 되살릴 때는 이 자리에 wrapCanvasText로 DISCLAIM_SHORT 한 줄을 다시 넣으면 된다. */
  } else if(kind==='mbtiReport'){
    var rpt = buildMbtiReport16(profile);
    ctx.font='700 22px '+CARD_SANS; ctx.fillText(profile.name+'님의 MBTI 풀이', 50, y); y+=40;

    ctx.font='400 16px '+CARD_SANS; ctx.fillStyle='#231F18'; ctx.fillText(TYPE_TAGLINE[profile.mbti], 50, y+26); y+=64;
    ctx.font='700 15px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.fillText('오프닝', 50, y); y+=22;
    ctx.font='400 15px '+CARD_SANS; ctx.fillStyle='#231F18';
    y=wrapCanvasText(ctx, rpt.sections[0].body.replace(/<[^>]+>/g,''), 50, y, w-100, 21); y+=18;
    ctx.font='700 15px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.fillText('4지표', 50, y); y+=22;
    ctx.font='400 15px '+CARD_SANS; ctx.fillStyle='#231F18';
    ctx.fillText(profile.mbti.split('').join('  ·  '), 50, y);
  } else {
    var r=data;
    ctx.font='700 22px '+CARD_SANS; ctx.fillText(profile.name+' × '+r.pB.name, 50, y); y+=50;
    ctx.font='700 60px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.textAlign='center';
    ctx.fillText(r.res.combined+'점', w/2, y+40); y+=70;
    ctx.font='400 18px '+CARD_SANS; ctx.fillStyle='#231F18';
    ctx.fillText(r.res.combinedTier, w/2, y); y+=50;
    ctx.textAlign='left';
    ctx.font='700 15px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.fillText('사주 관점', 50, y); y+=22;
    ctx.font='400 15px '+CARD_SANS; ctx.fillStyle='#231F18'; y=wrapCanvasText(ctx, r.res.saju.elemRel, 50, y, w-100, 21); y+=16;
    ctx.font='700 15px '+CARD_SANS; ctx.fillStyle='#584416'; ctx.fillText('MBTI 관점', 50, y); y+=22;
    ctx.font='400 15px '+CARD_SANS; ctx.fillStyle='#231F18'; y=wrapCanvasText(ctx, r.res.categories.chemistry, 50, y, w-100, 21);
  }

  /* R19 — 캐릭터를 카드 아래쪽에 크게 얹는다. 화면과 같은 좌표(CHARACTERS)를 Path2D로 다시 그리는 방식이라
     SVG를 이미지로 굽지 않는다 → 외부 요청 0건 유지, canvas 오염(toBlob 실패) 위험 없음. */
  if(SHARE_CARD_WITH_CHAR[kind]){
    /* 본문이 끝난 y부터 바닥 고지문 사이의 빈 자리에 그림을 "가운데 정렬"로 앉힌다.
       고정 좌표로 박으면 본문 줄 수에 따라 고지문 위로 겹치거나 허공이 크게 남는다(실측으로 겪음). */
    var top = y + 20, bottom = h - 78, avail = bottom - top;

    if(kind==='compatSummary' && avail >= 150){
      var rr=data;
      var kA=charKeyForMbti(profile.mbti), kB=charKeyForMbti(rr.pB.mbti);
      var cs=Math.max(104, Math.min(152, avail-38)), gap=26;
      var x0=(w-(cs*2+gap))/2, cy=top+Math.max(0,(avail-(cs+34))/2);
      if(kA) drawCharOnCanvas(ctx, kA, x0, cy, cs, '#231F18');
      if(kB) drawCharOnCanvas(ctx, kB, x0+cs+gap, cy, cs, '#231F18');
      ctx.font='400 14px '+CARD_SANS; ctx.fillStyle='#584416';
      if(kA) ctx.fillText(CHARACTERS[kA].name.split(' · ')[0], x0+cs/2, cy+cs+22);

    } else if(kind!=='compatSummary' && avail >= 150){
      var key = (kind==='saju')
        ? charKeyForDayStem(data && data.year ? data : getSajuResult(profile))

        var size=Math.max(120, Math.min(196, avail-38));
        var cyy=top+Math.max(0,(avail-(size+34))/2);
        drawCharOnCanvas(ctx, key, (w-size)/2, cyy, size, '#231F18');
        ctx.font='400 15px '+CARD_SANS; ctx.fillStyle='#584416';
        ctx.fillText(CHARACTERS[key].name, w/2, cyy+size+26);

    ctx.textAlign='left';

  ctx.font='400 11px '+CARD_SANS; ctx.fillStyle='#544E40'; ctx.textAlign='center';
  ctx.fillText('자체 계산 만세력 기반 참고용 콘텐츠입니다', w/2, h-40);

function render(){
  /* R59 — 화면이 바뀌었으면 방문 기록에 한 칸 얹는다(뒤로가기용). */
  pushRouteHistory(ROUTE);
  LAST_ROUTE = ROUTE;
  /* R25 — 그리기 전에 대표 오행 사본을 계산 결과에 맞춘다(위 syncAllProfileElements 주석 참고). */
  syncAllProfileElements();
  updateHeader();
  /* ★ R54 — 운영 현황판은 온보딩보다 먼저다. 대표님이 새 브라우저에서 #stats 를 열면
     '만 14세 이상입니다' 화면이 먼저 떠서 현황판에 닿을 수가 없었다(실측). */
  if(!STATE.onboarded && STATE.profiles.length===0 && ROUTE!=='stats'){ renderOnboarding(); return; }

  /* ★ R50 — 프로필이 없어도 홈(고르는 화면)과 안내 문서는 열려야 한다.
     예전에는 프로필이 없으면 무조건 마법사로 보냈다. 그래서 새로 온 사람은
     이 앱이 무엇을 해 주는지 보기도 전에 생년월일부터 넣어야 했다.
     나머지 화면(사주·궁합 등)은 계산할 값이 없으므로 여전히 마법사로 보낸다. */
  var NO_PROFILE_OK = {home:1, about:1, guideSaju:1, guideMbti:1, faq:1, glossary:1, settings:1, stats:1};
  if(STATE.profiles.length===0 && !NO_PROFILE_OK[ROUTE]){ startSetupWizard(null); renderSetup(); return; }
  if(ROUTE==='groupJoin'){ $('#appHeader').hidden=true; $('#tabbarWrap').hidden=true; renderGroupJoin(); return; }
  if(ROUTE==='roomJoin'){ $('#appHeader').hidden=true; $('#tabbarWrap').hidden=true; renderRoomJoin(); return; }
  if(ROUTE==='inviteAccept'){ $('#appHeader').hidden=true; $('#tabbarWrap').hidden=true; renderInviteAccept(); return; }

  /* R50 — 고른 서비스의 탭만 보여준다. 아직 안 골랐으면 홈·히스토리·설정만 남는다.
     ★ R56 — 홈에서는 서비스 탭을 아예 감춘다(대표님 지적).
       홈은 '무엇을 볼지 고르는 자리'인데, 직전에 무엇을 눌렀느냐에 따라 탭이 달라 보였다.
       고르러 온 화면의 메뉴가 매번 바뀌면 그게 더 헷갈린다. 홈은 늘 같은 모습이어야 한다. */
  var tabMode = (ROUTE==='home') ? null : modeOf();
  $all('.tab-btn').forEach(function(b){
    var m = b.dataset.mode;
    b.hidden = !!(m && m !== tabMode);
    var on=b.dataset.route===ROUTE;
    if(on && !b.hidden){ b.setAttribute('aria-current','page'); b.scrollIntoView({inline:'nearest', block:'nearest'}); }
    else b.removeAttribute('aria-current');

  if(ROUTE==='stats') renderStats();
  else if(ROUTE==='home') renderLanding();
  else if(ROUTE==='today') renderHome();
  else if(ROUTE==='saju') renderSaju();
  else if(ROUTE==='monthlyFortune') renderMonthlyFortune();
  else if(ROUTE==='report13') renderReport13();
  else if(ROUTE==='mbtiReport') renderMbtiReport13();
  else if(ROUTE==='report') renderReport();
  else if(ROUTE==='compat') renderCompat();
  else if(ROUTE==='chars') renderCharDex();
  else if(ROUTE==='glossary') renderGlossary();
  else if(ROUTE==='groupCompat') renderGroupCompat();
  else if(ROUTE==='history') renderHistory();
  else if(ROUTE==='settings') renderSettings();
  else if(ROUTE==='about') renderAbout();
  else if(ROUTE==='guideSaju') renderGuideSaju();
  else if(ROUTE==='guideMbti') renderGuideMbti();
  else if(ROUTE==='faq') renderFaq();
  else renderHome();
  /* R34 — 모든 화면 맨 아래에 공통 하단을 붙인다.
     각 render 함수를 일일이 고치지 않고 여기서 한 번에 처리한다 —
     화면이 늘어날 때마다 푸터를 빠뜨리는 일이 없도록. */
  appendFooterOnce();

/* =====================================================================
   R20 — 화면을 떠나기 전 확인.
   ---------------------------------------------------------------------
   저장 단계를 만들면 반드시 따라와야 하는 짝이 "저장 안 하고 나가려 할 때 알리기"다.
   지금 이 앱에서 "값을 넣어놓고 아직 저장하지 않은 상태"가 남을 수 있는 곳은 두 군데다.
     · 궁합 상대 입력 — 궁합 탭을 다시 누르면 입력이 통째로 초기화된다(예전에는 말없이 버렸다)
     · 관리자 콘솔 → AI 해석 서버 주소·모델 — 콘솔을 닫으면 입력칸의 글자가 사라진다
   ★ AI 해석 카드가 설정 화면에서 관리자 콘솔(모달)로 옮겨 갔으므로, 이제 그 경고는 라우트 이동이 아니라
     콘솔의 [닫기]가 맡는다(openAdminConsole의 닫기 버튼). 여기 남은 라우트 검사는 콘솔을 열어 둔 채
     탭을 누르는 경우를 위한 그물이다 — ADMIN_KEY가 null이면 interpDirty()가 참이 될 일 자체가 없다.
   프로필 마법사는 탭바 자체가 숨겨져 있어 이 경로로 나갈 수 없고, 대신 leaveSetupWizard()가 같은 일을 한다.
===================================================================== */
function guardRouteChange(nextRoute, proceed){
  if(ROUTE==='compat' && compatDraftDirty()){
    confirmModal('상대방 정보를 입력하던 중이에요. 저장하지 않은 입력을 버리고 이동할까요?', proceed, '나가기');
    return;
  }
  if(interpDirty()){
    confirmModal('AI 해석 설정에 저장하지 않은 변경이 있어요. 저장하지 않고 이동할까요?', function(){
      INTERP_EDIT = null; proceed();
    }, '나가기');
    return;
  }
  proceed();
}

ADMIN_GRANTS = loadAdminGrants();
adminBadgeMount();
/* 첫 화면을 그리기 전에 권한 상태를 채운다.
   서버 모드라면 조회가 끝날 때까지 '잠금'이 기본값이다 — 열어두고 나중에 닫으면 이미 늦다. */
primeEntitlements();

/* 초기 렌더: 초대 링크로 진입했고 이미 프로필이 있으면 봉인 해제 화면부터 보여준다.
   그룹 링크(#meet=)면 그룹 화면부터 보여준다. 둘 다 "내 프로필이 하나는 있어야" 열린다 —
   프로필이 없으면 앱이 설정 마법사부터 띄우기 때문이다(초대 링크도 원래 같은 조건이다). */
/* 표(INVITE_FIELDS)가 준비된 지금에서야 두 링크를 푼다. 위에서 주소만 챙겨 뒀다. */
PENDING_INVITE = decodeInviteFromHash(INVITE_HASH_RAW);
var MEET_HASH_PRESENT = /[#&]meet=/.test(location.hash||'');
PENDING_MEET = decodeMeetFromHash(location.hash);
/* ★ 읽기에 실패한(깨진·옛 형식) 링크도 지운다. 파싱이 안 됐다고 개인정보가 사라지는 게 아니다 —
   주소창에는 그대로 남아 있다. 그래서 "읽었는가"가 아니라 "해시에 meet가 있었는가"로 판단한다. */
if(MEET_HASH_PRESENT){
  /* ★ 주소창과 방문 기록에서 해시를 지운다.
     그룹 링크에는 남의 개인정보가 최대 30명분(이름·MBTI·생년월일·태어난 시각·출생지) 들어 있다.
     화면은 "받은 명단을 이 기기에 저장하지 않아요"라고 말하는데, 주소를 그대로 두면
     주소창·방문 기록·나중에 이 페이지를 다시 열 때까지 그 정보가 남는다 — 말과 실제가 어긋난다.
     1:1 초대 링크(#invite=)는 이미 같은 처리를 하고 있었고, 모임 경로에만 빠져 있었다.
     이미 읽어서 PENDING_MEET에 담은 뒤이므로 화면 동작에는 영향이 없다. */
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
}
/* =====================================================================
   R39 — 이미 열어 둔 화면에 링크를 붙여 넣은 경우
   ---------------------------------------------------------------------
   링크(#gj=, #g=, #r=, #meet=, #i1=)는 페이지가 켜질 때 딱 한 번만 읽는다.
   그래서 앱을 이미 열어 둔 탭의 주소창에 링크를 붙여 넣으면 주소만 바뀌고
   화면은 그대로였다 — 받은 사람 눈에는 "링크가 안 열린다"로 보인다.
   카카오톡에서 누르면 새 창이 뜨니 대개는 괜찮지만, 주소를 복사해 붙이는 분도 있다.

   ★ 여기서 직접 처리하지 않고 새로 고친다. 링크를 읽는 절차가 부팅 코드 곳곳에
     흩어져 있어(PENDING_* 여러 개) 그걸 다시 실행하려 들면 상태가 반쯤 섞인다.
     새로 고치면 원래 절차를 그대로 한 번 더 타므로 어긋날 여지가 없다.
   ★ 우리 링크 형식일 때만 새로 고친다. 화면 안에서 쓰는 #앵커까지 새로 고치면
     멀쩡히 보던 화면이 튕긴다. */
/* =====================================================================
   운영자 테스트 코드 — 결제 없이 유료 기능을 확인하기 위한 문
   ---------------------------------------------------------------------
   ★ 이 파일에 열쇠를 적지 않는다. 대조는 서버(api/testunlock.js)가 하고,
     열쇠는 Vercel 환경변수(TEST_UNLOCK_CODE)에만 있다.
     예전에 fortune-test.html 안에 관리자 키를 박은 채 공개 저장소에 올려,
     그 주소를 아는 사람이면 누구나 유료 기능을 전부 열 수 있었던 사고가 있었다.
   ★ 화면 어디에도 이 문으로 가는 버튼을 두지 않는다. 주소 끝에 #unlock 을 붙여야 열린다.
     주소가 비밀인 게 아니라, 코드가 비밀이다.
   ★ 환경변수를 안 넣으면 서버가 404로 답하고 아무 일도 일어나지 않는다.
===================================================================== */
function openTestUnlockModal(){
  var body = el('div',{class:'sheet-body'});
  body.appendChild(el('p',{class:'biz-hint'},[
    '운영자 확인용입니다. 결제 없이 유료 해석을 열어 확인하실 수 있어요.'
  ]));
  var input = el('input',{class:'biz-input', type:'password', style:'margin-top:12px;',
    placeholder:'테스트 코드', 'aria-label':'테스트 코드', autocomplete:'off', spellcheck:'false'});
  body.appendChild(input);
  var status = el('p',{class:'biz-hint', role:'status','aria-live':'polite', style:'margin-top:10px;min-height:1.2em;'});
  body.appendChild(status);

  var run = el('button',{class:'btn btn-primary btn-block', style:'margin-top:12px;'},['열기']);
  run.addEventListener('click', function(){
    var code = (input.value||'').trim();
    if(!code){ status.textContent = '코드를 입력해 주세요.'; input.focus(); return; }
    run.disabled = true; status.style.color=''; status.textContent = '확인하는 중이에요…';
    fetch('/api/testunlock', {method:'POST', headers:{'Content-Type':'application/json'},
      credentials:'include', body: JSON.stringify({code:code})})
      .then(function(r){ return r.json().catch(function(){ return null; })
        .then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(r){
        run.disabled = false;
        if(r.ok && r.d && r.d.ok){
          /* ★ 서버가 세션에 허가를 붙였다. 화면 쪽 잠금도 같이 열어야 유료 화면을 볼 수 있다.
             지금 앱은 아직 체험 모드(BILLING_SOURCE 미설정)라 권한이 브라우저에 있다. */
          grantAllForTest();
          closeModal();
          showToast('유료 기능을 열었어요. 일주일 동안 유지돼요.');
          render();
        } else {
          status.style.color = 'var(--red-hi)';
          status.textContent = (r.d && r.d.reason) || '열지 못했어요.';
        }
      })
      .catch(function(){
        run.disabled = false;
        status.style.color = 'var(--red-hi)';
        status.textContent = '서버에 닿지 못했어요.';
      });
  });
  body.appendChild(run);
  openModal('테스트 코드', body, [{label:'닫기', cls:'btn-ghost', onclick:closeModal}]);
}

/* 테스트 허가를 받은 뒤 화면 잠금도 함께 연다.
   ★ 서버는 이미 별도로 판단하고 있다(api/interpret.js). 이건 화면을 여는 것뿐이다. */
function grantAllForTest(){
  /* ★ 서버 권위 모드에서는 클라이언트가 권한을 만들지 않는다. 그때는 서버가 이미
     테스트 허가를 세션에 붙였으므로, 권한을 다시 받아오기만 하면 된다. */
  if(serverAuthoritative()){ if(typeof fetchEntitlements==='function') fetchEntitlements(); return; }
  var e = localTrialEntitlements();
  var now = Date.now();
  for(var pid in PRODUCTS){
    if(PRODUCTS[pid].kind === 'once') e.items[pid] = { purchasedAt: now };
  }
  e.pass = { productId:'premium_pass', purchasedAt: now, expiresAt: now + PRODUCTS.premium_pass.days*86400000 };
  saveState();
  ENT.data = e;   /* 체험 모드에서도 판정은 ENT를 거친다 */
}

window.addEventListener('hashchange', function(){
  var h = String(location.hash || '').replace(/^#/, '');
  if(h === 'unlock'){ openTestUnlockModal(); return; }
  if(h === 'stats'){ ROUTE='stats'; loadStats(); return; }
  if(/^(gj|g|r|meet|invite|i1)=/.test(h)){ location.reload(); }
});
/* 처음 열 때 #unlock 이 붙어 있으면 — hashchange는 '바뀔 때'만 오므로 여기서도 본다. */
if(String(location.hash||'').replace(/^#/,'') === 'unlock'){
  setTimeout(function(){ openTestUnlockModal(); }, 0);
}
if(String(location.hash||'').replace(/^#/,'') === 'stats'){
  setTimeout(function(){ ROUTE='stats'; loadStats(); }, 0);
}

/* ★ R50 — 링크로 바로 들어온 사람은 '궁합을 하러 온' 것이다. 탭도 그쪽으로 맞춘다. */
if(PENDING_MEET || PENDING_GROUP || PENDING_GROUP_JOIN || PENDING_ROOM || PENDING_INVITE){ MODE = 'compat'; }

if(PENDING_MEET && STATE.profiles.length>0){
  GC_SOURCE='link'; ROUTE='groupCompat';
} else if(PENDING_GROUP_JOIN && STATE.profiles.length>0){
  ROUTE='groupJoin';
} else if(PENDING_GROUP && STATE.profiles.length>0){
  /* 그룹 주소로 들어왔다. 명단은 서버에서 받아온다. */
  ROUTE='compat';
  setTimeout(function(){ openSavedGroup(PENDING_GROUP); PENDING_GROUP=null; }, 0);
} else if(PENDING_ROOM && STATE.profiles.length>0){
  ROUTE='roomJoin';
} else if(PENDING_INVITE && !INVITE_CONSUMED && STATE.profiles.length>0){
  ROUTE='inviteAccept';
}
render();
/* R59 — 첫 화면을 그린 뒤부터 방문 기록을 쌓는다.
   ★ 맨 처음 상태를 기록에 심어 둔다. 안 그러면 앱 안에서 한 번 움직인 뒤
     뒤로가기를 눌렀을 때 되돌아갈 '앱의 첫 화면'이 기록에 없어 그대로 밖으로 나간다. */
try{ history.replaceState({app:1, route:ROUTE}, '', location.pathname + location.search); }catch(e){}
LAST_ROUTE = ROUTE;
HISTORY_ON = true;

/* 서버가 붙어 있으면 권한을 서버에 다시 물어보고, 받은 값으로 화면을 다시 그린다.
   결제창에서 ?receipt=... 를 달고 돌아온 경우에는 영수증 검증을 먼저 통과시킨다.
   (검증에 성공해도 권한은 여전히 서버 조회 결과만 쓴다.) */
(function bootEntitlements(){
  if(!serverAuthoritative()) return;
  verifyReceiptFromUrl()
    .catch(function(){ return false; })
    .then(function(){ return fetchEntitlements(); })
    .then(function(){
      render();
      /* 결제창에서 돌아온 직후에도 영수증 번호를 보여주고 저장하라고 안내한다.
         (checkoutUrl 리다이렉트 방식에서는 이 경로가 결제 성공을 처음 알게 되는 자리다.) */
      if(RECEIPT_FROM_URL){ openReceiptSavedModal(RECEIPT_FROM_URL, {title:'결제가 확인되었습니다. 유료 해석이 열렸어요.'}); RECEIPT_FROM_URL = null; }
    })
    .catch(function(err){ console.warn('이용권 조회 실패', err); render(); });
})();

})();
</script>
</body>
</html>
