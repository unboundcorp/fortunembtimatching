<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>케미체크 · 사주 × MBTI 궁합</title>
<!-- 파비콘 — 외부 파일을 부르지 않고 SVG를 주소 안에 담는다(요청 0건 원칙 유지).
     인장 모티프의 緣 한 글자. 없으면 브라우저가 /favicon.ico 를 찾다가 404를 낸다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23FFF7F9'/%3E%3Cpath d='M24 39C24 39 7.5 29.3 7.5 18.6c0-5.1 3.9-8.8 8.5-8.8 3.2 0 6 1.8 8 4.7 2-2.9 4.8-4.7 8-4.7 4.6 0 8.5 3.7 8.5 8.8 0 4-2.3 7.7-5.1 10.8' stroke='%23F76391' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 23l5 5 10-10' stroke='%23F76391' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="description" content="클라이언트에서 직접 계산하는 만세력 사주와 MBTI를 결합한 운세·궁합 플랫폼">
<style>
/* ===================== 리셋 & 베이스 ===================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* R29 (2026-08-10 대표님 지시) — 화면 전체를 밝은 톤으로 뒤집었다.
     이 앱은 이제 "밝은 화면 하나"로만 만든다. color-scheme을 light로 고정해야
     <select>의 펼침 목록·스크롤바·기본 컨트롤이 OS가 다크 모드여도 밝게 그려진다.
     (dark로 두면 OS 다크 모드에서 흰 입력칸 위에 흰 글씨가 되던 그 사고가 반대로 재현된다.) */
  color-scheme: light;
  /* ===== R29 밝은 톤 팔레트 =====
     ① 바탕은 순백이 아니라 아주 옅은 웜그레이(한지). ② 글자는 순검정이 아니라 짙은 먹.
     ③ 금색은 밝은 바탕에서 읽히도록 톤을 낮춘 청동빛 골드. ④ 색 수를 줄이고 채도를 낮췄다.
     대비는 전부 다시 계산했다(본문 7:1 이상). 옆 주석의 숫자는 실제로 잰 값이다. */
  /* ===== R36 브랜드 교체 (2026-08-11 대표님 지시) =====
     로고가 인장·한지(청동 골드)에서 하트+체크(핑크)로 바뀌었다. 화면 전체를 그 결에 맞춘다.
     ★ 색만 바꾸지 않는다. 이 앱은 본문 글자 대비를 7:1(AAA)로 잡아 왔고, 그 기준을 그대로 지킨다.
       아래 숫자는 전부 실제로 계산해서 고른 값이다.
     ★ 로고 원색(#F76391)은 글자로 쓰면 바탕 대비 2.79:1이라 못 읽는다.
       그래서 원색은 "그림"(로고·아이콘)에만 쓰고, 글자로 쓰는 브랜드색은 한참 어둡게 내렸다.
       같은 분홍 계열이되 역할에 따라 밝기를 나눈다 — 이게 이번 교체의 핵심이다. */
  --void:#FFFFFF;          /* 진한 면 위에 얹는 밝은 글자 */
  --base:#FFF7F9;          /* 페이지 바탕: 아주 옅은 분홍 흰색 */
  --panel:#FFFFFF;         /* 카드 */
  --panel-2:#FFFFFF;       /* 모달·입력칸 */
  --panel-3:#FDEFF3;       /* 카드 안에 한 단 눌러 앉히는 면 */
  --track:#F7E1E8;         /* 막대·게이지의 빈 홈 */
  --brand:#F76391;         /* ★ 로고 원색 — 그림에만. 글자로 쓰지 말 것(2.79:1) */
  --brand-2:#FF8FAF;       /* 로고의 밝은 쪽 — 그라데이션·장식용 */
  --ink:#2A1F24;           /* 본문 먹색 — 바탕 15.10:1 / 카드 15.91:1 */
  /* 설명 글자. 밝은 바탕으로 뒤집으면서 "밝게"가 아니라 "어둡게" 가야 한다 —
     방향만 바뀌었지 기준은 그대로 본문 AAA(7:1)다. 바탕 8.70:1 / 카드 9.50:1. */
  --ink-dim:#4E3D46;       /* 바탕 9.58:1 / 카드 10.10:1 */
  /* 결제·보안 고지문. 위계(--ink > --ink-dim > --ink-faint)는 유지하되
     가장 흐린 이 색도 7:1을 넘긴다 — 바탕 7.30:1 / 카드 7.97:1.
     밝은 바탕에서는 세 단계 간격이 어두울 때보다 좁아 보인다(그건 아래 SELF_CHECK에 적었다). */
  --ink-faint:#5A4750;     /* 바탕 8.13:1 / 카드 8.56:1 — 가장 흐린 색도 7:1을 넘긴다 */
  /* 금박. 밝은 바탕에 밝은 금색을 그대로 쓰면 사라지므로 채도·명도를 낮춘 청동빛으로 내렸다.
     글자로도 쓰이는 색이라 7:1을 넘겨야 한다.
     ★ 처음 잡은 값(#5F4A1C)은 "카드 위"만 보고 정해서 7.4:1이었는데, 실제로 이 색이 가장 많이
       놓이는 자리는 카드가 아니라 **옅은 금색 면(--gold-soft) 위**였다(알약 칩·보조 버튼·배지).
       거기서 재니 6.37~6.49:1로 미달이라 한 단 더 내렸다 — 실측으로 잡은 자리다.
     지금 값: 페이지 8.28:1 / 카드 9.04:1 / --gold-soft 면 위 7.21:1. */
  /* ★ --gold 라는 이름은 그대로 둔다. 이 파일 곳곳에서 "강조색"이라는 뜻으로 쓰이고 있어
     이름을 바꾸면 수백 곳을 함께 고쳐야 한다. 값만 브랜드 분홍의 "글자용 톤"으로 바꾼다.
     ★ 처음 #A50F45(바탕 7.23:1)로 잡았는데, 이 색이 실제로 가장 많이 놓이는 자리는
       맨바탕이 아니라 --gold-soft가 깔린 옅은 분홍 면이었다. 거기서 6.61:1로 떨어졌다.
       (R29에서 청동 골드를 잡을 때도 똑같은 실수를 했고 같은 방법으로 잡았다.)
       그래서 한 단 더 내리고, 깔리는 면의 알파도 함께 낮춘다. #98003C — 바탕 8.30:1. */
  --gold:#98003C;
  --gold-2:#A50F45;
  /* 그라데이션은 "거의 단색 + 미세한 광택"으로 좁혔다. 넓게 잡으면 밝은 쪽 끝에서
     그 위에 얹은 흰 글자가 7:1 아래로 떨어진다(실제로 재서 좁혔다 — 밝은 끝 7.13:1). */
  /* 버튼처럼 "면"으로 쓰는 자리는 조금 밝아도 된다 — 그 위 글자가 흰색이기 때문이다.
     #C81E59 위 흰 글자 5.55:1 (보통 글자 AA·큰 글자 AAA). */
  --gold-gradient:linear-gradient(135deg,#AA0648,#8E0038);  /* 흰 글자 기준 밝은 끝 7.4:1 — 계산이 아니라 화면에서 재서 정한 값 */
  --gold-soft:rgba(247,99,145,.055);
  --gold-line:rgba(247,99,145,.30);
  /* 입력칸 테두리만 따로 둔다. 장식 헤어라인(--gold-line)은 1.4:1이라 "이게 입력칸이구나"를
     알려주지 못한다. 폼 컨트롤 경계는 3:1이 필요하므로 웜그레이 실선으로 분리했다(3.46:1). */
  --field-line:#C9A7B4;
  --red:rgba(156,21,51,.38);
  /* ★ 경고·잠금 글자로도 쓰이므로 본문 기준(7:1)을 넘겨야 한다.
     처음 #B21E3C로 잡았다가 6.34:1인 것을 재보고 한 단 내렸다. #9C1533 — 바탕 7.76:1. */
  --red-hi:#9C1533;
  --ok:#3F6B45;
  /* 그림자는 테두리를 대신해 카드를 띄우는 수단이다. 밝은 바탕에서는 검정 알파를
     10% 안팎까지 낮춰야 얼룩이 아니라 "떠 있는 느낌"이 된다. */
  --shadow:0 18px 44px rgba(160,60,95,.14),0 2px 6px rgba(160,60,95,.06);
  --shadow-sm:0 4px 14px rgba(160,60,95,.10);
  /* R22 — 카드에만 쓰는 부드러운 그림자. 기존 --shadow-sm보다 넓고 옅어서 "떠 있는 느낌"만 준다.
     새 색을 만든 게 아니다: 검정 알파값만 조정한 것이라 팔레트는 그대로다. */
  --shadow-soft:0 6px 20px rgba(160,60,95,.08),0 1px 2px rgba(160,60,95,.05);
  /* R22 — 여백 단계. 값을 손으로 흩어 적지 않고 여기 한 곳에서 키운다. */
  --gap-card:18px;
  --pad-card:24px;
  /* ★ 로고 글자가 끝이 둥근 서체다. 모서리를 더 둥글려 그 결을 화면 전체에 맞춘다. */
  --r-lg:24px;   /* 카드 */
  --r-md:16px;   /* 타일·입력칸·작은 상자 */
  --r-pill:999px;
  --serif:'Nanum Myeongjo','AppleMyungjo','Batang','Songti SC',serif;
  /* R29 폰트 — 대표님이 고르신 방식 ⓐ: 이름만 지정하고 없으면 기기 기본 고딕으로 떨어진다.
     @font-face도, CDN 링크도, data: URI도 쓰지 않는다(외부 요청 0건이 이 앱의 검수 항목이다).
     순서: Pretendard → 애플 → 안드로이드 → 윈도우 → 총칭. */
  --sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Roboto,'Malgun Gothic','Segoe UI',system-ui,sans-serif;
  --pA:#98003C; /* 프로필A 라인색 — 브랜드 분홍(글자용 톤) */
  --pB:#3A3C72; /* 프로필B 라인색 — 인디고. 분홍 옆에서 확실히 구분된다 */
  /* 오행 5색. 밝은 바탕에서 사라지지 않도록 전부 어둡고 채도를 낮췄다.
     특히 금(金)은 예전 #cfd3d8(밝은 은색)이라 밝은 바탕에서 1.3:1로 아예 안 보였다.
     지금은 바탕 대비 4.4~5.5:1 — 그림 요소 기준(3:1)을 넉넉히 넘는다. */
  --em-wood:#3F6B45; --em-fire:#B4442C; --em-earth:#7E5F2C; --em-metal:#646B70; --em-water:#3D6480;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;max-width:100%;}
body{
  font-family:var(--sans);
  /* R29 — 350은 Pretendard Variable에서만 의미가 있고 시스템 고딕으로 떨어지면 400으로 반올림된다.
     기기마다 굵기가 달라 보이지 않게 400으로 고정한다. */
  font-weight:400;
  /* 고딕(Pretendard)은 한글 자간이 넓게 느껴진다. 양수 자간을 음수로 내려야 "고딕 느낌"이 나고,
     동시에 줄 길이가 짧아져 320px에서의 넘침 위험도 함께 줄어든다. */
  letter-spacing:-.005em;
  background:var(--base);
  /* ★ R32 — 알파를 .05/.04 → .03/.025 로 낮췄다.
     검수가 화면 위쪽에서 이 두 그라데이션이 바탕을 rgb(225~230,…)까지 어둡게 만들어,
     그 자리에 놓인 --gold 글자가 6.91~6.95:1(자체 기준 7:1 미달)로 떨어지는 것을 실측했다.
     색을 바꾸지 않고 바탕이 어두워지는 폭만 줄이는 쪽을 골랐다 — 팔레트는 그대로 두고 싶었다. */
  background-image:
    radial-gradient(ellipse at 15% -10%, rgba(88,68,22,.03), transparent 55%),
    radial-gradient(ellipse at 100% 0%, rgba(88,68,22,.025), transparent 45%);
  color:var(--ink);
  min-height:100vh;
  /* R22 — 줄간격을 1.6에서 1.75로 넓혔다. "귀엽게"의 절반은 여백이라, 색을 건드리지 않고
     분위기를 바꿀 수 있는 가장 큰 손잡이가 줄간격·모서리·여백 세 가지다. */
  line-height:1.75;
  overflow-x:hidden;
  /* 어두운 바탕에서는 antialiased가 글자를 또렷하게 했지만, 밝은 바탕에서는 획을 가늘게 만들어
     대비를 깎아먹는다(같은 색인데 흐려 보인다). 밝은 화면에서는 기본 렌더링이 낫다. */
}
img{max-width:100%;display:block;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:1rem;letter-spacing:-.005em;}
/* 2026-08-10 대표님 지시 — "입력란이 안 보인다. 다크모드든 화이트모드든 상관없이 잘 보이게."
   R29에서 화면을 밝은 톤으로 뒤집으면서 같은 함정이 반대 방향으로 생긴다.
   → ① :root의 color-scheme:light 로 브라우저 기본 컨트롤·펼침 목록·스크롤바를 밝게 고정하고
     ② 배경·글자색·테두리를 우리 값으로 명시해 OS 설정에 기대지 않게 하고
     ③ 테두리는 장식용 헤어라인(--gold-line, 1.4:1) 대신 --field-line(3.46:1)을 쓴다.
        "여기가 입력칸이다"를 알리는 경계는 3:1을 넘겨야 한다. */
select,input,textarea{
  font-family:inherit;letter-spacing:-.005em;
  background:var(--panel-2);color:var(--ink);
  border:1px solid var(--field-line);border-radius:var(--r-md);
  padding:10px 12px;font-size:.95rem;min-height:44px;
}
select option{background:var(--panel-2);color:var(--ink);}
select:focus,input:focus,textarea:focus{border-color:var(--gold);outline:2px solid transparent;outline-offset:2px;box-shadow:0 0 0 3px rgba(88,68,22,.26);}
a{color:inherit;}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;}
/* ===== R29: 세리프(명조)를 어디에 남길 것인가 =====
   대표님 지시는 "Pretendard로 고딕 느낌", 그러면서 "한지·인장 모티프는 남긴다"였다.
   그래서 기준을 하나로 잡았다 — **글자 자체가 그림(인장·간지)인 자리만 명조로 남기고,
   읽으라고 쓴 글(제목·숫자·라벨)은 전부 고딕으로 내린다.**
   남긴 자리 6곳: 브랜드 인장 '印' / 사주 네 기둥의 간지 / 대운 간지 / 월별 간지 /
                  봉투 봉인 '緣' / 빈 화면의 인장 글자.
   내린 자리: 섹션 제목·게이지 숫자·브랜드명·온보딩 제목·요약 숫자·등급 라벨·MBTI 칸 등.
   (제목까지 명조로 두면 "고딕으로 바꿨다"는 지시가 화면에서 느껴지지 않는다.) */
.brand-seal,.empty-state .glyph,.pillar-seal .ch,.daewoon-item .gz,.month-cell .mc-gz,.envelope .seal{font-family:var(--serif);}
.gold-text{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hidden{display:none !important;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
[hidden]{display:none !important;}

/* ===================== 레이아웃 ===================== */
#app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--gold-line);
}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;margin:-4px;
  border-radius:12px;cursor:pointer;transition:opacity .15s,transform .15s;}
.brand:hover{opacity:.82;}
.brand:active{transform:scale(.97);}
/* R36 — 인장(緣) 자리에 로고를 넣는다. 외부 파일을 부르지 않으려고 SVG를 직접 그린다. */
.brand-seal{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;}
.brand-seal svg{width:100%;height:100%;display:block;}
.brand-name{font-family:var(--sans);font-size:1.24rem;font-weight:800;letter-spacing:-.03em;color:var(--gold);}
.profile-switch{display:flex;align-items:center;gap:8px;}
.profile-switch select{
  background:var(--panel-2);border:1px solid var(--field-line);color:var(--ink);
  /* R22 — 터치 목표 44px 확보(11px×2 + 글자 22px ≈ 44px) + 알약 모양 */
  padding:11px 14px;border-radius:var(--r-pill);font-size:.85rem;max-width:132px;min-height:44px;
}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--gold-line);
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  transition:background .15s,transform .15s;
}
.icon-btn:hover{background:var(--gold-soft);}
.icon-btn:active{transform:scale(.94);}

.tabbar-wrap{position:relative;border-bottom:1px solid var(--gold-line);}
.tabbar-wrap::after{
  content:"";position:absolute;top:0;right:0;bottom:0;width:26px;
  background:linear-gradient(90deg, transparent, var(--base) 80%);
  pointer-events:none;
}
/* ===================== R22: 메뉴를 알약(pill) 칩으로 =====================
   예전에는 밑줄(border-bottom) 방식이었다. 레퍼런스(점신)의 상단 분류는 전부 알약 칩이고,
   이 앱에도 이미 알약 칩이 세 종류(.tabgroup / .toc-nav a / .admin-chip) 있었다.
   같은 모양이 화면마다 따로 놀지 않도록 주 메뉴도 같은 형태로 맞춘다.
   색은 이미 .tabgroup[aria-selected]가 쓰던 조합(--gold-soft 배경 + --gold 글자)을 그대로 쓴다 — 새 색 0개. */
.tabbar{
  display:flex;gap:6px;padding:10px 14px;
  /* R29 — 예전엔 검정 12%로 띠를 눌렀다. 밝은 바탕에서 같은 값을 쓰면 회색 얼룩이 된다.
     페이지 바탕과 같게 두고, 오른쪽 스크롤 그림자(::after)가 var(--base)로 자연스럽게 이어지게 한다. */
  overflow-x:auto;background:transparent;
}
.tab-btn{
  /* 12px×2 + 글자 약 21px = 45px → 터치 목표 44px 이상 */
  padding:12px 15px;min-height:44px;display:inline-flex;align-items:center;
  font-size:.83rem;color:var(--ink-dim);white-space:nowrap;
  border:1px solid transparent;border-radius:var(--r-pill);letter-spacing:.01em;
  transition:color .15s,background .15s,border-color .15s;
}
.tab-btn[aria-current="page"]{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line);font-weight:600;}
.tab-btn:hover{color:var(--ink);background:rgba(35,31,24,.05);}
.tab-btn:active{opacity:.6;}

main{flex:1;padding:28px 20px 96px;}
/* v4-C: 화면 진입 리듬을 .stamp-in(카드 등장)과 동일한 이징으로 통일 — cubic-bezier(.2,1.4,.4,1), .2~.4s 범위 */
.view{animation:fadeUp .3s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===================== R22: 작은 회색 라벨 + 그 아래 큰 제목 =====================
   레퍼런스에서 가장 크게 빌려온 것. 예전에는 화면마다 큰 제목 하나뿐이라 위계가 없었다.
   .page-eyebrow는 "지금 어느 메뉴 안인지"를 작게 알리고(빵부스러기 역할), 큰 제목은 그대로 둔다.
   글자만 두 단으로 나눈 것이라 화면 순서는 하나도 바뀌지 않는다. */
.page-head{margin-bottom:22px;}
.page-eyebrow{
  font-size:.75rem;font-weight:700;letter-spacing:.14em;
  color:var(--ink-dim);margin-bottom:7px;line-height:1.4;
}
.section-title{font-size:1.62rem;line-height:1.38;margin-bottom:6px;color:var(--gold);font-weight:600;}
.section-sub{color:var(--ink-dim);font-size:.88rem;margin-bottom:20px;line-height:1.75;}
.page-head .section-sub{margin-bottom:0;}
/* 카드 안에서도 같은 규칙을 쓴다 — 작은 분류(총운) 위, 큰 제목(오늘의 흐름 읽기) 아래. */
.card-eyebrow{
  font-size:.72rem;font-weight:700;letter-spacing:.12em;
  color:var(--ink-dim);margin-bottom:5px;line-height:1.4;
}

/* ===================== 족자(scroll) 카드 → v4-A: 반투명 다크그레이 카드 + 얇은 골드 헤어라인 ===================== */
.scroll-card{
  background:var(--panel);
  /* R29 — 밝은 톤에서는 테두리보다 그림자로 띄운다(대표님 지시). 테두리는 완전히 지우지 않고
     헤어라인만 남긴다 — 겹쳐 놓인 카드끼리의 경계가 아예 사라지면 어디까지가 한 덩어리인지 모른다. */
  border:1px solid rgba(88,68,22,.10);
  /* R22 — 모서리 16→20, 안쪽 여백 22→24, 카드 사이 14→18. 한 카드에 한 주제라는 규칙은
     이미 지켜지고 있었고, 모자랐던 건 카드끼리의 숨 쉴 자리였다. */
  border-radius:var(--r-lg);
  padding:var(--pad-card);
  box-shadow:var(--shadow-soft);
  position:relative;
  margin-bottom:var(--gap-card);
}
.scroll-card::before,.scroll-card::after{
  content:"";position:absolute;left:22px;right:22px;height:1px;background:var(--gold-gradient);opacity:.22;
}
.scroll-card::before{top:0;}
.scroll-card::after{bottom:0;}
.scroll-card h3{font-size:1.1rem;color:var(--ink);margin-bottom:12px;font-weight:600;line-height:1.45;}
.scroll-card > p{line-height:1.85;}
.stamp-in{animation:stamp .3s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.08);}
  100%{opacity:1;transform:scale(1);}
}

/* ===================== 버튼 ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  /* R22 — 모서리 12→16, 최소 높이 48px 고정(터치 목표) */
  padding:13px 22px;border-radius:16px;min-height:48px;font-weight:600;font-size:1.02rem;letter-spacing:-.01em;
  border:1px solid rgba(88,68,22,.30);transition:transform .15s,background .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.98);}
/* R29 — 밝은 바탕에서 주 버튼은 "밝은 금색 면"이 아니라 "짙은 청동 면 + 밝은 글자"가 맞다.
   밝은 금색을 그대로 두면 버튼이 배경에 녹고 그 위 글자가 어디에도 안 붙는다.
   글자 대비: 그라데이션 어두운 끝 7.98:1 / 밝은 끝 7.13:1. */
.btn-primary{background:var(--gold-gradient);color:var(--void);border-color:transparent;font-weight:600;box-shadow:0 2px 8px rgba(58,50,34,.14);}
.btn-primary:hover{box-shadow:0 8px 20px rgba(88,68,22,.26);}
/* 보조 버튼은 테두리만으로는 컨트롤로 안 읽힌다(밝은 바탕에서 헤어라인이 1.4:1). 옅은 면을 깐다. */
.btn-ghost{background:var(--gold-soft);color:var(--gold);}
.btn-ghost:hover{background:rgba(88,68,22,.15);}
.btn-block{width:100%;}
/* R22 — 작은 버튼도 44px 아래로 내려가지 않게 한다(모바일 20-30대 타겟). 글자 크기는 그대로. */
.btn-sm{padding:11px 16px;font-size:.85rem;min-height:44px;border-radius:var(--r-pill);}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none !important;}

/* ===================== 인장 원형 버튼 → v4-A: 가는 골드 라인 프레임으로 재조정 ===================== */
.seal-btn{
  width:64px;height:64px;border-radius:50%;border:1px solid rgba(88,68,22,.28);background:var(--panel-3);
  color:var(--ink-dim);display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-weight:400;font-size:.82rem;text-align:center;line-height:1.15;
  transition:border-color .15s,color .15s,transform .15s;
}
.seal-btn:hover{border-color:var(--gold);color:var(--gold);}
.seal-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--void);background:var(--gold-gradient);}

/* ===================== v4-A 신규: 원형 CTA 버튼 (화면당 핵심 액션 1개) ===================== */
.btn-circle-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 6px;}
.btn-circle{
  width:68px;height:68px;border-radius:50%;flex:none;padding:0;
  /* 짙은 먹 원 + 밝은 아이콘. 색 역할이 뒤집혔을 뿐 관계(--ink 위에 --void)는 그대로다. */
  background:var(--ink);color:var(--void);border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(58,50,34,.22);
  transition:transform .15s,box-shadow .15s;
}
.btn-circle svg{width:26px;height:26px;stroke:var(--void);fill:none;stroke-width:1.6;}
.btn-circle:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(58,50,34,.28);}
.btn-circle:active{transform:translateY(0) scale(.96);}
.btn-circle[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;}
.btn-circle[disabled]:hover{transform:none;box-shadow:none;}
.btn-circle-label{font-size:.82rem;color:var(--ink-dim);letter-spacing:.03em;}

/* ===================== v4-A 신규: row + chevron 리스트 (설정·입력 화면 공용) ===================== */
/* ★ R44 — 한 줄에 다 안 들어가면 값을 아랫줄로 내린다.
   라벨과 값을 억지로 한 줄에 밀어 넣느라 양쪽이 다 잘리고 있었다
   ('테스트 (…' 와 'ENTJ · 남 · 9202…'). 어느 한쪽을 더 줄이는 것으로는 못 고친다 —
   320px에서는 둘을 합친 길이 자체가 줄 폭을 넘기 때문이다.
   flex-wrap 을 켜면 들어가는 줄은 그대로 한 줄로 두고, 안 들어가는 줄만 두 줄이 된다.
   줄마다 따로 정해 줄 필요가 없어 새로 만드는 화면에도 그대로 적용된다. */
.settings-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:16px 18px;min-height:60px;background:var(--panel);border:1px solid rgba(88,68,22,.12);
  border-radius:var(--r-lg);margin-bottom:12px;width:100%;text-align:left;
  box-shadow:var(--shadow-soft);
  transition:border-color .15s,background .15s,transform .15s;
}
.settings-row:hover,.settings-row:focus-visible{border-color:var(--gold);background:rgba(88,68,22,.06);}
.settings-row:active{transform:scale(.98);background:rgba(88,68,22,.10);}
/* ★ R33 — 값이 잘리던 원인은 여기였다. 라벨이 flex:none이라 절대 줄지 않아서
   라벨이 길면 값(남자 / 1996-01-01)이 밀려나 "남..." 처럼 잘렸다(대표님 제보).
   줄어드는 쪽을 값에서 라벨로 바꾼다 — 값은 짧고 반드시 읽혀야 하는 정보이고,
   라벨은 길어도 앞부분만 봐도 무엇인지 아는 쪽이다. */
.settings-row .sr-label{color:var(--ink-dim);font-size:.88rem;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.settings-row .sr-value-wrap{display:flex;align-items:center;gap:8px;min-width:0;
  /* 아랫줄로 내려갔을 때 왼쪽에 붙지 않고 오른쪽 화살표 자리에 그대로 서 있게 한다. */
  margin-left:auto;}
.settings-row .sr-value{color:var(--ink);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  /* 아랫줄로 내려가면 그 줄을 다 쓸 수 있어야 한다. 62vw로 묶어 두면 내려가서도 잘린다. */
  max-width:100%;text-align:right;flex:0 1 auto;min-width:0;}
.settings-row .sr-chevron{color:var(--gold);flex:none;font-size:1.1rem;line-height:1;opacity:.8;}
.settings-row[disabled],.settings-row.sr-static{cursor:default;}
.sheet-body{display:flex;flex-direction:column;gap:4px;}

/* ===================== v4-A 신규: 원형 도넛 게이지 ===================== */
.donut-gauge{position:relative;display:inline-flex;align-items:center;justify-content:center;margin:0 auto;}
/* R22 — "숫자를 크게, 뒤에 색 원 하나". 도넛 안쪽에 옅은 금빛 원을 깔아 숫자를 앉힌다.
   --gold-soft는 이미 쓰던 값이고 새 색이 아니다. 원은 장식이라 낭독에 잡히지 않는다(::before). */
.donut-gauge::before{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62%;height:62%;border-radius:50%;background:var(--gold-soft);
}
/* white-space:nowrap가 없으면 '74점'이 '74' / '점' 두 줄로 접힌다.
   left:50%로 절대 배치된 요소는 남은 폭(컨테이너의 절반)만 쓸 수 있어서, 글자를 키운 만큼 접힌다.
   실측 스크린샷에서 잡았다. */
.donut-gauge-num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.35rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.05;white-space:nowrap;}
.donut-gauge-num small{display:block;font-family:var(--sans);font-size:.62rem;color:var(--ink-dim);font-weight:400;margin-top:3px;letter-spacing:.06em;}

/* ===================== R22: 큰 숫자 + 뒤에 색 원 하나 (도넛이 아닌 자리용) =====================
   궁합 요약의 "성격으로 본 궁합 / 타고난 기운으로 본 궁합" 두 숫자에 쓴다.
   원은 ::before로 그리므로 DOM에 글자가 늘지 않고, 낭독기에도 잡히지 않는다. */
.big-num{position:relative;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:1.95rem;line-height:1.2;color:var(--gold);font-weight:700;letter-spacing:-.02em;
  min-height:1.9em;padding:0 .18em;}
.big-num::before{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1.72em;height:1.72em;border-radius:50%;background:var(--gold-soft);
}
.big-num > span{position:relative;}

/* ===================== MBTI 그리드 ===================== */
.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;}
.mbti-cell{
  aspect-ratio:1/1;border:1px solid rgba(88,68,22,.22);border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;font-family:var(--sans);
  font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--ink-dim);background:var(--panel-3);
  transition:all .15s;
}
.mbti-cell:hover{border-color:var(--gold);color:var(--ink);background:var(--gold-soft);}
.mbti-cell[aria-pressed="true"]{background:var(--gold-gradient);border-color:transparent;color:var(--void);}
@media (max-width:520px){.mbti-grid{grid-template-columns:repeat(4,1fr);gap:7px;}.mbti-cell{font-size:.85rem;}}

/* ===================== 폼 공통 ===================== */
.field{margin-bottom:18px;}
.field label{display:block;font-size:.85rem;color:var(--ink-dim);margin-bottom:7px;}
.field select,.field input[type=text],.field input[type=number]{
  /* R22 — 입력칸도 둥글게(3px→14px). 높이는 11px×2 + 24px ≈ 46px로 터치 목표를 넘는다.
     R29 — 배경을 카드색이 아니라 흰색(--panel-2)으로 올리고 테두리를 --field-line으로 바꿨다.
     밝은 바탕에서 "카드색 위의 카드색 + 1.4:1 테두리"는 입력칸으로 안 보인다. */
  width:100%;padding:12px 14px;background:var(--panel-2);border:1px solid var(--field-line);
  border-radius:var(--r-md);color:var(--ink);font-size:.95rem;min-height:46px;
}
.field select:focus,.field input:focus{border-color:var(--gold);}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.hour-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.hour-btn{padding:11px 6px;min-height:44px;font-size:.78rem;border:1px solid rgba(88,68,22,.26);background:var(--panel-3);border-radius:var(--r-md);color:var(--ink-dim);transition:border-color .15s,background .15s,color .15s,transform .15s;}
.hour-btn:hover{border-color:var(--gold);color:var(--ink);background:var(--gold-soft);}
.hour-btn:active{transform:scale(.95);}
.hour-btn[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:600;}
.progress-track{height:6px;background:var(--track);border-radius:var(--r-pill);overflow:hidden;margin-bottom:20px;}
.progress-fill{height:100%;border-radius:var(--r-pill);background:var(--red-hi);transition:width .3s ease;}
.seg-toggle{display:flex;border:1px solid rgba(88,68,22,.28);background:var(--panel-3);border-radius:var(--r-pill);overflow:hidden;width:max-content;}
.seg-toggle button{padding:12px 20px;min-height:44px;font-size:.85rem;color:var(--ink-dim);transition:background .15s,color .15s;}
.seg-toggle button:active{opacity:.7;}
.seg-toggle button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold);font-weight:600;}
/* R22 — 체크박스 줄도 손가락으로 누를 수 있는 크기(44px)로. 라벨까지 눌리는 건 for= 덕에 이미 된다. */
.chk-row{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--ink-dim);margin-top:8px;min-height:44px;}
.chk-row input{accent-color:var(--gold);width:22px;height:22px;flex:none;}
.chk-row label{cursor:pointer;padding:6px 0;}

/* 별점 */
.stars{display:flex;gap:2px;}
/* R29 — 안 켜진 별. 별은 글자가 아니라 그림이라 기준이 다르다. 중요한 건 "켜짐 vs 꺼짐"이
   3:1 이상으로 갈리는 것이고, 꺼진 별 자체는 배경에서 은은하게만 보이면 된다.
   --ink-faint(7.3:1)를 그대로 쓰면 켜진 금색과 구분이 안 될 만큼 진해진다. */
.star{width:16px;height:16px;color:#ADA492;}
.star.on{color:var(--gold);}

/* 태그/배지 — 이미 알약이었다. R22에서 여백만 조금 키운다(칩끼리 붙어 보이지 않게). */
.badge{display:inline-block;padding:6px 13px;border:1px solid rgba(88,68,22,.30);background:var(--gold-soft);border-radius:var(--r-pill);font-size:.76rem;color:var(--gold);line-height:1.6;}
.badge-row{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0;}
/* R29 — 네 관계색을 밝은 바탕용으로 내렸다. 전부 카드 배경 대비 7:1 이상(합 7.7 / 충 8.3 / 형 8.1 / 파 7.6). */
.badge-hap{border-color:rgba(63,107,69,.55);background:rgba(63,107,69,.08);color:#3F6B45;}
.badge-chung{border-color:rgba(143,36,19,.55);background:rgba(143,36,19,.07);color:var(--red-hi);}
.badge-hyeong{border-color:rgba(88,68,22,.55);background:var(--gold-soft);color:var(--gold);}
.badge-pa{border-color:rgba(61,100,128,.55);background:rgba(61,100,128,.08);color:#3D6480;}
.warn-box{border:1px dashed rgba(143,36,19,.55);background:rgba(143,36,19,.06);border-radius:var(--r-md);padding:14px 16px;font-size:.85rem;color:#6E2314;margin:14px 0;line-height:1.75;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-card);}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gap-card);}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}

/* 요약 카드 4분할 */
.stat-mini{background:var(--panel-3);border:1px solid rgba(88,68,22,.14);border-radius:var(--r-md);padding:14px 12px;text-align:center;}
.stat-mini .k{font-size:.72rem;color:var(--ink-dim);margin-bottom:5px;}
.stat-mini .v{font-family:var(--sans);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;color:var(--gold);}

/* 온보딩 */
.onboard{min-height:calc(100vh - 0px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:22px;}
.constellation{width:min(320px,80vw);height:min(320px,80vw);}
.constellation line{stroke:var(--gold);stroke-width:1;opacity:.55;stroke-dasharray:60;stroke-dashoffset:60;animation:drawLine 1.8s ease forwards;}
.constellation circle{fill:var(--gold);opacity:0;animation:popDot .4s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes drawLine{to{stroke-dashoffset:0;}}
@keyframes popDot{to{opacity:1;}}
.onboard h1{font-size:1.9rem;font-weight:700;letter-spacing:-.03em;color:var(--gold);}
.onboard p{color:var(--ink-dim);max-width:40ch;}

/* 히스토리 리스트 — R22: 목록 한 줄도 "작은 카드"로 보이게 둥글리고 여백을 준다 */
.hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1px solid rgba(88,68,22,.14);border-radius:var(--r-md);margin-bottom:10px;background:var(--panel-3);transition:border-color .15s,background .15s;}
.hist-item:hover{border-color:var(--gold);background:var(--gold-soft);}
.hist-item .meta{font-size:.78rem;color:var(--ink-dim);line-height:1.6;}
.hist-actions{display:flex;gap:6px;}
.tabgroup{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tabgroup button{padding:12px 16px;min-height:44px;border:1px solid rgba(88,68,22,.26);background:var(--panel-3);border-radius:var(--r-pill);font-size:.82rem;color:var(--ink-dim);transition:background .15s,color .15s,border-color .15s;}
.tabgroup button:active{opacity:.7;}
.tabgroup button[aria-selected="true"]{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);font-weight:600;}

/* 모달 */
/* R29 — 뒤 가림막. 밝은 화면이라 검정 72%는 너무 무겁다. 따뜻한 먹 42%로 낮춰
   "뒤가 비쳐 보이되 앞이 확실히 앞"인 정도만 남긴다. */
.modal-backdrop{position:fixed;inset:0;background:rgba(38,33,25,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:modalFade .2s ease both;}
.modal-box{background:var(--panel-2);border:1px solid rgba(88,68,22,.14);border-radius:var(--r-lg);max-width:480px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow);animation:modalIn .3s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes modalFade{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-box h3{color:var(--gold);margin-bottom:12px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* 토스트 */
/* R29 — 토스트는 짙은 먹 알약. 밝은 화면에서 흰 알약을 띄우면 배경에 묻힌다. */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2B261D;border:1px solid rgba(88,68,22,.5);color:var(--void);padding:11px 20px;border-radius:30px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;box-shadow:var(--shadow-sm);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 레이더차트 */
.radar-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
.legend{display:flex;gap:18px;font-size:.8rem;flex-wrap:wrap;justify-content:center;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;}

/* 매듭 애니메이션 */
.knot-wrap{display:flex;justify-content:center;margin:14px 0;}
.knot-path{stroke-dasharray:400;stroke-dashoffset:400;animation:knotDraw 1.4s ease forwards .2s;}
@keyframes knotDraw{to{stroke-dashoffset:0;}}

.gauge-num{font-family:var(--sans);font-weight:700;letter-spacing:-.03em;font-size:2.6rem;color:var(--gold);text-align:center;}
.gauge-label{text-align:center;color:var(--ink-dim);font-size:.85rem;margin-bottom:6px;}

.disclaimer{font-size:.8rem;color:var(--ink-dim);text-align:center;margin-top:26px;line-height:1.8;border-top:1px dashed rgba(88,68,22,.30);padding-top:16px;}
/* R32 — .disclaimer-wrap(계산 한계 고지 + 접이식) 규칙은 지웠다. 그 덩어리를 화면에서 뺐기 때문이다.
   ★ .disclaimer 자체는 남긴다 — MBTI·캐릭터·용어사전·궁합 고지 7곳이 아직 이 클래스를 쓴다. */

/* =====================================================================
   R34 — 사이트 공통 하단(푸터)
   ---------------------------------------------------------------------
   ★ 사업자 정보는 "굉장히 잘 보이지 않게"가 지시였다. 다만 전자상거래법 제13조
     표시의무 항목이라 아예 숨기거나 읽을 수 없게 만들면 안 된다.
     그래서 글자를 작게·연하게 두되 대비는 4.5:1 위로 유지한다(--ink-faint).
     "눈에 안 띈다"와 "못 읽는다"는 다르고, 지켜야 할 선은 후자다.
===================================================================== */
.site-footer{margin:34px 0 8px;padding:22px 14px 8px;border-top:1px solid rgba(88,68,22,.16);text-align:center;}
.site-footer .fl-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;margin-bottom:14px;}
.site-footer .fl{background:none;border:0;padding:4px 2px;font-family:inherit;font-size:.84rem;
  color:var(--ink-dim);cursor:pointer;text-decoration:none;line-height:1.4;}
.site-footer .fl:hover,.site-footer .fl:focus-visible{color:var(--gold);text-decoration:underline;}
.site-footer .biz{margin-top:16px;}
.site-footer .biz p{font-size:.68rem;color:var(--ink-faint);line-height:1.75;margin:0;}
.site-footer .copy{margin-top:10px;font-size:.68rem;color:var(--ink-faint);}
/* R35 — 궁합 근거 목록 */
.reason-list{margin:0;padding:0;list-style:none;}
.reason-list li{position:relative;padding:6px 0 6px 16px;font-size:.88rem;line-height:1.7;color:var(--ink);}
.reason-list li::before{content:'';position:absolute;left:2px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.65;}
.share-preview{display:flex;justify-content:center;margin:18px 0;}
.share-preview canvas{border:1px solid rgba(88,68,22,.24);border-radius:var(--r-md);max-width:100%;height:auto;box-shadow:var(--shadow-soft);}

.empty-state{text-align:center;padding:48px 18px;color:var(--ink-dim);}
.empty-state .glyph{font-size:2.4rem;color:var(--gold);margin-bottom:10px;}
/* R22 — 빈 화면의 '印' 글자 자리에 캐릭터를 세운다. 화면이 비어 있을 때야말로
   말 없이 분위기를 만들 수 있는 자리이고, 여기에는 계산 근거·고지·결제가 없다. */
.empty-state .empty-char{display:flex;justify-content:center;margin-bottom:14px;}
.empty-state .empty-char .char-svg{border-radius:50%;background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);padding:8px;color:var(--ink);}
.empty-state h3{font-size:1.12rem;color:var(--ink);margin-bottom:6px;font-weight:600;}
.empty-state .section-sub{margin-bottom:18px;}

.profile-list-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid rgba(88,68,22,.16);border-radius:var(--r-md);margin-bottom:10px;}
.profile-list-item.active{border-color:var(--red-hi);}

/* ===================== v2: 사주팔자 인장 표 ===================== */
.pillar-table{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:10px;margin:14px 0;}
.pillar-col{display:flex;flex-direction:column;align-items:center;gap:8px;}
.pillar-col .col-label{font-size:.72rem;color:var(--ink-dim);}
.pillar-seal{
  width:100%;aspect-ratio:1/1;max-width:78px;border-radius:14px;border:1px solid rgba(88,68,22,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--panel-3);position:relative;
}
.pillar-seal .ch{font-size:1.35rem;color:var(--ink);line-height:1.1;}
/* R29 — 실측으로 잡은 자리. 밝은 바탕에서 이 한자 라벨의 계산이 통째로 무효가 됐다.
   opacity:.72는 어두운 바탕에서는 글자를 "어둡게" 만들지만 밝은 바탕에서는 "밝게" 만든다.
   실제로 재 보니 5.84~5.91:1로 본문 기준(7:1) 아래였다 — 나는 9:1일 거라고 예측했고 틀렸다.
   불투명도 장난을 걷어내고 실제 색 하나(--ink-dim)를 쓴다. 위 한글(--ink)보다 흐리다는
   위계는 그대로 남고, 오행 타일 다섯 종 위에서 전부 7:1을 넘는다. */
.pillar-seal .ch-h{font-size:.68rem;color:var(--ink-dim);}
/* 오행 타일 — 밝은 바탕에서는 알파를 절반 이하로 낮춰야 "은은한 톤"이 된다.
   예전 값(.16~.18)을 그대로 두면 밝은 종이 위에 색종이를 붙인 것처럼 튄다. */
.pillar-seal.elem-0{background:rgba(63,107,69,.11);border-color:rgba(63,107,69,.45);}
.pillar-seal.elem-1{background:rgba(180,68,44,.10);border-color:rgba(180,68,44,.45);}
.pillar-seal.elem-2{background:rgba(126,95,44,.12);border-color:rgba(126,95,44,.48);}
.pillar-seal.elem-3{background:rgba(100,107,112,.12);border-color:rgba(100,107,112,.45);}
.pillar-seal.elem-4{background:rgba(61,100,128,.10);border-color:rgba(61,100,128,.45);}
.pillar-sipseong{font-size:.68rem;color:var(--gold);min-height:1em;}
.pillar-table-scroll{overflow-x:auto;padding-bottom:2px;}
/* R27 — 궁합처럼 두 사람을 나란히 놓는 자리에서 한쪽만 시주가 없으면 기둥이 4개와 3개로 갈려
   같은 항목이 서로 다른 자리에 선다(비교가 안 된다). 그 자리를 지우지 않고 비워 두는 칸이다.
   글자 두 줄(시간/모름)을 넣어 "무슨 칸이 비었는지"를 알 수 있게 한다 — 빈칸만 두지 않는다.
   높이는 위 칸 두 개 + 사이 간격을 합친 만큼 늘어난다(.pillar-col이 격자 행 높이만큼 늘어나고
   여기서 flex:1로 남은 높이를 받는다). 새 색을 만들지 않고 --ink-dim(대비 10.00:1)만 쓴다. */
.pillar-seal.is-empty{
  aspect-ratio:auto;flex:1 1 auto;min-height:64px;border-style:dashed;background:transparent;gap:2px;
}
.pillar-seal.is-empty .ch-empty{font-size:.7rem;color:var(--ink-dim);line-height:1.3;letter-spacing:.02em;}
@media (max-width:520px){ .pillar-table{gap:6px;} .pillar-seal{max-width:60px;} .pillar-seal .ch{font-size:1.05rem;} .pillar-seal.is-empty{min-height:52px;} }
@media (max-width:380px){ .pillar-seal{max-width:50px;} .pillar-seal .ch-h{font-size:.6rem;} .pillar-seal.is-empty{min-height:44px;} .pillar-seal.is-empty .ch-empty{font-size:.62rem;} }

/* 오행 도넛/막대 */
.elem-bars{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.elem-bar-row{display:flex;align-items:center;gap:10px;font-size:.8rem;}
.elem-bar-row .lbl{width:28px;color:var(--ink-dim);flex:none;}
.elem-bar-track{flex:1;height:10px;background:var(--track);border-radius:6px;overflow:hidden;}
.elem-bar-fill{height:100%;border-radius:6px;transition:width .4s ease;}
.elem-bar-row .num{width:20px;text-align:right;color:var(--ink-dim);flex:none;}

/* 목차 앵커 */
/* R29 — sticky로 떠 있는 띠라 반투명하면 밑의 글자가 비쳐 읽기 어렵다. 불투명 카드색 + 그림자로 띄운다. */
.toc-nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border:1px solid rgba(88,68,22,.14);border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow-soft);margin-bottom:20px;position:sticky;top:8px;z-index:5;max-height:196px;overflow-y:auto;}
/* R22 — 목차 칩도 44px 이상. 알약 모양은 예전부터 이 형태였고, 높이만 손가락 크기에 맞췄다. */
.toc-nav a{font-size:.74rem;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;gap:2px;border:1px solid rgba(88,68,22,.26);background:var(--panel-3);border-radius:var(--r-pill);color:var(--ink-dim);white-space:nowrap;transition:color .15s,border-color .15s,background .15s;}
.toc-nav a:hover{color:var(--gold);border-color:var(--gold);background:var(--gold-soft);}
.toc-nav a:active{opacity:.7;}
/* 잠긴 항목. 밝은 바탕에서 opacity .62를 그대로 쓰면 글자가 4:1대로 떨어진다(직전 라운드에
   대표님이 "안 보인다"고 하신 것과 같은 함정). 불투명도 대신 점선 테두리로만 구분한다. */
.toc-nav a.toc-locked{opacity:1;border-style:dashed;color:var(--ink-faint);}
.toc-nav a.toc-locked:hover{opacity:1;color:var(--gold);border-color:var(--gold);}
.report-section{scroll-margin-top:80px;margin-bottom:26px;}
.report-section h3{display:flex;align-items:center;gap:11px;color:var(--gold);font-size:1.1rem;margin-bottom:12px;line-height:1.45;font-weight:600;}
.report-section .sec-icon{width:19px;height:19px;flex:none;color:var(--gold);}
.report-section p{margin-bottom:12px;color:var(--ink);line-height:1.9;}
.report-section p strong{color:var(--gold);}
.next-sec-btn{display:flex;justify-content:center;margin:30px 0 8px;}

/* ===================== R22: 아이콘을 옅은 원 배경에 담기 =====================
   레퍼런스에서 목록 항목마다 왼쪽에 동그란 옅은 배경 + 아이콘이 있었다.
   여기서는 리포트 섹션 제목(13섹션 × 2종)에 같은 규칙을 준다. 새 색을 만들지 않고
   이미 있는 --gold-soft(배경) + --gold-line(테) + --gold(선)만 조합한다. */
.icon-dot{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:36px;height:36px;border-radius:50%;
  background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);color:var(--gold);
}

/* 대운 타임라인 */
.daewoon-scroll{display:flex;gap:10px;overflow-x:auto;padding:16px 4px 20px;}
.daewoon-item{flex:none;width:92px;min-height:44px;text-align:center;border:1px solid rgba(88,68,22,.18);border-radius:var(--r-md);padding:12px 7px;background:var(--panel-3);transition:border-color .15s,background .15s,transform .15s;}
.daewoon-item:hover{border-color:var(--gold);background:var(--gold-soft);}
.daewoon-item:active{transform:scale(.97);}
.daewoon-item.current{border-color:var(--red-hi);background:rgba(143,36,19,.07);}
.daewoon-item .age{font-size:.72rem;color:var(--ink-dim);margin-bottom:6px;}
.daewoon-item .gz{font-size:1.1rem;color:var(--ink);}
.daewoon-item .ss{font-size:.68rem;color:var(--gold);margin-top:4px;}
/* 점은 CSS로 "그린다". content에 '●' 글자를 넣으면 낭독기가 "검은 원"이라고 읽는다.
   '현재'라는 뜻은 CSS가 아니라 DOM의 실제 텍스트가 전달한다(아래 .age 안의 '현재 '). */
.daewoon-item.current .age::before{content:'';display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--red-hi);margin-right:5px;vertical-align:middle;}

/* ===================== R20: 월별 흐름 12칸 격자 =====================
   예전에는 대운 타임라인과 같은 .daewoon-scroll(가로 스크롤)을 재사용했다. 대운은 개수가
   사람마다 다르지만 월별은 언제나 정확히 12개이고, "12월까지 한눈에" 보이는 것이 이 화면의 목적이다.
   그래서 월별만 격자로 떼어냈다(대운 타임라인은 그대로 둔다).
   320px에서 3열(타일 폭 약 92px), 480px 이상에서 4열 — 어느 쪽이든 12개가 가로 스크롤 없이 다 들어간다. */
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0 4px;}
@media (min-width:480px){ .month-grid{grid-template-columns:repeat(4,1fr);} }
.month-cell{
  text-align:center;border:1px solid rgba(88,68,22,.18);border-radius:var(--r-md);padding:12px 5px 13px;min-height:44px;
  background:var(--panel-3);transition:border-color .15s,background .15s,transform .15s;
}
.month-cell:hover{border-color:var(--gold);background:var(--gold-soft);}
.month-cell:active{transform:scale(.97);}
.month-cell.current{border-color:var(--red-hi);background:rgba(143,36,19,.07);}
.month-cell .mc-top{font-size:.7rem;color:var(--ink-dim);margin-bottom:4px;line-height:1.3;}
.month-cell .mc-gz{font-size:1.02rem;color:var(--ink);line-height:1.2;}
.month-cell .mc-st{font-size:.68rem;color:var(--gold);margin-top:3px;}
/* 대운 타일과 같은 방식 — '현재'라는 뜻은 CSS가 아니라 DOM의 실제 글자가 전달하고, 점은 CSS로 그린다. */
.month-cell.current .mc-top::before{content:'';display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--red-hi);margin-right:4px;vertical-align:middle;}
@media (max-width:360px){
  .month-grid{gap:6px;}
  .month-cell{padding:7px 2px 8px;}
  .month-cell .mc-gz{font-size:.92rem;}
  .month-cell .mc-top{font-size:.64rem;}
  .month-cell .mc-st{font-size:.62rem;}
}

/* ===================== R20: 진태양시 보정 안내표 ===================== */
.ts-table{display:flex;flex-direction:column;gap:0;margin:8px 0 4px;}
.ts-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid rgba(35,31,24,.10);font-size:.84rem;}
.ts-row:last-child{border-bottom:0;}
.ts-row .ts-k{color:var(--ink-dim);flex:none;}
.ts-row .ts-v{color:var(--ink);text-align:right;word-break:keep-all;}
.ts-row.ts-strong .ts-v{color:var(--gold);font-weight:600;}
.ts-note{font-size:.78rem;color:var(--ink-faint);line-height:1.65;margin-top:8px;}
/* R29 — 밝은 바탕으로 뒤집으니 --red-hi(#8F2413)가 흰 모달 위에서 8.7:1이 된다.
   예전에 별도 값(#f0846f)을 쓰던 이유(어두운 배경에서 AA 미달)가 사라져 변수로 되돌린다.
   색 수를 늘리지 않는 쪽이 대표님이 말한 "고급스러움"에 맞다. */
.unsaved-line{font-size:.8rem;color:var(--red-hi);margin-top:10px;line-height:1.5;}
/* 마이그레이션 안내 — 조용히 바꾸지 않았다는 사실을 사용자 화면에 남긴다 */
.migrate-box{border:1px solid rgba(88,68,22,.24);background:var(--gold-soft);border-radius:var(--r-md);padding:14px 16px;margin:14px 0;font-size:.84rem;line-height:1.8;color:var(--ink);}
.migrate-box strong{color:var(--gold);display:block;margin-bottom:4px;}

/* ===================== v4: 유료 구간(페이월) ===================== */
/* 잠긴 구간은 "가려져 있다"가 눈에 보여야 한다. 내용을 통째로 지우면
   무엇을 사는 건지 알 수 없고, 다 보여주면 잠글 이유가 없다. */
.locked-block{position:relative;margin:20px 0;border:1px dashed rgba(88,68,22,.34);border-radius:var(--r-lg);overflow:hidden;background:var(--panel);box-shadow:var(--shadow-soft);}
.locked-count{padding:10px 16px 0;font-size:.78rem;color:var(--gold);letter-spacing:.02em;}
.locked-teaser{position:relative;padding:12px 16px 0;color:var(--ink-dim);font-size:.9rem;line-height:1.7;
  max-height:76px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 35%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 35%,transparent 100%);}
.locked-cta{padding:14px 18px 20px;text-align:center;}
.locked-icon{margin-bottom:6px;line-height:0;}
/* 잠금 아이콘(이모지 대체 SVG) — 글자 크기를 따라가므로 목차·버튼·카드 어디에 넣어도 주변과 맞는다 */
.lock-icon{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;margin-right:.28em;color:var(--gold);}
/* 버튼 라벨 앞에 붙는 라인아트 아이콘(초대 링크·그룹 네트워크) — 이모지 대체 */
.btn-lead-icon{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;margin-right:.35em;color:var(--gold);}
/* 방향 표시 아이콘(↓ ↑ → ← ›의 대체) — 문자로 두면 낭독기가 "아래쪽 화살표"처럼 이름을 그대로 읽는다.
   .btn이 inline-flex + gap:8px이므로 별도 여백 없이 라벨과 나란히 놓인다. */
.dir-icon{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;color:currentColor;opacity:.85;}
.locked-icon .lock-icon{width:1.6rem;height:1.6rem;margin-right:0;vertical-align:middle;}
.locked-title{font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:4px;}
.locked-desc{font-size:.84rem;color:var(--ink-dim);margin-bottom:12px;line-height:1.6;}
.compat-upsell{margin-top:20px;padding:20px 18px;border:1px solid rgba(88,68,22,.24);border-radius:var(--r-lg);background:var(--gold-soft);text-align:center;}
.compat-upsell p{font-size:.86rem;color:var(--ink-dim);line-height:1.7;margin-bottom:12px;}

/* 결제 화면 */
.pay-product{text-align:center;padding:6px 0 14px;border-bottom:1px solid rgba(88,68,22,.24);margin-bottom:14px;}
.pay-name{font-size:1.05rem;font-weight:600;color:var(--ink);}
.pay-price{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;color:var(--gold);margin:6px 0;}
.pay-desc{font-size:.85rem;color:var(--ink-dim);line-height:1.6;}
.pay-benefits{list-style:none;padding:0;margin:0 0 14px;}
.pay-benefits li{position:relative;padding-left:20px;font-size:.87rem;color:var(--ink-dim);line-height:2;}
/* 체크 표시를 '✓' 문자로 두면 낭독기가 항목마다 "체크 표시"를 읽는다.
   글자 대신 테두리 두 변을 기울여 그린다 — 화면에는 같은 체크가 보이고 읽히는 글자는 없다. */
.pay-benefits li::before{content:'';position:absolute;left:2px;top:.78em;width:9px;height:5px;
  border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg);}
.pay-upsell{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:14px;border-radius:var(--r-md);background:var(--gold-soft);font-size:.82rem;color:var(--ink-dim);margin-bottom:14px;}
/* 결제 미연동 상태를 숨기면 "결제되는 것처럼" 보인다. 눈에 띄게 알린다. */
.pay-demo-notice{padding:14px 16px;border:1px solid var(--red);border-radius:var(--r-md);background:rgba(143,36,19,.06);margin-bottom:8px;}
.pay-demo-notice strong{display:block;color:var(--red-hi);font-size:.88rem;margin-bottom:6px;}
.pay-demo-notice p{font-size:.8rem;color:var(--ink-dim);line-height:1.65;margin:0 0 6px;}
.pay-demo-notice p:last-child{margin-bottom:0;}
/* 체험 모드 배지 — "실제 결제가 아니다"를 결제 관련 화면 어디서든 같은 모양으로 알린다 */
.trial-badge{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--red);
  /* R29 — 밝은 바탕에서는 --red-hi가 자기 배경(rgba(143,36,19,.07)) 위에서 7.9:1이라
     R22에서 따로 만들었던 밝은 주홍이 더 이상 필요 없다. 변수 하나로 되돌린다. */
  background:rgba(143,36,19,.05);color:var(--red-hi);font-size:.74rem;font-weight:700;letter-spacing:0;margin-bottom:8px;}
/* 법적 고지 모달 본문 */
.legal-body{font-size:.85rem;color:var(--ink-dim);line-height:1.75;}
.legal-body h4{color:var(--gold);font-size:.92rem;margin:14px 0 6px;font-weight:600;}
.legal-body h4:first-child{margin-top:0;}
.legal-body p{margin-bottom:8px;}
.legal-body ul{margin:0 0 8px 18px;}
.legal-body li{margin-bottom:4px;}
.legal-body .pending{color:var(--red-hi);}
.legal-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.legal-links button{font-size:.8rem;padding:7px 12px;}
.pay-legal-line{font-size:.78rem;color:var(--ink-faint);line-height:1.6;margin-top:10px;}
/* 영수증(복원) 번호 — 옮겨 적어야 하는 값이라 눈에 띄고 선택하기 쉬워야 한다 */
.receipt-code{margin-top:8px;padding:14px 16px;border:1px dashed rgba(88,68,22,.34);border-radius:var(--r-md);
  background:rgba(88,68,22,.05);user-select:all;-webkit-user-select:all;}
.receipt-code code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem;
  color:var(--gold);word-break:break-all;letter-spacing:.03em;}

/* 지금 풀이를 무엇이 만들고 있는지 알리는 띠 */
.interp-notice{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:12px 16px;margin:16px 0;border-radius:var(--r-md);background:var(--panel-3);
  border:1px solid rgba(35,31,24,.10);font-size:.8rem;color:var(--ink-dim);line-height:1.6;}
.interp-notice.on{border-color:var(--gold-line);}
.interp-notice.warn{border-color:var(--red);}
.interp-badge{flex:0 0 auto;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--gold-soft);color:var(--gold);letter-spacing:.02em;}
.interp-notice.on .interp-badge{background:var(--gold-gradient);color:var(--void);}
.interp-err{color:var(--red-hi);}

/* 설정: 구매 내역 / 연동 */
.biz-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(35,31,24,.10);font-size:.86rem;}
.biz-row:last-child{border-bottom:0;}
.biz-row .k{color:var(--ink-dim);}
.biz-row .v{color:var(--ink);font-weight:600;text-align:right;}
.biz-input{width:100%;padding:12px 14px;min-height:46px;border-radius:var(--r-md);border:1px solid var(--field-line);
  background:var(--panel-2);color:var(--ink);font-size:.85rem;margin-top:6px;}
.biz-hint{font-size:.76rem;color:var(--ink-faint);line-height:1.65;margin-top:6px;}

/* 궁합 요약 좌우 배치 */
.compat-pair{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:14px 0;}
.compat-side{flex:1;min-width:200px;}
.compat-side h4{text-align:center;font-size:.9rem;color:var(--ink-dim);margin-bottom:8px;}
.compat-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
@media (max-width:640px){.compat-summary-grid{grid-template-columns:1fr;}}
.tier-label{display:inline-block;margin-top:4px;padding:5px 14px;border-radius:20px;background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);color:var(--gold);font-family:var(--sans);font-weight:700;font-size:.95rem;letter-spacing:-.01em;}

/* ===================== R21: 궁합 항목별 지표(일상어 막대) + 접어 둔 전문 용어 =====================
   지표 자체는 새 계산이 아니다 — computeCompat/buildSajuCompat이 이미 내던 하위 점수를
   막대 폭으로 바꿔 그릴 뿐이다(항목↔계산 대응표는 COMPAT_METRICS 주석 참고). */
.cm-verdict-line{text-align:center;color:var(--ink);font-size:.98rem;line-height:1.85;margin:12px 0 2px;}
.cm-mix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 2px;}
/* R22 — 두 칸을 "숫자가 주인공"인 타일로. 라벨은 작은 회색, 숫자는 크고 뒤에 색 원. */
.cm-mix-cell{padding:16px 13px 14px;border:1px solid rgba(88,68,22,.14);border-radius:var(--r-md);background:var(--panel-3);text-align:center;}
.cm-mix-k{font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:6px;}
.cm-mix-v{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:1.15rem;color:var(--gold);}
.cm-mix-note{font-size:.78rem;color:var(--ink-faint);line-height:1.8;margin-top:11px;}
.cm-list{display:flex;flex-direction:column;gap:15px;margin:16px 0 2px;}
.cm-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
.cm-label{font-size:.93rem;color:var(--ink);word-break:keep-all;}
.cm-num{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:.95rem;color:var(--gold);flex:none;}
.cm-track{height:9px;border-radius:6px;background:var(--track);overflow:hidden;}
.cm-fill{height:100%;border-radius:6px;transition:width .45s cubic-bezier(.2,1.4,.4,1);}
.cm-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:5px;font-size:.78rem;}
.cm-verdict{color:var(--ink-dim);line-height:1.6;}
.cm-src{color:var(--ink-faint);flex:none;}
/* "왜 이런 결과가 나왔나요?" — 합충형파·십성·간지 같은 용어는 전부 이 안으로 옮겨 접어 둔다.
   지운 게 아니라 자리를 옮긴 것이다(아는 사람에게는 이게 근거다). */
.why-panel{margin-top:14px;padding:16px 17px;border:1px solid rgba(88,68,22,.14);border-radius:var(--r-md);background:var(--panel-3);}
.why-panel h4{font-size:.88rem;color:var(--gold);margin:14px 0 6px;font-weight:600;}
.why-panel h4:first-child{margin-top:0;}
.why-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(35,31,24,.10);font-size:.82rem;}
.why-row:last-child{border-bottom:0;}
.why-row .why-k{color:var(--ink-dim);}
.why-row .why-v{color:var(--ink);text-align:right;word-break:keep-all;}
.why-note{font-size:.8rem;color:var(--ink-dim);line-height:1.75;margin-top:10px;}
@media (max-width:420px){ .cm-mix{grid-template-columns:1fr;} }

/* ===================== R21: 대운 기운 강도 흐름 그래프 =====================
   가로 스크롤 타임라인만으로는 "언제가 크게 열리는지"가 안 보인다. 나이(가로)×강도(세로)
   선 그래프를 SVG로 직접 그린다(외부 라이브러리 없음). 강도·그래프는 별점과 같은 성격의
   무료 요약 지표이고, 구간별 상세 문장의 잠금 규칙은 건드리지 않는다. */
.dw-flow{margin:10px 0 2px;}
.dw-flow svg{width:100%;height:auto;display:block;}
.dw-peak{border:1px solid rgba(88,68,22,.24);background:var(--gold-soft);border-radius:var(--r-md);padding:16px 17px;margin:14px 0 4px;font-size:.9rem;line-height:1.9;color:var(--ink);}
.dw-peak strong{color:var(--gold);}
/* R29 — 밝은 바탕에서 --gold-soft는 아주 옅은 미색이라 --ink-dim이 그 위에서 8.4:1이다.
   R21에 따로 만들었던 밝은 회색(#b7ada0)은 이유가 사라졌으므로 변수로 되돌린다. */
.dw-now{font-size:.82rem;color:var(--ink-dim);line-height:1.7;margin-top:6px;}
.daewoon-item .dw-str{height:4px;border-radius:3px;background:var(--track);overflow:hidden;margin:7px 2px 3px;}
.daewoon-item .dw-str i{display:block;height:100%;border-radius:3px;background:var(--gold);}
.daewoon-item .dw-strnum{font-size:.64rem;color:var(--ink-dim);}
/* 가장 큰 구간 표시. .current(빨간 테두리)와 겹쳐도 서로 지우지 않도록 테두리가 아닌 안쪽 선으로 그린다. */
.daewoon-item.peak{box-shadow:inset 0 0 0 1px var(--gold);}
.dw-why-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid rgba(35,31,24,.10);font-size:.82rem;}
.dw-why-row:last-child{border-bottom:0;}
.dw-why-row .dwy-k{color:var(--ink);}
.dwy-parts{width:100%;font-size:.75rem;color:var(--ink-faint);line-height:1.6;}
.dw-why-row .dwy-v{color:var(--gold);font-family:var(--sans);font-weight:700;letter-spacing:-.02em;flex:none;}

/* ===================== v3: 모임(그룹) 궁합 네트워크 (기능17) — R28에서 30명까지 =====================
   무대(.gc-stage)는 언제나 정사각형이고 가로는 부모 폭을 넘지 않는다. 사람 자리·아바타 크기·
   이름표 글자 크기는 전부 JS가 인원수에 맞춰 넣어주는 세 변수(--gc-av / --gc-fs / --gc-tagfs)로만
   바뀐다. 값을 CSS 여기저기 흩어 적지 않는 이유는, 인원별 겹침 계산을 JS 한 곳(gcLayoutSpec)에서만
   하기 위해서다 — 두 곳에 적으면 한쪽만 고쳐 놓고 안 겹친다고 착각하게 된다. */
.gc-stage{position:relative;width:100%;aspect-ratio:1/1;max-width:var(--gc-max,520px);margin:0 auto;}
.gc-svg{position:absolute;inset:0;width:100%;height:100%;}
.gc-line{transition:opacity .2s ease;}
/* 선 위에 붙는 관계 이름표(일상어). 그림 설명은 .gc-svg의 aria-label이 대신하므로 낭독에서 뺀다. */
.gc-tags{position:absolute;inset:0;pointer-events:none;}
/* R29 — 이름표 바탕. 어두울 때는 검정 86%였다. 밝은 화면에서 그대로 두면 선 위에
   검은 알약이 떠서 그림을 뚫는다. 종이색 92%로 바꾸고 글자는 등급색(전부 7:1 이상)을 쓴다. */
.gc-tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:var(--gc-tagfs,10px);line-height:1.25;padding:2px 7px;border-radius:var(--r-pill);
  border:1px solid currentColor;background:rgba(252,250,246,.93);font-weight:600;}
/* R22 — 노드 지름을 clamp(36..) → clamp(44..)로 올렸다. 320px 화면에서도 44px 터치 목표를 넘긴다.
   R28 — 인원이 20명을 넘으면 그림이 겹치지 않게 아바타 그림만 줄이고, 누르는 자리(min-width/height)는
   44px 그대로 둔다. 그림은 작아져도 손가락 목표는 줄이지 않는다. */
.gc-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;min-width:44px;min-height:44px;transition:opacity .2s ease;}
/* R29 실측으로 잡은 자리 — 여기서도 opacity의 뜻이 뒤집혔다.
   어두운 화면에서 opacity:.3은 "어둠에 잠기게" 했지만, 밝은 화면에서는 "종이에 지워지게" 만든다.
   실제로 재 보니 흐려진 사람의 이름이 1.66:1로 사실상 안 보였다(누른 순간 다른 사람 이름이 사라진다).
   R28이 적어 둔 원래 의도는 "나머지 **얼굴**이 흐려진다"였으므로, 흐리게 하는 대상을 얼굴로 좁히고
   이름은 한 단 흐린 색(--ink-faint, 7.2:1)으로만 물러나게 한다. */
.gc-node.dim{opacity:1;}
.gc-node.dim .gc-avatar{opacity:.34;}
.gc-node.dim .gc-label{color:var(--ink-faint);}
.gc-avatar{width:var(--gc-av,clamp(44px,10vw,58px));height:var(--gc-av,clamp(44px,10vw,58px));
  border-radius:50%;border:2px solid rgba(88,68,22,.28);background:var(--panel-3);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--sans);font-weight:700;font-size:1rem;color:var(--ink);
  transition:border-color .15s,box-shadow .15s;}
.gc-avatar .char-svg{width:100%;height:100%;}
.gc-node:hover .gc-avatar{border-color:var(--gold);}
.gc-node:focus-visible .gc-avatar{border-color:var(--gold);box-shadow:0 0 0 3px rgba(88,68,22,.26);}
.gc-node[aria-pressed="true"] .gc-avatar{border-color:var(--red-hi);box-shadow:0 0 0 3px rgba(143,36,19,.18);}
/* ★ R32 — 이름표가 SVG 관계선·다른 사람 얼굴 위에 그대로 얹혀 최저 1.18:1까지 떨어졌다(검수 실측).
   글자색을 바꿔도 밑에 무엇이 지나갈지 알 수 없으므로, 글자 뒤에 종이색 알약을 깔아
   "밑에 무엇이 있든 같은 바탕"을 만든다. 이러면 대비가 바탕색 하나로 고정된다. */
.gc-label{font-size:var(--gc-fs,11px);line-height:1.25;color:var(--ink-dim);white-space:nowrap;overflow:hidden;
  /* ★ box-sizing이 border-box라, 알약 padding(좌우 5px씩)을 그냥 얹으면 글자가 쓸 수 있는 폭이
     10px 줄어 좁은 화면에서 이름이 더 빨리 "…"로 잘린다. 그래서 max-width를 딱 그만큼 늘려
     **글자가 쓰는 폭은 예전과 같게** 맞춘다(알약만 바깥으로 커진다). */
  text-overflow:ellipsis;max-width:calc(var(--gc-av,44px) + 10px + 10px);text-align:center;
  background:var(--base);padding:1px 5px;border-radius:7px;
  box-shadow:0 0 0 2px var(--base);   /* 알약 바깥 2px까지 같은 바탕 — 획이 테두리에 닿아도 선과 안 겹친다 */
  position:relative;z-index:2;}
.gc-node[aria-pressed="true"] .gc-label{color:var(--gold);}
.gc-hint{text-align:center;color:var(--ink-dim);font-size:.84rem;margin:16px 0 0;}
.gc-legend{display:flex;flex-wrap:wrap;gap:9px 16px;justify-content:center;margin:14px 0 4px;font-size:.78rem;color:var(--ink-dim);}
.gc-legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
/* R21·R23 규칙 그대로 — 일상어를 앞에 크게, 원래 등급 이름은 뒤에 작게. */
.gc-legend .gl-term{color:var(--ink-faint);font-size:.68rem;margin-left:4px;}
.gc-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-card);margin-top:24px;}
.gc-pair-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px dashed rgba(88,68,22,.28);font-size:.82rem;}
/* 그룹 멤버 고르기 칩 */
.gc-members{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px;}
.gc-member{min-height:44px;padding:9px 14px;border-radius:var(--r-pill);border:1px solid rgba(88,68,22,.26);background:var(--panel-3);
  color:var(--ink-dim);font-size:.8rem;transition:background .15s,color .15s,border-color .15s;}
.gc-member:hover{border-color:var(--gold);color:var(--ink);}
.gc-member[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:600;}
/* 전체 순위 목록 */
.gc-rank-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(35,31,24,.10);font-size:.85rem;}
.gc-rank-row:last-child{border-bottom:0;}
.gc-rank-row .gr-no{color:var(--ink-faint);font-size:.74rem;flex:none;min-width:1.8em;padding-top:2px;}
.gc-rank-row .gr-who{flex:1;min-width:0;word-break:keep-all;}
.gc-rank-row .gr-val{flex:none;text-align:right;font-family:var(--sans);font-weight:700;letter-spacing:-.02em;}
.gc-rank-row .gr-plain{display:block;font-size:.72rem;margin-top:2px;}
@media (max-width:480px){.gc-cards{grid-template-columns:1fr;}}

/* R46 — 링크로 들어온 화면 맨 위의 로고. 움직임 없이도 처음부터 보인다. */
.brand-top{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:4px;}
.brand-top-mark{width:96px;height:96px;border-radius:50%;background:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;flex:none;}
.brand-top-name{font-family:var(--sans);font-size:1.18rem;font-weight:800;letter-spacing:-.03em;color:var(--gold);}

/* R56 — '또는 내가 직접 입력하기' 가름줄 */
.manual-head{display:flex;align-items:center;gap:10px;margin:6px 0 14px;}
.manual-head .manual-line{flex:1;height:1px;background:var(--gold-line);}
.manual-head .manual-text{font-size:.8rem;color:var(--ink-faint);white-space:nowrap;}

/* R54 — 운영 현황판의 숫자 격자 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.stat-cell{background:var(--panel-2);border:1px solid var(--gold-line);border-radius:12px;padding:12px 13px;}
.stat-k{font-size:.74rem;color:var(--ink-faint);}
.stat-v{font-family:var(--sans);font-size:1.16rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:3px;}

/* R50 — 홈: 서비스 고르는 카드 */
.landing{padding-top:8px;}
.landing-intro{color:var(--ink-dim);font-size:.9rem;line-height:1.7;text-align:center;margin:2px 0 18px;word-break:keep-all;}
/* ★ R51 — 카드가 '눌러도 되는 것'으로 보여야 한다(대표님 지시).
   마우스를 올리면 살짝 떠오르고 그림자가 깊어진다. 누르면 다시 내려앉는다.
   ★ 손가락으로 쓰는 기기에는 hover가 없다 — @media (hover:hover)로 감싸
     터치 기기에서 '눌렀는데 뜬 채로 남는' 상태가 생기지 않게 한다.
   ★ 움직임을 줄여 쓰는 분에게는 뜨는 효과를 빼고 테두리만 바꾼다. */
.svc-card{position:relative;display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--gold-line);border-radius:var(--r-lg);padding:18px 44px 16px 18px;margin-bottom:14px;
  box-shadow:var(--shadow-soft);cursor:pointer;
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;}
@media (hover:hover){
  .svc-card:hover{border-color:var(--gold);transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(152,0,60,.14);}
}
.svc-card:focus-visible{border-color:var(--gold);transform:translateY(-3px);
  box-shadow:0 10px 24px rgba(152,0,60,.14);}
.svc-card:active{transform:translateY(0);box-shadow:var(--shadow-soft);}
@media (prefers-reduced-motion: reduce){
  .svc-card:hover,.svc-card:focus-visible{transform:none;}
}
.svc-arrow{position:absolute;top:18px;right:16px;color:var(--gold);opacity:.75;display:flex;}
.svc-arrow svg{width:20px;height:20px;}
.svc-title{font-family:var(--sans);font-size:1.1rem;font-weight:800;letter-spacing:-.02em;color:var(--gold);}
.svc-desc{color:var(--ink);font-size:.94rem;font-weight:600;margin-top:6px;line-height:1.65;word-break:keep-all;}
.svc-list{margin:12px 0 0;padding-left:16px;}
.svc-list li{color:var(--ink-dim);font-size:.82rem;line-height:1.95;word-break:keep-all;}
.cross-sell{margin-top:20px;padding:20px 18px;border-radius:var(--r-lg);
  background:var(--gold-soft);border:1px solid var(--gold-line);text-align:center;}
.cross-sell .cs-mark{display:flex;justify-content:center;margin-bottom:6px;}
.cross-sell .cs-title{font-family:var(--sans);font-size:1.06rem;font-weight:800;
  letter-spacing:-.02em;color:var(--gold);}
.cross-sell .cs-desc{color:var(--ink-dim);font-size:.84rem;line-height:1.7;
  margin:6px 0 14px;word-break:keep-all;}
.cross-sell .btn{display:flex;align-items:center;justify-content:center;gap:4px;}

/* R49 — '무엇으로 봤나요' 한 줄 */
.basis-chip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 14px;}
.basis-chip .basis-k{font-size:.72rem;color:var(--ink-faint);}
.basis-chip .basis-v{font-size:.72rem;font-weight:700;color:var(--gold);
  background:var(--gold-soft);border-radius:999px;padding:3px 9px;}

/* 봉투 애니메이션 */
.envelope-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 20px;text-align:center;}
.envelope{width:180px;height:120px;position:relative;}
.envelope .body{position:absolute;inset:0;background:var(--panel-2);border:2px solid var(--gold);border-radius:4px;box-shadow:var(--shadow-soft);}
.envelope .flap{position:absolute;top:0;left:0;right:0;height:60px;background:var(--panel-3);border:2px solid var(--gold);border-top:none;clip-path:polygon(0 0,50% 85%,100% 0);transform-origin:top center;animation:flapOpen 1.1s ease forwards .3s;}
@keyframes flapOpen{to{transform:rotateX(180deg);opacity:.15;}}
.envelope .seal{position:absolute;top:38px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--gold-gradient);display:flex;align-items:center;justify-content:center;color:var(--void);font-family:var(--serif);font-weight:400;animation:sealPop 1.1s ease forwards .3s;}
@keyframes sealPop{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;transform:translateX(-50%) scale(1.4);}}

/* ===================== 관리자 테스트 콘솔 (ADMIN_KEY가 채워진 사본에서만 화면에 나온다) ===================== */
/* 배지는 화면 어디에서나 보인다 — 테스트 화면을 실제 화면으로 착각하는 것을 막는 유일한 표시다.
   토스트(하단 중앙)와 겹치지 않도록 왼쪽 아래에 두고, 모달(z-index 50)·토스트(80)보다 위에 올린다. */
.admin-flag{position:fixed;left:10px;bottom:14px;z-index:90;display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 20px);padding:7px 12px;border-radius:999px;
  /* R29 — 이 배지만은 일부러 어둡게 남긴다. "지금 화면은 테스트다"를 알리는 유일한 표시라
     밝은 화면에 묻히면 안 된다. 짙은 인주 알약 + 밝은 글자(11:1대). */
  border:1px solid #6E1B0E;background:rgba(110,27,14,.96);
  color:#FFEDE8;font-size:.74rem;font-weight:700;letter-spacing:0;box-shadow:var(--shadow-sm);}
.admin-flag .af-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-flag .af-open{flex:none;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,237,232,.6);
  color:#FFEDE8;font-size:.72rem;font-weight:700;line-height:1.5;}
.admin-flag .af-open:hover{background:rgba(255,237,232,.22);}
@media (max-width:420px){ .admin-flag{font-size:.68rem;padding:6px 10px;gap:6px;} }

.admin-sec{border:1px solid rgba(88,68,22,.16);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;background:var(--panel-3);}
.admin-sec > h4{color:var(--gold);font-size:.9rem;margin-bottom:8px;font-weight:600;}
.admin-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.admin-chip{padding:11px 15px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--r-pill);border:1px solid rgba(88,68,22,.26);background:var(--panel);color:var(--ink-dim);
  font-size:.76rem;transition:background .15s,color .15s,border-color .15s;}
.admin-chip:hover{border-color:var(--gold);color:var(--ink);}
.admin-chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:600;}
.admin-log{margin-top:8px;padding:10px;border-radius:8px;background:var(--panel-2);border:1px solid rgba(35,31,24,.12);
  font-size:.74rem;line-height:1.7;color:var(--ink-dim);max-height:190px;overflow:auto;
  white-space:pre-wrap;word-break:break-word;}

/* ===================== 2D 캐릭터 (오행 5종 + MBTI 16종 = 21종) — R19 신규 ===================== */
/* 그림 자체는 전부 인라인 SVG다(아래 CHARACTERS). 여기 있는 건 그 SVG를 앉히는 자리뿐이다. */
.char-svg{display:block;flex:none;object-fit:contain;}
/* R22 — 캐릭터를 "옅은 원 안에" 앉힌다. 레퍼런스의 동그란 아이콘 배경과 같은 규칙이고,
   덕분에 어두운 배경에서 캐릭터 실루엣이 훨씬 또렷하게 떠오른다. 색은 --gold-soft/--gold-line뿐. */
.char-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.char-hero .char-svg{border-radius:50%;background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);padding:6px;color:var(--ink);}
.char-hero .ch-text{flex:1 1 200px;min-width:170px;}
.char-hero .ch-name{font-family:var(--sans);font-size:1.18rem;letter-spacing:-.02em;color:var(--gold);margin-bottom:6px;font-weight:700;}
.char-hero .ch-line{font-size:.94rem;line-height:1.9;}
.char-hero .ch-kind{font-size:.76rem;color:var(--ink-dim);margin-top:10px;line-height:1.6;}
/* 목록 행의 작은 칩. 34→40으로 키우고 같은 원 배경을 준다(작아서 안 보이던 문제를 함께 해결). */
/* R29 — 캐릭터 윤곽선은 currentColor다. 칩이 놓이는 자리마다 물려받는 글자색이 달라서
   밝은 바탕에서 실루엣이 날아갈 수 있다. 캐릭터를 담는 자리 전부에 color:var(--ink)를 못 박는다. */
.char-chip{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);padding:2px;color:var(--ink);}
.char-pair{display:flex;justify-content:center;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:4px 0 16px;}
.char-pair .cp-side{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:160px;text-align:center;}
.char-pair .cp-side .char-svg{border-radius:50%;background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);padding:6px;color:var(--ink);}
.char-pair .cp-name{font-size:.92rem;font-weight:600;}
.char-pair .cp-sub{font-size:.74rem;color:var(--ink-dim);line-height:1.6;}
/* 온보딩 첫 화면에 세우는 캐릭터 셋 — 이 앱이 무엇인지 말보다 먼저 알려주는 자리다. */
.char-row{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;}
.char-row .char-svg{border-radius:50%;background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);padding:6px;color:var(--ink);}
/* 최소 폭 96→88. 여백을 키운 뒤 96px로 두었더니 390px에서 2열로 접혀 도감이 두 배로 길어졌다
   (실측 스크린샷에서 잡았다). 88px면 390px에서 3열, 320px에서 2열 — R19·R21 때와 같은 접힘이다. */
.char-dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin-top:14px;}
.char-dex-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px 14px;
  border:1px solid rgba(88,68,22,.14);border-radius:var(--r-lg);background:var(--panel);min-height:44px;color:var(--ink);
  box-shadow:var(--shadow-soft);
  transition:border-color .15s,background .15s,transform .15s;}
.char-dex-item:hover{border-color:var(--gold);background:var(--gold-soft);}
.char-dex-item:active{transform:scale(.97);}
.char-dex-item .char-svg{border-radius:50%;background:var(--gold-soft);border:1px solid rgba(88,68,22,.22);padding:4px;color:var(--ink);}
.char-dex-item .cd-name{font-size:.8rem;line-height:1.4;font-weight:600;}
.char-dex-item.mine{border-color:var(--gold);background:var(--gold-soft);}
.char-dex-item .cd-mine{font-size:.68rem;color:var(--gold);border:1px solid rgba(88,68,22,.30);border-radius:var(--r-pill);padding:2px 9px;}
/* 프로필 행·히스토리 행에 붙는 작은 캐릭터 칩의 자리.
   기존 .settings-row는 justify-content:space-between이라 자식을 그냥 하나 더 넣으면 라벨이 가운데로 밀린다.
   그래서 칩+라벨을 한 덩어리(.sr-label-wrap)로 묶어 왼쪽 항목 수를 그대로 유지한다. */
.settings-row .sr-label-wrap{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto;}
.hist-item .hi-main{display:flex;align-items:center;gap:11px;text-align:left;background:none;flex:1;min-width:0;min-height:44px;}
.hist-item .hi-text{min-width:0;}
@media (max-width:360px){.char-dex-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));}}

/* ===================== R23: 사주 용어를 쉬운 말로 =====================
   규칙 세 가지만 지킨다.
     ① 일상어를 먼저·크게, 원래 용어를 뒤에·작게. 용어를 지우지 않는다(아는 사람에게는 그게 근거다).
     ② 눌러서 설명이 뜨는 요소는 "점선 밑줄"로 표시한다 — 색만으로 구분하지 않는다(색각 이상 대응).
     ③ 설명 문장은 CSS에도 화면 코드에도 두지 않는다. 전부 TERMS 한 곳에서만 온다.
   새 색을 만들지 않았다 — --gold / --ink / --ink-dim / --gold-line / --gold-soft 와
   이미 badge-*에 쓰이던 rgba 값만 그대로 쓴다. */
.term-lite{
  font:inherit;line-height:inherit;vertical-align:baseline;
  color:var(--gold);background:none;border:0;padding:0 1px;margin:0;
  border-bottom:1px dotted currentColor;cursor:pointer;
}
.term-lite:hover{border-bottom-style:solid;}
.term-lite:active{opacity:.7;}
/* 칩형 — 문장 안이 아니라 목록·표 자리. 손가락으로 누르는 자리라 44px를 지킨다. */
.term-chip{
  display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;
  min-height:44px;padding:7px 13px;text-align:left;cursor:pointer;
  border:1px solid rgba(88,68,22,.22);border-radius:var(--r-md);background:var(--panel-3);
  transition:border-color .15s,background .15s;
}
.term-chip:hover{border-color:var(--gold);background:var(--gold-soft);}
.term-chip:active{opacity:.8;}
.term-chip .tc-plain{font-size:.82rem;color:var(--ink);line-height:1.35;word-break:keep-all;}
.term-chip .tc-term{font-size:.68rem;color:var(--ink-dim);line-height:1.3;border-bottom:1px dotted currentColor;}
/* 관계 종류별 테두리 색은 예전 .badge-hap/.badge-chung/.badge-pa/.badge-hyeong 값을 그대로 옮겼다. */
.term-chip.tchip-hap{border-color:rgba(63,107,69,.55);}
.term-chip.tchip-chung{border-color:rgba(143,36,19,.55);}
.term-chip.tchip-pa{border-color:rgba(61,100,128,.55);}
.term-chip.tchip-hyeong{border-color:rgba(88,68,22,.55);}
.term-chip-row{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0;}
/* 좁은 칸용(사주 네 기둥 표의 칸 이름·그 위에 얹는 십성 칸). 칸이 좁아 mini(더 짧은 일상어)를 쓰고,
   테두리와 배경을 지워 표를 어지럽히지 않는다. 누를 수 있다는 표시는 점선 밑줄이 계속 맡는다. */
.term-chip.tchip-tight{
  width:100%;flex:none;min-height:45px;align-items:center;text-align:center;padding:5px 3px;gap:1px;
  border-color:transparent;background:none;
}
.term-chip.tchip-tight:hover{border-color:rgba(88,68,22,.30);background:var(--gold-soft);}
.term-chip.tchip-tight .tc-plain{font-size:.7rem;line-height:1.3;}
.term-chip.tchip-tight .tc-term{font-size:.62rem;color:var(--gold);line-height:1.2;}
.term-chip.tchip-static{cursor:default;}
.term-chip.tchip-static:hover{border-color:transparent;background:none;}
/* 카드 제목: 큰 제목은 일상어, 그 아래 작게 "사주 용어로는 …" 한 줄 */
.card-term-line{font-size:.75rem;color:var(--ink-dim);margin:0 0 12px;line-height:1.7;}
.daewoon-item .ss-term{font-size:.62rem;color:var(--ink-dim);margin-top:1px;line-height:1.2;}
/* R24 — 일상어가 간지 글자보다 위로 올라갔다. 대운 타일(.ss → .ss-term)과 같은 순서다. */
.month-cell .mc-term{font-size:.62rem;color:var(--ink-dim);line-height:1.2;margin-bottom:1px;}
/* 눌렀을 때 뜨는 설명 */
.term-modal .tm-plain{font-size:1.15rem;color:var(--gold);font-weight:600;margin-bottom:2px;line-height:1.5;}
.term-modal .tm-term{font-size:.78rem;color:var(--ink-dim);margin-bottom:12px;}
.term-modal .tm-long{color:var(--ink);line-height:1.85;}
.term-modal .tm-note{font-size:.78rem;color:var(--ink-dim);margin-top:12px;line-height:1.7;}
/* 용어 사전 화면 */
.gl-tools{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:6px;}
.gl-count{font-size:.8rem;color:var(--ink-dim);}
.gl-item{padding:14px 0;border-bottom:1px solid rgba(35,31,24,.10);}
.gl-item:last-child{border-bottom:0;}
.gl-plain{font-size:1rem;color:var(--ink);font-weight:600;line-height:1.55;}
.gl-term{font-size:.76rem;color:var(--gold);margin-top:3px;}
.gl-long{font-size:.87rem;color:var(--ink-dim);margin-top:7px;line-height:1.8;}
.gl-src{font-size:.74rem;color:var(--ink-faint);margin-top:6px;}

/* ===================== R22: 좁은 화면에서 여백을 되돌린다 =====================
   여백을 키우면 제일 먼저 깨지는 곳이 320~390px다. 그래서 카드 안쪽 여백·카드 간격을
   변수 한 곳에서 다시 줄인다(값을 여기저기 흩어 적지 않는다). */
@media (max-width:600px){
  :root{ --pad-card:20px; --gap-card:16px; }
  main{padding:22px 16px 88px;}
  .section-title{font-size:1.34rem;}
  .row3{grid-template-columns:1fr 1fr;}
  .scroll-card::before,.scroll-card::after{left:18px;right:18px;}
  .char-hero{gap:14px;}
}
@media (max-width:380px){
  :root{ --pad-card:17px; --gap-card:14px; }
  main{padding:20px 13px 88px;}
  .section-title{font-size:1.22rem;}
  .page-head{margin-bottom:18px;}
  .scroll-card::before,.scroll-card::after{left:15px;right:15px;}
  .tabbar{gap:5px;padding:9px 11px;}
  .tab-btn{padding:12px 11px;}
  .toc-nav{padding:12px;gap:7px;}
  .toc-nav a{padding:0 11px;}
  .char-hero .ch-text{min-width:0;}
}

/* ===================== R22: 움직임을 줄여달라고 한 사람에게는 줄인다 =====================
   이 파일의 애니메이션은 전부 "한 번 재생하고 끝(both/forwards)"이라, 재생 시간을 0에 가깝게
   두면 최종 상태로 곧바로 앉는다. 즉 끄더라도 화면이 비거나 반쯤 그려진 채로 남지 않는다.
   (별자리 선·매듭 선의 stroke-dashoffset, 카드 등장, 모달, 봉투 전부 확인했다.) */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>
<body>
<div id="app">

  <header class="app-header" id="appHeader" hidden>
    <!-- R51 — 로고를 누르면 홈으로 (대표님 지시). 웹에서 가장 익숙한 규칙이라
         따로 안내하지 않아도 사람들이 먼저 눌러 본다. button으로 두어야
         키보드로도 닿고 화면 낭독기도 "버튼"이라고 읽는다. -->
    <button class="brand" id="brandHome" type="button" aria-label="홈으로">
      <div class="brand-seal" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M24 40.5C24 40.5 6.5 30.2 6.5 18.8c0-5.4 4.2-9.3 9-9.3 3.4 0 6.4 1.9 8.5 5 2.1-3.1 5.1-5 8.5-5 4.8 0 9 3.9 9 9.3 0 4.2-2.4 8.2-5.4 11.5" stroke="var(--brand)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 23.5 22 29l10.5-10.5" stroke="var(--brand)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.5 6.5c.4 2.1.9 2.6 3 3-2.1.4-2.6.9-3 3-.4-2.1-.9-2.6-3-3 2.1-.4 2.6-.9 3-3Z" fill="var(--brand)"/></svg></div>
      <span class="brand-name">케미체크</span>
    </button>
    <div class="profile-switch" id="profileSwitch"></div>
  </header>

  <div class="tabbar-wrap" id="tabbarWrap" hidden>
  <!-- 화면 전환 메뉴다. 각 버튼이 실제로 바꾸는 영역은 아래 <main id="main">이므로
       aria-controls로 그 id를 가리킨다(가리키는 id가 실제로 존재해야 의미가 있다).
       role="tab"을 쓰지 않는 이유: 이건 탭 위젯이 아니라 화면 이동이라서,
       현재 위치는 aria-current="page"로 알리는 쪽이 맞다. -->
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴">
    <!-- R50 — 서비스를 고른 뒤 그 서비스의 탭만 보여준다(대표님 지시).
         data-mode 가 붙은 탭은 지금 고른 서비스와 같을 때만 나온다.
         홈·히스토리·설정은 어느 쪽에서도 필요하므로 표시가 없다. -->
    <button class="tab-btn" data-route="home" aria-controls="main">홈</button>
    <button class="tab-btn" data-route="today" data-mode="self" aria-controls="main">오늘의 운세</button>
    <button class="tab-btn" data-route="saju" data-mode="self" aria-controls="main">내 사주</button>
    <button class="tab-btn" data-route="report" data-mode="self" aria-controls="main">MBTI 리포트</button>
    <button class="tab-btn" data-route="chars" data-mode="self" aria-controls="main">캐릭터 도감</button>
    <button class="tab-btn" data-route="compat" data-mode="compat" aria-controls="main">궁합 보기</button>
    <button class="tab-btn" data-route="history" aria-controls="main">히스토리</button>
    <button class="tab-btn" data-route="settings" aria-controls="main">설정</button>
  </nav>
  </div>

  <main id="main" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
</div>

<script>
'use strict';
(function(){

/* =====================================================================
   ★ 출시 전 반드시 채워야 하는 값 (지금은 비어 있음 — 화면에는 "확인 중"으로 나간다)
   ---------------------------------------------------------------------
   [1] COMPANY.mailOrderNo   — 통신판매업 신고번호. 신고 자체는 완료됐고 번호만 아직 못 받은 상태라
                               화면에는 "확인 중"으로 나간다("미신고"로 읽히는 표현을 쓰지 않는다).
   [2] COMPANY.supportPhone  — 고객센터 전화번호 (대표님 지시로 현재 비워둠)
       → 전자상거래법 제13조 표시의무 항목이다. 위 2개가 비어 있는 상태로 유료 결제를 열면 안 된다.
       → 값이 채워지면 화면 표기는 자동으로 바뀐다(하드코딩된 곳이 없다).
       ※ 고객센터 이메일·개인정보 보호책임자는 확정되어 이미 채워져 있다.

   [5] BILLING_SOURCE.entitlementEndpoint / contentEndpoint / verifyEndpoint / checkoutEndpoint
       → 전부 null이면 "체험 모드"다. 이 상태에서는 이용권이 이 브라우저에만 저장되고
         개발자도구로 위조할 수 있으므로 실제 과금을 해서는 안 된다.
       → ★ 주소를 넣는 곳은 아래 BILLING_SOURCE 상수 "한 곳뿐"이다. 여기에 값이 들어가면
         브라우저 저장소로는 그 값을 바꾸거나 지울 수 없다(설정 화면 저장본은 개발자도구
         한 줄이면 지워지므로, 그것을 권한의 근거로 삼으면 페이월이 통째로 뚫린다).
       → 설정 → 결제 연동 화면의 입력칸은 ?demo=1 개발 모드에서만 동작하는 임시 덮어쓰기이고,
         이미 상수에 값이 있는 항목은 개발 모드에서도 덮어쓸 수 없다(끄거나 낮출 수 없다).
       → 결제 버튼을 실제로 열려면 entitlementEndpoint · contentEndpoint · checkoutEndpoint ·
         verifyEndpoint가 "모두" 설정돼야 한다. 하나라도 비면 결제 버튼은 열리지 않는다.
         (verifyEndpoint까지 필수인 이유는 PAYWALL_REQUIRED 주석 참조 — 결제 모달·약관·환불 정책이
          모두 "영수증 번호로 복원할 수 있다"고 약속하기 때문이다. 목록의 정본은 PAYWALL_REQUIRED이니
          거기를 고치면 이 주석도 함께 고칠 것.)
===================================================================== */

/* =====================================================================
   사업자 정보 — 화면 어디에도 하드코딩하지 않는다. 전부 이 객체에서 꺼내 쓴다.
   null인 항목은 companyValue()가 "확인 중"으로 바꿔 표시한다.
   (가격을 formatWon(PRODUCTS[...].price) 한 곳으로 모은 것과 같은 원칙)
===================================================================== */
var COMPANY = {
  serviceName:  '케미체크',
  legalName:    '주식회사 언바운드',
  legalNameEn:  'Unbound',
  ceo:          '박정인',
  bizRegNo:     '581-88-04065',
  corpRegNo:    '120111-0153083',
  /* ★ 행정구역 표기 확인 필요 (2026-08-11 기록).
     대표님이 두 번에 걸쳐 "서해구"로 확인해 주셨기에 그대로 둔다.
     다만 아래 통신판매업 신고번호가 `2026-인천서구-2262`로 **서구**를 가리킨다.
     신고번호의 지역명은 신고를 수리한 관청 이름이므로, 둘 중 하나는 틀렸을 가능성이 높다.
     전자상거래법 제13조 표시의무 항목이라 틀리면 문제가 되므로 대표님께 재확인 요청해 둔 상태다.
     ★ 확인 없이 임의로 "서구"로 고치지 말 것. */
  address:      '인천광역시 서해구 중봉대로612번길 10-22, 7층 703호 D21 (청라동, 우리프라자)',
  mailOrderNo:  '2026-인천서구-2262',
  /* ★ 발신전용. 화면에 그렇게 적어 두지 않으면 손님이 전화를 걸었다가 안 받는다고 여긴다.
     전자상거래법은 "연락처"를 표시하라고만 하고 수신 가능한 전화일 것을 요구하지는 않는다.
     다만 받지 않는 번호라면 그 사실을 함께 적어야 오해가 없다. */
  supportPhone: '070-4571-6907 (발신전용)',
  supportEmail: 'unbound.co.ltd@gmail.com',
  privacyOfficer: '박정인',
  /* 전자상거래법 제13조 제1항 제3호 — 호스팅서비스 제공자 표시의무. 배포처가 Vercel로 확정됐다. */
  hostingProvider: 'Vercel Inc.',
  /* ★ R48 — '확인 중'으로 비워 두면 법정 문서에 시행일이 없는 상태가 된다.
     지금 화면에 걸려 있는 방침이 곧 지금 적용되는 방침이므로, 그 날짜를 적는다.
     정식 출시일이 정해지면 그날로 바꾸면 된다(바꿀 때는 §10의 사전 공지 규칙을 따른다). */
  privacyEffectiveDate: '2026년 8월 12일'
};
/* 못 받은 값을 그럴듯한 가짜로 채우지 않는다. 없으면 없다고 적는다. */
function companyValue(v){ return (v===null || v===undefined || v==='') ? '확인 중' : String(v); }
function companyMissing(v){ return (v===null || v===undefined || v===''); }

/* =====================================================================
   결제수단 종류 — 전자상거래법 제13조 제2항(대금의 지급방법) 표시의무 항목.
   ---------------------------------------------------------------------
   ★ 결제대행사(PG)를 아직 정하지 않았으므로 실제로 지원되는 수단을 알 수 없다.
     "신용카드·계좌이체"처럼 그럴듯하게 적어두면 그 자체가 거짓 표시가 되므로 null로 두고,
     화면에는 COMPANY의 미확정 항목과 똑같이 "확인 중"으로 내보낸다.
     PG가 확정되면 아래 배열만 채우면 된다 — 결제 모달·사업자 정보·환불 안내가 자동으로 따라간다.

   ★ 2026-08-11 — 토스페이먼츠로 확정. 다만 **실제로 여는 수단만** 적는다.
     서버(api/pay.js)가 requestPayment에 넘기는 값은 `method:'CARD'` 하나뿐이고,
     토스의 통합결제창(flowMode:'DEFAULT')에서 카드와 간편결제가 함께 열린다.
     계좌이체·휴대폰 결제는 지금 코드가 요청하지 않으므로 적지 않는다 —
     "지원한다"고 써놓고 화면에 안 나오면 그게 거짓 표시다. 늘리려면 코드를 먼저 고쳐야 한다.
===================================================================== */
var PAYMENT_METHODS = ['신용·체크카드', '간편결제'];

/* =====================================================================
   개인정보 처리 위탁 — 개인정보보호법 제26조·제28조의8(국외 이전) 고지 항목
   ---------------------------------------------------------------------
   ★ 실제로 쓰는 곳만 적는다. 광고·분석 업체는 하나도 쓰지 않으므로 적지 않는다.
   ★ 나라를 모르면 지어내지 않는다. region이 null이면 화면에 "확인 중"으로 나가고,
     아래 legalGaps()가 그것을 미확정 항목으로 세어 결제 게이트에도 반영된다.
     (Supabase는 프로젝트를 만들 때 고른 지역에 따라 달라진다 — 확인 후 채운다.)
===================================================================== */
var PROCESSORS = [
  { name:'Vercel Inc.',        task:'앱 화면과 서버 기능의 호스팅',        region:'미국',    items:'접속 요청 정보' },
  /* 대표님이 프로젝트를 서울(ap-northeast-2) 지역으로 만드셨다고 확인해 주셨다(2026-08-11). */
  /* ★ R48 — 맡긴 일이 늘었는데 문구가 그대로였다. 그룹·AI 해석 글·이용 기록도 여기 저장된다. */
  { name:'Supabase Inc.',      task:'궁합 방·그룹·AI 해석 글·결제 기록 저장', region:'대한민국', items:'닉네임·MBTI·생년월일·태어난 시각·성별·출생지, 생성된 해석 글, 주문·결제 기록' },
  { name:'토스페이먼츠 주식회사', task:'결제 처리 및 결제수단 인증',         region:'대한민국', items:'주문번호·결제금액·결제수단 정보' },
  /* ★ 2026-08-12 — AI 해석을 붙이면서 추가. 결제하신 분의 사주 계산 결과가 미국으로 나간다.
     처리위탁·국외이전은 미리 알리지 않으면 그 자체가 위반이다. 기능을 켜기 전에 여기 적는다.
     내보내는 것은 '계산 결과'다 — 이름은 호칭으로만 쓰이고, 연락처나 결제수단은 보내지 않는다. */
  { name:'Anthropic PBC',      task:'유료 상세 해석 문장 생성(AI)',        region:'미국',
    items:'닉네임·성별·생년월일·태어난 시각, 사주 계산 결과(여덟 글자·오행·십성·대운), MBTI 유형' }
];
function processorRegion(x){ return companyValue(x.region); }
function processorsMissing(){ return PROCESSORS.some(function(x){ return companyMissing(x.region); }); }
function paymentMethodsMissing(){ return !(Array.isArray(PAYMENT_METHODS) && PAYMENT_METHODS.length); }
function paymentMethodsText(){ return paymentMethodsMissing() ? '확인 중' : PAYMENT_METHODS.join(' · '); }

/* =====================================================================
   결제 서버 연결 지점 — 여기 한 곳에만 둔다.
   ---------------------------------------------------------------------
   null = 아직 서버가 없다는 뜻(체험 모드). 값이 들어가는 순간 서버 권위 모드로 전환된다.

   ── 서버 계약 (백엔드는 이 주석만 보고 구현할 수 있어야 한다) ────────────────
   공통: 요청은 POST + Content-Type: application/json, 자격증명은 쿠키(credentials:'include').
        모든 응답은 JSON. 타임아웃 BILLING.timeoutMs(기본 10초).
        ★ 어떤 실패(네트워크/타임아웃/4xx/5xx/형식오류)든 클라이언트는 "잠금"으로 되돌아간다.
