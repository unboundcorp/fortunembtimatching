<!doctype html>
<meta charset="utf-8">
<!-- 옛 주소(GitHub Pages)로 들어온 사람을 정식 주소로 보낸다.
     이 저장소는 GitHub Pages와 Vercel 두 곳에 배포되는데, 서버 기능(/api/*)은 Vercel에만 있다.
     옛 주소로 들어오면 그룹·실시간 궁합이 405로 실패하므로 그쪽에서는 바로 넘긴다.

     ★ R84 (2026-08-14) — 정식 주소가 inyeonjeom.kr 로 바뀌었다(대표님 지시).
     ★ 이 파일은 Vercel 배포에서는 빠진다(.vercelignore). 여기 남겨 두면 Vercel이
       '/' 에서 이 파일을 먼저 집어 들어, 주소창에 fortune.html 이 다시 붙는다.
       GitHub Pages에는 그대로 올라가므로 옛 주소를 넘기는 일은 계속 한다. -->
<title>인연점</title>
<script>
  (function(){
    var LIVE = 'https://inyeonjeom.kr/';
    var here = location.hostname;
    /* Vercel(또는 정식 도메인)에서 열렸다면 같은 곳의 앱으로, 그 밖(GitHub Pages 등)이면 정식 주소로 */
    var onLive = here.indexOf('vercel.app') >= 0 || here.indexOf('inyeonjeom.kr') >= 0;
    var to = onLive ? ('fortune.html' + location.search + location.hash)
                    : (LIVE + location.search + location.hash);
    location.replace(to);
  })();
</script>
<noscript><a href="https://inyeonjeom.kr/">인연점으로 이동</a></noscript>
